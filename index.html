    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

        /* Le celle di una griglia, per impostazione del browser, non si stringono
           sotto la larghezza del loro contenuto. Il campo data su iPhone e iPad ha
           una larghezza minima sua, tutt'altro che piccola: dentro una colonna
           stretta sbordava e finiva sopra il campo accanto. */
        .grid > * { min-width: 0; }
        input[type="date"], input[type="time"], input[type="month"] {
            /* Su Safari il campo data e ora nasce con una larghezza minima sua,
               piuttosto generosa, che non scende nemmeno con width:100%. Togliendo
               l'aspetto nativo si comporta come gli altri campi e sta nella colonna. */
            -webkit-appearance: none;
            appearance: none;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }

        /* ============================================================
           BERSAGLI GRANDI ABBASTANZA PER UN POLLICE
           Misurati sulla versione 72: ventidue comandi stavano sotto misura,
           fra cui «Elimina», alto 25px. Con il telefono nel supporto, mezzo
           guanto e gli occhiali da presbite, 25px non si centrano: o non
           succede niente, o si tocca quello sbagliato - e quello sbagliato,
           li', cancella una corsa.
           Il minimo e' 44px: e' la misura di Apple (Human Interface
           Guidelines) ed e' anche il criterio WCAG 2.5.5. Sta qui come regola
           unica invece che classe per classe, cosi' vale anche per i comandi
           che verranno dopo e nessuno puo' nascere piccolo per distrazione.
           ============================================================ */
        button,
        select,
        summary,
        [role="button"],
        input:not([type="checkbox"]):not([type="radio"]):not([type="file"]) {
            min-height: 44px;
        }
        /* I comandi quadrati (le frecce del giorno, la x che azzera) restavano
           larghi 36px: sul lato corto il minimo va chiesto anche in larghezza. */
        .tasto-icona { min-width: 44px; min-height: 44px; }
        /* Rare eccezioni dove 44px spaccherebbe davvero la riga: si chiede
           apposta, non per sbaglio. */
        .tasto-minuto { min-height: 0; }

        /* I tasti «come ha pagato»: stessa misura per tutti, su qualunque
           telefono. Con il corpo normale «Satispay» e «App / Voucher» andavano
           a capo gia' a 375px e quei due tasti crescevano piu' degli altri. */
        .tasto-metodo {
            font-size: 0.875rem;
            line-height: 1.15;
            font-weight: 900;
            padding: 0.9rem 0.4rem;
            border-radius: 0.75rem;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            text-align: center;
        }

        /* Prospetto dei corrispettivi: la colonna della data resta ferma mentre
           si scorre di lato. Con cinque metodi su un telefono, senza questo si
           perde di vista la riga che si sta copiando sul registro. */
        .col-ferma { position: sticky; left: 0; z-index: 1; }
        .col-ferma-chiara { background-color: #fff; }
        .col-ferma-grigia { background-color: #f3f4f6; }
        .col-ferma-scura  { background-color: #111827; }

        /* ============================================================
           LA LINGUA VISIVA (v89 - direzione «Rifinitura»)
           Prima di questa versione l'app aveva 287 elementi scritti con il
           peso massimo del carattere: se tutto urla, non si legge niente per
           primo. E l'incasso della giornata stava a 24px mentre il titolo
           «Oggi» stava a 30px - il titolo gridava piu' dei soldi.
           Qui stanno i colori, i pesi e le ombre di tutta l'applicazione,
           in un posto solo. Le regole che riscrivono una classe di Tailwind
           (.font-black, .shadow-sm, .border-gray-100...) servono a cambiare
           il tono ovunque senza toccare novemila righe di markup: chi scrive
           una schermata nuova continua a usare le classi di sempre e viene
           fuori nella lingua giusta.
           ============================================================ */
        :root {
            --sfondo:        #faf9f6;   /* carta calda, non grigio ufficio */
            --carta:         #ffffff;
            --inchiostro:    #2a2620;
            --inchiostro-su: #14120d;   /* i titoli e la scheda scura */
            --tenue:         #8a8578;
            --tenuissimo:    #a8a294;
            --filo:          #e9e5da;
            --filo-chiaro:   #f2efe7;
            --giallo:        #facc15;
        }

        body { background-color: var(--sfondo); color: var(--inchiostro); }

        /* Le cifre non devono ballare mentre si aggiornano: larghezza fissa
           per tutti i numeri dell'app, non solo per quelli marcati a mano. */
        body { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

        /* LA SCALA DEI PESI. Il massimo (900) resta solo dove c'e' un numero
           grande da leggere in un colpo: la classe .cifra. Tutto il resto
           scende di un gradino e finalmente si vede cosa viene prima. */
        .font-black { font-weight: 800; }
        .font-bold  { font-weight: 650; }
        .cifra { font-weight: 800; letter-spacing: -0.03em; }

        /* LE OMBRE. Prima ce n'era una sola e piatta: le schede sembravano
           adesivi appoggiati. Due livelli: le schede appena staccate dal
           fondo, i comandi e la scheda scura piu' alti. */
        .shadow-sm { --tw-shadow: 0 1px 2px rgba(24,22,17,.04), 0 4px 12px -4px rgba(24,22,17,.07); --tw-shadow-colored: var(--tw-shadow); }
        .shadow-md { --tw-shadow: 0 2px 6px rgba(24,22,17,.08), 0 12px 24px -10px rgba(24,22,17,.16); --tw-shadow-colored: var(--tw-shadow); }
        .shadow-lg { --tw-shadow: 0 2px 6px rgba(24,22,17,.10), 0 18px 34px -14px rgba(24,22,17,.22); --tw-shadow-colored: var(--tw-shadow); }

        /* I FILI E I GRIGI, rifatti caldi: sul fondo color carta il grigio
           freddo di prima faceva un alone azzurrino attorno a ogni scheda. */
        .border-gray-100 { border-color: var(--filo-chiaro); }
        .border-gray-200 { border-color: var(--filo); }
        .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: var(--filo-chiaro); }
        .divide-gray-200 > :not([hidden]) ~ :not([hidden]) { border-color: var(--filo); }
        .bg-gray-50 { background-color: var(--sfondo); }
        /* Il nero dell'app era blu di suo (#111827): accanto al fondo color
           carta faceva una macchia fredda. Questo e' lo stesso nero della
           scheda della giornata. */
        .bg-gray-900 { background-color: var(--inchiostro-su); }
        .bg-gray-800 { background-color: #242019; }
        .border-gray-800 { border-color: #2e2a20; }
        .text-gray-400 { color: var(--tenuissimo); }
        .text-gray-500 { color: var(--tenue); }
        .text-gray-800 { color: var(--inchiostro); }

        /* L'etichettina sopra ogni riquadro: piccola, spaziata, mai nera. */
        .etichetta {
            font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--tenue);
        }

        /* La scheda scura: il posto dove sta il numero che conta. */
        .eroe {
            background: var(--inchiostro-su);
            border-radius: 1.375rem;
            box-shadow: 0 2px 6px rgba(24,22,17,.10), 0 14px 28px -12px rgba(24,22,17,.35);
        }
        .eroe-campo {
            background: rgba(250,204,21,.14); color: #fff; border: 0;
            border-radius: 0.6rem; font-weight: 650;
        }
        /* Un menu a tendina dentro una scheda scura: la casella e' chiara di
           suo su ogni sistema, qui si veste di scuro. Le voci del menu che si
           apre le disegna il telefono: restano nere su bianco, ed e' giusto
           cosi' - e' il menu di sistema, non un pezzo dell'app. */
        .campo-scuro {
            background-color: rgba(255,255,255,.08);
            color: #fff;
            border: 0;
            border-radius: 0.75rem;
            font-weight: 650;
        }
        .campo-scuro option { color: #1f2937; background-color: #fff; }

        /* Il campo data dentro la scheda scura: nativo, ma vestito da scuro. */
        .eroe input[type="date"] {
            background-color: transparent; color: #fff; border: 0;
            font-weight: 650; padding: 0.25rem 0;
        }
        .eroe input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.55); }

        /* La barra in fondo: bianca ma non opaca, cosi' il contenuto che le
           scorre sotto si intravede invece di sparire di colpo. */
        .barra-fondo {
            background-color: rgba(255,255,255,.93);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 -2px 12px rgba(24,22,17,.05);
        }

        /* Il simbolo dell'euro accanto a una cifra grande: piu' piccolo e piu'
           tenue del numero. Da lontano si legge «116,50», non «€». */
        .cifra-euro { font-size: 0.6em; font-weight: 600; opacity: 0.45; margin-left: 0.12em; }

        /* Solo la prima lettera maiuscola: «mercoledi' 16», non «Mercoledi' 16
           Settembre» come faceva capitalize di Tailwind parola per parola. */
        .prima-maiuscola::first-letter { text-transform: uppercase; }

        /* Il campo data trasparente steso sopra la data scritta per esteso:
           «mercoledi' 16 settembre» si legge, «16/09/2026» si decifra. Tocchi
           la scritta e si apre il calendario del telefono, come prima. */

<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col md:flex-row">

    <!-- ============================================================
         LA BARRA IN CIMA (solo telefono)
         Il menu laterale, dove stavano il nome e la versione, sul
         telefono e' nascosto dalla v74: restava solo una riga in fondo
         ad «Altro». Ma la versione va vista a colpo d'occhio - e' il
         primo controllo quando ci si chiede se l'aggiornamento e'

    <!-- Toast Notifica -->

            <div>
                <h1 class="text-2xl font-black tracking-tight">TaxiManager</h1>
                <p class="text-xs font-semibold text-gray-800 opacity-80" id="etichetta-versione">Edizione Cloud</p>

    <!-- Contenuto Principale -->

    </main>

    <!-- ============================================================
         LA BARRA IN BASSO (solo telefono)
         Una mano sola, telefono nel supporto, mezzo guanto: il pollice
         arriva in basso, non in cima. Tre voci, perche' tre sono le cose
         che si fanno davvero in turno; tutto il resto sta in «Altro».
         env(safe-area-inset-bottom) tiene i tasti sopra la barra di casa
         dell'iPhone, che altrimenti se li mangia.
         ============================================================ -->
    <nav id="barra-basso"
         class="md:hidden fixed bottom-0 inset-x-0 z-40 barra-fondo border-t border-gray-200 no-print"
         style="padding-bottom: env(safe-area-inset-bottom);"
         aria-label="Navigazione principale">
        <!-- Renderizzato via JS -->
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
                 getRedirectResult, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, deleteDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Costanti di sistema per Firebase
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'taximanager-2026';
        const firebaseConfig = {
            apiKey: "AIzaSyBEwQksNARpGev_yI8Z0sDhqET7tU6sfic",
            authDomain: "taximanager-5ac5b.firebaseapp.com",
            projectId: "taximanager-5ac5b",
            storageBucket: "taximanager-5ac5b.firebasestorage.app",
            messagingSenderId: "1026887809693",
            appId: "1:1026887809693:web:ed0d6508582aa4c3b0b274"
        };
        let db = null;
        let auth = null;
        let isCloudActive = false;
        let annullaAscolti = [];

        // ============================================================
        //  DOVE STANNO I DATI
        //  Prima stavano tutti sotto "public": chiunque arrivasse all'indirizzo
        //  del database poteva leggerli e scriverli. Adesso ogni account ha la
        //  sua cartella, con dentro il suo identificativo, e le regole di
        //  Firestore lasciano entrare solo lui.
        // ============================================================
        function uidCorrente() {
            return auth && auth.currentUser ? auth.currentUser.uid : null;
        }

        function colDati(nome) {
            return collection(db, 'artifacts', appId, 'users', uidCorrente(), nome);
        }

        function docDati(nome, id) {
            return doc(db, 'artifacts', appId, 'users', uidCorrente(), nome, String(id));
        }


        async function initCloudSync() {
            if (!firebaseConfig) {
                console.log("Firebase config non presente. Modalità salvataggio locale attivata.");
                window.renderNav();
                window.renderContent();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // L'accesso resta memorizzato sul dispositivo: si entra una volta
                // sola per telefono, non ogni volta che si apre l'app.
                try { await setPersistence(auth, browserLocalPersistence); } catch (err) { /* pazienza */ }

                // Se si e' entrati con il reindirizzamento (Safari sulla schermata
                // Home), il risultato arriva qui al ritorno.
                try { await getRedirectResult(auth); } catch (err) { avvisaErroreAccesso(err); }

                // Nessun accesso automatico: senza fare l'accesso l'app funziona
                // per intero in locale, e nessun dato va sul Cloud.
                onAuthStateChanged(auth, (user) => {
                    fermaAscolti();
                    if (user) {
                        isCloudActive = true;
                        window.isCloudSyncing = true;
                        window.cloudUtente = { nome: user.displayName || '', email: user.email || '' };
                        window.showToast(`⚡ Cloud attivo per ${user.email || 'il tuo account'}`);
                        subscribeToFirestore();
                        // I dati dal Cloud arrivano poco dopo: la copia automatica
                        // si controlla quando sono in casa, non prima, o si
                        // metterebbe da parte un archivio vuoto.
                        setTimeout(() => {
                            if (window.caricaSchedeIstantanee) window.caricaSchedeIstantanee();
                            if (window.controllaIstantanea) window.controllaIstantanea();
                        }, 6000);
                    } else {
                        // Fuori dal Cloud si salva solo in locale, e la pastiglia in
                        // alto deve dirlo invece di restare verde.
                        isCloudActive = false;
                        window.isCloudSyncing = false;
                        window.cloudUtente = null;
                    }
                    window.renderNav();
                    if (!formConDatiNonSalvati()) window.renderContent();
                });
            } catch (err) {
                console.warn("Impossibile connettersi al Cloud, uso memoria locale:", err);
                window.renderNav();
                window.renderContent();
            }
        }

        // Se un form di inserimento/modifica e' aperto con dati non ancora salvati,
        // un rendering completo lo cancellerebbe senza preavviso: in quel caso
        // si aggiornano solo i dati in memoria e si avvisa, senza ridisegnare.
        let ultimoAvvisoSyncBloccato = 0;
        function formConDatiNonSalvati() {
            return !!(window.showCorsaForm || window.showUscitaForm || window.showShiftForm
                || window.editRecordId || window.editKmId || window.veicoloInModifica);
        }
        function avvisaSyncInAttesa() {
            const ora = Date.now();
            if (ora - ultimoAvvisoSyncBloccato > 8000) {
                ultimoAvvisoSyncBloccato = ora;
                if (window.showToast) window.showToast('🔄 Nuovi dati dal Cloud: verranno mostrati alla chiusura del modulo aperto.');
            }
        }

        function avvisaErroreAccesso(err) {
            const codice = (err && err.code) || '';
            if (!codice || codice === 'auth/popup-closed-by-user' || codice === 'auth/cancelled-popup-request') return;
            console.warn('Accesso non riuscito:', err);
            const messaggi = {
                'auth/unauthorized-domain': 'Questo indirizzo non è autorizzato nella console Firebase (Authentication → Settings → Authorized domains).',
                'auth/operation-not-allowed': 'L\'accesso con Google non è ancora attivo nella console Firebase (Authentication → Sign-in method).',
                'auth/network-request-failed': 'Senza rete non si può fare l\'accesso: l\'app intanto continua a funzionare in locale.'
            };
            if (window.showToast) window.showToast('⚠️ ' + (messaggi[codice] || ('Accesso non riuscito: ' + codice)));
        }

        // Entrare e uscire dal Cloud. Il popup e' la strada che funziona meglio
        // quando l'app sta su un indirizzo diverso da quello di Firebase; se il
        // telefono lo blocca - capita con l'app aggiunta alla schermata Home - si
        // ripiega sul reindirizzamento, che esce e rientra dalla pagina.
        window.entraConGoogle = async function() {
            if (!auth) { if (window.showToast) window.showToast('Cloud non disponibile: sei senza rete?'); return; }
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                const codice = (err && err.code) || '';
                const daRedirect = ['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/operation-not-supported-in-this-environment', 'auth/internal-error'];
                if (daRedirect.includes(codice)) {
                    try { await signInWithRedirect(auth, provider); return; } catch (err2) { avvisaErroreAccesso(err2); return; }
                }
                avvisaErroreAccesso(err);
            }
        };

        window.esciDalCloud = async function() {
            if (!auth) return;
            try {
                await signOut(auth);
                // I dati restano sul dispositivo: uscire dal Cloud non cancella niente.
                if (window.showToast) window.showToast('Uscito dal Cloud. I dati restano su questo dispositivo.');
            } catch (err) {
                console.warn('Uscita non riuscita:', err);
            }
        };

        function fermaAscolti() {
            annullaAscolti.forEach(f => { try { f(); } catch (err) { /* pazienza */ } });
            annullaAscolti = [];
        }

        // Collezioni che hanno gia' consegnato almeno un elenco non vuoto dal server.
        const collezioniConDati = {};

        // Collezioni gia' portate sul Cloud dopo il primo accesso: senza questo
        // segno la migrazione ripartirebbe a ogni notifica.
        const giaMigrate = {};

        // Primo accesso su questo account: la cartella sul Cloud e' vuota e qui
        // c'e' gia' un archivio. Va caricato, altrimenti entrando dal secondo
        // dispositivo non si troverebbe niente. Prima i movimenti stavano in una
        // cartella condivisa e c'erano gia': adesso ogni account parte da zero.
        async function migraSulCloud(nomeCol, elementi, chiave) {
            if (giaMigrate[nomeCol] || !elementi || !elementi.length) return;
            giaMigrate[nomeCol] = true;
            try {
                if (window.showToast) window.showToast(`Porto sul Cloud ${elementi.length} elementi...`);
                for (let i = 0; i < elementi.length; i += 400) {
                    const batch = writeBatch(db);
                    elementi.slice(i, i + 400).forEach(x => batch.set(docDati(nomeCol, String(x[chiave])), x));
                    await batch.commit();
                }
                if (window.showToast) window.showToast(`${elementi.length} elementi portati sul Cloud.`);
            } catch (err) {
                giaMigrate[nomeCol] = false;   // riproveremo al prossimo giro
                console.error('Errore migrazione ' + nomeCol + ':', err);
                if (window.showToast) window.showToast('⚠️ Caricamento sul Cloud non riuscito: i dati restano qui e riproverà da solo.');
            }
        }

        function subscribeToFirestore() {
            if (!db || !auth.currentUser) return;

            // true = questo elenco vuoto arriva davvero dal server e segue dei dati:
            //        e' una cancellazione fatta altrove, va applicata.
            const vuotoDaApplicare = (nome, snapshot) =>
                snapshot.empty && collezioniConDati[nome] && !snapshot.metadata.fromCache;

            const recordsCol = colDati('taxi_records');
            const shiftsCol = colDati('taxi_shifts');
            const scadenzeCol = colDati('taxi_scadenze');
            const veicoliCol = colDati('taxi_veicoli');
            const vociFisseCol = colDati('taxi_voci_fisse');

            // Il profilo: un documento solo, quindi basta ascoltarlo. Se sul
            // Cloud non c'e' ancora ma qui si', si porta su - e' il caso di chi
            // aveva gia' compilato prima di fare l'accesso.
            annullaAscolti.push(onSnapshot(
                doc(db, 'artifacts', appId, 'users', uidCorrente(), 'profilo', 'dati'),
                (d) => {
                    if (d.exists()) {
                        window.profilo = Object.assign({}, window.profilo, d.data());
                        try { localStorage.setItem('taxi_profilo', JSON.stringify(window.profilo)); }
                        catch (err) { /* pazienza */ }
                    } else if (!d.metadata.fromCache && window.profiloCompilato && window.profiloCompilato()) {
                        window.saveProfiloToCloud(window.profilo);
                    }
                    window.renderNav();
                    if (!formConDatiNonSalvati()) window.renderContent();
                },
                (error) => console.error('Errore Sync Profilo:', error)));

            annullaAscolti.push(onSnapshot(recordsCol, (snapshot) => {
                // Cartella vuota al primo accesso: si carica quello che c'e' qui
                if (snapshot.empty && !collezioniConDati['records'] && !snapshot.metadata.fromCache) {
                    migraSulCloud('taxi_records', window.dailyRecords, 'id');
                    return;
                }
                if (!snapshot.empty || vuotoDaApplicare('records', snapshot)) {
                    const cloudRecords = [];
                    snapshot.forEach(doc => {
                        cloudRecords.push({ id: doc.id, ...doc.data() });
                    });
                    cloudRecords.sort((a, b) => new Date(b.data) - new Date(a.data));
                    if (cloudRecords.length) collezioniConDati['records'] = true;
                    window.dailyRecords = cloudRecords;
                    localStorage.setItem('taxi_records', JSON.stringify(cloudRecords));
                    // Un dispositivo non ancora aggiornato puo' rimandare indietro
                    // le voci col vecchio nome del finanziamento
                    if (typeof controllaNomeFinanziamento === 'function') controllaNomeFinanziamento();
                }
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Movimenti:", error)));

            annullaAscolti.push(onSnapshot(shiftsCol, (snapshot) => {
                if (snapshot.empty && !collezioniConDati['turni'] && !snapshot.metadata.fromCache) {
                    migraSulCloud('taxi_shifts', window.shifts, 'id');
                    return;
                }
                if (!snapshot.empty || vuotoDaApplicare('turni', snapshot)) {
                    const cloudShifts = [];
                    snapshot.forEach(doc => {
                        cloudShifts.push({ id: doc.id, ...doc.data() });
                    });
                    cloudShifts.sort((a, b) => new Date(b.data) - new Date(a.data));
                    if (cloudShifts.length) collezioniConDati['turni'] = true;
                    window.shifts = cloudShifts;
                    localStorage.setItem('taxi_shifts', JSON.stringify(cloudShifts));
                    // Un dispositivo non ancora aggiornato puo' rimandare indietro dei "Riposo"
                    if (typeof controllaRiposiDaConvertire === 'function') controllaRiposiDaConvertire();
                }
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Turni:", error)));

            // Scadenze: a differenza di corse e turni, qui si applica anche uno snapshot vuoto,
            // altrimenti cancellandone una da un dispositivo resterebbe sugli altri.
            // Prima pero' si migrano sul Cloud quelle gia' salvate solo in locale.
            annullaAscolti.push(onSnapshot(scadenzeCol, async (snapshot) => {
                const cloudScadenze = [];
                snapshot.forEach(d => cloudScadenze.push({ id: d.id, ...d.data() }));

                if (!snapshot.empty) scadenzeCloudOk = true;

                if (snapshot.empty && (window.scadenze || []).length && !scadenzeCloudOk) {
                    // Non svuoto niente finche' non so che il Cloud accetta i dati
                    try {
                        for (const sc of window.scadenze) {
                            await setDoc(docDati('taxi_scadenze', String(sc.id)), sc);
                        }
                        scadenzeCloudOk = true;
                        if (window.showToast) window.showToast('☁️ Scadenze caricate sul Cloud.');
                    } catch (err) {
                        console.error("Errore migrazione scadenze:", err);
                        if (window.showToast) window.showToast('⚠️ Scadenze salvate solo qui: il Cloud ha rifiutato la scrittura.');
                    }
                    return;
                }

                scadenzeMigrate = true;
                cloudScadenze.sort((a, b) => String(a.data).localeCompare(String(b.data)));
                window.scadenze = cloudScadenze;
                localStorage.setItem('taxi_scadenze', JSON.stringify(cloudScadenze));
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Scadenze:", error)));

            // Parco auto: stesso trattamento delle scadenze. Uno snapshot vuoto si
            // applica solo dopo aver visto che il Cloud accetta i dati, altrimenti
            // al primo avvio cancellerebbe le vetture salvate solo qui.
            annullaAscolti.push(onSnapshot(veicoliCol, async (snapshot) => {
                const cloudVeicoli = [];
                snapshot.forEach(d => cloudVeicoli.push({ id: d.id, ...d.data() }));

                if (!snapshot.empty) veicoliCloudOk = true;

                if (snapshot.empty && (window.veicoli || []).length && !veicoliCloudOk) {
                    try {
                        for (const v of window.veicoli) {
                            await setDoc(docDati('taxi_veicoli', String(v.id)), v);
                        }
                        veicoliCloudOk = true;
                        if (window.showToast) window.showToast('☁️ Parco auto caricato sul Cloud.');
                    } catch (err) {
                        console.error("Errore migrazione veicoli:", err);
                        if (window.showToast) window.showToast('⚠️ Parco auto salvato solo qui: il Cloud ha rifiutato la scrittura.');
                    }
                    return;
                }

                window.veicoli = cloudVeicoli;
                localStorage.setItem('taxi_veicoli', JSON.stringify(cloudVeicoli));
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Parco Auto:", error)));

            // Voci di costo fisso: stesso trattamento del parco auto
            annullaAscolti.push(onSnapshot(vociFisseCol, async (snapshot) => {
                const cloudVoci = [];
                snapshot.forEach(d => cloudVoci.push({ slug: d.id, ...d.data() }));

                if (!snapshot.empty) vociFisseCloudOk = true;

                if (snapshot.empty && (window.vociFisse || []).length && !vociFisseCloudOk) {
                    try {
                        for (const v of window.vociFisse) {
                            await setDoc(docDati('taxi_voci_fisse', String(v.slug)), v);
                        }
                        vociFisseCloudOk = true;
                    } catch (err) {
                        console.error("Errore migrazione voci fisse:", err);
                    }
                    return;
                }

                if (!cloudVoci.length && (window.vociFisse || []).length) {
                    console.warn('Elenco voci fisse vuoto dal Cloud: tengo quello locale.');
                    return;
                }
                window.vociFisse = cloudVoci;
                localStorage.setItem('taxi_voci_fisse', JSON.stringify(cloudVoci));
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Voci Fisse:", error)));
        }

        // Diventa true quando il Cloud ha dimostrato di funzionare per le scadenze:
        // o perche' conteneva gia' dei dati, o perche' ha accettato una scrittura.
        let scadenzeMigrate = false;
        let scadenzeCloudOk = false;
        let veicoliCloudOk = false;
        let vociFisseCloudOk = false;

        // ============================================================
        //  ISTANTANEE NEL CLOUD
        //  Una copia di tutto, in tre posti a rotazione. Il documento dell'
        //  istantanea tiene solo la scheda (quando, quanti movimenti, quanti
        //  pezzi); il contenuto sta nei pezzi, perche' un documento Firestore
        //  non puo' superare il megabyte e tre anni di corse lo superano.
        // ============================================================
        const PARTE_MAX = 600000;

        function sentieroIstantanea(slot) {
            return ['artifacts', appId, 'users', uidCorrente(), 'istantanee', String(slot)];
        }

        window.scriviIstantanea = async function (slot, dati) {
            if (!isCloudActive || !db || !uidCorrente()) throw new Error('Cloud non attivo');
            const testo = JSON.stringify(dati);
            const parti = [];
            for (let i = 0; i < testo.length; i += PARTE_MAX) parti.push(testo.slice(i, i + PARTE_MAX));
            const base = sentieroIstantanea(slot);

            // Quanti pezzi c'erano prima: se l'istantanea nuova e' piu' corta,
            // quelli che avanzano vanno tolti o resterebbero li' a occupare posto.
            let vecchi = 0;
            try {
                const prima = await getDoc(doc(db, ...base));
                if (prima.exists()) vecchi = parseInt(prima.data().parti, 10) || 0;
            } catch (err) { /* prima volta: nessuna scheda da leggere */ }

            for (let i = 0; i < parti.length; i++) {
                await setDoc(doc(db, ...base, 'parti', String(i)), { testo: parti[i] });

            for (let i = parti.length; i < vecchi; i++) {
                try { await deleteDoc(doc(db, ...base, 'parti', String(i))); } catch (err) { /* pazienza */ }
            }

            await setDoc(doc(db, ...base), {
                quando: new Date().toISOString(),
                parti: parti.length,
                byte: testo.length,
                movimenti: (dati.records || []).length,
                turni: (dati.shifts || []).length

                    schede.push(d.exists() ? Object.assign({ slot: s }, d.data()) : { slot: s, vuota: true });

        window.deleteRecordsFromCloud = async function(ids) {

            window.dailyRecords = (window.dailyRecords || []).filter(r => !insieme.has(String(r.id)));
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));

            if (isCloudActive && db && auth.currentUser) {

                    const elenco = Array.from(insieme);

                        const batch = writeBatch(db);
                        elenco.slice(i, i + 400).forEach(id => {
                            batch.delete(docDati('taxi_records', String(id)));
                        });
                        await batch.commit();
                    }
                } catch (err) {
                    console.error("Errore eliminazione multipla Cloud:", err);

            if (isCloudActive && db && auth.currentUser) {
                try {

        // === IMPORT MASSIVO (usato dal ripristino backup / import Excel) ===
        // Scrive in un colpo solo su localStorage e sincronizza il Cloud a blocchi di 400
        // documenti: evita di bloccare il browser con migliaia di scritture singole.
        window.bulkSave = async function(newRecords, newShifts, onProgress) {
            const merge = (esistenti, nuovi) => {
                const mappa = new Map();
                (esistenti || []).forEach(x => mappa.set(String(x.id), x));
                (nuovi || []).forEach(x => mappa.set(String(x.id), x));
                return Array.from(mappa.values())
                    .sort((a, b) => new Date(b.data) - new Date(a.data));
            };

            window.dailyRecords = merge(window.dailyRecords, newRecords);
            window.shifts = merge(window.shifts, newShifts);
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));
            localStorage.setItem('taxi_shifts', JSON.stringify(window.shifts));

            if (!(isCloudActive && db && auth.currentUser)) return { cloud: false };

            const gruppi = [
                { col: 'taxi_records', items: newRecords || [] },
                { col: 'taxi_shifts', items: newShifts || [] }
            ];
            let fatti = 0;
            const totale = gruppi.reduce((a, g) => a + g.items.length, 0);

            // Se la scrittura sul Cloud fallisce (rete debole o assente, molto comune
            // spostandosi in auto), il dato resta comunque salvato in locale qui sopra:
            // non deve bloccare chi ha chiamato bulkSave (es. il salvataggio di una
            // modifica a km/ore di un turno), altrimenti il pannello di modifica resta
            // aperto e la schermata non si aggiorna, dando l'impressione che "non funzioni".
            try {
                for (const g of gruppi) {
                    for (let i = 0; i < g.items.length; i += 400) {
                        const fetta = g.items.slice(i, i + 400);
                        const batch = writeBatch(db);
                        fetta.forEach(item => {
                            batch.set(docDati(g.col, String(item.id)), item);
                        });
                        await batch.commit();
                        fatti += fetta.length;
                        if (onProgress) onProgress(fatti, totale);
                    }
                }
                return { cloud: true, scritti: fatti };
            } catch (err) {
                console.error("Errore scrittura Cloud (bulkSave):", err);
                if (window.showToast) window.showToast('⚠️ Salvato solo in locale: sync Cloud fallita (rete debole?). Riproverai al prossimo salvataggio.');
                return { cloud: false, errore: true, scritti: fatti };
            }
        };

        window.wipeAllData = async function() {
            window.dailyRecords = [];
            window.shifts = [];
            localStorage.setItem('taxi_records', '[]');
            localStorage.setItem('taxi_shifts', '[]');

            if (isCloudActive && db && auth.currentUser) {
                try {
                    for (const col of ['taxi_records', 'taxi_shifts']) {
                        const snap = await getDocs(colDati(col));
                        const docs = snap.docs;
                        for (let i = 0; i < docs.length; i += 400) {
                            const batch = writeBatch(db);
                            docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
                            await batch.commit();
                        }
                    }
                } catch (err) {
                    console.error("Errore azzeramento Cloud:", err);
                    if (window.showToast) window.showToast('⚠️ Azzerato solo in locale: sync Cloud fallita (rete debole?).');
                }
            }
        };

        initCloudSync();

        }

        }

        // La partita IVA italiana ha undici cifre e l'ultima e' un controllo:
        // si sommano le cifre di posto dispari, e quelle di posto pari
        // raddoppiate (togliendo 9 se superano 9); il totale deve chiudere
        // alla decina. Serve a intercettare una cifra battuta storta, che su
        // un documento che va al commercialista non e' un dettaglio.
        function partitaIvaValida(v) {
            const t = String(v || '').replace(/\D/g, '');
            if (t.length !== 11) return false;
            let somma = 0;
            for (let i = 0; i < 11; i++) {
                let n = parseInt(t[i], 10);
                if (i % 2 === 1) { n *= 2; if (n > 9) n -= 9; }
                somma += n;
            }
            return somma % 10 === 0;
        }
