                                                <td class="p-3 text-right">${t.ore.toFixed(0)} h</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-red-200 space-y-4">
                            <h3 class="text-lg font-bold text-red-700">Azzera tutti i dati</h3>
                            <p class="text-xs text-gray-500 leading-relaxed">Cancella tutti i movimenti e i turni, sia in locale sia sul Cloud. Utile per rimuovere i dati di esempio prima di importare l'archivio dell'anno. Scarica prima un backup!</p>
                            <button onclick="resetAllData()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-sm transition-colors">🗑️ Cancella tutto</button>
                        </div>
                    </div>
                `;
            }
        }

        // Preset orari turno fissi
        const SHIFT_PRESETS = {
            sei30:    { label: "Le sei e trenta (6:30 - 18:30)", inizio: "06:30", fine: "18:30" },
            otto:     { label: "Le otto (8:00 - 20:00)", inizio: "08:00", fine: "20:00" },
            una:      { label: "L'una (13:00 - 1:00)", inizio: "13:00", fine: "01:00" },
            notte:    { label: "La notte (19:00 - 7:00)", inizio: "19:00", fine: "07:00" },
            spezzato: { label: "Lo spezzato (7:30-13:00 / 15:00-21:30)", inizio: "07:30", fine: "21:30", pausaInizio: "13:00", pausaFine: "15:00" },
            // Nelle giornate di rinforzo si puo' fare soltanto il turno dell'una:
            // gli orari sono fissi e non modificabili, e' questo che lo distingue.
            rinforzo: { label: "Rinforzo (13:00 - 1:00)", inizio: "13:00", fine: "01:00" },
            custom:   { label: "Personalizzato" },
            // Giornate non lavorate: nessun orario, nessun km, zero ore.
            // lavorato:false è ciò che le distingue ovunque nell'app.
            festivo:  { label: "Festivo", lavorato: false },
            recupero: { label: "Recupero festivo", lavorato: false },
            malattia: { label: "Malattia", lavorato: false },
            sciopero: { label: "Sciopero", lavorato: false }
        };

        function isRiposo(t) {
            return !!t && t.lavorato === false;
        }

        function onShiftTypeChange(val) {
            window.selectedShiftType = val;
            try { localStorage.setItem('taxi_ultimo_turno', val); } catch (err) { /* spazio esaurito: pazienza */ }
            renderContent();
        }

        // Ricalcola in automatico il campo "Ore totali" mentre si digitano Ora Inizio/Ora Fine
        // nel turno Personalizzato. Il valore resta comunque modificabile a mano dopo il calcolo.
        function ricalcolaOreCustom() {
            const iniz = document.getElementById('sh-inizio');
            const fine = document.getElementById('sh-fine');
            const campoOre = document.getElementById('sh-ore');
            if (!iniz || !fine || !campoOre || !iniz.value || !fine.value) return;
            campoOre.value = calcolaOreTurno('2000-01-01', iniz.value, fine.value).toFixed(1);
        }

        // Calcola le ore lavorate tra inizio e fine (gestendo il turno a cavallo di mezzanotte
        // e, se presente, una pausa da escludere dal totale, come nello Spezzato)
        function calcolaOreTurno(data, inizio, fine, pausaInizio, pausaFine) {
            const start = new Date(`${data}T${inizio}`);
            let end = new Date(`${data}T${fine}`);
            if (end <= start) end.setDate(end.getDate() + 1);
            let diffHours = (end - start) / (1000 * 60 * 60);

            if (pausaInizio && pausaFine) {
                const pStart = new Date(`${data}T${pausaInizio}`);
                let pEnd = new Date(`${data}T${pausaFine}`);
                if (pEnd <= pStart) pEnd.setDate(pEnd.getDate() + 1);
                diffHours -= (pEnd - pStart) / (1000 * 60 * 60);
            }
            return diffHours;
        }

        function toggleCorsaForm() {
            window.showCorsaForm = !window.showCorsaForm;
            renderContent();
        }

        function toggleUscitaForm() {
            window.showUscitaForm = !window.showUscitaForm;
            renderContent();
        }

        function toggleShiftForm() {
            window.showShiftForm = !window.showShiftForm;
            // Ad ogni apertura pulita del form si azzerano le bozze dei km,
            // cosi' il suggerimento riparte dal turno precedente.
            if (window.showShiftForm) { window.kmIniDraft = null; window.kmFineDraft = null; }
            renderContent();
        }

        // Senza tratta la corsa prende un numero progressivo nella giornata,
        // cosi' nel registro resta comunque distinguibile dalle altre.
        function etichettaCorsaAutomatica(data) {
            const gia = (window.dailyRecords || [])
                .filter(r => r.tipo === 'ENTRATA' && r.data === data).length;
            return `Corsa #${gia + 1}`;
        }

        function addCorsa(e) {
            e.preventDefault();
            const data = document.getElementById('corsa-data').value;
            const scritta = (document.getElementById('corsa-cat').value || '').trim();
            const metodo = document.getElementById('corsa-metodo').value;
            const importo = parseFloat(document.getElementById('corsa-imp').value);

            if (!data || isNaN(importo)) return;
            if (importo < 0) { showToast('L\'importo non può essere negativo.'); return; }

            const categoria = scritta || etichettaCorsaAutomatica(data);
            const record = { id: nuovoId(), data, tipo: 'ENTRATA', categoria, metodo, importo };
            window.saveRecordToCloud(record);

            // Ricorda data e metodo per velocizzare l'inserimento successivo
            window.ultimoDataCorsa = data;
            window.ultimoMetodoCorsa = metodo;
            try { localStorage.setItem('taxi_ultimo_metodo_corsa', metodo); } catch (err) { /* spazio esaurito: pazienza */ }

            // Il pulsante "Salva e inserisci un'altra" tiene il form aperto e pronto
            // per la corsa successiva, invece di richiuderlo ad ogni inserimento.
            const continua = !!(e.submitter && e.submitter.value === 'nuova');
            window.showCorsaForm = continua;
            showToast(continua ? '⚡ Corsa salvata! Pronta per la prossima.' : '⚡ Corsa salvata e sincronizzata!');
            renderContent();
            if (continua) {
                setTimeout(() => {
                    const campoImp = document.getElementById('corsa-imp');
                    if (campoImp) campoImp.focus();
                }, 0);
            }
        }

        // Aggiorna il campo Nota quando si sceglie "Altro": diventa la descrizione
        // completa della spesa invece di un dettaglio facoltativo aggiunto alla categoria.
        // La sezione della ricorrenza si apre con la spunta. Il "fino al" si
        // propone al 31 dicembre dell'anno della spesa: e' il caso piu' comune.
        function onRipetiChange() {
            const spunta = document.getElementById('uscita-ripeti');
            const box = document.getElementById('uscita-ripeti-box');
            const fino = document.getElementById('uscita-fino');
            if (!spunta || !box) return;
            box.classList.toggle('hidden', !spunta.checked);
            if (spunta.checked && fino && !fino.value) {
                const data = (document.getElementById('uscita-data') || {}).value || oggiISO();
                fino.value = `${data.slice(0, 4)}-12-31`;
            }
            aggiornaAnteprimaRipeti();
        }

        // Anteprima scritta a mano nel paragrafo, senza ridisegnare la pagina:
        // un renderContent() qui cancellerebbe quello che si sta scrivendo.
        function aggiornaAnteprimaRipeti() {
            const p = document.getElementById('uscita-anteprima');
            if (!p) return;
            const dati = datiRipetizione();
            if (!dati) { p.textContent = ''; return; }
            if (!dati.date.length) {
                p.textContent = 'La data finale viene prima della prima spesa.';
                return;
            }
            const imp = parseFloat((document.getElementById('uscita-imp') || {}).value);
            const totale = Number.isFinite(imp) ? ' · ' + formatCurrency(imp * dati.date.length) + ' in tutto' : '';
            const futuri = dati.date.filter(d => d > oggiISO()).length;
            p.textContent = `${dati.date.length} ${dati.date.length === 1 ? 'movimento' : 'movimenti'}, dal ${ggMm(dati.date[0])} al ${ggMm(dati.date[dati.date.length - 1])}${totale}.`
                + (futuri ? ` ${futuri} ${futuri === 1 ? 'è' : 'sono'} in date future.` : '')
                + (dati.date.length >= MAX_RICORRENZE ? ` Oltre ${MAX_RICORRENZE} movimenti non si va: accorcia il periodo.` : '');
        }

        // Quello che c'e' scritto adesso nel riquadro della ricorrenza
        function datiRipetizione() {
            const spunta = document.getElementById('uscita-ripeti');
            if (!spunta || !spunta.checked) return null;
            const inizio = (document.getElementById('uscita-data') || {}).value || '';
            const cadenza = (document.getElementById('uscita-cadenza') || {}).value || 'mese';
            const fino = (document.getElementById('uscita-fino') || {}).value || '';
            if (!inizio || !fino) return null;
            return { inizio, cadenza, fino, date: datePeriodiche(inizio, cadenza, fino) };
        }

        // Il campo "Nome della spesa" serve solo quando si sceglie "Altro":
        // negli altri casi la categoria e' gia' quella del menu.
        function onUscitaCatChange(val) {
            const box = document.getElementById('uscita-altro-box');
            const campo = document.getElementById('uscita-altro');
            if (!box) return;
            const altro = val === '__altro__';
            box.classList.toggle('hidden', !altro);
            if (altro && campo) campo.focus();
        }

        async function addUscita(e) {
            e.preventDefault();
            const continua = !!(e.submitter && e.submitter.value === 'nuova');
            const data = document.getElementById('uscita-data').value;
            const selCat = document.getElementById('uscita-cat-select').value;
            const nota = (document.getElementById('uscita-nota').value || '').trim();
            const campoAltro = document.getElementById('uscita-altro');
            const metodo = document.getElementById('uscita-metodo').value;
            const importo = parseFloat(document.getElementById('uscita-imp').value);

            // La categoria resta pulita: e' quella che decide la tipologia, il
            // costo al chilometro e l'abbinamento con il budget. Le note stanno
            // per conto loro e non entrano in nessun conto.
            let categoria;
            if (selCat === '__altro__') {
                categoria = (campoAltro ? campoAltro.value : '').trim();
                if (!categoria) { showToast('Scrivi il nome della spesa.'); return; }
            } else {
                categoria = selCat;
            }

            if (!data || !categoria || isNaN(importo)) return;
            if (importo < 0) { showToast('L\'importo non può essere negativo.'); return; }

            const record = { id: nuovoId(), data, tipo: 'USCITA', categoria, metodo, importo };
            if (nota) record.nota = nota;

            const ripeti = datiRipetizione();
            if (ripeti) {
                if (!ripeti.date.length) { showToast('La data finale viene prima della prima spesa.'); return; }
                if (!(await generaSerieSpese(record, ripeti))) return;
            } else {
                window.saveRecordToCloud(record);
            }

            // Ricorda data, categoria e metodo per velocizzare l'inserimento successivo
            window.ultimoDataUscita = data;
            window.ultimoMetodoUscita = metodo;
            try { localStorage.setItem('taxi_ultimo_metodo_uscita', metodo); } catch (err) { /* spazio esaurito: pazienza */ }
            if (selCat !== '__altro__') {
                window.ultimaCategoriaUscita = selCat;
                try { localStorage.setItem('taxi_ultima_categoria_uscita', selCat); } catch (err) { /* spazio esaurito: pazienza */ }
            }

            window.showUscitaForm = continua;
            if (!ripeti) showToast(continua ? '⚡ Spesa salvata! Pronta per la prossima.' : '⚡ Spesa salvata e sincronizzata!');
            renderContent();
            if (continua) {
                setTimeout(() => {
                    const campoImp = document.getElementById('uscita-imp');
                    if (campoImp) campoImp.focus();
                }, 0);
            }
        }

        function addShift(e) {
            e.preventDefault();
            const data = document.getElementById('sh-data').value;
            const tipo = document.getElementById('sh-tipo').value;
            const preset = SHIFT_PRESETS[tipo];

            // Giornata non lavorata: si registra solo la data e il motivo
            if (isRiposo(preset)) {
                if (!data) return;
                const gia = (window.shifts || []).find(x => x.data === data);
                if (gia && !confirm(`Per il ${data} c'e' gia' ${isRiposo(gia) ? 'una giornata non lavorata' : 'un turno di lavoro'} (${gia.turno}). Registro comunque ${preset.label}?`)) {
                    return;
                }
                const riposo = {
                    id: nuovoId(),
                    data, inizio: '', fine: '',
                    turno: preset.label,
                    lavorato: false,
                    kmInizio: null, kmFine: null,
                    ore: 0, kmTot: null
                };
                window.saveShiftToCloud(riposo);
                window.showShiftForm = false;
                showToast(`${preset.label} registrato per il ${data}.`);
                renderContent();
                return;
            }

            let inizio, fine;
            if (tipo === 'custom') {
                inizio = document.getElementById('sh-inizio').value;
                fine = document.getElementById('sh-fine').value;
            } else {
                inizio = preset.inizio;
                fine = preset.fine;
            }

            // I km sono facoltativi: si possono completare in seguito dall'elenco turni
            const kmIniVal = parseInt(document.getElementById('sh-kmini').value);
            const kmFineVal = parseInt(document.getElementById('sh-kmfine').value);
            const kmInizio = isNaN(kmIniVal) ? null : kmIniVal;
            const kmFine = isNaN(kmFineVal) ? null : kmFineVal;

            if (!data || !inizio || !fine) return;

            if (kmInizio !== null && kmFine !== null && kmFine < kmInizio) {
                showToast('I km fine non possono essere inferiori ai km inizio.');
                return;
            }

            // Doppione: due turni sulla stessa data raddoppiano ore e km nei report.
            // Capita registrando due volte lo stesso giorno a distanza di ore.
            const giaRegistrato = (window.shifts || []).find(x => x.data === data && !isRiposo(x));
            if (giaRegistrato && !confirm(`Per il ${data} c'e' gia' un turno registrato (${giaRegistrato.turno}, ${giaRegistrato.ore} ore). Vuoi aggiungerne un altro?`)) {
                return;
            }

            // Contachilometri all'indietro: quasi sempre e' una cifra sbagliata.
            const kmPrec = kmFinePrecedente(data);
            if (kmInizio !== null && kmPrec !== null && kmInizio < kmPrec) {
                if (!confirm(`I km inizio (${kmInizio}) sono inferiori ai km fine del turno precedente (${kmPrec}). Salvo lo stesso?`)) {
                    return;
                }
            }

            // Le ore totali si possono modificare a mano (es. turno finito prima per un impegno):
            // se il campo e' compilato ha la precedenza sul calcolo automatico da inizio/fine.
            const campoOre = document.getElementById('sh-ore');
            const oreInserite = campoOre ? parseFloat(campoOre.value) : NaN;
            if (campoOre && (isNaN(oreInserite) || oreInserite < 0 || oreInserite > 24)) {
                showToast('Le ore totali devono essere un numero tra 0 e 24.');
                return;
            }
            const ore = !isNaN(oreInserite) ? oreInserite : calcolaOreTurno(data, inizio, fine, preset.pausaInizio, preset.pausaFine);

            const shift = {
                id: nuovoId(),
                data, inizio, fine,
                turno: preset.label,
                kmInizio, kmFine,
                ore: parseFloat(ore.toFixed(1)),
                kmTot: (kmInizio !== null && kmFine !== null) ? kmFine - kmInizio : null
            };

            window.saveShiftToCloud(shift);
            window.showShiftForm = false;
            // La prossima apertura riparte dal suggerimento del turno precedente
            window.kmIniDraft = null;
            window.kmFineDraft = null;
            showToast(shift.kmTot === null
                ? '⚡ Turno salvato senza km: completali quando vuoi dall\'elenco.'
                : '⚡ Turno salvato e sincronizzato!');
            renderContent();
        }

        // ============================================================
        //  MODIFICA DI UN MOVIMENTO GIA' REGISTRATO
        //  Prima si poteva solo cancellare e riscrivere: un importo sbagliato
        //  costava due operazioni e la perdita della data originale.
        // ============================================================

        function apriModificaRecord(id) {
            window.editRecordId = (String(window.editRecordId) === String(id)) ? null : id;
            renderContent();
        }

        function annullaModificaRecord() {
            window.editRecordId = null;
            renderContent();
        }

        // Scrive tutti i movimenti di una serie. Chiede conferma prima, perche'
        // ne nascono parecchi in un colpo solo e alcuni possono essere in date
        // future: quelli entrano subito nei totali dell'anno.
        async function generaSerieSpese(modello, ripeti) {
            const serie = 'ric-' + nuovoId();
            const date = ripeti.date;
            const totale = date.length * modello.importo;
            const futuri = date.filter(d => d > oggiISO()).length;
            const cadenza = (CADENZE_SPESA.find(c => c.id === ripeti.cadenza) || {}).etichetta || '';

            let avviso = `«${modello.categoria}» ${cadenza}: ${date.length} movimenti da ${formatCurrency(modello.importo)}, `
                + `dal ${ggMm(date[0])} al ${ggMm(date[date.length - 1])}, per ${formatCurrency(totale)} in tutto.`;
            if (futuri) {
                avviso += `\n\n${futuri} ${futuri === 1 ? 'è in una data futura' : 'sono in date future'}: `
                    + `entrano subito nei totali dell'anno e nella stima delle tasse.`;
            }
            if (!confirm(avviso + '\nProcedo?')) return false;

            const nuovi = date.map(d => Object.assign({}, modello, { id: `${serie}-${d}`, data: d, serie }));
            showToast(`Creo ${nuovi.length} movimenti...`);
            if (typeof window.bulkSave === 'function') {
                await window.bulkSave(nuovi, []);
            } else {
                nuovi.forEach(r => window.saveRecordToCloud(r));
            }
            showToast(`${nuovi.length} movimenti creati, ${formatCurrency(totale)} in tutto.`);
            return true;
        }

        // Tutti i movimenti di una serie ricorrente
        function movimentiDellaSerie(serie) {
            return (window.dailyRecords || []).filter(r => r.serie && String(r.serie) === String(serie));
        }

        async function eliminaSerieSpese(serie) {
            const voci = movimentiDellaSerie(serie);
            if (!voci.length) return;
            const totale = voci.reduce((a, r) => a + parseFloat(r.importo || 0), 0);
            const date = voci.map(r => r.data).sort();
            if (!confirm(`Elimino tutti i ${voci.length} movimenti di «${voci[0].categoria}», dal ${ggMm(date[0])} al ${ggMm(date[date.length - 1])}, per ${formatCurrency(totale)} in tutto?\nL'operazione non si può annullare.`)) return;
            const ids = voci.map(r => r.id);
            showToast(`Elimino ${ids.length} movimenti...`);
            if (typeof window.deleteRecordsFromCloud === 'function') {
                await window.deleteRecordsFromCloud(ids);
            } else {
                ids.forEach(id => window.deleteRecordFromCloud(id));
            }
            showToast(`${ids.length} movimenti della serie eliminati.`);
            renderNav();
            renderContent();
        }

        async function persistiRecord(rec) {
            if (typeof window.bulkSave === 'function') {
                await window.bulkSave([rec], []);
                return;
            }
            window.dailyRecords = (window.dailyRecords || []).map(x => String(x.id) === String(rec.id) ? rec : x);
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));
        }

        async function salvaModificaRecord(id) {
            const rec = (window.dailyRecords || []).find(x => String(x.id) === String(id));
            if (!rec) return;

            const leggi = (p) => { const el = document.getElementById(p + id); return el ? el.value : ''; };
            const data = leggi('mv-data-');
            const scritta = (leggi('mv-cat-') || '').trim();
            const nota = (leggi('mv-nota-') || '').trim();
            const metodo = leggi('mv-met-');
            const importo = parseFloat(leggi('mv-imp-'));

            if (!data || isNaN(importo) || importo < 0) {
                showToast('Controlla data e importo.');
                return;
            }

            // Sulle corse la descrizione resta facoltativa anche in modifica;
            // sulle spese serve, perche' e' quella che definisce la tipologia.
            if (!scritta && rec.tipo === 'USCITA') {
                showToast('La descrizione della spesa è necessaria.');
                return;
            }
            const categoria = scritta || etichettaCorsaAutomatica(data);

            const aggiornato = Object.assign({}, rec, {
                data, categoria, metodo,
                importo: Math.round(importo * 100) / 100
            });
            // Il campo delle note c'e' solo sulle spese: sulle corse si lascia
            // stare quello che c'era.
            if (document.getElementById('mv-nota-' + id)) {
                if (nota) aggiornato.nota = nota; else delete aggiornato.nota;
            }
            await persistiRecord(aggiornato);

            window.editRecordId = null;
            showToast('Movimento aggiornato.');
            renderContent();
        }

        function deleteRecord(id) {
            const rec = (window.dailyRecords || []).find(x => String(x.id) === String(id));
            if (!rec) return;
            const descrizione = `${rec.categoria || 'movimento'} del ${rec.data} · ${formatCurrency(rec.importo)}`;
            if (!confirm(`Elimino definitivamente ${descrizione}?\nL'operazione cancella il dato anche sul Cloud.`)) return;
            window.deleteRecordFromCloud(id);
            showToast('Movimento eliminato.');
            renderContent();
        }

        // Un turno ha i km "mancanti" anche quando valgono 0: un contachilometri a zero
        // non esiste, quindi lo tratto come dato non ancora inserito.
        function kmMancanti(s) {
            if (isRiposo(s)) return false;   // in un giorno di riposo non c'è nulla da compilare
            return !s.kmInizio || !s.kmFine;
        }

        // Turni con i km fine gia' compilati, in ordine cronologico (per data, poi per id a
        // parita' di data), su tutti gli anni: il contachilometri e' continuo.
        function turniConKmFine() {
            return (window.shifts || [])
                .filter(s => !isRiposo(s) && s.kmFine !== null && s.kmFine !== undefined && s.kmFine !== '')
                .slice()
                .sort((a, b) => String(a.data).localeCompare(String(b.data)) || String(a.id).localeCompare(String(b.id)));
        }

        // Ultimo turno con km fine PRECEDENTE alla data indicata (escludendo un turno per id,
        // quando si stanno compilando i km di quel turno stesso).
        // Prima si prendeva sempre l'ultimo turno in assoluto: registrando un turno arretrato
        // il suggerimento era il contachilometri di una data successiva, quindi sbagliato.
        function turnoPrecedenteConKm(dataRif, idEscluso) {
            const lista = turniConKmFine().filter(s => String(s.id) !== String(idEscluso || ''));
            if (!dataRif) return lista.length ? lista[lista.length - 1] : null;
            const precedenti = lista.filter(s => String(s.data) < String(dataRif));
            return precedenti.length ? precedenti[precedenti.length - 1] : null;
        }

        function kmFinePrecedente(dataRif, idEscluso) {
            const t = turnoPrecedenteConKm(dataRif, idEscluso);
            if (!t) return null;
            // Cambiando vettura il contachilometri riparte da capo: fra i due turni
            // c'e' l'acquisto di un'auto nuova, quindi il confronto non ha senso e
            // l'avviso "km all'indietro" sarebbe solo un fastidio.
            const cambioAuto = (window.veicoli || []).some(v =>
                v.dataAcquisto && String(v.dataAcquisto) > String(t.data) && String(v.dataAcquisto) <= String(dataRif));
            if (cambioAuto) return null;
            return t.kmFine;
        }

        // Salva il turno aggiornato: usa l'import massivo (che unisce per id e
        // sincronizza il Cloud) e ripiega sulla sola memoria locale se il modulo

        async function persistiTurno(turno) {
            if (typeof window.bulkSave === 'function') {
                await window.bulkSave([], [turno]);
                return;
            }
            window.shifts = (window.shifts || []).map(x => String(x.id) === String(turno.id) ? turno : x);

        // Il tipo "Riposo" e' stato tolto: le giornate registrate in passato con quel
        // nome diventano "Festivo". Gira una volta sola, poi lascia un segno in memoria
        // per non ripetersi a ogni avvio. Se il Cloud non e' ancora pronto la conversione
        // resta comunque locale e viene ripubblicata alla prima occasione utile.
        // La voce di costo fisso si chiamava "Finanziamento veicolo", ma il
        // finanziamento e' quello per l'acquisto della licenza. Le voci gia'
        // registrate portano ancora il nome sbagliato: si correggono una volta
        // sola, lasciando un segno in memoria per non ripetere il giro a ogni avvio.
        async function correggiNomeFinanziamento() {
            const daCorreggere = (window.dailyRecords || []).filter(r =>
                String(r.id || '').startsWith('fissi-') &&
                String(r.categoria || '').startsWith('Costi fissi - Finanziamento veicolo'));
            if (!daCorreggere.length) {
                try { localStorage.setItem('taxi_finanziamento_corretto', '1'); } catch (err) { /* pazienza */ }
                return 0;
            }
            const corretti = daCorreggere.map(r => Object.assign({}, r, {
                categoria: r.categoria.replace('Finanziamento veicolo', 'Finanziamento licenza')
            }));
            if (typeof window.bulkSave === 'function') await window.bulkSave(corretti, []);
            try { localStorage.setItem('taxi_finanziamento_corretto', '1'); } catch (err) { /* pazienza */ }
            return corretti.length;
        }

            const quanti = await correggiNomeFinanziamento();
            if (quanti > 0) {
                if (window.showToast) window.showToast(quanti === 1
                    ? '1 voce rinominata: il finanziamento è quello della licenza, non del veicolo.'

        async function convertiRiposiInFestivi() {
            const daConvertire = (window.shifts || []).filter(t => t.turno === 'Riposo');
            if (!daConvertire.length) {
                try { localStorage.setItem('taxi_riposi_convertiti', '1'); } catch (err) { /* spazio esaurito: pazienza */ }
                return 0;
            }
            for (const t of daConvertire) {
                await persistiTurno(Object.assign({}, t, { turno: 'Festivo' }));
            }
            try { localStorage.setItem('taxi_riposi_convertiti', '1'); } catch (err) { /* spazio esaurito: pazienza */ }
            return daConvertire.length;
        }

        async function salvaModificaTurno(id) {
            const turno = (window.shifts || []).find(x => String(x.id) === String(id));
            if (!turno) return;

            const campoIni = document.getElementById('km-ini-' + id);
            const campoFine = document.getElementById('km-fine-' + id);
            const campoOre = document.getElementById('ore-edit-' + id);
            const ini = parseInt(campoIni ? campoIni.value : '');
            const fine = parseInt(campoFine ? campoFine.value : '');
            const ore = parseFloat(campoOre ? campoOre.value : '');

            if (isNaN(ini) && isNaN(fine) && isNaN(ore)) {
                showToast('Inserisci almeno un valore da modificare.');
                return;
            }

            // Le ore restano modificabili in qualsiasi momento, anche molto dopo aver
            // registrato il turno: capita di finire prima per un impegno e accorgersene dopo.
            if (campoOre && (isNaN(ore) || ore < 0 || ore > 24)) {
                showToast('Le ore totali devono essere un numero tra 0 e 24.');
                return;
            }

            const aggiornato = Object.assign({}, turno, {
                kmInizio: isNaN(ini) ? (turno.kmInizio || null) : ini,
                kmFine: isNaN(fine) ? (turno.kmFine || null) : fine,
                ore: isNaN(ore) ? turno.ore : parseFloat(ore.toFixed(1))
            });

            if (aggiornato.kmInizio && aggiornato.kmFine && aggiornato.kmFine < aggiornato.kmInizio) {
                showToast('I km fine non possono essere inferiori ai km inizio.');
                return;
            }

            // Contachilometri all'indietro rispetto al turno precedente: di solito e' un refuso
            const kmPrecMod = kmFinePrecedente(turno.data, turno.id);
            if (aggiornato.kmInizio && kmPrecMod !== null && aggiornato.kmInizio < kmPrecMod) {
                if (!confirm(`I km inizio (${aggiornato.kmInizio}) sono inferiori ai km fine del turno precedente (${kmPrecMod}). Salvo lo stesso?`)) {
                    return;
                }
            }

            aggiornato.kmTot = (aggiornato.kmInizio && aggiornato.kmFine)
                ? aggiornato.kmFine - aggiornato.kmInizio
                : null;

            await persistiTurno(aggiornato);
            window.editKmId = null;
            showToast(aggiornato.kmTot !== null
                ? `Turno aggiornato: ${aggiornato.ore} ore, ${aggiornato.kmTot} km percorsi.`
                : `Turno aggiornato: ${aggiornato.ore} ore. Mancano ancora i km per calcolare quelli percorsi.`);
            renderContent();
        }

        // Tipologia di spesa = quello che viene prima del trattino o della parentesi.
        // "Costi fissi - Radio taxi (30 gg x 10,50 €)" -> "Costi fissi"
        // Cosi' le famiglie si formano da sole, senza un elenco fisso da aggiornare.
        function tipoSpesa(categoria) {
            const c = (categoria || '').trim();
            if (!c) return 'Senza categoria';
            const taglio = c.split(' - ')[0].split(' (')[0].trim();
            return taglio || 'Senza categoria';
        }

        function tipiSpesaDisponibili() {
            const tipi = {};
            recordsAnno().forEach(r => {
                if (r.tipo !== 'USCITA') return;
                const t = tipoSpesa(r.categoria);
                if (!tipi[t]) tipi[t] = { nome: t, n: 0, tot: 0 };
                tipi[t].n++;
                tipi[t].tot += parseFloat(r.importo || 0);
            });
            return Object.keys(tipi).map(k => tipi[k]).sort((a, b) => b.tot - a.tot);
        }

        function scaricaFile(blob, nomeFile) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeFile;
            a.rel = 'noopener';
            document.body.appendChild(a);

                URL.revokeObjectURL(url);
            }, 2000);
