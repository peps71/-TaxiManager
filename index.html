<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA: installazione su telefono -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#facc15">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TaxiManager">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon-180.png">
    <title>TaxiManager Pro V28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

        /* Le celle di una griglia, per impostazione del browser, non si stringono
           sotto la larghezza del loro contenuto. Il campo data su iPhone e iPad ha
           una larghezza minima sua, tutt'altro che piccola: dentro una colonna
           stretta sbordava e finiva sopra il campo accanto. */
        .grid > * { min-width: 0; }
        input[type="date"], input[type="time"], input[type="month"] {
            /* Su Safari il campo data e ora nasce con una larghezza minima sua,
               piuttosto generosa, che non scende nemmeno con width:100%. Togliendo
               l'aspetto nativo si comporta come gli altri campi e sta nella colonna. */
            -webkit-appearance: none;
            appearance: none;
            min-width: 0;
            max-width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }

        /* Stili specifici per la Stampa / Esportazione PDF */
        @media print {
            aside, #toast, .no-print { display: none !important; }
            body { background: white !important; color: #000 !important; font-size: 12pt; }
            main { padding: 0 !important; margin: 0 !important; width: 100% !important; background: white !important; }
            .print-card { border: 1px solid #e5e7eb !important; box-shadow: none !important; border-radius: 8px !important; }
            .print-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col md:flex-row">

    <!-- Toast Notifica -->
    <div id="toast" class="hidden fixed bottom-5 right-5 bg-gray-900 text-yellow-400 px-5 py-3 rounded-xl shadow-2xl z-50 items-center space-x-2 border border-yellow-400/30 slide-in font-bold text-sm no-print">
        <span id="toast-text">Messaggio</span>
    </div>

    <!-- Sidebar / Navigazione -->
    <aside class="w-full md:w-64 bg-yellow-400 text-gray-900 flex flex-col shadow-lg z-10 md:min-h-screen border-r border-yellow-500 flex-shrink-0 no-print">
        <div class="p-6 flex items-center space-x-3 bg-yellow-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a2 2 0 0 0-1.6-.8H8.3a2 2 0 0 0-1.6.8L4 11l-5.16.86a1 1 0 0 0-.84.99V16h3m10 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0m-6 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0"/></svg>
            <div>
                <h1 class="text-2xl font-black tracking-tight">TaxiManager</h1>
                <p class="text-xs font-semibold text-gray-800 opacity-80">Edizione Cloud - V28</p>
            </div>
        </div>
        <div class="px-4 pt-4" id="anno-container">
            <!-- Renderizzato via JS -->
        </div>
        <nav class="flex-1 p-4 flex md:flex-col gap-2 overflow-x-auto md:overflow-visible" id="nav-container">
            <!-- Renderizzato via JS -->
        </nav>
    </aside>

    <!-- Contenuto Principale -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full bg-gray-50" id="main-container">
        <!-- Renderizzato via JS -->
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, deleteDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Costanti di sistema per Firebase
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'taximanager-2026';
        const firebaseConfig = {
            apiKey: "AIzaSyBEwQksNARpGev_yI8Z0sDhqET7tU6sfic",
            authDomain: "taximanager-5ac5b.firebaseapp.com",
            projectId: "taximanager-5ac5b",
            storageBucket: "taximanager-5ac5b.firebasestorage.app",
            messagingSenderId: "1026887809693",
            appId: "1:1026887809693:web:ed0d6508582aa4c3b0b274"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db = null;
        let auth = null;
        let isCloudActive = false;


        async function initCloudSync() {
            if (!firebaseConfig) {
                console.log("Firebase config non presente. Modalità salvataggio locale attivata.");
                window.renderNav();
                window.renderContent();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        isCloudActive = true;
                        window.isCloudSyncing = true;
                        window.showToast("⚡ Cloud Sync Attivo: Sincronizzazione con Mac/iPhone...");
                        subscribeToFirestore();
                    } else {
                        // Accesso decaduto: da qui in avanti si salva solo in locale,
                        // e la pastiglia in alto deve dirlo invece di restare verde.
                        isCloudActive = false;
                        window.isCloudSyncing = false;
                    }
                    if (!formConDatiNonSalvati()) window.renderContent();
                });
            } catch (err) {
                console.warn("Impossibile connettersi al Cloud, uso memoria locale:", err);
                window.renderNav();
                window.renderContent();
            }
        }

        // Se un form di inserimento/modifica e' aperto con dati non ancora salvati,
        // un rendering completo lo cancellerebbe senza preavviso: in quel caso
        // si aggiornano solo i dati in memoria e si avvisa, senza ridisegnare.
        let ultimoAvvisoSyncBloccato = 0;
        function formConDatiNonSalvati() {
            return !!(window.showCorsaForm || window.showUscitaForm || window.showShiftForm
                || window.editRecordId || window.editKmId || window.veicoloInModifica);
        }
        function avvisaSyncInAttesa() {
            const ora = Date.now();
            if (ora - ultimoAvvisoSyncBloccato > 8000) {
                ultimoAvvisoSyncBloccato = ora;
                if (window.showToast) window.showToast('🔄 Nuovi dati dal Cloud: verranno mostrati alla chiusura del modulo aperto.');
            }
        }

        // Collezioni che hanno gia' consegnato almeno un elenco non vuoto dal server.
        const collezioniConDati = {};

        function subscribeToFirestore() {
            if (!db || !auth.currentUser) return;

            // true = questo elenco vuoto arriva davvero dal server e segue dei dati:
            //        e' una cancellazione fatta altrove, va applicata.
            const vuotoDaApplicare = (nome, snapshot) =>
                snapshot.empty && collezioniConDati[nome] && !snapshot.metadata.fromCache;

            const recordsCol = collection(db, 'artifacts', appId, 'public', 'data', 'taxi_records');
            const shiftsCol = collection(db, 'artifacts', appId, 'public', 'data', 'taxi_shifts');
            const scadenzeCol = collection(db, 'artifacts', appId, 'public', 'data', 'taxi_scadenze');
            const veicoliCol = collection(db, 'artifacts', appId, 'public', 'data', 'taxi_veicoli');
            const vociFisseCol = collection(db, 'artifacts', appId, 'public', 'data', 'taxi_voci_fisse');

            onSnapshot(recordsCol, (snapshot) => {
                if (!snapshot.empty || vuotoDaApplicare('records', snapshot)) {
                    const cloudRecords = [];
                    snapshot.forEach(doc => {
                        cloudRecords.push({ id: doc.id, ...doc.data() });
                    });
                    cloudRecords.sort((a, b) => new Date(b.data) - new Date(a.data));
                    if (cloudRecords.length) collezioniConDati['records'] = true;
                    window.dailyRecords = cloudRecords;
                    localStorage.setItem('taxi_records', JSON.stringify(cloudRecords));
                    // Un dispositivo non ancora aggiornato puo' rimandare indietro
                    // le voci col vecchio nome del finanziamento
                    if (typeof controllaNomeFinanziamento === 'function') controllaNomeFinanziamento();
                }
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Movimenti:", error));

            onSnapshot(shiftsCol, (snapshot) => {
                if (!snapshot.empty || vuotoDaApplicare('turni', snapshot)) {
                    const cloudShifts = [];
                    snapshot.forEach(doc => {
                        cloudShifts.push({ id: doc.id, ...doc.data() });
                    });
                    cloudShifts.sort((a, b) => new Date(b.data) - new Date(a.data));
                    if (cloudShifts.length) collezioniConDati['turni'] = true;
                    window.shifts = cloudShifts;
                    localStorage.setItem('taxi_shifts', JSON.stringify(cloudShifts));
                    // Un dispositivo non ancora aggiornato puo' rimandare indietro dei "Riposo"
                    if (typeof controllaRiposiDaConvertire === 'function') controllaRiposiDaConvertire();
                }
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Turni:", error));

            // Scadenze: a differenza di corse e turni, qui si applica anche uno snapshot vuoto,
            // altrimenti cancellandone una da un dispositivo resterebbe sugli altri.
            // Prima pero' si migrano sul Cloud quelle gia' salvate solo in locale.
            onSnapshot(scadenzeCol, async (snapshot) => {
                const cloudScadenze = [];
                snapshot.forEach(d => cloudScadenze.push({ id: d.id, ...d.data() }));

                if (!snapshot.empty) scadenzeCloudOk = true;

                if (snapshot.empty && (window.scadenze || []).length && !scadenzeCloudOk) {
                    // Non svuoto niente finche' non so che il Cloud accetta i dati
                    try {
                        for (const sc of window.scadenze) {
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'taxi_scadenze', String(sc.id)), sc);
                        }
                        scadenzeCloudOk = true;
                        if (window.showToast) window.showToast('☁️ Scadenze caricate sul Cloud.');
                    } catch (err) {
                        console.error("Errore migrazione scadenze:", err);
                        if (window.showToast) window.showToast('⚠️ Scadenze salvate solo qui: il Cloud ha rifiutato la scrittura.');
                    }
                    return;
                }

                scadenzeMigrate = true;
                cloudScadenze.sort((a, b) => String(a.data).localeCompare(String(b.data)));
                window.scadenze = cloudScadenze;
                localStorage.setItem('taxi_scadenze', JSON.stringify(cloudScadenze));
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Scadenze:", error));

            // Parco auto: stesso trattamento delle scadenze. Uno snapshot vuoto si
            // applica solo dopo aver visto che il Cloud accetta i dati, altrimenti
            // al primo avvio cancellerebbe le vetture salvate solo qui.
            onSnapshot(veicoliCol, async (snapshot) => {
                const cloudVeicoli = [];
                snapshot.forEach(d => cloudVeicoli.push({ id: d.id, ...d.data() }));

                if (!snapshot.empty) veicoliCloudOk = true;

                if (snapshot.empty && (window.veicoli || []).length && !veicoliCloudOk) {
                    try {
                        for (const v of window.veicoli) {
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'taxi_veicoli', String(v.id)), v);
                        }
                        veicoliCloudOk = true;
                        if (window.showToast) window.showToast('☁️ Parco auto caricato sul Cloud.');
                    } catch (err) {
                        console.error("Errore migrazione veicoli:", err);
                        if (window.showToast) window.showToast('⚠️ Parco auto salvato solo qui: il Cloud ha rifiutato la scrittura.');
                    }
                    return;
                }

                window.veicoli = cloudVeicoli;
                localStorage.setItem('taxi_veicoli', JSON.stringify(cloudVeicoli));
                window.renderNav();
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Parco Auto:", error));

            // Voci di costo fisso: stesso trattamento del parco auto
            onSnapshot(vociFisseCol, async (snapshot) => {
                const cloudVoci = [];
                snapshot.forEach(d => cloudVoci.push({ slug: d.id, ...d.data() }));

                if (!snapshot.empty) vociFisseCloudOk = true;

                if (snapshot.empty && (window.vociFisse || []).length && !vociFisseCloudOk) {
                    try {
                        for (const v of window.vociFisse) {
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'taxi_voci_fisse', String(v.slug)), v);
                        }
                        vociFisseCloudOk = true;
                    } catch (err) {
                        console.error("Errore migrazione voci fisse:", err);
                    }
                    return;
                }

                window.vociFisse = cloudVoci;
                localStorage.setItem('taxi_voci_fisse', JSON.stringify(cloudVoci));
                if (formConDatiNonSalvati()) { avvisaSyncInAttesa(); return; }
                window.renderContent();
            }, (error) => console.error("Errore Sync Voci Fisse:", error));
        }

        // Diventa true quando il Cloud ha dimostrato di funzionare per le scadenze:
        // o perche' conteneva gia' dei dati, o perche' ha accettato una scrittura.
        let scadenzeMigrate = false;
        let scadenzeCloudOk = false;
        let veicoliCloudOk = false;
        let vociFisseCloudOk = false;

        window.saveScadenzaToCloud = async function(scadenza) {
            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_scadenze', String(scadenza.id));
                    await setDoc(docRef, scadenza);
                } catch (err) {
                    console.error("Errore scrittura Cloud scadenza:", err);
                    if (window.showToast) window.showToast('⚠️ Scadenza salvata solo su questo dispositivo.');
                }
            }
        };

        window.deleteScadenzaFromCloud = async function(id) {
            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_scadenze', String(id));
                    await deleteDoc(docRef);
                } catch (err) {
                    console.error("Errore eliminazione Cloud scadenza:", err);
                    if (window.showToast) window.showToast('⚠️ Eliminata solo su questo dispositivo.');
                }
            }
        };

        window.saveVoceFissaToCloud = async function(voce) {
            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_voci_fisse', String(voce.slug));
                    await setDoc(docRef, voce);
                } catch (err) {
                    console.error("Errore scrittura Cloud voce fissa:", err);
                }
            }
        };

        window.deleteVoceFissaFromCloud = async function(slug) {
            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_voci_fisse', String(slug));
                    await deleteDoc(docRef);
                } catch (err) {
                    console.error("Errore eliminazione Cloud voce fissa:", err);
                }
            }
        };

        window.saveVeicoloToCloud = async function(veicolo) {
            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_veicoli', String(veicolo.id));
                    await setDoc(docRef, veicolo);
                } catch (err) {
                    console.error("Errore scrittura Cloud veicolo:", err);
                    if (window.showToast) window.showToast('⚠️ Vettura salvata solo su questo dispositivo.');
                }
            }
        };

        window.deleteVeicoloFromCloud = async function(id) {
            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_veicoli', String(id));
                    await deleteDoc(docRef);
                } catch (err) {
                    console.error("Errore eliminazione Cloud veicolo:", err);
                    if (window.showToast) window.showToast('⚠️ Eliminata solo su questo dispositivo.');
                }
            }
        };

        window.saveRecordToCloud = async function(record) {
            window.dailyRecords.unshift(record);
            // Riordino per data (piu' recente in cima): senza questo una corsa
            // registrata per un giorno passato restava in testa all'elenco.
            window.dailyRecords.sort((a, b) => new Date(b.data) - new Date(a.data));
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));

            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_records', String(record.id));
                    await setDoc(docRef, record);
                } catch (err) {
                    console.error("Errore scrittura Cloud record:", err);
                    if (window.showToast) window.showToast('⚠️ Corsa salvata solo in locale: sync Cloud fallita.');
                }
            }
        };

        window.saveShiftToCloud = async function(shift) {
            window.shifts.unshift(shift);
            // Stesso motivo delle corse: l'elenco turni deve restare in ordine di data
            // anche quando si registra un turno di ieri o dell'altro ieri.
            window.shifts.sort((a, b) => new Date(b.data) - new Date(a.data));
            localStorage.setItem('taxi_shifts', JSON.stringify(window.shifts));

            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_shifts', String(shift.id));
                    await setDoc(docRef, shift);
                } catch (err) {
                    console.error("Errore scrittura Cloud turno:", err);
                    if (window.showToast) window.showToast('⚠️ Turno salvato solo in locale: sync Cloud fallita.');
                }
            }
        };

        window.deleteRecordFromCloud = async function(id) {
            window.dailyRecords = window.dailyRecords.filter(r => String(r.id) !== String(id));
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));

            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_records', String(id));
                    await deleteDoc(docRef);
                } catch (err) {
                    console.error("Errore eliminazione Cloud record:", err);
                    if (window.showToast) window.showToast('⚠️ Eliminato solo in locale: sync Cloud fallita.');
                }
            }
        };

        // Cancellazione di molti movimenti in un colpo solo: una scrittura sola
        // in locale e blocchi da 400 sul Cloud, invece di una chiamata per riga.
        window.deleteRecordsFromCloud = async function(ids) {
            const insieme = new Set((ids || []).map(String));
            if (!insieme.size) return;
            window.dailyRecords = (window.dailyRecords || []).filter(r => !insieme.has(String(r.id)));
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));

            if (isCloudActive && db && auth.currentUser) {
                try {
                    const elenco = Array.from(insieme);
                    for (let i = 0; i < elenco.length; i += 400) {
                        const batch = writeBatch(db);
                        elenco.slice(i, i + 400).forEach(id => {
                            batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'taxi_records', String(id)));
                        });
                        await batch.commit();
                    }
                } catch (err) {
                    console.error("Errore eliminazione multipla Cloud:", err);
                    if (window.showToast) window.showToast('⚠️ Eliminate solo in locale: sync Cloud fallita.');
                }
            }
        };

        window.deleteShiftFromCloud = async function(id) {
            window.shifts = window.shifts.filter(s => String(s.id) !== String(id));
            localStorage.setItem('taxi_shifts', JSON.stringify(window.shifts));

            if (isCloudActive && db && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'taxi_shifts', String(id));
                    await deleteDoc(docRef);
                } catch (err) {
                    console.error("Errore eliminazione Cloud turno:", err);
                    if (window.showToast) window.showToast('⚠️ Eliminato solo in locale: sync Cloud fallita.');
                }
            }
        };

        // === IMPORT MASSIVO (usato dal ripristino backup / import Excel) ===
        // Scrive in un colpo solo su localStorage e sincronizza il Cloud a blocchi di 400
        // documenti: evita di bloccare il browser con migliaia di scritture singole.
        window.bulkSave = async function(newRecords, newShifts, onProgress) {
            const merge = (esistenti, nuovi) => {
                const mappa = new Map();
                (esistenti || []).forEach(x => mappa.set(String(x.id), x));
                (nuovi || []).forEach(x => mappa.set(String(x.id), x));
                return Array.from(mappa.values())
                    .sort((a, b) => new Date(b.data) - new Date(a.data));
            };

            window.dailyRecords = merge(window.dailyRecords, newRecords);
            window.shifts = merge(window.shifts, newShifts);
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));
            localStorage.setItem('taxi_shifts', JSON.stringify(window.shifts));

            if (!(isCloudActive && db && auth.currentUser)) return { cloud: false };

            const gruppi = [
                { col: 'taxi_records', items: newRecords || [] },
                { col: 'taxi_shifts', items: newShifts || [] }
            ];
            let fatti = 0;
            const totale = gruppi.reduce((a, g) => a + g.items.length, 0);

            // Se la scrittura sul Cloud fallisce (rete debole o assente, molto comune
            // spostandosi in auto), il dato resta comunque salvato in locale qui sopra:
            // non deve bloccare chi ha chiamato bulkSave (es. il salvataggio di una
            // modifica a km/ore di un turno), altrimenti il pannello di modifica resta
            // aperto e la schermata non si aggiorna, dando l'impressione che "non funzioni".
            try {
                for (const g of gruppi) {
                    for (let i = 0; i < g.items.length; i += 400) {
                        const fetta = g.items.slice(i, i + 400);
                        const batch = writeBatch(db);
                        fetta.forEach(item => {
                            batch.set(doc(db, 'artifacts', appId, 'public', 'data', g.col, String(item.id)), item);
                        });
                        await batch.commit();
                        fatti += fetta.length;
                        if (onProgress) onProgress(fatti, totale);
                    }
                }
                return { cloud: true, scritti: fatti };
            } catch (err) {

        const CATEGORIE_USCITA = ['Carburante', 'Ristoro', 'Lavaggio', 'Manutenzione', 'Assicurazione', 'Radio taxi', 'Bollo / Tasse auto', 'Parcheggio / Pedaggio', 'Multa', 'Commercialista'];

        const COLORI_CATEGORIA = {
            'Carburante': 'bg-orange-500',

            'Lavaggio': 'bg-sky-500',
            'Assicurazione': 'bg-indigo-500',
            'Radio taxi': 'bg-purple-500',
            'Bollo / Tasse auto': 'bg-rose-500',
            'Parcheggio / Pedaggio': 'bg-teal-500',
            'Multa': 'bg-red-600',
            'Commercialista': 'bg-lime-600',
            'Ristoro': 'bg-cyan-500',
            'Costi fissi': 'bg-slate-500',
            'Altro': 'bg-gray-400'
        };

        function coloreCategoria(nome) {
            return COLORI_CATEGORIA[nome] || 'bg-gray-400';
        }

        // Secondo livello di dettaglio: dalla stringa salvata alla tipologia di spesa.
        // "Costi fissi - Radio taxi (31 gg x 10,50 €)"  -> "Radio taxi"
        // "Costi fissi - Finanziamento licenza (rata mensile)" -> "Finanziamento licenza"
        // "Costi fissi - Rata tassametro (rata mensile dal 10/07)" -> "Rata tassametro"
        // "Carburante - Q8 corso Francia"               -> "Q8 corso Francia"
        // "Carburante / Diesel (233362 Km)"             -> "Carburante / Diesel"
        // "Finanziamento licenza (70.000 € x 10 anni) (31 gg x 26,60 €)" -> tiene la prima parentesi
        function sottocategoria(testo) {
            let t = String(testo || '').trim();
            if (!t) return 'Senza descrizione';
            const i = t.indexOf(' - ');
            if (i > -1) t = t.slice(i + 3).trim();
            // via solo le code automatiche: conteggio giorni e chilometraggio
            t = t.replace(/\s*\(\s*\d+\s*gg[^()]*\)\s*$/i, '').trim();
            t = t.replace(/\s*\(\s*rata mensile[^()]*\)\s*$/i, '').trim();
            t = t.replace(/\s*\([^()]*\bkm\b[^()]*\)\s*$/i, '').trim();
            return t || 'Senza descrizione';
        }

        // Raggruppa un elenco di movimenti per tipologia, dal piu' pesante al piu' leggero
        function raggruppaPerTipologia(voci) {
            const m = {};
            (voci || []).forEach(v => {
                const nome = sottocategoria(v.categoria);
                if (!m[nome]) m[nome] = { nome, tot: 0, n: 0, ultima: v.data };
                m[nome].tot += parseFloat(v.importo || 0);
                m[nome].n++;
                if (String(v.data) > String(m[nome].ultima)) m[nome].ultima = v.data;
            });
            return Object.values(m).sort((a, b) => b.tot - a.tot);

        function categoriaBase(testo) {
            const t = String(testo || '').trim();
            if (!t) return 'Altro';
            const b = t.toLowerCase();
            if (b.startsWith('costi fissi')) return 'Costi fissi';
            if (b.includes('carburante') || b.includes('diesel') || b.includes('benzina') || b.includes('gpl') || b.includes('metano')) return 'Carburante';
            const trovata = CATEGORIE_USCITA.find(c => b.startsWith(c.toLowerCase()));

        function esc(v) {
            return String(v === null || v === undefined ? '' : v)

        function metodoBadgeClass(metodo) {

                : [['Contanti', '🟢 Contanti'], ['POS', '⚫ POS / Carta'], ['Satispay', '🔴 Satispay'],

            return voci.map(([v, l]) => `<option value="${v}" ${selezionato === v ? 'selected' : ''}>${l}</option>`).join('');
        }

        // Aliquote IRPEF a scaglioni. Dal 2026 il secondo scaglione scende dal 35% al 33%
        // (Legge di Bilancio 2026, L. 199/2025); per gli anni precedenti resta il 35%.
        function aliquotaSecondoScaglione(anno) {
            return parseInt(anno, 10) >= 2026 ? 0.33 : 0.35;
        }

        function calcolaIRPEF(imponibile, anno) {
            if (imponibile <= 0) return 0;
            const a2 = aliquotaSecondoScaglione(anno || annoAttivo());
            if (imponibile <= 28000) return imponibile * 0.23;
            if (imponibile <= 50000) return 28000 * 0.23 + (imponibile - 28000) * a2;
            return 28000 * 0.23 + 22000 * a2 + (imponibile - 50000) * 0.43;
        }

        // Stima tasse per Regime Ordinario: Contributi INPS (deducibili) + IRPEF a scaglioni + Addizionali
        function calcolaTasseOrdinario(utileLordo, anno) {
            const fs = window.fiscalSettings || { inpsPerc: 24, addizionaliPerc: 2 };
            const contributiInps = utileLordo > 0 ? utileLordo * (fs.inpsPerc / 100) : 0;
            const imponibileIrpef = Math.max(0, utileLordo - contributiInps);
            const irpef = calcolaIRPEF(imponibileIrpef, anno);
            const addizionali = imponibileIrpef * (fs.addizionaliPerc / 100);

                tasseTot: contributiInps + irpef + addizionali

        // ============================================================

        function anniDisponibili() {
            const anni = new Set();
            (window.dailyRecords || []).forEach(r => { if (r.data) anni.add(String(r.data).slice(0, 4)); });
            (window.shifts || []).forEach(t => { if (t.data) anni.add(String(t.data).slice(0, 4)); });
            anni.add(String(new Date().getFullYear()));
            return Array.from(anni).sort();
        }

        function annoAttivo() {
            if (!window.annoScelto) {
                const anni = anniDisponibili();
                const corrente = String(new Date().getFullYear());

        function cambiaAnno(val) {

        function nellAnno(x) {
            return x && x.data && String(x.data).slice(0, 4) === annoAttivo();
        }

        function recordsAnno() {
            return (window.dailyRecords || []).filter(nellAnno);
        }

        function turniAnno() {
            return (window.shifts || []).filter(nellAnno);
        }

        function getStats() {
            let entrate = 0, uscite = 0;
            recordsAnno().forEach(r => {
                if (r.tipo === 'ENTRATA') entrate += parseFloat(r.importo || 0);
                if (r.tipo === 'USCITA') uscite += parseFloat(r.importo || 0);
            });
            const utileLordo = entrate - uscite;
            const fiscale = calcolaTasseOrdinario(utileLordo);
            const tasse = fiscale.tasseTot;
            return { entrate, uscite, tasse, fiscale, netto: entrate - uscite - tasse };
        }

        function saveFiscalSettings() {
            const inps = parseFloat(document.getElementById('set-inps').value);
            const add = parseFloat(document.getElementById('set-add').value);
            const campoSoglia = document.getElementById('set-soglia');
            const soglia = campoSoglia ? parseFloat(campoSoglia.value) : (window.fiscalSettings.sogliaForfettario || 85000);
            if (isNaN(inps) || isNaN(add) || inps < 0 || add < 0 || isNaN(soglia) || soglia <= 0) {
                showToast('Valori non validi.');
                return;

            window.fiscalSettings = { inpsPerc: inps, addizionaliPerc: add, sogliaForfettario: soglia };

            showToast('⚡ Impostazioni fiscali salvate!');
            renderContent();

        // Un singolo scenario di calcolo: da un imponibile di partenza alle tasse stimate
        function scenarioTasse(incassi, uscite, anno) {
            const utile = incassi - uscite;
            const f = calcolaTasseOrdinario(utile, anno);
            return {
                incassi, uscite, utile,
                contributiInps: f.contributiInps,
                imponibileIrpef: f.imponibileIrpef,
                irpef: f.irpef,
                addizionali: f.addizionali,
                tasse: f.tasseTot,
                netto: utile - f.tasseTot
            };
        }

        // Quanto manca alla soglia di uscita dal Regime Forfettario, sull'anno attivo.
        function statsForfettario() {
            const fs = window.fiscalSettings || {};
            const soglia = fs.sogliaForfettario || 85000;
            const entrate = recordsAnno().filter(r => r.tipo === 'ENTRATA').reduce((a, r) => a + parseFloat(r.importo || 0), 0);
            const pct = soglia > 0 ? Math.min(100, (entrate / soglia) * 100) : 0;
            return { soglia, entrate, pct, vicino: entrate >= soglia * 0.85 };
        }

        // Totali essenziali di un anno, per il confronto anno su anno
        function totaliAnno(anno) {
            let entrate = 0, uscite = 0, corse = 0, ore = 0, giorni = new Set();
            (window.dailyRecords || []).forEach(r => {
                if (!r.data || String(r.data).slice(0, 4) !== anno) return;
                const imp = parseFloat(r.importo || 0);
                if (r.tipo === 'ENTRATA') { entrate += imp; corse++; giorni.add(r.data); }
                else uscite += imp;
            });
            (window.shifts || []).forEach(t => {
                if (!t.data || String(t.data).slice(0, 4) !== anno || isRiposo(t)) return;
                ore += parseFloat(t.ore || 0);
            });
            return { anno, entrate, uscite, saldo: entrate - uscite, corse, ore, giorni: giorni.size };
        }

        // ============================================================
        //  SCADENZE (revisione, RCA, bollo, tassametro, licenza...)
        //  Salvate in locale e sincronizzate sul Cloud come corse e turni,
        //  cosi' si vedono da tutti i dispositivi collegati.
        // ============================================================

        function salvaScadenze() {
            try { localStorage.setItem('taxi_scadenze', JSON.stringify(window.scadenze || [])); } catch (err) { /* spazio esaurito: pazienza */ }
        }

        function addScadenza(e) {
            e.preventDefault();
            const nome = (document.getElementById('scad-nome').value || '').trim();
            const data = document.getElementById('scad-data').value;
            if (!nome || !data) {
                showToast('Inserisci nome e data della scadenza.');
                return;
            }
            window.scadenze = window.scadenze || [];
            const nuova = { id: nuovoId(), nome, data };
            window.scadenze.push(nuova);
            window.scadenze.sort((a, b) => String(a.data).localeCompare(String(b.data)));
            salvaScadenze();
            if (window.saveScadenzaToCloud) window.saveScadenzaToCloud(nuova);
            showToast('⚡ Scadenza aggiunta.');
            renderContent();
        }

        function deleteScadenza(id) {
            const sc = (window.scadenze || []).find(x => String(x.id) === String(id));
            if (sc && !confirm(`Elimino la scadenza "${sc.nome}" del ${sc.data}?`)) return;
            window.scadenze = (window.scadenze || []).filter(s => String(s.id) !== String(id));
            salvaScadenze();
            if (window.deleteScadenzaFromCloud) window.deleteScadenzaFromCloud(id);
            showToast('Scadenza eliminata.');
            renderContent();
        }

        // Ordina per data crescente e calcola i giorni mancanti da oggi.
        function scadenzeOrdinate() {
            const oggi = oggiISO();
            return (window.scadenze || []).slice().sort((a, b) => String(a.data).localeCompare(String(b.data))).map(s => {
                const giorni = Math.round((new Date(s.data) - new Date(oggi)) / 86400000);
                return Object.assign({}, s, { giorniMancanti: giorni, scaduta: giorni < 0, vicina: giorni >= 0 && giorni <= 30 });
            });
        }


        // ============================================================
        //  PARCO AUTO
        //  Ogni vettura con quello che e' costata e quello che ha reso.
        //  I km non si riscrivono a mano: quelli percorsi si ricavano dal
        //  contachilometri dei turni, e le spese del periodo sono quelle
        //  gia' registrate nel Registro Uscite.
        // ============================================================

        const ALIMENTAZIONI = ['Diesel', 'Benzina', 'GPL', 'Metano', 'Ibrida', 'Ibrida plug-in', 'Elettrica', 'Altro'];

        const USCITE_VEICOLO = {
            'in-uso':       'Ancora in uso',
            'venduta':      'Venduta',
            'permutata':    'Data in permuta',
            'rottamata':    'Rottamata',
            'incidente':    'Distrutta in un incidente',
            'fine-leasing': 'Restituita a fine leasing'
        };

        // Categorie di spesa che riguardano la vettura: sono quelle che entrano
        // nel costo al chilometro. Restano fuori radio taxi, commercialista e
        // ristoro, che ci sarebbero con qualsiasi auto, e i costi fissi: li' dentro
        // c'e' il finanziamento della licenza, che con la vettura non c'entra.
        // Fuori anche le rate di un eventuale finanziamento dell'auto: quanto e'
        // costata la vettura sta gia' nella differenza fra prezzo di acquisto e
        // valore di realizzo, e sommarci le rate sarebbe contarla due volte.
        const CATEGORIE_AUTO = ['Carburante', 'Manutenzione', 'Lavaggio', 'Assicurazione',
                                'Bollo / Tasse auto', 'Parcheggio / Pedaggio', 'Multa'];

        function salvaVeicoli() {
            try { localStorage.setItem('taxi_veicoli', JSON.stringify(window.veicoli || [])); } catch (err) { /* spazio esaurito: pazienza */ }
        }

        function numeroOpzionale(v) {
            const n = parseFloat(String(v === null || v === undefined ? '' : v).replace(',', '.'));
            return Number.isFinite(n) ? n : null;
        }

        function inUso(v) { return !v.dataUscita; }

        // Vetture dalla piu' recente alla piu' vecchia, con quella in uso in cima
        function veicoliOrdinati() {
            return (window.veicoli || []).slice().sort((a, b) => {
                if (inUso(a) !== inUso(b)) return inUso(a) ? -1 : 1;
                return String(b.dataAcquisto || '').localeCompare(String(a.dataAcquisto || ''));
            });
        }

        // Contachilometri piu' alto registrato nei turni dentro un periodo:
        // serve per sapere a che punto e' l'auto ancora in uso, senza doverlo
        // riscrivere a mano da qualche parte.
        function kmMassimoNelPeriodo(da, a) {
            let massimo = null;
            (window.shifts || []).forEach(t => {
                if (isRiposo(t) || !t.data) return;
                if (da && String(t.data) < da) return;
                if (a && String(t.data) > a) return;
                [t.kmInizio, t.kmFine].forEach(k => {
                    const n = numeroOpzionale(k);
                    if (n !== null && n > 0 && (massimo === null || n > massimo)) massimo = n;
                });
            });
            return massimo;
        }

        // Tutti i conti di una vettura: km, perdita di valore, spese del periodo
        // e quanto viene a costare ogni chilometro.
        function statsVeicolo(v) {
            const da = v.dataAcquisto || '';
            const a = v.dataUscita || oggiISO();

            const kmAcq = numeroOpzionale(v.kmAcquisto);
            const kmUsc = numeroOpzionale(v.kmUscita);
            const kmOggi = inUso(v) ? kmMassimoNelPeriodo(da, a) : null;
            const kmFinali = kmUsc !== null ? kmUsc : kmOggi;
            const kmPercorsi = (kmAcq !== null && kmFinali !== null && kmFinali >= kmAcq) ? kmFinali - kmAcq : null;

            const prezzoAcq = numeroOpzionale(v.prezzoAcquisto);
            const realizzo = numeroOpzionale(v.valoreUscita);
            const stimato = numeroOpzionale(v.valoreStimato);
            // Per un'auto venduta la perdita e' certa; per una ancora in uso si
            // puo' calcolare solo se hai indicato quanto vale oggi, a occhio.
            const valoreFinale = inUso(v) ? stimato : realizzo;
            const perdita = (prezzoAcq !== null && valoreFinale !== null) ? prezzoAcq - valoreFinale : null;
            const perditaStimata = inUso(v) && perdita !== null;

            // Spese del periodo di possesso, prese dai movimenti gia' registrati
            const perCategoria = {};
            let speseTot = 0, incassi = 0;
            (window.dailyRecords || []).forEach(r => {
                if (!r.data || String(r.data) < da || String(r.data) > a) return;
                const imp = parseFloat(r.importo || 0);
                if (r.tipo === 'ENTRATA') { incassi += imp; return; }
                if (r.tipo !== 'USCITA') return;
                const base = categoriaBase(r.categoria);
                if (!CATEGORIE_AUTO.includes(base)) return;
                perCategoria[base] = (perCategoria[base] || 0) + imp;
                speseTot += imp;
            });

            const giorni = da ? Math.max(1, giorniTraDate(da, a)) : null;
            const anni = giorni ? giorni / 365.25 : null;

            const costoTot = (perdita !== null ? perdita : 0) + speseTot;
            const perKm = (x) => (kmPercorsi && kmPercorsi > 0 && x !== null) ? x / kmPercorsi : null;

            return {
                da, a, giorni, anni,
                kmAcq, kmFinali, kmPercorsi, kmOggi,
                kmAnno: (kmPercorsi !== null && anni) ? kmPercorsi / anni : null,
                prezzoAcq, valoreFinale, perdita, perditaStimata,
                speseTot, incassi,
                categorie: Object.keys(perCategoria)
                    .map(k => ({ nome: k, totale: perCategoria[k] }))
                    .sort((x, y) => y.totale - x.totale),
                costoTot,
                perditaKm: perKm(perdita),
                speseKm: perKm(speseTot),
                costoKm: perKm(costoTot)
            };
        }

        function giorniTraDate(da, a) {
            const [a1, m1, g1] = String(da).split('-').map(Number);
            const [a2, m2, g2] = String(a).split('-').map(Number);
            if (!a1 || !a2) return 0;
            return Math.round((Date.UTC(a2, m2 - 1, g2) - Date.UTC(a1, m1 - 1, g1)) / 86400000);
        }

        // Due vetture possedute nello stesso momento: le spese di quei giorni
        // finirebbero contate su entrambe. Meglio dirlo che far tornare i conti
        // per finta.
        function periodiSovrapposti() {
            const elenco = (window.veicoli || []).filter(v => v.dataAcquisto);
            const coppie = [];
            for (let i = 0; i < elenco.length; i++) {
                for (let j = i + 1; j < elenco.length; j++) {
                    const x = elenco[i], y = elenco[j];
                    const fineX = x.dataUscita || '9999-12-31';
                    const fineY = y.dataUscita || '9999-12-31';
                    if (x.dataAcquisto <= fineY && y.dataAcquisto <= fineX) {
                        coppie.push([x, y]);
                    }
                }
            }
            return coppie;
        }

        // Campi del modulo, nell'ordine in cui compaiono
        const CAMPI_VEICOLO = ['modello', 'targa', 'anno', 'alimentazione', 'telaio',
                               'data-acquisto', 'km-acquisto', 'prezzo-acquisto',
                               'uscita', 'data-uscita', 'km-uscita', 'valore-uscita',
                               'valore-stimato', 'note'];

        // Cambiando la situazione della vettura il modulo si ridisegna, perche'
        // i campi da mostrare sono diversi. Prima si fotografa quello che c'e'
        // gia' scritto, altrimenti la scelta appena fatta andrebbe persa insieme
        // a tutto il resto. I campi non presenti in quel momento restano com'erano.
        function leggiFormVeicolo() {
            window.bozzaVeicolo = window.bozzaVeicolo || {};
            CAMPI_VEICOLO.forEach(campo => {
                const el = document.getElementById('vc-' + campo);
                if (el) window.bozzaVeicolo[campo] = el.value;
            });
            return window.bozzaVeicolo;
        }

        function cambiaUscitaVeicolo() {
            leggiFormVeicolo();
            renderContent();
        }

        function apriFormVeicolo(id) {
            window.veicoloInModifica = id || 'nuovo';
            const v = id && id !== 'nuovo'
                ? ((window.veicoli || []).find(x => String(x.id) === String(id)) || {})
                : {};
            const testo = (x) => x === null || x === undefined ? '' : String(x);
            window.bozzaVeicolo = {
                'modello': testo(v.modello), 'targa': testo(v.targa), 'anno': testo(v.anno),
                'alimentazione': v.alimentazione || ALIMENTAZIONI[0], 'telaio': testo(v.telaio),
                'data-acquisto': testo(v.dataAcquisto), 'km-acquisto': testo(v.kmAcquisto),
                'prezzo-acquisto': testo(v.prezzoAcquisto),
                'uscita': v.uscita || 'in-uso', 'data-uscita': testo(v.dataUscita),
                'km-uscita': testo(v.kmUscita), 'valore-uscita': testo(v.valoreUscita),
                'valore-stimato': testo(v.valoreStimato), 'note': testo(v.note)
            };
            renderContent();
            setTimeout(() => {
                const el = document.getElementById('vc-modello');
                if (el) el.focus();
            }, 0);
        }

        function chiudiFormVeicolo() {
            window.veicoloInModifica = null;
            window.bozzaVeicolo = null;
            renderContent();
        }

        function salvaVeicolo(e) {
            e.preventDefault();
            const bozza = leggiFormVeicolo();
            const leggi = (id) => String(bozza[String(id).replace(/^vc-/, '')] || '').trim();
            const modello = leggi('vc-modello');
            const dataAcquisto = leggi('vc-data-acquisto');
            if (!modello) { showToast('Indica almeno marca e modello.'); return; }
            if (!dataAcquisto) { showToast('Indica la data di acquisto.'); return; }

            const uscita = leggi('vc-uscita');
            const dataUscita = uscita === 'in-uso' ? '' : leggi('vc-data-uscita');
            if (uscita !== 'in-uso' && !dataUscita) {
                showToast('Indica la data in cui l\'auto è uscita.');
                return;
            }
            if (dataUscita && dataUscita < dataAcquisto) {
                showToast('La data di uscita viene prima di quella di acquisto.');
                return;
            }

            const kmAcquisto = numeroOpzionale(leggi('vc-km-acquisto'));
            const kmUscita = uscita === 'in-uso' ? null : numeroOpzionale(leggi('vc-km-uscita'));
            if (kmAcquisto !== null && kmUscita !== null && kmUscita < kmAcquisto) {
                showToast('I km all\'uscita non possono essere inferiori a quelli di acquisto.');
                return;
            }

            const prezzoAcquisto = numeroOpzionale(leggi('vc-prezzo-acquisto'));
            const valoreUscita = uscita === 'in-uso' ? null : numeroOpzionale(leggi('vc-valore-uscita'));
            const valoreStimato = uscita === 'in-uso' ? numeroOpzionale(leggi('vc-valore-stimato')) : null;
            if ([prezzoAcquisto, valoreUscita, valoreStimato].some(x => x !== null && x < 0)) {
                showToast('Gli importi non possono essere negativi.');
                return;
            }

            const esistente = window.veicoloInModifica !== 'nuovo'
                ? (window.veicoli || []).find(x => String(x.id) === String(window.veicoloInModifica))
                : null;

            const veicolo = Object.assign({}, esistente || {}, {
                id: esistente ? esistente.id : nuovoId(),
                modello,
                targa: leggi('vc-targa').toUpperCase(),
                anno: leggi('vc-anno'),
                alimentazione: leggi('vc-alimentazione'),
                telaio: leggi('vc-telaio').toUpperCase(),
                dataAcquisto, kmAcquisto, prezzoAcquisto,
                uscita, dataUscita, kmUscita, valoreUscita, valoreStimato,
                note: leggi('vc-note')
            });

            window.veicoli = window.veicoli || [];
            if (esistente) {
                window.veicoli = window.veicoli.map(x => String(x.id) === String(veicolo.id) ? veicolo : x);
            } else {
                window.veicoli.push(veicolo);
            }
            salvaVeicoli();
            if (window.saveVeicoloToCloud) window.saveVeicoloToCloud(veicolo);
            window.veicoloInModifica = null;
            window.bozzaVeicolo = null;
            showToast(esistente ? 'Vettura aggiornata.' : '⚡ Vettura aggiunta al parco auto.');
            renderNav();
            renderContent();
        }

        function deleteVeicolo(id) {
            const v = (window.veicoli || []).find(x => String(x.id) === String(id));
            if (!v) return;
            if (!confirm(`Elimino ${v.modello}${v.targa ? ' (' + v.targa + ')' : ''} dal parco auto?\nI movimenti e i turni restano dove sono.`)) return;
            window.veicoli = (window.veicoli || []).filter(x => String(x.id) !== String(id));
            salvaVeicoli();
            if (window.deleteVeicoloFromCloud) window.deleteVeicoloFromCloud(id);
            showToast('Vettura eliminata.');
            renderContent();
        }

        function pastigliaStatoVeicolo(v) {
            if (inUso(v)) return '<span class="bg-green-100 text-green-800 border border-green-300 px-2.5 py-1 rounded-md text-xs font-black">In uso</span>';
            const etichetta = USCITE_VEICOLO[v.uscita] || 'Uscita';
            const rosse = ['rottamata', 'incidente'];
            const classe = rosse.includes(v.uscita)
                ? 'bg-red-100 text-red-800 border-red-300'
                : 'bg-gray-100 text-gray-700 border-gray-300';
            return `<span class="${classe} border px-2.5 py-1 rounded-md text-xs font-black">${esc(etichetta)}</span>`;
        }

        function formVeicolo() {
            const nuovo = window.veicoloInModifica === 'nuovo';
            const b = window.bozzaVeicolo || {};
            const uscita = b['uscita'] || 'in-uso';
            const ancoraInUso = uscita === 'in-uso';
            // Il modulo si disegna sempre da quello che c'e' scritto adesso,
            // non dal dato salvato: cosi' un ridisegno non cancella niente.
            const val = (campo) => esc(b[campo] === null || b[campo] === undefined ? '' : b[campo]);
            const v = { alimentazione: b['alimentazione'] };

            return `
                <div class="bg-white p-6 rounded-2xl shadow-md border-2 border-yellow-400 slide-in no-print">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-900">${nuovo ? 'Aggiungi una vettura' : 'Modifica la vettura'}</h3>
                        <button onclick="chiudiFormVeicolo()" class="text-gray-500 hover:text-gray-800 text-sm font-bold">Chiudi</button>
                    </div>
                    <form onsubmit="salvaVeicolo(event)" class="space-y-5">

                        <div>
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400 mb-2">La vettura</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                <div class="lg:col-span-2">
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Marca e modello</label>
                                    <input type="text" id="vc-modello" required value="${val('modello')}" placeholder="Es. Skoda Octavia 2.0 TDI" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Targa</label>
                                    <input type="text" id="vc-targa" value="${val('targa')}" placeholder="AB123CD" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400 uppercase" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Anno <span class="text-gray-400 font-normal">immatricolazione</span></label>
                                    <input type="number" id="vc-anno" value="${val('anno')}" placeholder="2021" min="1950" max="2100" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Alimentazione</label>
                                    <select id="vc-alimentazione" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400 font-medium">
                                        ${ALIMENTAZIONI.map(a => `<option value="${esc(a)}" ${v.alimentazione === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="lg:col-span-3">
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Numero di telaio <span class="text-gray-400 font-normal">facoltativo, comodo per le pratiche</span></label>
                                    <input type="text" id="vc-telaio" value="${val('telaio')}" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400 uppercase" />
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-gray-100">
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400 mb-2">Acquisto</p>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Data di acquisto</label>
                                    <input type="date" id="vc-data-acquisto" required value="${val('data-acquisto')}" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Km al momento dell'acquisto</label>
                                    <input type="number" id="vc-km-acquisto" value="${val('km-acquisto')}" placeholder="0" min="0" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400" />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Costo di acquisto (€)</label>
                                    <input type="number" step="0.01" id="vc-prezzo-acquisto" value="${val('prezzo-acquisto')}" placeholder="0.00" min="0" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400 font-bold" />
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-gray-100">
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400 mb-2">Uscita dal parco</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Situazione</label>
                                    <select id="vc-uscita" onchange="cambiaUscitaVeicolo()" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400 font-medium">
                                        ${Object.keys(USCITE_VEICOLO).map(k => `<option value="${k}" ${uscita === k ? 'selected' : ''}>${esc(USCITE_VEICOLO[k])}</option>`).join('')}
                                    </select>
                                </div>
                                ${ancoraInUso ? `
                                    <div class="lg:col-span-3">
                                        <label class="block text-xs font-bold text-gray-700 mb-1">Quanto vale oggi, a occhio (€) <span class="text-gray-400 font-normal">facoltativo</span></label>
                                        <input type="number" step="0.01" id="vc-valore-stimato" value="${val('valore-stimato')}" placeholder="0.00" min="0" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400" />
                                        <p class="text-[11px] text-gray-400 mt-1">Serve solo per stimare quanto valore hai già perso: finché non vendi è una stima, non un dato certo.</p>
                                    </div>
                                ` : `
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 mb-1">Data di uscita</label>
                                        <input type="date" id="vc-data-uscita" value="${val('data-uscita')}" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-400" />
                                    </div>

        function getReportStats(monthFilter) {
            const meseOk = (x) => monthFilter === 'ALL'
                || (!!x.data && parseInt(String(x.data).slice(5, 7)) === parseInt(monthFilter));

            const records = recordsAnno().filter(meseOk);
            const shifts = turniAnno().filter(meseOk);

            let incassiTot = 0, pos = 0, contanti = 0, fattura = 0, satispay = 0, app = 0;
            let usciteTot = 0, carburante = 0, manutenzione = 0, altro = 0;
            const perCat = {};

            records.forEach(r => {
                const imp = parseFloat(r.importo || 0);
                if (r.tipo === 'ENTRATA') {
                    incassiTot += imp;
                    switch (famigliaMetodo(r.metodo)) {
                        case 'POS': pos += imp; break;
                        case 'Contanti': contanti += imp; break;
                        case 'Satispay': satispay += imp; break;
                        case 'Fattura': fattura += imp; break;
                        default: app += imp;
                    }
                } else if (r.tipo === 'USCITA') {
                    usciteTot += imp;
                    const cat = (r.categoria || '').toLowerCase();
                    if (cat.includes('carburante') || cat.includes('diesel')) carburante += imp;
                    else if (cat.includes('manutenzione') || cat.includes('lavaggio')) manutenzione += imp;
                    else altro += imp;

                    const baseCat = categoriaBase(r.categoria);
                    if (!perCat[baseCat]) perCat[baseCat] = { nome: baseCat, tot: 0, n: 0, voci: [] };
                    perCat[baseCat].tot += imp;
                    perCat[baseCat].n++;
                    perCat[baseCat].voci.push(r);
                }
            });

            let kmTot = 0, oreTot = 0;
            shifts.filter(s => !isRiposo(s)).forEach(s => {
                kmTot += parseFloat(s.kmTot || 0);
                oreTot += parseFloat(s.ore || 0);
            });

            const utileLordo = incassiTot - usciteTot;
            const fiscale = calcolaTasseOrdinario(utileLordo);
            const stimaTasse = fiscale.tasseTot;
            const nettoStimato = utileLordo - stimaTasse;

            const mediaOra = oreTot > 0 ? (incassiTot / oreTot) : 0;
            const mediaKm = kmTot > 0 ? (incassiTot / kmTot) : 0;
            const costoKm = kmTot > 0 ? (usciteTot / kmTot) : 0;

            return {
                countCorse: records.filter(r => r.tipo === 'ENTRATA').length,
                countUscite: records.filter(r => r.tipo === 'USCITA').length,
                countTurni: shifts.filter(s => !isRiposo(s)).length,
                countRiposi: shifts.filter(isRiposo).length,
                incassiTot, pos, contanti, fattura, satispay, app,
                usciteTot, carburante, manutenzione, altro,
                speseCategorie: Object.values(perCat)
                    .sort((a, b) => b.tot - a.tot)
                    .map(c => ({ ...c, tipologie: raggruppaPerTipologia(c.voci) })),
                kmTot, oreTot, utileLordo, stimaTasse, nettoStimato, fiscale,
                mediaOra, mediaKm, costoKm
            };
        }
