        // ============================================================
        //  RIEPILOGO GIORNALIERO E MENSILE (Dashboard)
        // ============================================================

        const GIORNI_SETT = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
        const GIORNI_SETT_BREVI = ['dom','lun','mar','mer','gio','ven','sab'];

        // Le date sono salvate come 'AAAA-MM-GG': confronto le stringhe per evitare
        // gli scherzi dei fusi orari di new Date().
        function dataEstesa(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(a, m - 1, g);
            return `${GIORNI_SETT[d.getDay()]} ${g} ${nomeMese(m).toLowerCase()} ${a}`;
        }

        function giornoBreve(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            return GIORNI_SETT_BREVI[new Date(a, m - 1, g).getDay()];
        }

        // Numero di settimana ISO 8601 (la settimana contiene il primo giovedi' dell'anno):
        // e' lo stesso conteggio usato su calendari e agende cartacee.
        function numeroSettimana(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(Date.UTC(a, m - 1, g));
            const giornoIso = (d.getUTCDay() + 6) % 7; // lunedi=0 ... domenica=6
            d.setUTCDate(d.getUTCDate() - giornoIso + 3);
            const primoGennaio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - primoGennaio) / 86400000) + 1) / 7);
        }

        // Domenica di Pasqua secondo il calendario gregoriano (algoritmo di Gauss):
        // serve per calcolare Pasqua e Pasquetta, le uniche due festivita' italiane "mobili".
        function pasquaGregoriana(anno) {
            const a = anno % 19;
            const b = Math.floor(anno / 100);
            const c = anno % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mese = Math.floor((h + l - 7 * m + 114) / 31); // 3 = marzo, 4 = aprile
            const giorno = ((h + l - 7 * m + 114) % 31) + 1;
            return `${anno}-${String(mese).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
        }

        // Festivita' nazionali italiane + il patrono di Torino (San Giovanni Battista, 24 giugno),
        // utile a colpo d'occhio per un tassista torinese per capire su quali giorni si e' lavorato
        // durante una festa. Calcolate una volta per anno e tenute in cache.
        const _cacheFestivita = {};
        function festivitaAnno(anno) {
            if (_cacheFestivita[anno]) return _cacheFestivita[anno];
            const pasqua = pasquaGregoriana(anno);
            const pasquetta = spostaGiorno(pasqua, 1);
            const mappa = {
                [`${anno}-01-01`]: 'Capodanno',
                [`${anno}-01-06`]: 'Epifania',
                [pasqua]: 'Pasqua',
                [pasquetta]: 'Pasquetta',
                [`${anno}-04-25`]: '25 Aprile',
                [`${anno}-05-01`]: '1 Maggio',
                [`${anno}-06-02`]: '2 Giugno',
                [`${anno}-06-24`]: 'S. Giovanni',
                [`${anno}-08-15`]: 'Ferragosto',
                [`${anno}-11-01`]: 'Ognissanti',
                [`${anno}-12-08`]: 'Immacolata',
                [`${anno}-12-25`]: 'Natale',
                [`${anno}-12-26`]: 'S. Stefano',
            };
            _cacheFestivita[anno] = mappa;
            return mappa;
        }

        function nomeFestivo(iso) {
            if (!iso) return null;
            const anno = parseInt(iso.slice(0, 4));
            return festivitaAnno(anno)[iso] || null;
        }

        // Classe colore per evidenziare sabato (arancione), domenica e festivi (rosso):
        // un colpo d'occhio per distinguere subito i giorni "normali" da weekend/festa.
        function classeEvidenziaGiorno(iso) {
            if (!iso) return 'text-gray-400';
            const [a, m, g] = iso.split('-').map(Number);
            const gg = new Date(a, m - 1, g).getDay(); // 0 = domenica ... 6 = sabato
            if (nomeFestivo(iso) || gg === 0) return 'text-red-500';
            if (gg === 6) return 'text-amber-600';
            return 'text-gray-400';
        }

        // Markup compatto per le celle "Data" dei registri: data + giorno abbreviato + settimana
        // (o nome della festa, se il giorno e' festivo), su due righe per non allargare le tabelle
        // (importante sugli schermi piu' stretti). Sabato in arancione, domenica/festivi in rosso.
        function dataConDettagli(iso) {
            if (!iso) return '';
            const festivo = nomeFestivo(iso);
            const colore = classeEvidenziaGiorno(iso);
            const evidenziato = colore !== 'text-gray-400';
            const dettaglio = festivo ? `${giornoBreve(iso)} · ${festivo}` : `${giornoBreve(iso)} · sett. ${numeroSettimana(iso)}`;
            return `<div class="${evidenziato ? colore + ' font-bold' : ''}">${iso}</div><div class="text-[10px] ${colore} font-bold uppercase tracking-wide">${dettaglio}</div>`;
        }

        function spostaGiorno(iso, delta) {
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(a, m - 1, g + delta);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Identificativo univoco per corse, turni e scadenze.
        // Date.now() da solo puo' ripetersi se due registrazioni cadono nello stesso
        // millisecondo: due righe con lo stesso id si cancellerebbero a vicenda.
        let contatoreId = 0;
        function nuovoId() {
            contatoreId = (contatoreId + 1) % 1000;
            return String(Date.now()) + String(contatoreId).padStart(3, '0');
        }

        function oggiISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Ultimo giorno lavorato: la Dashboard si apre lì.
        // Cerco un giorno con incassi, non solo con movimenti, altrimenti finirei
        // sull'ultimo del mese dove sono registrati i costi fissi.
        function ultimoGiornoConDati() {
            const conIncassi = recordsAnno()
                .filter(r => r.tipo === 'ENTRATA' && r.data).map(r => r.data).sort();
            if (conIncassi.length) return conIncassi[conIncassi.length - 1];
            const tutte = recordsAnno().map(r => r.data).filter(Boolean).sort();
            if (tutte.length) return tutte[tutte.length - 1];
            // Anno senza dati: mi posiziono su oggi se l'anno è quello corrente,
            // altrimenti sul 1° gennaio dell'anno scelto.
            const oggi = oggiISO();
            return oggi.slice(0, 4) === annoAttivo() ? oggi : `${annoAttivo()}-01-01`;
        }

        function giornoSelezionato() {
            if (!window.dashGiorno) window.dashGiorno = ultimoGiornoConDati();
            return window.dashGiorno;
        }

        function meseSelezionato() {
            if (!window.dashMese) window.dashMese = giornoSelezionato().slice(0, 7);
            return window.dashMese;
        }

        // Dal Rendimento al riepilogo di quella giornata, in Dashboard
        function vaiAlGiorno(iso) {
            setDashGiorno(iso);
            switchTab('dashboard');
        }

        function setDashGiorno(v) {
            if (!v) return;
            window.dashGiorno = v;
            window.dashMese = v.slice(0, 7);
            renderContent();
        }

        function scorriGiorno(delta) {
            setDashGiorno(spostaGiorno(giornoSelezionato(), delta));
        }

        function setDashMese(v) {
            if (!v) return;
            window.dashMese = v;
            renderContent();
        }

        function scorriMese(delta) {
            const [a, m] = meseSelezionato().split('-').map(Number);
            const d = new Date(a, m - 1 + delta, 1);
            setDashMese(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
        }

        // Aggrega i movimenti di un periodo (prefisso data: '2026-05' oppure '2026-05-14')
        function aggrega(prefisso) {
            const r = {
                incassi: 0, contanti: 0, pos: 0, satispay: 0, app: 0, fattura: 0,
                nCorse: 0, uscite: 0, carburante: 0, manutenzione: 0, altroSpese: 0,
                perCategoria: {}, speseCategorie: [],
                listaUscite: [], ore: 0, nTurni: 0, turni: []
            };

            (window.dailyRecords || []).forEach(x => {
                if (!x.data || !String(x.data).startsWith(prefisso)) return;
                const imp = parseFloat(x.importo || 0);
                if (x.tipo === 'ENTRATA') {
                    r.incassi += imp;
                    r.nCorse++;
                    switch (famigliaMetodo(x.metodo)) {
                        case 'POS': r.pos += imp; break;
                        case 'Contanti': r.contanti += imp; break;
                        case 'Satispay': r.satispay += imp; break;
                        case 'Fattura': r.fattura += imp; break;
                        default: r.app += imp;
                    }
                } else if (x.tipo === 'USCITA') {
                    r.uscite += imp;
                    r.listaUscite.push(x);
                    const c = (x.categoria || '').toLowerCase();
                    if (c.includes('carburante') || c.includes('diesel')) r.carburante += imp;
                    else if (c.includes('manutenzione') || c.includes('lavaggio')) r.manutenzione += imp;
                    else r.altroSpese += imp;

                    // Dettaglio per categoria: totale e singoli movimenti
                    const base = categoriaBase(x.categoria);
                    if (!r.perCategoria[base]) r.perCategoria[base] = { nome: base, tot: 0, voci: [] };
                    r.perCategoria[base].tot += imp;
                    r.perCategoria[base].voci.push(x);
                }
            });

            r.riposi = [];
            (window.shifts || []).forEach(t => {
                if (!t.data || !String(t.data).startsWith(prefisso)) return;
                if (isRiposo(t)) { r.riposi.push(t); return; }
                r.nTurni++;
                r.ore += parseFloat(t.ore || 0);
                r.turni.push(t);
            });

            r.saldo = r.incassi - r.uscite;
            r.mediaCorsa = r.nCorse ? r.incassi / r.nCorse : 0;
            r.mediaOra = r.ore ? r.incassi / r.ore : 0;
            r.listaUscite.sort((a, b) => parseFloat(b.importo) - parseFloat(a.importo));
            r.speseCategorie = Object.values(r.perCategoria).sort((a, b) => b.tot - a.tot);
            r.speseCategorie.forEach(c => {
                c.voci.sort((a, b) => parseFloat(b.importo) - parseFloat(a.importo));
                c.tipologie = raggruppaPerTipologia(c.voci);
            });
            return r;
        }

        // Dettaglio giorno per giorno del mese, usato dal grafico a barre
        function serieMensile(ym) {
            const [a, m] = ym.split('-').map(Number);
            const giorni = new Date(a, m, 0).getDate();
            const serie = [];
            for (let g = 1; g <= giorni; g++) {
                const iso = `${ym}-${String(g).padStart(2, '0')}`;
                const d = aggrega(iso);
                serie.push({ giorno: g, iso, incassi: d.incassi, uscite: d.uscite, nCorse: d.nCorse, ore: d.ore });
            }
            return serie;
        }

        // I 12 mesi dell'anno con i rispettivi totali: e' la base del grafico annuale
        function serieAnnuale(anno) {
            const serie = [];
            for (let m = 1; m <= 12; m++) {
                const ym = `${anno}-${String(m).padStart(2, '0')}`;
                const d = aggrega(ym);
                serie.push({ mese: m, ym, incassi: d.incassi, uscite: d.uscite, nCorse: d.nCorse, ore: d.ore });
            }
            return serie;
        }

        // Riquadro "Incassi per metodo", usato identico in quattro punti dell'app.
        // opzioni: vuoto = testo quando non ci sono incassi;
        //          daVersare = aggiunge la riga contanti + Satispay;
        //          soloConImporto = nasconde i metodi a zero (utile sulla singola giornata).
        function bloccoIncassiPerMetodo(d, opzioni) {
            const o = opzioni || {};
            if (!(d.incassi > 0)) {
                return `<p class="text-sm text-gray-400">${o.vuoto || 'Nessun incasso registrato.'}</p>`;
            }
            const metodi = [
                ['Contanti', d.contanti, 'bg-green-500'],
                ['POS / Carta', d.pos, 'bg-gray-900'],
                ['Satispay', d.satispay, 'bg-red-500'],
                ['App / Voucher', d.app, 'bg-blue-500'],
                ['Fattura', d.fattura, 'bg-indigo-500']
            ];
            // La riga Fattura si mostra solo se c'e' davvero: altrimenti resta sempre a zero
            const visibili = metodi.filter(m => o.soloConImporto ? m[1] > 0 : (m[0] !== 'Fattura' || m[1] > 0));
            const righe = visibili.map(m => rigaMetodo(m[0], m[1], d.incassi, m[2])).join('');
            if (!o.daVersare) return righe;
            return righe + `
                <div class="pt-2 mt-1 border-t border-dashed border-gray-200 flex justify-between text-xs font-black">
                    <span class="text-gray-600">Da versare (contanti + Satispay)</span>
                    <span class="text-gray-900">${formatCurrency(d.contanti + d.satispay)}</span>
                </div>`;
        }

        // Riquadro "Spese per categoria" dei riepiloghi mensile e annuale
        // Elenco compatto "descrizione - importo" delle spese di una giornata
        function righeSpeseGiornata(uscite) {
            return uscite.map(u => `
                <div class="px-3 py-2 flex justify-between items-center gap-3">
                    <span class="text-xs font-bold text-gray-700 truncate">${esc(u.categoria)}</span>
                    <span class="text-sm font-black text-red-600 whitespace-nowrap">-${formatCurrency(u.importo)}</span>
                </div>`).join('');
        }

        function bloccoSpesePerCategoria(d, ambito, vuoto) {
            if (!(d.uscite > 0)) return `<p class="text-sm text-gray-400">${vuoto}</p>`;
            return d.speseCategorie.map(c => rigaCategoriaSpesa(c, d.uscite, ambito)).join('');
        }

        function rigaMetodo(etichetta, valore, totale, classe) {
            const pct = totale > 0 ? (valore / totale) * 100 : 0;
            return `
                <div class="space-y-1">
                    <div class="flex justify-between items-baseline text-xs">
                        <span class="font-bold text-gray-600">${etichetta}</span>
                        <span class="font-black text-gray-900">${formatCurrency(valore)} <span class="text-gray-400 font-bold">${pct.toFixed(0)}%</span></span>
                    </div>
                    <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full ${classe} rounded-full" style="width:${pct}%"></div>
                    </div>
                </div>`;
        }

        // Riga di spesa per categoria: si tocca per aprire l'elenco dei singoli movimenti
        function rigaCategoriaSpesa(cat, totale, ambito) {
            const pct = totale > 0 ? (cat.tot / totale) * 100 : 0;
            // L'ambito ('mese' o 'anno') tiene separate le righe aperte nei due riepiloghi
            const chiave = (ambito || 'mese') + '|' + cat.nome;
            const aperta = window.catSpesaAperta === chiave;
            return `
                <div class="space-y-1">
                    <div onclick="toggleCatSpesa('${escJs(chiave)}')" class="cursor-pointer select-none">
                        <div class="flex justify-between items-baseline text-xs">
                            <span class="font-bold text-gray-600">
                                <span class="text-gray-400">${aperta ? '&#9662;' : '&#9656;'}</span>
                                ${esc(cat.nome)}
                                <span class="text-gray-400 font-bold">${cat.voci.length}</span>
                            </span>
                            <span class="font-black text-gray-900">${formatCurrency(cat.tot)} <span class="text-gray-400 font-bold">${pct.toFixed(0)}%</span></span>
                        </div>
                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden mt-1">
                            <div class="h-full ${coloreCategoria(cat.nome)} rounded-full" style="width:${pct}%"></div>
                        </div>
                    </div>
                    ${aperta ? `
                        <div class="ml-1 pl-2 border-l-2 border-gray-100">
                            ${(cat.tipologie || raggruppaPerTipologia(cat.voci)).map(t => `
                                <div class="flex justify-between items-baseline gap-2 py-1">
                                    <span class="text-[11px] text-gray-500 truncate">
                                        ${esc(t.nome)}
                                        <span class="text-gray-400">${t.n > 1 ? '×' + t.n : ggMm(t.ultima)}</span>
                                    </span>
                                    <span class="text-[11px] font-bold text-red-600 whitespace-nowrap">-${formatCurrency(t.tot)}</span>
                                </div>`).join('')}
                        </div>` : ''}
                </div>`;
        }

        function toggleCatSpesa(chiave) {
            window.catSpesaAperta = window.catSpesaAperta === chiave ? null : chiave;
            window.renderContent();
        }

        // ============================================================
        //  QUOTA GIORNALIERA DEI COSTI FISSI
        //  I costi fissi restano registrati una volta al mese, il giorno in cui
        //  escono davvero dal conto: e' cosi' che li vede la banca e cosi' vanno
        //  in contabilita'. Ma per capire com'e' andata una giornata quel numero
        //  non serve: serve sapere quanto pesa ogni singolo giorno. Quella quota
        //  si calcola qui, dividendo il mese per i suoi giorni, e resta una
        //  lettura: non e' un movimento e non entra in nessun totale.
        // ============================================================

        function giorniDelMese(ym) {
            const [a, m] = String(ym).split('-').map(Number);
            if (!a || !m) return 30;
            return new Date(a, m, 0).getDate();
        }

        function costiFissiDelMese(ym) {
            let totale = 0, voci = 0;
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA') return;
                if (String(r.data || '').slice(0, 7) !== String(ym)) return;
                if (categoriaBase(r.categoria) !== 'Costi fissi') return;
                totale += parseFloat(r.importo || 0);
                voci++;
            });
            return { totale, voci, giorni: giorniDelMese(ym), quota: totale / giorniDelMese(ym) };
        }

        function quotaFissiGiorno(iso) {
            return costiFissiDelMese(String(iso).slice(0, 7));
        }

        // Costi fissi registrati proprio in quel giorno: con la registrazione
        // mensile ce ne sono solo sull'ultimo giorno, con quella giornaliera
        // ce ne sono tutti i giorni.
        function fissiDelGiorno(iso) {
            let totale = 0;
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA' || String(r.data) !== String(iso)) return;
                if (categoriaBase(r.categoria) !== 'Costi fissi') return;
                totale += parseFloat(r.importo || 0);
            });
            return totale;
        }

        // Riquadro che spiega quanto pesa ogni giorno e quanto serve incassare
        // per coprire le spese: e' il numero che dice se la giornata e' andata
        // davvero in attivo.
        function bloccoQuotaFissi(iso, incassiGiorno, usciteGiorno) {
            const q = quotaFissiGiorno(iso);
            if (!(q.totale > 0)) return '';
            const [, mese] = String(iso).split('-');
            const ultimo = `${String(iso).slice(0, 7)}-${String(q.giorni).padStart(2, '0')}`;
            // Se in questa giornata ci sono gia' dei costi fissi registrati, le
            // sue spese li comprendono: sommarci anche la quota li conterebbe
            // due volte. Vale sia per la registrazione mensile (solo l'ultimo
            // giorno) sia per quella giornaliera (tutti i giorni).
            const fissiGiaDentro = fissiDelGiorno(iso);
            const spesePulite = Math.max(0, (usciteGiorno || 0) - fissiGiaDentro);
            const pareggio = spesePulite + q.quota;
            const risultato = (incassiGiorno || 0) - pareggio;

            return `
                <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-4">
                    <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <p class="text-[10px] font-black uppercase tracking-wider text-indigo-700">Quota costi fissi del giorno</p>
                        <p class="text-xs font-bold text-indigo-500">${nomeMese(parseInt(mese, 10))} · ${formatCurrency(q.totale)} su ${q.giorni} giorni</p>
                    </div>
                    <p class="text-2xl font-black text-indigo-900 mt-1">${formatCurrency(q.quota)} <span class="text-sm font-bold text-indigo-500">al giorno</span></p>
                    <div class="grid grid-cols-2 gap-3 mt-3">
                        <div class="bg-white/70 rounded-lg p-2.5">
                            <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-500">Pareggio della giornata</p>
                            <p class="text-base font-black text-indigo-900">${formatCurrency(pareggio)}</p>
                        </div>
                        <div class="bg-white/70 rounded-lg p-2.5">
                            <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-500">Risultato con la quota</p>
                            <p class="text-base font-black ${risultato >= 0 ? 'text-green-700' : 'text-red-600'}">${formatCurrency(risultato)}</p>
                        </div>
                    </div>
                    <p class="text-[11px] text-indigo-500 mt-2 leading-relaxed">
                        ${fissiGiaDentro > 0
                            ? `In questa giornata i costi fissi sono già registrati fra le spese (${formatCurrency(fissiGiaDentro)}): il pareggio qui sopra li conta una volta sola.`
                            : `I costi fissi di questo mese sono registrati il ${ggMm(ultimo)}, quando escono dal conto: qui sono divisi per i giorni del mese, per far vedere quanto pesano ogni giorno. È solo una lettura, non un movimento.`}
                    </p>
                </div>`;
        }

        function boxDato(etichetta, valore, classe) {
            return `
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-0.5">${etichetta}</p>
                    <p class="text-base sm:text-lg font-black ${classe || 'text-gray-900'} leading-tight">${valore}</p>
                </div>`;
        }

        // ============================================================
        //  RENDIMENTO
        //  Incrocia gli incassi giornalieri con il turno svolto e con il
        //  giorno della settimana: sono dati gia' presenti, mai messi a confronto.
        // ============================================================
        function statsRendimento() {
            const perData = {};
            recordsAnno().forEach(r => {
                if (r.tipo !== 'ENTRATA') return;
                if (!perData[r.data]) perData[r.data] = { tot: 0, n: 0 };
                perData[r.data].tot += parseFloat(r.importo || 0);
                perData[r.data].n++;
            });

            const perTurno = {};
            const giorniConTurno = {};
            turniAnno().filter(t => !isRiposo(t)).forEach(t => {
                giorniConTurno[t.data] = true;
                const g = perData[t.data] || { tot: 0, n: 0 };
                const k = t.turno || 'Personalizzato';
                if (!perTurno[k]) perTurno[k] = { nome: k, gg: 0, tot: 0, n: 0, ore: 0 };
                perTurno[k].gg++;
                perTurno[k].tot += g.tot;
                perTurno[k].n += g.n;
                perTurno[k].ore += parseFloat(t.ore || 0);
            });

            // Giornate con incassi ma senza turno registrato: le tengo separate
            // invece di attribuirle a un turno che non risulta da nessuna parte.
            Object.keys(perData).forEach(d => {
                if (giorniConTurno[d]) return;
                const k = 'Senza turno registrato';
                if (!perTurno[k]) perTurno[k] = { nome: k, gg: 0, tot: 0, n: 0, ore: 0 };
                perTurno[k].gg++;
                perTurno[k].tot += perData[d].tot;
                perTurno[k].n += perData[d].n;
            });

            const listaTurni = Object.keys(perTurno).map(k => {
                const v = perTurno[k];
                return {
                    nome: v.nome, gg: v.gg, tot: v.tot, ore: v.ore,
                    perGg: v.gg ? v.tot / v.gg : 0,
                    perOra: v.ore ? v.tot / v.ore : 0,
                    corseGg: v.gg ? v.n / v.gg : 0,
                    perCorsa: v.n ? v.tot / v.n : 0
                };
            }).sort((a, b) => b.perOra - a.perOra);

            const NOMI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
            const settimana = NOMI.map(n => ({ nome: n, gg: 0, tot: 0, n: 0 }));
            Object.keys(perData).forEach(d => {
                const [a, m, gi] = d.split('-').map(Number);
                const idx = new Date(a, m - 1, gi).getDay();
                settimana[idx].gg++;
                settimana[idx].tot += perData[d].tot;
                settimana[idx].n += perData[d].n;
            });
            const perSettimana = [1, 2, 3, 4, 5, 6, 0].map(i => settimana[i]).map(v => ({
                nome: v.nome, gg: v.gg, tot: v.tot,
                perGg: v.gg ? v.tot / v.gg : 0,
                corseGg: v.gg ? v.n / v.gg : 0
            }));

            // Giornata record e giornata piu' fiacca dell'anno. Conto solo i giorni
            // con almeno un incasso: i riposi non sono giornate andate male.
            const turniPerData = {};
            turniAnno().filter(t => !isRiposo(t)).forEach(t => { turniPerData[t.data] = t; });
            const giornate = Object.keys(perData)
                .filter(d => perData[d].tot > 0)
                .map(d => {
                    const t = turniPerData[d];
                    return {
                        data: d,
                        tot: perData[d].tot,
                        nCorse: perData[d].n,
                        turno: t ? (t.turno || 'Personalizzato') : null,
                        ore: t ? parseFloat(t.ore || 0) : 0
                    };
                })
                .sort((a, b) => b.tot - a.tot);

            const giornoRecord = giornate[0] || null;
            // Se c'e' una sola giornata lavorata, record e peggiore coinciderebbero:
            // in quel caso non ha senso mostrare il confronto.
            const giornoPeggiore = giornate.length > 1 ? giornate[giornate.length - 1] : null;

            return {
                listaTurni, perSettimana, giornoRecord, giornoPeggiore,
                giornateLavorate: giornate.length,
                giorniLavorati: Object.keys(perData).length
            };
        }

        function renderRiepilogoGiornaliero() {
            const g = giornoSelezionato();
            const d = aggrega(g);
            // Nessuna corsa e nessun turno = giornata di riposo. Se non è stata
            // registrata esplicitamente la deduco, ma solo per i giorni già passati:
            // un giorno futuro è semplicemente ancora da compilare.
            const riposoEsplicito = d.riposi[0] || null;
            const riposo = d.nCorse === 0 && d.nTurni === 0 && (riposoEsplicito || g <= oggiISO());
            const daCompilare = d.nCorse === 0 && d.nTurni === 0 && !riposo;
            const vuoto = daCompilare && d.listaUscite.length === 0;

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden print-card print-break">
                    <div class="bg-gray-900 px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h3 class="text-lg font-black text-yellow-400 leading-tight">Riepilogo giornaliero</h3>
                            <p class="text-xs text-gray-300 font-bold capitalize">${dataEstesa(g)}</p>
                        </div>
                        <div class="flex items-center gap-2 no-print">
                            <button onclick="scorriGiorno(-1)" title="Giorno precedente" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-400 font-black">‹</button>
                            <input type="date" value="${g}" onchange="setDashGiorno(this.value)" class="p-2 rounded-lg text-sm font-bold bg-white border-0 outline-none" />
                            <button onclick="scorriGiorno(1)" title="Giorno successivo" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-400 font-black">›</button>
                            <button onclick="setDashGiorno(ultimoGiornoConDati())" class="px-3 h-9 rounded-lg bg-yellow-400 hover:bg-yellow-500 text-gray-900 text-xs font-black">Ultimo</button>
                        </div>
                    </div>

                    ${riposo ? `
                        <div class="p-8 text-center bg-blue-50/50">
                            <p class="text-2xl font-black text-indigo-900">${esc(riposoEsplicito ? (riposoEsplicito.turno || 'Festivo') : 'Giornata non lavorata')}</p>
                            <p class="text-sm text-gray-500 font-bold mt-1">Nessuna corsa registrata in questa giornata.</p>
                            ${d.listaUscite.length ? `
                                <div class="max-w-md mx-auto mt-4 text-left divide-y divide-blue-100 border border-blue-100 rounded-xl bg-white">
                                    ${righeSpeseGiornata(d.listaUscite)}
                                </div>
                                <p class="text-xs text-gray-400 mt-2">Spese registrate comunque in questa data.</p>
                            ` : ''}
                        </div>
                    ` : vuoto ? `
                        <div class="p-8 text-center">
                            <p class="text-gray-400 font-bold">Giornata ancora da compilare.</p>
                            <p class="text-xs text-gray-400 mt-1">Usa le frecce per spostarti di un giorno o il pulsante Ultimo.</p>
                        </div>

        // Le viste possibili sono tre: qualunque altro valore rimasto in memoria
        // (per esempio la vecchia "giornata") ricade sull'elenco corse.
        function vistaCorseTurni() {
            const v = window.vistaGiornata;
            return (v === 'turni' || v === 'calendario') ? v : 'corse';
        }

        function renderSezioneCorse() {
            const records = window.dailyRecords || [];
            const shifts = window.shifts || [];

                // Il giorno, quando impostato, ha la precedenza sul filtro mese
                const perPeriodo = records.filter(r => {
                    if (r.tipo !== 'ENTRATA') return false;
                    if (!nellAnno(r)) return false;
                    if (giornoFiltroCorse()) return r.data === giornoFiltroCorse();
                    if (window.filterMonthCorse !== 'ALL') {
                        const m = new Date(r.data).getMonth() + 1;
                        if (m !== parseInt(window.filterMonthCorse)) return false;
                    }
                    return true;
                });

                const corseList = perPeriodo.filter(r =>
                    window.filterMetodoCorse === 'ALL' || famigliaMetodo(r.metodo) === window.filterMetodoCorse
                );

                const totCorse = corseList.reduce((acc, curr) => acc + parseFloat(curr.importo || 0), 0);
                const mediaCorsa = corseList.length ? totCorse / corseList.length : 0;

                // Ripartizione del periodo scelto, indipendente dal filtro metodo:
                // serve a far vedere quanto pesa ogni voce prima di selezionarla
                const perMetodo = {};
                ['Contanti', 'POS', 'Satispay', 'App', 'Fattura'].forEach(k => perMetodo[k] = { n: 0, tot: 0 });
                perPeriodo.forEach(r => {
                    const famiglia = famigliaMetodo(r.metodo);
                    const f = perMetodo[famiglia] ? famiglia : 'App';
                    perMetodo[f].n++;
                    perMetodo[f].tot += parseFloat(r.importo || 0);
                });

                const etichettaPeriodo = giornoFiltroCorse()
                    ? dataEstesa(giornoFiltroCorse())
                    : (window.filterMonthCorse === 'ALL' ? 'anno ' + annoAttivo() : nomeMese(window.filterMonthCorse) + ' ' + annoAttivo());
                const filtriAttivi = giornoFiltroCorse() || window.filterMonthCorse !== 'ALL' || window.filterMetodoCorse !== 'ALL';

                return `

                                    </div>
                                    <div>

                                        <input type="number" step="0.01" id="corsa-imp" required placeholder="0.00" autofocus class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-green-400 font-bold text-gray-900" />
                                    </div>
                                    <div class="lg:col-span-4 flex flex-col sm:flex-row gap-3">
                                        <button type="submit" name="azione" value="nuova" class="flex-1 bg-green-600 hover:bg-green-700 font-bold py-3 rounded-xl transition-colors text-white shadow-md">
                                            Salva e inserisci un'altra

                        <!-- Barra Filtri e Totale -->

                                <div class="flex items-center gap-1">
                                    <button onclick="scorriGiornoCorse(-1)" title="Giorno precedente" class="w-9 h-9 rounded-lg bg-gray-100 hover:bg-gray-200 font-black text-gray-700">‹</button>
                                    <input type="date" value="${giornoFiltroCorse()}" onchange="applyFilterGiornoCorse(this.value)" class="p-2 border rounded-lg text-sm bg-gray-50 font-bold" />

        function renderSezioneTurni() {
            const records = window.dailyRecords || [];
            const shifts = window.shifts || [];

                const presetAttivo = SHIFT_PRESETS[window.selectedShiftType];
                const giornataNonLavorata = isRiposo(presetAttivo);
                // Ore proposte di default: quelle del turno scelto (o 08:00-17:00 per il Personalizzato,
                // gli stessi orari gia' precompilati nei campi Ora Inizio/Ora Fine). Restano comunque
                // modificabili a mano, ad esempio se il turno finisce prima per un impegno.
                const oreDefault = giornataNonLavorata ? 0
                    : (window.selectedShiftType === 'custom'
                        ? calcolaOreTurno('2000-01-01', '08:00', '17:00')
                        : calcolaOreTurno('2000-01-01', presetAttivo.inizio, presetAttivo.fine, presetAttivo.pausaInizio, presetAttivo.pausaFine));

                // Km inizio proposto = km fine dell'ultimo turno registrato (il contachilometri e'
                // continuo): velocizza l'inserimento, ma resta un campo normale, modificabile a mano.
                // window.kmIniDraft tiene traccia di una modifica manuale gia' fatta in questa sessione
                // di compilazione, cosi' non si perde ridisegnando il form (es. cambiando tipo di turno).
                // Il suggerimento dipende dalla data scelta nel form: e' il km fine del turno
                // immediatamente precedente a quella data, non dell'ultimo turno in assoluto.
                const dataFormTurno = window.dataTurnoProposta || new Date().toISOString().split('T')[0];
                const turnoPrec = turnoPrecedenteConKm(dataFormTurno);
                const kmIniSuggerito = turnoPrec ? turnoPrec.kmFine : null;
                const kmIniValore = window.kmIniDraft !== null && window.kmIniDraft !== undefined
                    ? window.kmIniDraft
                    : (kmIniSuggerito !== null ? kmIniSuggerito : '');
                const kmFineValore = window.kmFineDraft !== null && window.kmFineDraft !== undefined
                    ? window.kmFineDraft
                    : '';

                const turniDellAnno = turniAnno();
                // Il promemoria "turni senza km" resta sempre su tutto l'anno, cosi' non si perde
                // di vista un turno da completare solo perche' si sta guardando un altro mese.
                const daCompletare = turniDellAnno.filter(kmMancanti);
                // Il filtro mese invece restringe solo la tabella qui sotto.
                const turniMese = window.filterMonthTurni === 'ALL'
                    ? turniDellAnno
                    : turniDellAnno.filter(t => parseInt(String(t.data).slice(5, 7)) === parseInt(window.filterMonthTurni));
                const listaTurni = window.soloSenzaKm ? turniMese.filter(kmMancanti) : turniMese;
                const turniLavoratiMese = turniMese.filter(t => !isRiposo(t));
                const oreMeseTot = turniLavoratiMese.reduce((a, t) => a + parseFloat(t.ore || 0), 0);
                const kmMeseTot = turniLavoratiMese.reduce((a, t) => a + parseFloat(t.kmTot || 0), 0);
                const etichettaPeriodoTurni = window.filterMonthTurni === 'ALL' ? 'anno ' + annoAttivo() : nomeMese(window.filterMonthTurni) + ' ' + annoAttivo();
                return `
                    <div class="fade-in space-y-6 max-w-7xl mx-auto">

                        </header>

                        ${window.showShiftForm ? `

                                        <input type="date" id="sh-data" required value="${dataFormTurno}" onchange="onDataTurnoChange(this.value)" class="w-full p-2.5 border rounded-lg outline-none" />

                                            <option value="otto" ${window.selectedShiftType==='otto'?'selected':''}>Le otto (8:00 - 20:00)</option>
                                            <option value="una" ${window.selectedShiftType==='una'?'selected':''}>L'una (13:00 - 1:00)</option>
                                            <option value="notte" ${window.selectedShiftType==='notte'?'selected':''}>La notte (19:00 - 7:00)</option>
                                            <option value="spezzato" ${window.selectedShiftType==='spezzato'?'selected':''}>Lo spezzato (7:30-13:00 / 15:00-21:30)</option>
                                            <option value="rinforzo" ${window.selectedShiftType==='rinforzo'?'selected':''}>Rinforzo (13:00 - 1:00)</option>
                                            <option value="custom" ${window.selectedShiftType==='custom'?'selected':''}>Personalizzato (orario libero)</option>

                                                <option value="recupero" ${window.selectedShiftType==='recupero'?'selected':''}>Recupero festivo</option>
                                                <option value="malattia" ${window.selectedShiftType==='malattia'?'selected':''}>Malattia</option>

                                            return `

                                                        : esc(s.turno || 'Personalizzato')}
                                                </td>
                                                <td class="p-4 text-sm text-gray-600">${isRiposo(s) ? '—' : s.inizio + ' - ' + s.fine}</td>

                                                        ? `<span class="text-yellow-700 text-xs font-black">✏️ sotto ↓</span>`
                                                        : s.ore + ' ore'}
                                                </td>
                                                <td class="p-4 text-sm text-gray-500">
                                                    ${isRiposo(s) ? '—' : editing
                                                        ? `<span class="text-yellow-700 text-xs font-black">✏️ sotto ↓</span>`
                                                        : (kmMancanti(s)
                                                            ? `<span class="text-gray-400 italic">${s.kmInizio || '—'} → ${s.kmFine || '—'}</span>`
                                                            : `${s.kmInizio} → ${s.kmFine}`)}
                                                </td>
                                                <td class="p-4 text-right text-base font-black ${s.kmTot ? 'text-gray-900' : 'text-gray-300'}">

                                                </td>
                                                <td class="p-4 text-center whitespace-nowrap">
                                                    ${isRiposo(s) ? `
                                                        <button onclick="deleteShift('${s.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold bg-red-50 hover:bg-red-100 px-2 py-1.5 rounded">Elimina</button>
                                                    ` : editing ? `
                                                        <button onclick="annullaModificaTurno()" class="text-gray-600 hover:text-gray-900 text-xs font-bold bg-gray-100 hover:bg-gray-200 px-2 py-1.5 rounded">Annulla</button>

                                                            ${kmMancanti(s) ? '+ Aggiungi km' : 'Modifica'}
                                                        </button>
                                                        <button onclick="deleteShift('${s.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold bg-red-50 hover:bg-red-100 px-2 py-1.5 rounded">Elimina</button>
                                                    `}
                                                </td>
                                            </tr>
                                            ${editing ? `
                                            <tr class="bg-yellow-50">
                                                <td colspan="7" class="px-4 pb-4">
                                                    <div class="flex flex-wrap items-end gap-3 border-2 border-yellow-300 rounded-xl p-4 bg-white">
                                                        <div>
                                                            <label class="block text-[10px] font-black uppercase tracking-wider text-gray-400 mb-1">Ore totali</label>
                                                            <input type="number" step="0.1" min="0" max="24" id="ore-edit-${s.id}" value="${s.ore}" class="w-24 p-2.5 border rounded-lg text-sm outline-none font-bold text-gray-900" />
                                                        </div>
                                                        <div>
                                                            <label class="block text-[10px] font-black uppercase tracking-wider text-gray-400 mb-1">Km inizio</label>
                                                            <input type="number" id="km-ini-${s.id}" value="${kmIniRiga}" placeholder="inizio" class="w-24 p-2.5 border rounded-lg text-sm outline-none" />
                                                            ${precRiga ? `<p class="text-[10px] text-gray-400 mt-1">dal turno del ${ggMm(precRiga.data)}</p>` : ''}
                                                        </div>
                                                        <div>
                                                            <label class="block text-[10px] font-black uppercase tracking-wider text-gray-400 mb-1">Km fine</label>
                                                            <input type="number" id="km-fine-${s.id}" value="${s.kmFine || ''}" placeholder="fine" class="w-24 p-2.5 border rounded-lg text-sm outline-none" />
                                                        </div>
                                                        <div class="flex gap-2 w-full sm:w-auto sm:ml-auto">
                                                            <button onclick="salvaModificaTurno('${s.id}')" class="flex-1 sm:flex-none bg-gray-900 hover:bg-gray-800 text-white text-sm font-bold px-4 py-2.5 rounded-lg">Salva modifiche</button>
                                                            <button onclick="annullaModificaTurno()" class="flex-1 sm:flex-none bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-bold px-4 py-2.5 rounded-lg">Annulla</button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                            ` : ''}
                                            `;
                                        }).join('') || `<tr><td colspan="7" class="p-8 text-center text-gray-400">${window.soloSenzaKm ? 'Tutti i turni hanno i km compilati.' : 'Nessun turno registrato.'}</td></tr>`}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
        }

        // ============================================================
        //  SCHEDA UNIFICATA TURNI & CORSE
        //  Il giorno selezionato e' uno solo per tutte e tre le viste:
        //  passando da Giornata a Corse o a Turni non si perde il segno.
        // ============================================================

        // Il form turno vive nella vista Elenco turni: ci porto l'utente con la
        // data gia' impostata, invece di duplicare un form complesso.
        function setVistaGiornata(v) {
            window.vistaGiornata = v;
            window.giornoCalendarioAperto = null;
            window.spostaTurnoId = null;
            window.editRecordId = null;
            window.editTurnoId = null;
            renderContent();
        }

        // Riga compatta di una corsa: in verticale una tabella e' illeggibile
        // ============================================================
        //  CALENDARIO TURNI
        //  Vista mensile per vedere a colpo d'occhio lavoro, riposi e
        //  recuperi, e per sistemarli senza passare dall'elenco.
        // ============================================================

        // Come si colora ogni tipo di giornata nella griglia
        const COLORI_CALENDARIO = {
            'Festivo':          { cella: 'bg-indigo-100 border-indigo-300', testo: 'text-indigo-900', breve: 'Festivo' },
            'Recupero festivo': { cella: 'bg-orange-200 border-orange-400', testo: 'text-orange-900', breve: 'Recupero' },
            // Vecchi "Riposo" non ancora convertiti: stesso colore dei festivi
            'Riposo':           { cella: 'bg-indigo-100 border-indigo-300', testo: 'text-indigo-900', breve: 'Festivo' },
            // Il rinforzo e' una giornata di lavoro, ma si riconosce a colpo d'occhio
            'rinforzo':         { cella: 'bg-fuchsia-200 border-fuchsia-500', testo: 'text-fuchsia-900', breve: '' },
            'Malattia':         { cella: 'bg-orange-100 border-orange-300', testo: 'text-orange-900', breve: 'Malattia' },
            'Sciopero':         { cella: 'bg-pink-100 border-pink-300', testo: 'text-pink-900', breve: 'Sciopero' },
            'lavoro':           { cella: 'bg-yellow-100 border-yellow-400', testo: 'text-yellow-900', breve: '' },
            'vuoto':            { cella: 'bg-white border-gray-200', testo: 'text-gray-400', breve: '' }
        };

        function stileGiornoCalendario(turno) {
            if (!turno) return COLORI_CALENDARIO['vuoto'];
            if (!isRiposo(turno)) {
                return String(turno.turno || '').startsWith('Rinforzo')
                    ? COLORI_CALENDARIO['rinforzo']
                    : COLORI_CALENDARIO['lavoro'];
            }
            return COLORI_CALENDARIO[turno.turno] || COLORI_CALENDARIO['Riposo'];
        }

        // Attenzione al nome: la variabile di stato si chiama window.meseCalendario,
        // quindi questa funzione deve chiamarsi diversamente. Con lo stesso nome il
        // modulo Firebase, che parte dopo, sostituirebbe la funzione con null.
        function meseCalendarioAttivo() {
            if (!window.meseCalendario) {
                // Parto dal mese di oggi, ma se stai guardando un altro anno di
                // esercizio parto da gennaio di quell'anno.
                const oggi = oggiISO();
                window.meseCalendario = oggi.slice(0, 4) === annoAttivo() ? oggi.slice(0, 7) : `${annoAttivo()}-01`;
            }
            return window.meseCalendario;
        }

        function scorriMeseCalendario(delta) {
            const [a, m] = meseCalendarioAttivo().split('-').map(Number);
            const d = new Date(a, m - 1 + delta, 1);
            window.meseCalendario = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            window.giornoCalendarioAperto = null;
            renderContent();
        }

        function meseCalendarioOggi() {
            window.meseCalendario = oggiISO().slice(0, 7);
            window.giornoCalendarioAperto = null;
            renderContent();
        }

        // Tocco su una casella: se sto spostando un turno lo appoggio qui,
        // altrimenti apro (o chiudo) il pannello di quel giorno.
        function toccaGiornoCalendario(iso) {
            if (window.spostaTurnoId) { concludiSpostamento(iso); return; }
            window.giornoCalendarioAperto = window.giornoCalendarioAperto === iso ? null : iso;
            renderContent();
        }

        function iniziaSpostamento(id) {
            window.spostaTurnoId = id;
            window.giornoCalendarioAperto = null;
            showToast('Ora tocca il giorno in cui spostarlo.');
            renderContent();
        }

        function annullaSpostamento() {
            window.spostaTurnoId = null;
            renderContent();
        }

        function concludiSpostamento(iso) {
            const turno = (window.shifts || []).find(t => String(t.id) === String(window.spostaTurnoId));
            window.spostaTurnoId = null;
            if (!turno) { renderContent(); return; }
            if (turno.data === iso) { showToast('Era già questo il giorno.'); renderContent(); return; }

            const occupato = (window.shifts || []).find(t => t.data === iso && String(t.id) !== String(turno.id));
            if (occupato && !confirm(`Il ${ggMm(iso)} ha già ${occupato.turno}. Sposto lo stesso?`)) {
                renderContent();
                return;
            }
            // Tolgo la riga vecchia e ne salvo una nuova sulla data scelta:
            // il salvataggio aggiunge sempre, quindi senza la prima parte
            // lo stesso turno comparirebbe due volte.
            window.deleteShiftFromCloud(turno.id);
            window.saveShiftToCloud({ ...turno, id: nuovoId(), data: iso });
            showToast(`${turno.turno} spostato al ${ggMm(iso)}.`);
            renderContent();
        }

        // Registra al volo una giornata non lavorata dal calendario
        function segnaGiornataNonLavorata(iso, tipo) {
            const preset = SHIFT_PRESETS[tipo];
            if (!preset || !isRiposo(preset)) return;
            const gia = (window.shifts || []).find(x => x.data === iso);
            if (gia && !confirm(`Il ${ggMm(iso)} ha già ${gia.turno}. Lo sostituisco con ${preset.label}?`)) return;
            if (gia) window.deleteShiftFromCloud(gia.id);

            window.saveShiftToCloud({
                id: nuovoId(),
                data: iso, inizio: '', fine: '',
                turno: preset.label,
                lavorato: false,
                kmInizio: null, kmFine: null,
                ore: 0, kmTot: null
            });
            window.giornoCalendarioAperto = null;
            showToast(`${preset.label} registrato per il ${ggMm(iso)}.`);
            renderContent();
        }

        // Registra un turno di lavoro con uno degli orari fissi
        function segnaTurnoLavoro(iso, tipo) {
            const preset = SHIFT_PRESETS[tipo];
            if (!preset || isRiposo(preset) || tipo === 'custom') return;
            const gia = (window.shifts || []).find(x => x.data === iso);
            if (gia && !confirm(`Il ${ggMm(iso)} ha già ${gia.turno}. Lo sostituisco con ${preset.label}?`)) return;
            if (gia) window.deleteShiftFromCloud(gia.id);

            const ore = calcolaOreTurno(iso, preset.inizio, preset.fine, preset.pausaInizio, preset.pausaFine);
            // I km restano da compilare: si aggiungono dall'elenco turni quando si sanno
            window.saveShiftToCloud({
                id: nuovoId(),
                data: iso, inizio: preset.inizio, fine: preset.fine,
                turno: preset.label,
                lavorato: true,
                kmInizio: null, kmFine: null,
                ore, kmTot: null
            });
            window.giornoCalendarioAperto = null;
            showToast(`${preset.label} registrato per il ${ggMm(iso)}.`);
            renderContent();
        }

        // Dal calendario all'elenco turni, posizionato sul mese giusto
        function apriNellElenco(iso) {
            window.vistaGiornata = 'turni';
            window.filterMonthTurni = String(parseInt(iso.slice(5, 7), 10));
            window.giornoCalendarioAperto = null;
            renderContent();
        }

        function renderSezioneCalendario() {
            const mese = meseCalendarioAttivo();
            const [anno, mm] = mese.split('-').map(Number);
            const oggi = oggiISO();

            // Griglia che parte sempre da lunedi', come i calendari cartacei
            const primo = new Date(anno, mm - 1, 1);
            const giorniNelMese = new Date(anno, mm, 0).getDate();
            const offset = (primo.getDay() + 6) % 7;   // 0 = lunedi'
            const celle = [];
            for (let i = 0; i < offset; i++) celle.push(null);
            for (let g = 1; g <= giorniNelMese; g++) {
                celle.push(`${anno}-${String(mm).padStart(2, '0')}-${String(g).padStart(2, '0')}`);
            }
            while (celle.length % 7 !== 0) celle.push(null);

            const turnoDi = (iso) => (window.shifts || []).find(t => t.data === iso) || null;
            const incassoDi = (iso) => (window.dailyRecords || [])
                .filter(r => r.tipo === 'ENTRATA' && r.data === iso)
                .reduce((tot, r) => tot + parseFloat(r.importo || 0), 0);

            // Conteggi del mese
            const delMese = (window.shifts || []).filter(t => String(t.data).startsWith(mese));
            const lavorati = delMese.filter(t => !isRiposo(t));
            const festivi = delMese.filter(t => isRiposo(t) && t.turno === 'Festivo');
            const recuperi = delMese.filter(t => t.turno === 'Recupero festivo');
            const oreMese = lavorati.reduce((tot, t) => tot + parseFloat(t.ore || 0), 0);

            const inSpostamento = (window.shifts || []).find(t => String(t.id) === String(window.spostaTurnoId));

            const cella = (iso) => {
                if (!iso) return '<div class="aspect-square"></div>';
                const t = turnoDi(iso);
                const stile = stileGiornoCalendario(t);
                const giorno = parseInt(iso.slice(8, 10), 10);
                const isOggi = iso === oggi;
                const aperto = window.giornoCalendarioAperto === iso;
                const rossa = classeEvidenziaGiorno(iso) === 'text-red-500';
                const incasso = t && !isRiposo(t) ? incassoDi(iso) : 0;

                return `
                    <button onclick="toccaGiornoCalendario('${iso}')"
                            class="aspect-square w-full rounded-lg border ${stile.cella} ${aperto ? 'ring-2 ring-gray-900' : ''} ${isOggi ? 'ring-2 ring-yellow-500' : ''} p-1 flex flex-col items-center justify-center gap-0.5 transition-colors hover:brightness-95">
                        <span class="text-sm font-black ${t ? stile.testo : (rossa ? 'text-red-500' : 'text-gray-500')} leading-none">${giorno}</span>
                        ${t ? `<span class="text-[9px] font-bold ${stile.testo} leading-none truncate max-w-full px-0.5">${isRiposo(t) ? stile.breve : (t.ore ? t.ore + 'h' : '·')}</span>` : ''}
                        ${incasso > 0 ? `<span class="text-[8px] font-black text-green-700 leading-none">${Math.round(incasso)}€</span>` : ''}
                    </button>`;
            };

            const pannello = () => {
                const iso = window.giornoCalendarioAperto;
                if (!iso) return '';
                const t = turnoDi(iso);
                const lavoro = ['sei30', 'otto', 'una', 'notte', 'spezzato', 'rinforzo'];
                const nonLavorate = ['festivo', 'recupero', 'malattia', 'sciopero'];
                return `
                    <div class="bg-gray-900 rounded-2xl p-4 space-y-3">
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <p class="text-[10px] font-black uppercase tracking-wider text-yellow-400">Giornata scelta</p>
                                <p class="text-base font-black text-white capitalize leading-tight">${dataEstesa(iso)}</p>
                                <p class="text-xs font-bold text-gray-400">${esc(t ? t.turno + (t.ore ? ` · ${t.ore} h` : '') : 'Nessun turno registrato')}</p>
                            </div>
                            <button onclick="toccaGiornoCalendario('${iso}')" class="text-gray-400 hover:text-white text-xl leading-none px-2">×</button>
                        </div>

                        <div>
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-500 mb-1.5">Turno di lavoro</p>
                            <div class="flex flex-wrap gap-1.5">
                                ${lavoro.map(k => `
                                    <button onclick="segnaTurnoLavoro('${iso}', '${k}')" class="text-[11px] font-black px-2.5 py-1.5 rounded-lg ${k === 'rinforzo' ? 'bg-fuchsia-600 hover:bg-fuchsia-700 text-white' : 'bg-yellow-400 hover:bg-yellow-500 text-gray-900'}">${SHIFT_PRESETS[k].label.split(' (')[0]}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-500 mb-1.5">Giornata non lavorata</p>
                            <div class="flex flex-wrap gap-1.5">
                                ${nonLavorate.map(k => `
                                    <button onclick="segnaGiornataNonLavorata('${iso}', '${k}')" class="text-[11px] font-black px-2.5 py-1.5 rounded-lg ${k === 'recupero' ? 'bg-orange-500 hover:bg-orange-600 text-white' : 'bg-gray-700 hover:bg-gray-600 text-white'}">${SHIFT_PRESETS[k].label}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-1.5 pt-1 border-t border-gray-800">
                            ${t ? `<button onclick="iniziaSpostamento('${t.id}')" class="text-[11px] font-black px-2.5 py-1.5 rounded-lg bg-white hover:bg-gray-100 text-gray-900">Sposta ad altro giorno</button>` : ''}
                            ${t ? `<button onclick="deleteShift('${t.id}')" class="text-[11px] font-black px-2.5 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white">Elimina</button>` : ''}
                            <button onclick="apriNellElenco('${iso}')" class="text-[11px] font-black px-2.5 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white">Apri nell'elenco turni</button>
                        </div>
                        <p class="text-[10px] text-gray-500 leading-tight">I km si aggiungono dall'elenco turni, quando li sai. Per un orario diverso da questi usa "+ Registra Turno" nell'elenco.</p>
                    </div>`;
            };

            return `
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-4">
                        <!-- Intestazione con mese precedente e successivo -->
                        <div class="flex items-center justify-between gap-3">
                            <button onclick="scorriMeseCalendario(-1)" title="Mese precedente" class="w-10 h-10 rounded-lg bg-gray-100 hover:bg-gray-200 font-black text-gray-700">‹</button>
                            <div class="text-center min-w-0">
                                <p class="text-lg font-black text-gray-900 capitalize leading-tight">${nomeMese(mm)} ${anno}</p>
                                <p class="text-[11px] font-bold text-gray-400">${lavorati.length} lavorati · ${festivi.length} festivi · ${recuperi.length} recuperi · ${oreMese.toFixed(1)} h</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="meseCalendarioOggi()" class="px-3 h-10 rounded-lg bg-yellow-400 hover:bg-yellow-500 text-gray-900 text-xs font-black">Oggi</button>
                                <button onclick="scorriMeseCalendario(1)" title="Mese successivo" class="w-10 h-10 rounded-lg bg-gray-100 hover:bg-gray-200 font-black text-gray-700">›</button>
                            </div>
                        </div>

                        ${inSpostamento ? `
                            <div class="bg-gray-900 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                                <p class="text-xs font-bold text-white">Sto spostando <span class="text-yellow-400 font-black">${esc(inSpostamento.turno)}</span> del ${ggMm(inSpostamento.data)}: tocca il giorno di destinazione.</p>
                                <button onclick="annullaSpostamento()" class="text-[11px] font-black px-2.5 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white">Annulla</button>
                            </div>
                        ` : ''}

                        <!-- Griglia del mese -->
                        <div>
                            <div class="grid grid-cols-7 gap-1 mb-1">
                                ${['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'].map((g, i) => `
                                    <div class="text-center text-[10px] font-black uppercase tracking-wider ${i >= 5 ? 'text-red-400' : 'text-gray-400'}">${g}</div>
                                `).join('')}
                            </div>
                            <div class="grid grid-cols-7 gap-1">
                                ${celle.map(cella).join('')}
                            </div>
                        </div>

                        <!-- Legenda -->
                        <div class="flex flex-wrap gap-x-3 gap-y-1 text-[10px] font-bold text-gray-500 pt-1 border-t border-gray-100">
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-yellow-100 border border-yellow-400 align-middle"></span> lavoro</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-fuchsia-200 border border-fuchsia-500 align-middle"></span> rinforzo</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-indigo-100 border border-indigo-300 align-middle"></span> festivo</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-orange-200 border border-orange-400 align-middle"></span> recupero festivo</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-white border border-gray-300 align-middle"></span> da compilare</span>
                        </div>
                    </div>

                    ${pannello()}
                </div>`;
        }

        function renderContent() {
            const main = document.getElementById('main-container');
            if (!main) return;

            const scrollMain = main.scrollTop;
            const scrollPagina = window.scrollY;
            requestAnimationFrame(() => {
                main.scrollTop = scrollMain;
                window.scrollTo(0, scrollPagina);
            });

            const records = window.dailyRecords || [];
            const shifts = window.shifts || [];

            if (!SCHEDE.includes(window.activeTab)) window.activeTab = 'dashboard';

            if (window.activeTab === 'dashboard') {
                main.innerHTML = `
                    <div class="fade-in space-y-6 max-w-7xl mx-auto">
                        <header class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h2 class="text-3xl font-bold text-gray-900">Bilancio & Statistiche ${annoAttivo()}</h2>
                                <p class="text-gray-500">Tutti i numeri di questa schermata riguardano il ${annoAttivo()}.</p>
                            </div>
                            <span class="${window.isCloudSyncing ? 'bg-green-100 text-green-800 border-green-300' : 'bg-yellow-100 text-yellow-800 border-yellow-300'} text-xs font-black px-3 py-1.5 rounded-full border flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full ${window.isCloudSyncing ? 'bg-green-500 animate-pulse' : 'bg-yellow-500'}"></span>
                                ${window.isCloudSyncing ? 'Cloud Sync Attivo (Mac + Phone)' : 'Memoria Locale'}
                            </span>
                        </header>

                        <!-- Avviso scadenze vicine o scadute -->
                        ${(() => {
                            const urgenti = scadenzeOrdinate().filter(s => s.scaduta || s.vicina);
                            if (!urgenti.length) return '';
                            return `
                            <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 no-print">
                                <div>
                                    <p class="font-black text-red-800">${urgenti.length} scadenza${urgenti.length > 1 ? 'e' : ''} da tenere d'occhio</p>
                                    <p class="text-xs text-red-700">${urgenti.map(s => `${esc(s.nome)} (${s.scaduta ? 'scaduta' : 'tra ' + s.giorniMancanti + ' gg'})`).join(' · ')}</p>
                                </div>
                                <button onclick="switchTab('scadenze')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-black px-4 py-2.5 rounded-xl">Vai a Scadenze</button>
                            </div>`;
                        })()}

                        <!-- Riepiloghi selezionabili per giorno e per mese -->
                        ${renderRiepilogoGiornaliero()}
                        ${renderRiepilogoMensile()}

                        <!-- Riepilogo dell'intero anno, stessa struttura di quello mensile -->
                        ${renderRiepilogoAnnuale()}

                    </div>
                `;
            } 
            else if (window.activeTab === 'giornata') {
                const vista = vistaCorseTurni();
                if (vista === 'calendario') {
                    main.innerHTML = `
                        <div class="fade-in space-y-6 max-w-7xl mx-auto">
                            ${barraLinguette()}
                            ${renderSezioneCalendario()}
                        </div>`;
                } else {
                    main.innerHTML = `
                        <div class="fade-in space-y-6 max-w-7xl mx-auto">
                            ${barraLinguette()}
                        </div>` + (vista === 'turni' ? renderSezioneTurni() : renderSezioneCorse());
                }
            }
            else if (window.activeTab === 'uscite') {
                // Il giorno, quando impostato, ha la precedenza sul filtro mese
                const uscitePeriodo = records.filter(r => {
