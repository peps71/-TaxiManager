                                            <th class="p-3 font-bold text-right">Corse</th>
                                            <th class="p-3 font-bold text-right">Giorni</th>
                                            <th class="p-3 font-bold text-right">Ore</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        ${anniDisponibili().map(a => totaliAnno(a)).map(t => `
                                            <tr class="${t.anno === annoAttivo() ? 'bg-yellow-50 font-bold' : ''}">
                                                <td class="p-3 font-black">${t.anno}</td>
                                                <td class="p-3 text-right text-green-700 font-bold">${formatCurrency(t.entrate)}</td>
                                                <td class="p-3 text-right text-red-600 font-bold">${formatCurrency(t.uscite)}</td>
                                                <td class="p-3 text-right font-black ${t.saldo >= 0 ? 'text-gray-900' : 'text-red-600'}">${formatCurrency(t.saldo)}</td>
                                                <td class="p-3 text-right">${t.corse}</td>
                                                <td class="p-3 text-right">${t.giorni}</td>
                                                <td class="p-3 text-right">${t.ore.toFixed(0)} h</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-red-200 space-y-4">
                            <h3 class="text-lg font-bold text-red-700">Azzera tutti i dati</h3>
                            <p class="text-xs text-gray-500 leading-relaxed">Cancella tutti i movimenti e i turni, sia in locale sia sul Cloud. Utile per rimuovere i dati di esempio prima di importare l'archivio dell'anno. Scarica prima un backup!</p>
                            <button onclick="resetAllData()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-sm transition-colors">🗑️ Cancella tutto</button>
                        </div>
                    </div>
                `;
            }
        }

        // Preset orari turno fissi
        const SHIFT_PRESETS = {
            sei30:    { label: "Le sei e trenta (6:30 - 18:30)", inizio: "06:30", fine: "18:30" },
            otto:     { label: "Le otto (8:00 - 20:00)", inizio: "08:00", fine: "20:00" },
            una:      { label: "L'una (13:00 - 1:00)", inizio: "13:00", fine: "01:00" },
            notte:    { label: "La notte (19:00 - 7:00)", inizio: "19:00", fine: "07:00" },
            spezzato: { label: "Lo spezzato (7:30-13:00 / 15:00-21:30)", inizio: "07:30", fine: "21:30", pausaInizio: "13:00", pausaFine: "15:00" },
            // Nelle giornate di rinforzo si puo' fare soltanto il turno dell'una:
            // gli orari sono fissi e non modificabili, e' questo che lo distingue.
            rinforzo: { label: "Rinforzo (13:00 - 1:00)", inizio: "13:00", fine: "01:00" },
            custom:   { label: "Personalizzato" },
            // Giornate non lavorate: nessun orario, nessun km, zero ore.
            // lavorato:false è ciò che le distingue ovunque nell'app.
            festivo:  { label: "Festivo", lavorato: false },
            recupero: { label: "Recupero festivo", lavorato: false },
            malattia: { label: "Malattia", lavorato: false },
            sciopero: { label: "Sciopero", lavorato: false }
        };

        function isRiposo(t) {
            return !!t && t.lavorato === false;
        }

        function onShiftTypeChange(val) {
            window.selectedShiftType = val;
            try { localStorage.setItem('taxi_ultimo_turno', val); } catch (err) { /* spazio esaurito: pazienza */ }
            renderContent();
        }

        // Ricalcola in automatico il campo "Ore totali" mentre si digitano Ora Inizio/Ora Fine
        // nel turno Personalizzato. Il valore resta comunque modificabile a mano dopo il calcolo.
        function ricalcolaOreCustom() {
            const iniz = document.getElementById('sh-inizio');
            const fine = document.getElementById('sh-fine');
            const campoOre = document.getElementById('sh-ore');
            if (!iniz || !fine || !campoOre || !iniz.value || !fine.value) return;
            campoOre.value = calcolaOreTurno('2000-01-01', iniz.value, fine.value).toFixed(1);
        }

        // Calcola le ore lavorate tra inizio e fine (gestendo il turno a cavallo di mezzanotte
        // e, se presente, una pausa da escludere dal totale, come nello Spezzato)
        function calcolaOreTurno(data, inizio, fine, pausaInizio, pausaFine) {
            const start = new Date(`${data}T${inizio}`);
            let end = new Date(`${data}T${fine}`);
            if (end <= start) end.setDate(end.getDate() + 1);
            let diffHours = (end - start) / (1000 * 60 * 60);

            if (pausaInizio && pausaFine) {
                const pStart = new Date(`${data}T${pausaInizio}`);
                let pEnd = new Date(`${data}T${pausaFine}`);
                if (pEnd <= pStart) pEnd.setDate(pEnd.getDate() + 1);
                diffHours -= (pEnd - pStart) / (1000 * 60 * 60);
            }
            return diffHours;
        }

        function toggleCorsaForm() {
            window.showCorsaForm = !window.showCorsaForm;
            renderContent();
        }

        function toggleUscitaForm() {
            window.showUscitaForm = !window.showUscitaForm;
            renderContent();
        }

        function toggleShiftForm() {
            window.showShiftForm = !window.showShiftForm;
            // Ad ogni apertura pulita del form si azzerano le bozze dei km,
            // cosi' il suggerimento riparte dal turno precedente.
            if (window.showShiftForm) { window.kmIniDraft = null; window.kmFineDraft = null; }
            renderContent();
        }

        // Senza tratta la corsa prende un numero progressivo nella giornata,
        // cosi' nel registro resta comunque distinguibile dalle altre.
        function etichettaCorsaAutomatica(data) {
            const gia = (window.dailyRecords || [])
                .filter(r => r.tipo === 'ENTRATA' && r.data === data).length;
            return `Corsa #${gia + 1}`;
        }

        function addCorsa(e) {
            e.preventDefault();
            const data = document.getElementById('corsa-data').value;
            const scritta = (document.getElementById('corsa-cat').value || '').trim();
            const metodo = document.getElementById('corsa-metodo').value;
            const importo = parseFloat(document.getElementById('corsa-imp').value);

            if (!data || isNaN(importo)) return;
            if (importo < 0) { showToast('L\'importo non può essere negativo.'); return; }

            const categoria = scritta || etichettaCorsaAutomatica(data);
            const record = { id: nuovoId(), data, tipo: 'ENTRATA', categoria, metodo, importo };
            window.saveRecordToCloud(record);

            // Ricorda data e metodo per velocizzare l'inserimento successivo
            window.ultimoDataCorsa = data;
            window.ultimoMetodoCorsa = metodo;
            try { localStorage.setItem('taxi_ultimo_metodo_corsa', metodo); } catch (err) { /* spazio esaurito: pazienza */ }

            // Il pulsante "Salva e inserisci un'altra" tiene il form aperto e pronto
            // per la corsa successiva, invece di richiuderlo ad ogni inserimento.
            const continua = !!(e.submitter && e.submitter.value === 'nuova');
            window.showCorsaForm = continua;
            showToast(continua ? '⚡ Corsa salvata! Pronta per la prossima.' : '⚡ Corsa salvata e sincronizzata!');
            renderContent();
            if (continua) {
                setTimeout(() => {
                    const campoImp = document.getElementById('corsa-imp');
                    if (campoImp) campoImp.focus();
                }, 0);
            }
        }

        // Aggiorna il campo Nota quando si sceglie "Altro": diventa la descrizione
        // completa della spesa invece di un dettaglio facoltativo aggiunto alla categoria.
        function onUscitaCatChange(val) {
            const nota = document.getElementById('uscita-nota');
            const label = document.getElementById('uscita-nota-label');
            if (!nota || !label) return;
            if (val === '__altro__') {
                label.innerHTML = 'Descrizione spesa';
                nota.placeholder = 'Es. Bombole GPL, revisione tassametro...';
            } else {
                label.innerHTML = 'Nota <span class="text-gray-400 font-normal">facoltativa</span>';
                nota.placeholder = 'Es. targa, fornitore...';
            }
        }

        function addUscita(e) {
            e.preventDefault();
            const data = document.getElementById('uscita-data').value;
            const selCat = document.getElementById('uscita-cat-select').value;
            const nota = (document.getElementById('uscita-nota').value || '').trim();
            const metodo = document.getElementById('uscita-metodo').value;
            const importo = parseFloat(document.getElementById('uscita-imp').value);

            let categoria;
            if (selCat === '__altro__') {
                if (!nota) { showToast('Descrivi la spesa.'); return; }
                categoria = nota;
            } else {
                categoria = nota ? `${selCat} - ${nota}` : selCat;
            }

            if (!data || !categoria || isNaN(importo)) return;
            if (importo < 0) { showToast('L\'importo non può essere negativo.'); return; }

            const record = { id: nuovoId(), data, tipo: 'USCITA', categoria, metodo, importo };
            window.saveRecordToCloud(record);

            // Ricorda data, categoria e metodo per velocizzare l'inserimento successivo
            window.ultimoDataUscita = data;
            window.ultimoMetodoUscita = metodo;
            try { localStorage.setItem('taxi_ultimo_metodo_uscita', metodo); } catch (err) { /* spazio esaurito: pazienza */ }
            if (selCat !== '__altro__') {
                window.ultimaCategoriaUscita = selCat;
                try { localStorage.setItem('taxi_ultima_categoria_uscita', selCat); } catch (err) { /* spazio esaurito: pazienza */ }
            }

            const continua = !!(e.submitter && e.submitter.value === 'nuova');
            window.showUscitaForm = continua;
            showToast(continua ? '⚡ Spesa salvata! Pronta per la prossima.' : '⚡ Spesa salvata e sincronizzata!');
            renderContent();
            if (continua) {
                setTimeout(() => {
                    const campoImp = document.getElementById('uscita-imp');
                    if (campoImp) campoImp.focus();
                }, 0);
            }
        }

        function addShift(e) {
            e.preventDefault();
            const data = document.getElementById('sh-data').value;
            const tipo = document.getElementById('sh-tipo').value;
            const preset = SHIFT_PRESETS[tipo];

            // Giornata non lavorata: si registra solo la data e il motivo
            if (isRiposo(preset)) {
                if (!data) return;
                const gia = (window.shifts || []).find(x => x.data === data);
                if (gia && !confirm(`Per il ${data} c'e' gia' ${isRiposo(gia) ? 'una giornata non lavorata' : 'un turno di lavoro'} (${gia.turno}). Registro comunque ${preset.label}?`)) {
                    return;
                }
                const riposo = {
                    id: nuovoId(),
                    data, inizio: '', fine: '',
                    turno: preset.label,
                    lavorato: false,
                    kmInizio: null, kmFine: null,
                    ore: 0, kmTot: null
                };
                window.saveShiftToCloud(riposo);
                window.showShiftForm = false;
                showToast(`${preset.label} registrato per il ${data}.`);
                renderContent();
                return;
            }

            let inizio, fine;
            if (tipo === 'custom') {
                inizio = document.getElementById('sh-inizio').value;
                fine = document.getElementById('sh-fine').value;
            } else {
                inizio = preset.inizio;
                fine = preset.fine;
            }

            // I km sono facoltativi: si possono completare in seguito dall'elenco turni
            const kmIniVal = parseInt(document.getElementById('sh-kmini').value);
            const kmFineVal = parseInt(document.getElementById('sh-kmfine').value);
            const kmInizio = isNaN(kmIniVal) ? null : kmIniVal;
            const kmFine = isNaN(kmFineVal) ? null : kmFineVal;

            if (!data || !inizio || !fine) return;

            if (kmInizio !== null && kmFine !== null && kmFine < kmInizio) {
                showToast('I km fine non possono essere inferiori ai km inizio.');
                return;
            }

            // Doppione: due turni sulla stessa data raddoppiano ore e km nei report.
            // Capita registrando due volte lo stesso giorno a distanza di ore.
            const giaRegistrato = (window.shifts || []).find(x => x.data === data && !isRiposo(x));
            if (giaRegistrato && !confirm(`Per il ${data} c'e' gia' un turno registrato (${giaRegistrato.turno}, ${giaRegistrato.ore} ore). Vuoi aggiungerne un altro?`)) {
                return;
            }

            // Contachilometri all'indietro: quasi sempre e' una cifra sbagliata.
            const kmPrec = kmFinePrecedente(data);
            if (kmInizio !== null && kmPrec !== null && kmInizio < kmPrec) {
                if (!confirm(`I km inizio (${kmInizio}) sono inferiori ai km fine del turno precedente (${kmPrec}). Salvo lo stesso?`)) {
                    return;
                }
            }

            // Le ore totali si possono modificare a mano (es. turno finito prima per un impegno):
            // se il campo e' compilato ha la precedenza sul calcolo automatico da inizio/fine.
            const campoOre = document.getElementById('sh-ore');
            const oreInserite = campoOre ? parseFloat(campoOre.value) : NaN;
            if (campoOre && (isNaN(oreInserite) || oreInserite < 0 || oreInserite > 24)) {
                showToast('Le ore totali devono essere un numero tra 0 e 24.');
                return;
            }
            const ore = !isNaN(oreInserite) ? oreInserite : calcolaOreTurno(data, inizio, fine, preset.pausaInizio, preset.pausaFine);

            const shift = {
                id: nuovoId(),
                data, inizio, fine,
                turno: preset.label,
                kmInizio, kmFine,
                ore: parseFloat(ore.toFixed(1)),
                kmTot: (kmInizio !== null && kmFine !== null) ? kmFine - kmInizio : null
            };

            window.saveShiftToCloud(shift);
            window.showShiftForm = false;
            // La prossima apertura riparte dal suggerimento del turno precedente
            window.kmIniDraft = null;
            window.kmFineDraft = null;
            showToast(shift.kmTot === null
                ? '⚡ Turno salvato senza km: completali quando vuoi dall\'elenco.'
                : '⚡ Turno salvato e sincronizzato!');
            renderContent();
        }

        // ============================================================
        //  MODIFICA DI UN MOVIMENTO GIA' REGISTRATO
        //  Prima si poteva solo cancellare e riscrivere: un importo sbagliato
        //  costava due operazioni e la perdita della data originale.
        // ============================================================

        function apriModificaRecord(id) {
            window.editRecordId = (String(window.editRecordId) === String(id)) ? null : id;
            renderContent();
        }

        function annullaModificaRecord() {
            window.editRecordId = null;
            renderContent();
        }

        async function persistiRecord(rec) {
            if (typeof window.bulkSave === 'function') {
                await window.bulkSave([rec], []);
                return;
            }
            window.dailyRecords = (window.dailyRecords || []).map(x => String(x.id) === String(rec.id) ? rec : x);
            localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));
        }

        async function salvaModificaRecord(id) {
            const rec = (window.dailyRecords || []).find(x => String(x.id) === String(id));
            if (!rec) return;

            const leggi = (p) => { const el = document.getElementById(p + id); return el ? el.value : ''; };
            const data = leggi('mv-data-');
            const scritta = (leggi('mv-cat-') || '').trim();
            const metodo = leggi('mv-met-');
            const importo = parseFloat(leggi('mv-imp-'));

            if (!data || isNaN(importo) || importo < 0) {
                showToast('Controlla data e importo.');
                return;
            }

            // Sulle corse la descrizione resta facoltativa anche in modifica;
            // sulle spese serve, perche' e' quella che definisce la tipologia.
            if (!scritta && rec.tipo === 'USCITA') {
                showToast('La descrizione della spesa è necessaria.');
                return;
            }
            const categoria = scritta || etichettaCorsaAutomatica(data);

            await persistiRecord(Object.assign({}, rec, {
                data, categoria, metodo,
                importo: Math.round(importo * 100) / 100
            }));

            window.editRecordId = null;
            showToast('Movimento aggiornato.');
            renderContent();
        }

        function deleteRecord(id) {
            const rec = (window.dailyRecords || []).find(x => String(x.id) === String(id));
            if (!rec) return;
            const descrizione = `${rec.categoria || 'movimento'} del ${rec.data} · ${formatCurrency(rec.importo)}`;
            if (!confirm(`Elimino definitivamente ${descrizione}?\nL'operazione cancella il dato anche sul Cloud.`)) return;
            window.deleteRecordFromCloud(id);
            showToast('Movimento eliminato.');
            renderContent();
        }

        // Un turno ha i km "mancanti" anche quando valgono 0: un contachilometri a zero
        // non esiste, quindi lo tratto come dato non ancora inserito.
        function kmMancanti(s) {
            if (isRiposo(s)) return false;   // in un giorno di riposo non c'è nulla da compilare
            return !s.kmInizio || !s.kmFine;
        }

        // Turni con i km fine gia' compilati, in ordine cronologico (per data, poi per id a
        // parita' di data), su tutti gli anni: il contachilometri e' continuo.
        function turniConKmFine() {
            return (window.shifts || [])
                .filter(s => !isRiposo(s) && s.kmFine !== null && s.kmFine !== undefined && s.kmFine !== '')
                .slice()
                .sort((a, b) => String(a.data).localeCompare(String(b.data)) || String(a.id).localeCompare(String(b.id)));
        }

        // Ultimo turno con km fine PRECEDENTE alla data indicata (escludendo un turno per id,
        // quando si stanno compilando i km di quel turno stesso).
        // Prima si prendeva sempre l'ultimo turno in assoluto: registrando un turno arretrato
        // il suggerimento era il contachilometri di una data successiva, quindi sbagliato.
        function turnoPrecedenteConKm(dataRif, idEscluso) {
            const lista = turniConKmFine().filter(s => String(s.id) !== String(idEscluso || ''));
            if (!dataRif) return lista.length ? lista[lista.length - 1] : null;
            const precedenti = lista.filter(s => String(s.data) < String(dataRif));
            return precedenti.length ? precedenti[precedenti.length - 1] : null;
        }

        function kmFinePrecedente(dataRif, idEscluso) {
            const t = turnoPrecedenteConKm(dataRif, idEscluso);
            if (!t) return null;
            // Cambiando vettura il contachilometri riparte da capo: fra i due turni
            // c'e' l'acquisto di un'auto nuova, quindi il confronto non ha senso e
            // l'avviso "km all'indietro" sarebbe solo un fastidio.
            const cambioAuto = (window.veicoli || []).some(v =>
                v.dataAcquisto && String(v.dataAcquisto) > String(t.data) && String(v.dataAcquisto) <= String(dataRif));
            if (cambioAuto) return null;
            return t.kmFine;
        }

        // Etichetta breve gg/mm per le note sotto i campi km
        function ggMm(iso) {
            return iso ? String(iso).slice(8, 10) + '/' + String(iso).slice(5, 7) : '';
        }

        // Aggiorna il suggerimento dei km inizio quando si cambia la data nel form turno,
        // senza ridisegnare la pagina (cosi' non si perde quello che si sta digitando).
        function onDataTurnoChange(val) {
            window.dataTurnoProposta = val;
            const campo = document.getElementById('sh-kmini');
            const nota = document.getElementById('sh-kmini-nota');
            if (!campo) return;
            // Se l'utente ha gia' scritto i km a mano, la sua scelta ha la precedenza
            if (window.kmIniDraft !== null && window.kmIniDraft !== undefined && window.kmIniDraft !== '') return;
            const prec = turnoPrecedenteConKm(val);
            campo.value = prec ? prec.kmFine : '';
            if (nota) nota.textContent = prec
                ? 'Km fine del turno del ' + ggMm(prec.data) + ': modificalo se non corrisponde.'
                : 'Nessun turno precedente con i km: inseriscili a mano.';
        }

        function apriModificaTurno(id) {
            window.editKmId = (String(window.editKmId) === String(id)) ? null : id;
            renderContent();
        }

        function annullaModificaTurno() {
            window.editKmId = null;
            renderContent();
        }

        function toggleSoloSenzaKm() {
            window.soloSenzaKm = !window.soloSenzaKm;
            window.editKmId = null;
            renderContent();
        }

        function applyFilterTurni(val) {
            window.filterMonthTurni = val;
            renderContent();
        }

        // Salva il turno aggiornato: usa l'import massivo (che unisce per id e
        // sincronizza il Cloud) e ripiega sulla sola memoria locale se il modulo
        // Firebase non e' disponibile.
        async function persistiTurno(turno) {
            if (typeof window.bulkSave === 'function') {
                await window.bulkSave([], [turno]);
                return;
            }
            window.shifts = (window.shifts || []).map(x => String(x.id) === String(turno.id) ? turno : x);
            localStorage.setItem('taxi_shifts', JSON.stringify(window.shifts));
        }

        // Il tipo "Riposo" e' stato tolto: le giornate registrate in passato con quel
        // nome diventano "Festivo". Gira una volta sola, poi lascia un segno in memoria
        // per non ripetersi a ogni avvio. Se il Cloud non e' ancora pronto la conversione
        // resta comunque locale e viene ripubblicata alla prima occasione utile.
        // La voce di costo fisso si chiamava "Finanziamento veicolo", ma il
        // finanziamento e' quello per l'acquisto della licenza. Le voci gia'
        // registrate portano ancora il nome sbagliato: si correggono una volta
        // sola, lasciando un segno in memoria per non ripetere il giro a ogni avvio.
        async function correggiNomeFinanziamento() {
            const daCorreggere = (window.dailyRecords || []).filter(r =>
                String(r.id || '').startsWith('fissi-') &&
                String(r.categoria || '').startsWith('Costi fissi - Finanziamento veicolo'));
            if (!daCorreggere.length) {
                try { localStorage.setItem('taxi_finanziamento_corretto', '1'); } catch (err) { /* pazienza */ }
                return 0;
            }
            const corretti = daCorreggere.map(r => Object.assign({}, r, {
                categoria: r.categoria.replace('Finanziamento veicolo', 'Finanziamento licenza')
            }));
            if (typeof window.bulkSave === 'function') await window.bulkSave(corretti, []);
            try { localStorage.setItem('taxi_finanziamento_corretto', '1'); } catch (err) { /* pazienza */ }
            return corretti.length;
        }

        async function controllaNomeFinanziamento() {
            if (!(window.dailyRecords || []).some(r =>
                String(r.id || '').startsWith('fissi-') &&
                String(r.categoria || '').startsWith('Costi fissi - Finanziamento veicolo'))) return;
            const quanti = await correggiNomeFinanziamento();
            if (quanti > 0) {
                if (window.showToast) window.showToast(quanti === 1
                    ? '1 voce rinominata: il finanziamento è quello della licenza, non del veicolo.'
                    : `${quanti} voci rinominate: il finanziamento è quello della licenza, non del veicolo.`);
                renderContent();
            }
        }

        async function convertiRiposiInFestivi() {
            const daConvertire = (window.shifts || []).filter(t => t.turno === 'Riposo');
            if (!daConvertire.length) {
                try { localStorage.setItem('taxi_riposi_convertiti', '1'); } catch (err) { /* spazio esaurito: pazienza */ }
                return 0;
            }
            for (const t of daConvertire) {
                await persistiTurno(Object.assign({}, t, { turno: 'Festivo' }));
            }
            try { localStorage.setItem('taxi_riposi_convertiti', '1'); } catch (err) { /* spazio esaurito: pazienza */ }
            return daConvertire.length;
        }

        // Richiamata all'avvio e dopo ogni arrivo di dati dal Cloud: un altro dispositivo
        // ancora aggiornato potrebbe rimandare indietro dei "Riposo".
        async function controllaRiposiDaConvertire() {
            if (!(window.shifts || []).some(t => t.turno === 'Riposo')) return;
            const quanti = await convertiRiposiInFestivi();
            if (quanti > 0) {
                if (window.showToast) window.showToast(`${quanti} ${quanti === 1 ? 'giornata convertita' : 'giornate convertite'} da Riposo a Festivo.`);
                renderContent();
            }
        }

        async function salvaModificaTurno(id) {
            const turno = (window.shifts || []).find(x => String(x.id) === String(id));
            if (!turno) return;

            const campoIni = document.getElementById('km-ini-' + id);
            const campoFine = document.getElementById('km-fine-' + id);
            const campoOre = document.getElementById('ore-edit-' + id);
            const ini = parseInt(campoIni ? campoIni.value : '');
            const fine = parseInt(campoFine ? campoFine.value : '');
            const ore = parseFloat(campoOre ? campoOre.value : '');

            if (isNaN(ini) && isNaN(fine) && isNaN(ore)) {
                showToast('Inserisci almeno un valore da modificare.');
                return;
            }

            // Le ore restano modificabili in qualsiasi momento, anche molto dopo aver
            // registrato il turno: capita di finire prima per un impegno e accorgersene dopo.
            if (campoOre && (isNaN(ore) || ore < 0 || ore > 24)) {
                showToast('Le ore totali devono essere un numero tra 0 e 24.');
                return;
            }

            const aggiornato = Object.assign({}, turno, {
                kmInizio: isNaN(ini) ? (turno.kmInizio || null) : ini,
                kmFine: isNaN(fine) ? (turno.kmFine || null) : fine,
                ore: isNaN(ore) ? turno.ore : parseFloat(ore.toFixed(1))
            });

            if (aggiornato.kmInizio && aggiornato.kmFine && aggiornato.kmFine < aggiornato.kmInizio) {
                showToast('I km fine non possono essere inferiori ai km inizio.');
                return;
            }

            // Contachilometri all'indietro rispetto al turno precedente: di solito e' un refuso
            const kmPrecMod = kmFinePrecedente(turno.data, turno.id);
            if (aggiornato.kmInizio && kmPrecMod !== null && aggiornato.kmInizio < kmPrecMod) {
                if (!confirm(`I km inizio (${aggiornato.kmInizio}) sono inferiori ai km fine del turno precedente (${kmPrecMod}). Salvo lo stesso?`)) {
                    return;
                }
            }

            aggiornato.kmTot = (aggiornato.kmInizio && aggiornato.kmFine)
                ? aggiornato.kmFine - aggiornato.kmInizio
                : null;

            await persistiTurno(aggiornato);
            window.editKmId = null;
            showToast(aggiornato.kmTot !== null
                ? `Turno aggiornato: ${aggiornato.ore} ore, ${aggiornato.kmTot} km percorsi.`
                : `Turno aggiornato: ${aggiornato.ore} ore. Mancano ancora i km per calcolare quelli percorsi.`);
            renderContent();
        }

        // All'apertura i registri si posizionano sulla giornata di oggi: e' il caso

        // Tipologia di spesa = quello che viene prima del trattino o della parentesi.
        // "Costi fissi - Radio taxi (30 gg x 10,50 €)" -> "Costi fissi"
        // Cosi' le famiglie si formano da sole, senza un elenco fisso da aggiornare.
        function tipoSpesa(categoria) {
            const c = (categoria || '').trim();
            if (!c) return 'Senza categoria';
            const taglio = c.split(' - ')[0].split(' (')[0].trim();
            return taglio || 'Senza categoria';

        function tipiSpesaDisponibili() {
            const tipi = {};
            recordsAnno().forEach(r => {
                if (r.tipo !== 'USCITA') return;

                if (!tipi[t]) tipi[t] = { nome: t, n: 0, tot: 0 };
                tipi[t].n++;
                tipi[t].tot += parseFloat(r.importo || 0);
            });
            return Object.keys(tipi).map(k => tipi[k]).sort((a, b) => b.tot - a.tot);

        // Le dodici voci del menu a tendina dei mesi: erano scritte a mano

        function scaricaFile(blob, nomeFile) {

        // Il backup contiene anche le scadenze: prima restavano fuori e ripristinando

        // Esporta i movimenti dell'anno attivo in CSV, pensato per essere aperto in
        // Excel/Numeri e passato al commercialista (separatore ';' e virgola decimale,
        // come si aspetta un Excel impostato in italiano).
        function exportCSV() {
            const recs = recordsAnno().slice().sort((a, b) => new Date(a.data) - new Date(b.data));
            const righe = [['Data', 'Tipo', 'Categoria', 'Metodo', 'Importo (EUR)']];
            recs.forEach(r => {
                righe.push([
                    r.data || '',
                    r.tipo === 'ENTRATA' ? 'Incasso' : 'Spesa',

                    r.metodo || '',
                    (parseFloat(r.importo || 0)).toFixed(2).replace('.', ',')
                ]);
            });
            const csv = righe.map(riga => riga.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            scaricaFile(blob, `TaxiManager_Movimenti_${annoAttivo()}.csv`);
            showToast(`CSV ${annoAttivo()} scaricato!`);

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (!data || typeof data !== 'object') throw new Error('formato non riconosciuto');

                    const valida = (x) => !!x && x.id !== undefined && x.id !== null
                        && /^\d{4}-\d{2}-\d{2}$/.test(String(x.data || ''));
                    const records = (Array.isArray(data.records) ? data.records : []).filter(valida);
                    const shifts = (Array.isArray(data.shifts) ? data.shifts : []).filter(valida);
                    const scadenze = (Array.isArray(data.scadenze) ? data.scadenze : []).filter(valida);
                    const veicoli = (Array.isArray(data.veicoli) ? data.veicoli : [])
                        .filter(v => v && v.id !== undefined && v.id !== null && String(v.modello || '').trim());
                    const vociImportate = (Array.isArray(data.vociFisse) ? data.vociFisse : [])
                        .filter(v => v && String(v.slug || '').trim() && String(v.nome || '').trim());
                    const scartati = (Array.isArray(data.records) ? data.records.length : 0) - records.length
                        + (Array.isArray(data.shifts) ? data.shifts.length : 0) - shifts.length;

                    if (!records.length && !shifts.length && !scadenze.length && !veicoli.length && !vociImportate.length) {
                        showToast('Il file non contiene movimenti, turni o scadenze validi.');
                        return;
                    }

                    const nRec = records.length;
                    const nTur = shifts.length;
                    showToast(`Importazione di ${nRec} movimenti e ${nTur} turni in corso...`);

                    const esito = await window.bulkSave(
                        records,
                        shifts,
                        (fatti, tot) => showToast(`Sincronizzazione Cloud ${fatti}/${tot}...`)
                    );

                    // Le scadenze non passano da bulkSave: si uniscono per identificativo
                    // e si ripubblicano una per una sul Cloud.
                    if (scadenze.length) {
                        const mappa = new Map((window.scadenze || []).map(x => [String(x.id), x]));
                        scadenze.forEach(x => mappa.set(String(x.id), x));
                        window.scadenze = Array.from(mappa.values())
                            .sort((a, b) => String(a.data).localeCompare(String(b.data)));
                        salvaScadenze();
                        if (window.saveScadenzaToCloud) scadenze.forEach(x => window.saveScadenzaToCloud(x));
                    }

                    if (vociImportate.length) {
                        const mappa = new Map((window.vociFisse || []).map(x => [String(x.slug), x]));
                        vociImportate.forEach(x => mappa.set(String(x.slug), x));
                        window.vociFisse = Array.from(mappa.values());
                        salvaVociFisse();
                        if (window.saveVoceFissaToCloud) vociImportate.forEach(x => window.saveVoceFissaToCloud(x));
                    }

                    // Stessa cosa per le vetture del parco auto
                    if (veicoli.length) {
                        const mappa = new Map((window.veicoli || []).map(x => [String(x.id), x]));
                        veicoli.forEach(x => mappa.set(String(x.id), x));
                        window.veicoli = Array.from(mappa.values());
                        salvaVeicoli();
                        if (window.saveVeicoloToCloud) veicoli.forEach(x => window.saveVeicoloToCloud(x));
                    }

                    const pezzi = [];
                    if (scadenze.length) pezzi.push(`${scadenze.length} scadenze`);
                    if (veicoli.length) pezzi.push(`${veicoli.length} vetture`);
                    const coda = pezzi.length ? ' e ' + pezzi.join(', ') : '';
                    showToast(esito.cloud
                        ? `⚡ Importati ${nRec} movimenti, ${nTur} turni${coda} (locale + Cloud)!`
                        : `✅ Importati ${nRec} movimenti, ${nTur} turni${coda} (memoria locale)`);
                    if (scartati > 0) {
                        setTimeout(() => showToast(`${scartati} righe del file sono state ignorate perché incomplete.`), 3200);
                    }
                    renderNav();
                    renderContent();
                } catch (err) {
                    console.error(err);
                    showToast('Errore nel file di backup.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Voci di costo fisso con la quota giornaliera predefinita.
        // Sono quelle che non compaiono altrove: manutenzione, INPS e IRPEF sono
        // volutamente escluse per non contarle due volte.
        // Alcune di queste spese sono una rata fissa che arriva ogni mese uguale
        // (il finanziamento); altre sono un importo annuo che ha senso spalmare
        // giorno per giorno (le assicurazioni). Con l'unita' sbagliata i conti
        // ballano: una rata mensile spalmata a giornata darebbe 733,60 € a
        // febbraio e 812,20 € a gennaio, quando la banca ne addebita 797 sempre.
        // ============================================================
        //  LE TUE VOCI DI COSTO FISSO
        //  L'elenco non e' piu' fisso nel programma: si aggiungono, si
        //  modificano e si tolgono, e ognuna vale in un periodo suo. Una
        //  polizza che parte a marzo non deve comparire a gennaio, e una
        //  rata che finisce a settembre non deve proseguire a ottobre.
        // ============================================================

        // Come partiva il programma prima che l'elenco diventasse modificabile.
        // Gli "slug" sono quelli storici: formano l'identificativo dei movimenti
        // gia' generati, e cambiandoli rigenerare creerebbe dei doppioni invece
        // di aggiornare quelli che ci sono.
        const VOCI_FISSE_INIZIALI = [
            { slug: 'finanziamento',  nome: 'Finanziamento licenza',   importo: 797.00, unita: 'mese' },
            { slug: 'radiotaxi',      nome: 'Radio taxi',              importo: 10.50,  unita: 'giorno' },
            { slug: 'commercialista', nome: 'Commercialista',          importo: 4.50,   unita: 'giorno' },
            { slug: 'assic-auto',     nome: 'Assicurazione auto',      importo: 3.80,   unita: 'giorno' },
            { slug: 'assic-infort',   nome: 'Assicurazione infortuni', importo: 1.37,   unita: 'giorno' }
        ];

        function elencoVociFisse() {
            if (!Array.isArray(window.vociFisse) || !window.vociFisse.length) {
                window.vociFisse = VOCI_FISSE_INIZIALI.map(v => Object.assign({ dataInizio: '', dataFine: '' }, v));
                salvaVociFisse();
            }
            return window.vociFisse;
        }

        // Ogni quanto scrivere il movimento: una riga al mese (come esce dal
        // conto, e come la vede la banca) oppure una riga al giorno, per
        // ritrovarsi il costo su ogni singola giornata.
        function cadenzaFissi() {
            const v = localStorage.getItem('taxi_cadenza_fissi');
            return v === 'giorno' ? 'giorno' : 'mese';
        }

        function impostaCadenzaFissi(v) {
            try { localStorage.setItem('taxi_cadenza_fissi', v === 'giorno' ? 'giorno' : 'mese'); } catch (err) { /* pazienza */ }
            renderContent();
        }

        function salvaVociFisse() {
            try { localStorage.setItem('taxi_voci_fisse', JSON.stringify(window.vociFisse || [])); } catch (err) { /* spazio esaurito: pazienza */ }
        }

        // Identificativo breve e stabile, ricavato dal nome: e' quello che
        // finisce nell'id dei movimenti, quindi non deve scontrarsi con altri.
        function slugVoce(nome) {
            const base = normalizzaSlug(nome) || 'voce';
            const presi = new Set(elencoVociFisse().map(v => v.slug));
            if (!presi.has(base)) return base;
            let n = 2;
            while (presi.has(base + '-' + n)) n++;
            return base + '-' + n;
        }

        function normalizzaSlug(t) {
            return String(t || '').toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 24);
        }

        // Giorni di un mese davvero coperti dal periodo di validita' della voce.
        // Una voce senza date vale sempre.
        function giorniCoperti(voce, anno, mese) {
            const gg = new Date(anno, mese, 0).getDate();
            const primo = `${anno}-${String(mese).padStart(2, '0')}-01`;
            const ultimo = `${anno}-${String(mese).padStart(2, '0')}-${String(gg).padStart(2, '0')}`;
            const da = (voce.dataInizio && voce.dataInizio > primo) ? voce.dataInizio : primo;
            const a = (voce.dataFine && voce.dataFine < ultimo) ? voce.dataFine : ultimo;
            if (da > a) return { giorni: 0, da: null, a: null, interoMese: false };
            const giorni = Number(a.slice(8, 10)) - Number(da.slice(8, 10)) + 1;
            return { giorni, da, a, interoMese: giorni === gg };
        }

        function aggiungiVoceFissa() {
            const elenco = leggiVociFisse();
            const nome = 'Nuova voce';
            elenco.push({
                slug: slugVoce(nome + '-' + Date.now().toString().slice(-5)),
                nome: '', importo: 0, unita: 'mese',
                dataInizio: '', dataFine: ''
            });
            salvaVociFisse();
            renderContent();
            setTimeout(() => {
                const campi = document.querySelectorAll('input[id^="cf-nome-"]');
                const ultimo = campi[campi.length - 1];
                if (ultimo) { ultimo.focus(); ultimo.scrollIntoView({ block: 'center' }); }
            }, 0);
        }

        // Quello che c'e' scritto adesso nei campi, senza aspettare un salvataggio:
        // cosi' modificando una voce e premendo Genera si usa il valore nuovo.
        function leggiVociFisse() {
            const elenco = elencoVociFisse();
            elenco.forEach(v => {
                const leggi = (p) => {
                    const el = document.getElementById(p + v.slug);
                    return el ? String(el.value || '').trim() : null;
                };
                const nome = leggi('cf-nome-');
                if (nome !== null) v.nome = nome;
                const importo = leggi('cf-imp-');
                if (importo !== null) {
                    const n = parseFloat(importo.replace(',', '.'));
                    v.importo = Number.isFinite(n) ? n : 0;
                }
                const unita = leggi('cf-unita-');
                if (unita !== null) v.unita = unita;
                const dal = leggi('cf-dal-');
                if (dal !== null) v.dataInizio = dal;
                const al = leggi('cf-al-');
                if (al !== null) v.dataFine = al;
            });
            return elenco;
        }

        function salvaModificheVociFisse() {
            const elenco = leggiVociFisse();
            const senzaNome = elenco.filter(v => !String(v.nome || '').trim()).length;
            if (senzaNome) { showToast('Ogni voce deve avere un nome.'); return; }
            const dateStorte = elenco.filter(v => v.dataInizio && v.dataFine && v.dataFine < v.dataInizio).length;
            if (dateStorte) { showToast('In una voce la data finale viene prima di quella iniziale.'); return; }
            salvaVociFisse();
            if (window.saveVoceFissaToCloud) elenco.forEach(v => window.saveVoceFissaToCloud(v));
            showToast('Voci di costo fisso salvate.');
            renderContent();
        }

        function eliminaVoceFissa(slug) {
            const v = elencoVociFisse().find(x => x.slug === slug);
            if (!v) return;
            if (!confirm(`Tolgo «${v.nome || 'questa voce'}» dall'elenco dei costi fissi?\nI movimenti già generati restano dove sono: puoi eliminarli dalla tabella qui sotto.`)) return;
            window.vociFisse = leggiVociFisse().filter(x => x.slug !== slug);
            salvaVociFisse();
            if (window.deleteVoceFissaFromCloud) window.deleteVoceFissaFromCloud(slug);
            showToast('Voce tolta dall\'elenco.');
            renderContent();
        }

        // Riquadro di una voce: nome, importo con la sua unita' e periodo
        function rigaVoceFissa(v) {
            const val = (x) => x === null || x === undefined ? '' : esc(x);
            return `
                <div class="border border-gray-200 rounded-xl p-3 space-y-2 bg-gray-50/60">
                    <div class="flex gap-2">
                        <input type="text" id="cf-nome-${esc(v.slug)}" value="${val(v.nome)}" placeholder="Nome della spesa"
                               class="flex-1 min-w-0 p-2 border rounded-lg outline-none font-bold text-sm bg-white" />
                        <button type="button" onclick="eliminaVoceFissa('${escJs(v.slug)}')"
                                class="flex-shrink-0 text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2.5 rounded-lg text-xs font-bold">Togli</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex gap-1">
                            <input type="number" step="0.01" min="0" id="cf-imp-${esc(v.slug)}" value="${val(v.importo)}"
                                   class="w-full min-w-0 p-2 border rounded-lg outline-none bg-white" />
                            <select id="cf-unita-${esc(v.slug)}" class="p-2 border rounded-lg outline-none text-xs font-bold bg-white flex-shrink-0">
                                <option value="giorno" ${v.unita !== 'mese' ? 'selected' : ''}>€/gg</option>
                                <option value="mese" ${v.unita === 'mese' ? 'selected' : ''}>€/mese</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-1">
                            <label class="block">
                                <span class="block text-[9px] font-black uppercase tracking-wider text-gray-400">Dal</span>
                                <input type="date" id="cf-dal-${esc(v.slug)}" value="${val(v.dataInizio)}"
                                       class="w-full min-w-0 p-1.5 border rounded-lg outline-none text-xs bg-white" />
                            </label>
                            <label class="block">
                                <span class="block text-[9px] font-black uppercase tracking-wider text-gray-400">Al</span>
                                <input type="date" id="cf-al-${esc(v.slug)}" value="${val(v.dataFine)}"
                                       class="w-full min-w-0 p-1.5 border rounded-lg outline-none text-xs bg-white" />
                            </label>
                        </div>
                    </div>
                </div>`;
        }


        // ============================================================
        //  COSTI FISSI GIA' IN ARCHIVIO
        //  Versioni diverse dell'app hanno usato nomi (e identificativi)
        //  diversi per le stesse voci: rigenerando, la serie nuova si
        //  affianca alla vecchia invece di sostituirla, e il mese risulta
        //  pagato due volte. Qui si vede cosa c'e' davvero e si toglie
        //  la serie di troppo in un colpo solo.
        // ============================================================

        // Le voci generate dal pulsante "Genera costi fissi" hanno un identificativo
        // che comincia per "fissi-". Tutte le altre arrivano da una versione
        // precedente dell'app o sono state scritte a mano: e' questo, e non il
        // nome, a distinguere le due serie. Alcune voci (Radio taxi, Assicurazione
        // infortuni) si chiamano infatti uguali in entrambe.
        function generataDallApp(r) {
            return String(r.id || '').startsWith('fissi-');
        }

        // Raggruppa i movimenti "Costi fissi" per nome e provenienza
        function gruppiCostiFissi() {
            const gruppi = {};
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA') return;
                if (categoriaBase(r.categoria) !== 'Costi fissi') return;
                const nome = sottocategoria(r.categoria);
                const daApp = generataDallApp(r);
                const chiave = (daApp ? 'app|' : 'altra|') + nome;
                if (!gruppi[chiave]) {
                    gruppi[chiave] = { chiave, nome, daApp, voci: [], totale: 0, dal: r.data, al: r.data, mesi: new Set() };
                }
                const g = gruppi[chiave];
                g.voci.push(r);
                g.totale += parseFloat(r.importo || 0);
                if (String(r.data) < String(g.dal)) g.dal = r.data;
                if (String(r.data) > String(g.al)) g.al = r.data;
                g.mesi.add(String(r.data).slice(0, 7));
            });
            return Object.values(gruppi).sort((a, b) => (a.daApp === b.daApp) ? b.totale - a.totale : (a.daApp ? 1 : -1));
        }

        function serieVecchia() {
            return gruppiCostiFissi().filter(g => !g.daApp);
        }

        // Mesi in cui due voci diverse coprono la stessa spesa: e' il segno
        // che convivono due serie generate da versioni diverse.
        function mesiCostiFissiDoppi() {
            const gruppi = gruppiCostiFissi();
            const perMese = {};
            gruppi.forEach(g => {
                g.mesi.forEach(m => {
                    if (!perMese[m]) perMese[m] = [];
                    perMese[m].push(g.nome);
                });
            });
            // Un mese "doppio" ha piu' voci di quante ne preveda l'elenco
            const attese = elencoVociFisse().length;
            return Object.keys(perMese)
                .filter(m => perMese[m].length > attese)
                .sort();
        }

        async function eliminaGruppoCostiFissi(chiave) {
            const g = gruppiCostiFissi().find(x => x.chiave === chiave);
            if (!g) return;
            if (!confirm(`Elimino tutte le ${g.voci.length} voci di «${g.nome}»${g.daApp ? '' : ' (versione precedente)'}, per un totale di ${formatCurrency(g.totale)}?\nDal ${g.dal} al ${g.al}. L'operazione non si può annullare.`)) return;

            const ids = g.voci.map(v => v.id);
            showToast(`Elimino ${ids.length} voci...`);
            if (typeof window.deleteRecordsFromCloud === 'function') {
                await window.deleteRecordsFromCloud(ids);
            } else {
                const insieme = new Set(ids.map(String));
                window.dailyRecords = (window.dailyRecords || []).filter(r => !insieme.has(String(r.id)));
                scriviLocale('taxi_records', window.dailyRecords);
            }
            showToast(`${ids.length} voci di «${g.nome}» eliminate.`);
            renderNav();
            renderContent();
        }

        // Toglie in un colpo solo tutte le voci di costo fisso che non ha
        // generato questa app: e' la serie rimasta da una versione precedente.
        async function eliminaSerieVecchia() {
            const gruppi = serieVecchia();
            if (!gruppi.length) return;
            const righe = gruppi.reduce((a, g) => a + g.voci.length, 0);
            const totale = gruppi.reduce((a, g) => a + g.totale, 0);
            const elenco = gruppi.map(g => `  · ${g.nome}: ${g.voci.length} righe, ${formatCurrency(g.totale)}`).join('\n');
            if (!confirm(`Elimino ${righe} voci di costi fissi rimaste da una versione precedente, per ${formatCurrency(totale)} in tutto:\n\n${elenco}\n\nRestano quelle generate da questa app. L'operazione non si può annullare: hai già scaricato un backup?`)) return;

            const ids = [].concat(...gruppi.map(g => g.voci.map(v => v.id)));
            showToast(`Elimino ${ids.length} voci...`);
            if (typeof window.deleteRecordsFromCloud === 'function') {
                await window.deleteRecordsFromCloud(ids);
            } else {
                const insieme = new Set(ids.map(String));
                window.dailyRecords = (window.dailyRecords || []).filter(r => !insieme.has(String(r.id)));
                scriviLocale('taxi_records', window.dailyRecords);
            }
            showToast(`${ids.length} voci della serie vecchia eliminate.`);
            renderNav();
            renderContent();
        }

        function sezioneCostiFissiInArchivio() {
            const gruppi = gruppiCostiFissi();
            if (!gruppi.length) return '';
            const doppi = mesiCostiFissiDoppi();
            const vecchie = serieVecchia();
            const righeVecchie = vecchie.reduce((a, g) => a + g.voci.length, 0);
            const totaleVecchie = vecchie.reduce((a, g) => a + g.totale, 0);

            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div>
                        <h3 class="text-lg font-bold text-gray-900">Costi fissi già registrati</h3>
                        <p class="text-xs text-gray-500 leading-relaxed mt-1">
                            Tutte le voci "Costi fissi" presenti in archivio, raggruppate per nome.
                            Quelle segnate «versione precedente» non le ha generate questa app: restano da
                            una versione più vecchia e si sommano alle nuove, facendo risultare il mese
                            pagato due volte. Alcune si chiamano allo stesso modo in entrambe le serie,
                            quindi la distinzione è sulla provenienza, non sul nome.
                        </p>
                    </div>

                    ${vecchie.length ? `
                        <div class="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4">
                            <p class="font-black text-yellow-900 text-sm">
                                Ci sono ${righeVecchie} voci rimaste da una versione precedente
                            </p>
                            <p class="text-xs text-yellow-800 mt-1 leading-relaxed">
                                Valgono ${formatCurrency(totaleVecchie)} e si sommano a quelle generate adesso${doppi.length ? `, così ${doppi.length === 1 ? 'un mese risulta pagato' : doppi.length + ' mesi risultano pagati'} due volte` : ''}.
                                Le riconosci dall'identificativo: non le ha generate questa app.
                            </p>
                            <button onclick="eliminaSerieVecchia()" class="mt-3 bg-red-600 hover:bg-red-700 text-white text-xs font-black px-4 py-2.5 rounded-xl">
                                Elimina tutte le ${righeVecchie} voci vecchie
                            </button>
                        </div>` : ''}

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                                <tr>
                                    <th class="p-3 font-bold">Voce</th>
                                    <th class="p-3 font-bold text-right">Righe</th>
                                    <th class="p-3 font-bold text-right">Totale</th>
                                    <th class="p-3 font-bold">Periodo</th>
                                    <th class="p-3 font-bold text-center">Azione</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${gruppi.map(g => `
                                    <tr class="${g.daApp ? '' : 'bg-yellow-50'}">
                                        <td class="p-3 font-bold text-gray-800">
                                            ${esc(g.nome)}
                                            ${g.daApp
                                                ? ''
                                                : '<span class="ml-2 bg-yellow-200 text-yellow-900 px-2 py-0.5 rounded text-[10px] font-black uppercase whitespace-nowrap">versione precedente</span>'}
                                        </td>
                                        <td class="p-3 text-right">${g.voci.length}</td>
                                        <td class="p-3 text-right font-bold text-red-600">${formatCurrency(g.totale)}</td>
                                        <td class="p-3 text-xs text-gray-500 whitespace-nowrap">${esc(g.dal)} → ${esc(g.al)}</td>
                                        <td class="p-3 text-center">
                                            <button onclick="eliminaGruppoCostiFissi('${escJs(g.chiave)}')"
                                                    class="text-red-600 bg-red-50 hover:bg-red-100 text-xs font-bold px-3 py-1.5 rounded whitespace-nowrap">
                                                Elimina
                                            </button>
                                        </td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                    <p class="text-xs text-gray-400">Scarica un backup prima di eliminare: l'operazione non si può annullare.</p>
                </div>`;
        }

        async function generaCostiFissi() {
            const anno = parseInt(document.getElementById('cf-anno').value);
            if (isNaN(anno) || anno < 2000 || anno > 2100) {
                showToast('Anno non valido.');
                return;
            }

            const voci = leggiVociFisse().filter(v => v.importo > 0 && String(v.nome || '').trim());
            salvaVociFisse();

            if (!voci.length) {
                showToast('Inserisci almeno una voce, con nome e importo.');
                return;
            }

            // Ogni voce vale solo nel suo periodo. Su un mese coperto a meta'
            // (una polizza che parte il 15) l'importo a giornata si conta per i
            // giorni davvero coperti; la rata mensile invece arriva intera,
            // perche' una rata non si dimezza.
            const cadenza = cadenzaFissi();
            const nuovi = [];
            const attesi = new Set();
            let saltatiPeriodo = 0;

            for (let m = 1; m <= 12; m++) {
                const mm = String(m).padStart(2, '0');
                voci.forEach(v => {
                    const c = giorniCoperti(v, anno, m);
                    if (!c.giorni) { saltatiPeriodo++; return; }
                    const perMese = v.unita === 'mese';

                    if (cadenza === 'giorno') {
                        // Una riga per ogni giorno coperto. Se l'importo e' una rata
                        // mensile la si divide per i giorni di quel mese, cosi' il
                        // mese torna comunque alla rata intera.
                        const giorniMese = new Date(anno, m, 0).getDate();
                        const alGiorno = perMese ? v.importo / giorniMese : v.importo;
                        const arrotondato = Math.round(alGiorno * 100) / 100;
                        // Dividendo una rata per i giorni resta sempre qualche
                        // centesimo di scarto: lo assorbe l'ultimo giorno, cosi'
                        // il mese torna esatto alla rata invece di sballare di poco.
                        const totaleMese = perMese ? v.importo : null;
                        const primo = Number(c.da.slice(8, 10));
                        for (let g = primo; g < primo + c.giorni; g++) {
                            const ultimoGiorno = g === primo + c.giorni - 1;
                            const data = `${anno}-${mm}-${String(g).padStart(2, '0')}`;
                            const id = `fissi-${anno}-${mm}-${String(g).padStart(2, '0')}-${v.slug}`;
                            const importoGiorno = (perMese && ultimoGiorno)
                                ? Math.round((totaleMese - arrotondato * (c.giorni - 1)) * 100) / 100
                                : arrotondato;
                            attesi.add(id);
                            nuovi.push({
                                id, data, tipo: 'USCITA',
                                categoria: `Costi fissi - ${v.nome} (quota del giorno)`,
                                metodo: 'Fattura',
                                importo: importoGiorno
                            });
                        }
                        return;
                    }

                    const importo = perMese ? v.importo : Math.round(v.importo * c.giorni * 100) / 100;
                    const dettaglio = perMese
                        ? (c.interoMese ? 'rata mensile' : `rata mensile dal ${ggMm(c.da)}`)
                        : `${c.giorni} gg x ${v.importo.toFixed(2).replace('.', ',')} €`;
                    const id = `fissi-${anno}-${mm}-${v.slug}`;
                    attesi.add(id);
                    nuovi.push({
                        id,
                        // Se il mese e' coperto solo in parte, la spesa cade
                        // sull'ultimo giorno davvero coperto.
                        data: c.a,
                        tipo: 'USCITA',
                        categoria: `Costi fissi - ${v.nome} (${dettaglio})`,
                        metodo: 'Fattura',
                        importo: Math.round(importo * 100) / 100
                    });
                });
            }

            if (!nuovi.length) {
                showToast(`Nessuna voce risulta valida nel ${anno}: controlla le date di inizio e fine.`);
                return;
            }

            // Restringendo il periodo di una voce, i mesi generati prima e ora
            // non piu' coperti resterebbero li' a sporcare i conti: si tolgono.
            const slugNoti = voci.map(v => v.slug);
            const daTogliere = (window.dailyRecords || []).filter(r => {
                const id = String(r.id || '');
                if (!id.startsWith(`fissi-${anno}-`)) return false;
                if (attesi.has(id)) return false;
                // Vale sia per "fissi-2027-03-slug" sia per "fissi-2027-03-15-slug"
                return slugNoti.some(sl => id.endsWith('-' + sl));
            });

            const totAnno = nuovi.reduce((a, x) => a + x.importo, 0);
            let avviso = `Genero le spese fisse ${anno}: ${nuovi.length} ${cadenza === 'giorno' ? 'righe, una per ogni giorno' : 'voci, una al mese'}, per ${formatCurrency(totAnno)} in tutto.`;
            if (saltatiPeriodo) avviso += `\n${saltatiPeriodo} mesi saltati perché fuori dal periodo di validità delle voci.`;
            if (daTogliere.length) avviso += `\n${daTogliere.length} voci generate prima verranno tolte (cambio di periodo o di cadenza).`;
            if (cadenza === 'giorno' && nuovi.length > 900) {
                avviso += `\n\nSono tante righe: il registro diventa lungo e la memoria del telefono si riempie più in fretta. Puoi sempre tornare a una voce al mese e rigenerare.`;
            }
            if (!confirm(avviso + '\nProcedo?')) return;

            if (daTogliere.length && typeof window.deleteRecordsFromCloud === 'function') {
                await window.deleteRecordsFromCloud(daTogliere.map(r => r.id));
            }

            showToast(`Genero ${nuovi.length} voci per il ${anno}...`);
            if (typeof window.bulkSave === 'function') {
                await window.bulkSave(nuovi, []);
            } else {
                const mappa = new Map((window.dailyRecords || []).map(x => [String(x.id), x]));
                nuovi.forEach(x => mappa.set(String(x.id), x));
                window.dailyRecords = Array.from(mappa.values()).sort((a, b) => new Date(b.data) - new Date(a.data));
                localStorage.setItem('taxi_records', JSON.stringify(window.dailyRecords));
            }
            const totale = nuovi.reduce((a, x) => a + x.importo, 0);
            showToast(`Costi fissi ${anno} generati: ${formatCurrency(totale)}.`);
            renderNav();
            renderContent();
        }

        async function resetAllData() {
            if (!confirm('Attenzione: verranno cancellati TUTTI i movimenti e i turni, anche sul Cloud. Procedere?')) return;
            if (!confirm('Conferma definitiva: l\'operazione non è reversibile. Hai gia\' scaricato un backup?')) return;
            showToast('Cancellazione in corso...');
            await window.wipeAllData();
            showToast('Tutti i dati sono stati azzerati.');
            renderContent();
        }

        window.onload = function() {
            renderNav();
            renderContent();
            controllaNomeFinanziamento();
        };
    </script>

    <!-- PWA: registrazione service worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js')
                    .then(function (reg) {
                        // Quando esce una versione nuova il telefono la scarica da solo,
                        // ma la schermata aperta resta quella vecchia finche' non si
                        // riapre l'app: senza un avviso non c'e' modo di accorgersene.
                        reg.addEventListener('updatefound', function () {
                            const nuovo = reg.installing;
                            if (!nuovo) return;
                            nuovo.addEventListener('statechange', function () {
                                if (nuovo.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (window.showToast) {
                                        window.showToast('⬆️ Nuova versione pronta: chiudi e riapri l\'app per usarla.');
                                    }
                                }
                            });
                        });
                    })
                    .catch(function (e) { console.log('Service worker non registrato:', e); });
            });
        }
    </script>
</body>
