            { id: 'scadenze',   label: 'Scadenze',              desc: 'Bollo, revisione, INPS: cosa scade e quando',   icona: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M12 14v3"/><circle cx="12" cy="19.5" r="0.5" fill="currentColor"/></svg>' },
            { id: 'auto',       label: 'Le mie auto',           desc: 'Le vetture, i chilometri, quanto valgono',      icona: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm15 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M3 17v-4.2a2 2 0 0 1 .4-1.2L5.7 8.4A2 2 0 0 1 7.3 7.6h9.4a2 2 0 0 1 1.6.8l2.3 3.2a2 2 0 0 1 .4 1.2V17"/><path d="M4 12h16"/></svg>' },
            { id: 'rendimento', label: 'Rendimento',            desc: 'Euro all\'ora, al chilometro, per corsa',       icona: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>' },
            { id: 'report',     label: 'Commercialista',        desc: 'Il riepilogo da stampare o da esportare',       icona: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' },
            { id: 'cloud',      label: 'Backup e impostazioni', desc: 'Copie automatiche, accesso, aliquote fiscali',  icona: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 3 16.3"/><path d="M16 16l2 2 4-4"/><path d="M20 16.5A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 3 14.5"/></svg>' }
        ];

        // Dove si trova adesso: se sei dentro una scheda del cassetto, in basso
        // resta acceso «Altro», o la barra sembrerebbe non riguardarti.
        function destinazioneAttiva() {
            if (window.activeTab === 'giornata' || window.activeTab === 'dashboard') return window.activeTab;
            return 'altro';
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-container');
            const barraBasso = document.getElementById('barra-basso');

            // L'anno di esercizio non sta piu' in cima a ogni schermata: costava
            // sessanta pixel su nove schede e si tocca due volte l'anno. Adesso
            // e' una pastiglia sulle schermate dove l'anno conta davvero.
            const annoContainer = document.getElementById('anno-container');
            if (annoContainer) annoContainer.innerHTML = pillolaAnno('scura');

            if (navContainer) {
                const voce = (t, grande) => `
                    <button onclick="switchTab('${t.id}')" class="flex items-center gap-3 w-full p-3 rounded-lg font-bold transition-all text-left ${window.activeTab === t.id ? 'bg-gray-900 text-yellow-400 shadow-md' : 'hover:bg-yellow-500 text-gray-800'}">
                        ${t.icona}<span class="${grande ? '' : 'text-sm'}">${t.label}</span>
                    </button>`;
                navContainer.innerHTML =
                    SCHEDE_PRINCIPALI.filter(t => t.id !== 'altro').map(t => voce(t, true)).join('')
                    + '<div class="h-px bg-yellow-500/60 my-2"></div>'
                    + SCHEDE_SECONDARIE.map(t => voce(t, false)).join('');
            }

            if (barraBasso) {
                const attiva = destinazioneAttiva();
                // La voce accesa: l'icona dentro una pastiglia gialla invece del
                // trattino sotto la scritta. Il trattino a un centimetro dal
                // bordo dello schermo non si vedeva, la pastiglia si'.
                barraBasso.innerHTML = SCHEDE_PRINCIPALI.map(t => `
                    <button onclick="switchTab('${t.id}')"
                            aria-current="${attiva === t.id ? 'page' : 'false'}"
                            class="flex-1 flex flex-col items-center justify-center gap-1 py-2 px-1 min-h-[58px] text-xs transition-colors ${attiva === t.id ? 'text-gray-900 font-black' : 'text-gray-400 font-bold'}">
                        <span class="flex items-center justify-center w-10 h-[26px] rounded-full transition-colors ${attiva === t.id ? 'bg-yellow-400' : ''}">${t.icona}</span>
                        <span>${t.label}</span>
                    </button>
                `).join('');
                barraBasso.firstElementChild && barraBasso.classList.add('flex');
            }

            mostraVersione();
        }

        // La pastiglia dell'anno: piccola, dove serve, invece che grande dappertutto.
        function pillolaAnno(stile) {
            const anni = anniDisponibili();
            const opzioni = anni.map(a => `<option value="${a}" ${annoAttivo() === a ? 'selected' : ''}>${a}</option>`).join('');
            if (stile === 'scura') {
                return `
                    <div class="w-full p-3 bg-gray-900 rounded-lg flex items-center gap-3">
                        <label for="scelta-anno-menu" class="text-xs font-black uppercase tracking-wider text-yellow-400 flex-shrink-0">Anno</label>
                        <select id="scelta-anno-menu" onchange="cambiaAnno(this.value)" class="flex-1 min-w-0 p-2 rounded-lg text-base font-black bg-white text-gray-900 outline-none">${opzioni}</select>
                    </div>`;
            }
            // Nella testata di una schermata: un comando quieto accanto al titolo.
            // Il blocco nero di prima pesava piu' del titolo che gli stava
            // accanto, e diceva una cosa che il titolo dice gia'.
            if (stile === 'inScheda') {
                return `
                    <div class="inline-flex items-center gap-1.5 eroe-campo rounded-xl pl-2.5 pr-1.5 py-1 shrink-0">
                        <label for="scelta-anno-${stile}" class="text-[11px] font-bold uppercase tracking-wider text-white/45">Anno</label>
                        <select id="scelta-anno-${stile}" onchange="cambiaAnno(this.value)" class="p-1 rounded-lg text-sm font-black bg-transparent text-white outline-none">${opzioni}</select>
                    </div>`;
            }
            return `
                <div class="inline-flex items-center gap-1.5 bg-white border border-gray-200 rounded-xl pl-2.5 pr-1.5 py-1 shrink-0">
                    <label for="scelta-anno-${stile}" class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Anno</label>
                    <select id="scelta-anno-${stile}" onchange="cambiaAnno(this.value)" class="p-1 rounded-lg text-sm font-black bg-transparent text-gray-900 outline-none">${opzioni}</select>
                </div>`;
        }

        function switchTab(tabId) {
            window.activeTab = tabId;
            window.editKmId = null;
            window.editRecordId = null;
            window.veicoloInModifica = null;
            try { localStorage.setItem('taxi_tab', tabId); } catch (e) { /* spazio esaurito: pazienza */ }
            const main = document.getElementById('main-container');
            if (main) main.scrollTop = 0;
            window.scrollTo(0, 0);
            renderNav();
            renderContent();
            // Le copie automatiche si vedono solo qui: vale la pena rileggerle
            // aprendo la scheda, cosi' l'elenco e' quello di adesso.
            if (tabId === 'cloud' && window.caricaSchedeIstantanee) window.caricaSchedeIstantanee();
        }


        // ============================================================
        //  RIEPILOGO GIORNALIERO E MENSILE (Dashboard)
        // ============================================================

        const GIORNI_SETT = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
        const GIORNI_SETT_BREVI = ['dom','lun','mar','mer','gio','ven','sab'];

        // Le date sono salvate come 'AAAA-MM-GG': confronto le stringhe per evitare
        // gli scherzi dei fusi orari di new Date().
        function dataEstesa(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(a, m - 1, g);
            return `${GIORNI_SETT[d.getDay()]} ${g} ${nomeMese(m).toLowerCase()} ${a}`;
        }

        // La data spezzata in due righe: «mercoledi' 16» sopra, «settembre 2026»
        // sotto. Per esteso su una riga sola, dentro la scheda con le due frecce,
        // non ci stava: veniva fuori «Mercoledi' 16 Sett...».
        function dataDueRighe(iso) {
            if (!iso) return { su: '', giu: '' };
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(a, m - 1, g);
            return { su: `${GIORNI_SETT[d.getDay()]} ${g}`, giu: `${nomeMese(m).toLowerCase()} ${a}` };
        }

        function giornoBreve(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            return GIORNI_SETT_BREVI[new Date(a, m - 1, g).getDay()];
        }

        // Numero di settimana ISO 8601 (la settimana contiene il primo giovedi' dell'anno):
        // e' lo stesso conteggio usato su calendari e agende cartacee.
        function numeroSettimana(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(Date.UTC(a, m - 1, g));
            const giornoIso = (d.getUTCDay() + 6) % 7; // lunedi=0 ... domenica=6
            d.setUTCDate(d.getUTCDate() - giornoIso + 3);
            const primoGennaio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - primoGennaio) / 86400000) + 1) / 7);
        }

        // Domenica di Pasqua secondo il calendario gregoriano (algoritmo di Gauss):
        // serve per calcolare Pasqua e Pasquetta, le uniche due festivita' italiane "mobili".
        function pasquaGregoriana(anno) {
            const a = anno % 19;
            const b = Math.floor(anno / 100);
            const c = anno % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mese = Math.floor((h + l - 7 * m + 114) / 31); // 3 = marzo, 4 = aprile
            const giorno = ((h + l - 7 * m + 114) % 31) + 1;
            return `${anno}-${String(mese).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
        }

        // Festivita' nazionali italiane + il patrono di Torino (San Giovanni Battista, 24 giugno),
        // utile a colpo d'occhio per un tassista torinese per capire su quali giorni si e' lavorato
        // durante una festa. Calcolate una volta per anno e tenute in cache.
        const _cacheFestivita = {};
        function festivitaAnno(anno) {
            if (_cacheFestivita[anno]) return _cacheFestivita[anno];
            const pasqua = pasquaGregoriana(anno);
            const pasquetta = spostaGiorno(pasqua, 1);
            const mappa = {
                [`${anno}-01-01`]: 'Capodanno',
                [`${anno}-01-06`]: 'Epifania',
                [pasqua]: 'Pasqua',
                [pasquetta]: 'Pasquetta',
                [`${anno}-04-25`]: '25 Aprile',
                [`${anno}-05-01`]: '1 Maggio',
                [`${anno}-06-02`]: '2 Giugno',
                [`${anno}-06-24`]: 'S. Giovanni',
                [`${anno}-08-15`]: 'Ferragosto',
                [`${anno}-11-01`]: 'Ognissanti',
                [`${anno}-12-08`]: 'Immacolata',
                [`${anno}-12-25`]: 'Natale',
                [`${anno}-12-26`]: 'S. Stefano',
            };
            _cacheFestivita[anno] = mappa;
            return mappa;
        }

        function nomeFestivo(iso) {
            if (!iso) return null;
            const anno = parseInt(iso.slice(0, 4));
            return festivitaAnno(anno)[iso] || null;
        }

        // Classe colore per evidenziare sabato (arancione), domenica e festivi (rosso):
        // un colpo d'occhio per distinguere subito i giorni "normali" da weekend/festa.
        function classeEvidenziaGiorno(iso) {
            if (!iso) return 'text-gray-400';
            const [a, m, g] = iso.split('-').map(Number);
            const gg = new Date(a, m - 1, g).getDay(); // 0 = domenica ... 6 = sabato
            if (nomeFestivo(iso) || gg === 0) return 'text-red-500';
            if (gg === 6) return 'text-amber-600';
            return 'text-gray-400';
        }

        // Markup compatto per le celle "Data" dei registri: data + giorno abbreviato + settimana
        // (o nome della festa, se il giorno e' festivo), su due righe per non allargare le tabelle
        // (importante sugli schermi piu' stretti). Sabato in arancione, domenica/festivi in rosso.
        function dataConDettagli(iso) {
            if (!iso) return '';
            const festivo = nomeFestivo(iso);
            const colore = classeEvidenziaGiorno(iso);
            const evidenziato = colore !== 'text-gray-400';
            const dettaglio = festivo ? `${giornoBreve(iso)} · ${festivo}` : `${giornoBreve(iso)} · sett. ${numeroSettimana(iso)}`;
            return `<div class="${evidenziato ? colore + ' font-bold' : ''}">${iso}</div><div class="text-xs ${colore} font-bold uppercase tracking-wide">${dettaglio}</div>`;
        }

        // ============================================================
        //  SPESE RICORRENTI
        //  La rata della licenza, il radio taxi, il commercialista: spese che
        //  tornano sempre uguali a distanza regolare. Si scrivono una volta e
        //  l'app ne genera la serie. Restano movimenti come tutti gli altri:
        //  si modificano, si eliminano e contano nei totali uno per uno.
        // ============================================================

        const CADENZE_SPESA = [
            { id: 'settimana',  etichetta: 'ogni settimana',   giorni: 7 },
            { id: '2settimane', etichetta: 'ogni 2 settimane', giorni: 14 },
            { id: 'mese',       etichetta: 'ogni mese',        mesi: 1 },
            { id: '2mesi',      etichetta: 'ogni 2 mesi',      mesi: 2 },
            { id: '3mesi',      etichetta: 'ogni 3 mesi',      mesi: 3 },
            { id: '6mesi',      etichetta: 'ogni 6 mesi',      mesi: 6 },
            { id: 'anno',       etichetta: 'ogni anno',        mesi: 12 }
        ];

        // Aggiunge dei mesi restando dentro il mese di arrivo: una rata del 31
        // diventa il 28 (o il 29) a febbraio, e torna al 31 il mese dopo, perche'
        // il conto si fa sempre a partire dalla data di partenza.
        function aggiungiMesi(iso, n) {
            const [a, m, g] = String(iso).split('-').map(Number);
            const arrivo = new Date(a, m - 1 + n, 1);
            const ultimo = new Date(arrivo.getFullYear(), arrivo.getMonth() + 1, 0).getDate();
            return `${arrivo.getFullYear()}-${String(arrivo.getMonth() + 1).padStart(2, '0')}-${String(Math.min(g, ultimo)).padStart(2, '0')}`;
        }

        const MAX_RICORRENZE = 400;

        // Le date di una serie, dalla prima compresa fino a "finoAl" compreso
        function datePeriodiche(inizio, cadenzaId, finoAl) {
            const c = CADENZE_SPESA.find(x => x.id === cadenzaId);
            if (!c || !inizio || !finoAl || finoAl < inizio) return [];
            const date = [];
            for (let k = 0; k < MAX_RICORRENZE; k++) {
                const d = c.mesi ? aggiungiMesi(inizio, c.mesi * k) : spostaGiorno(inizio, c.giorni * k);
                if (d > finoAl) break;
                date.push(d);
            }
            return date;
        }

        function spostaGiorno(iso, delta) {
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(a, m - 1, g + delta);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Identificativo univoco per corse, turni e scadenze.
        // Date.now() da solo puo' ripetersi se due registrazioni cadono nello stesso
        // millisecondo: due righe con lo stesso id si cancellerebbero a vicenda.
        let contatoreId = 0;
        function nuovoId() {
            contatoreId = (contatoreId + 1) % 1000;
            return String(Date.now()) + String(contatoreId).padStart(3, '0');
        }

        function oggiISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Ultimo giorno lavorato: la Dashboard si apre lì.
        // Cerco un giorno con incassi, non solo con movimenti, altrimenti finirei
        // sull'ultimo del mese dove sono registrati i costi fissi.
        function ultimoGiornoConDati() {
            const conIncassi = recordsAnno()
                .filter(r => r.tipo === 'ENTRATA' && r.data).map(r => r.data).sort();
            if (conIncassi.length) return conIncassi[conIncassi.length - 1];
            const tutte = recordsAnno().map(r => r.data).filter(Boolean).sort();
            if (tutte.length) return tutte[tutte.length - 1];
            // Anno senza dati: mi posiziono su oggi se l'anno è quello corrente,
            // altrimenti sul 1° gennaio dell'anno scelto.
            const oggi = oggiISO();
            return oggi.slice(0, 4) === annoAttivo() ? oggi : `${annoAttivo()}-01-01`;
        }

        // ============================================================
        //  UN RIQUADRO SOLO, CON L'INTERRUTTORE DEL PERIODO
        //  Prima la schermata impilava tre riquadri con la stessa identica
        //  struttura - giornaliero, mensile, annuale - e ripeteva venti
        //  etichette tre volte: 4.492 pixel, sessantasette numeri in colonna.
        //  Uno sopra l'altro non si confrontano nemmeno: per confrontarli
        //  dovresti vederli insieme, e insieme non ci stanno.
        //  Adesso e' lo stesso riquadro con tre posizioni. Quello che non
        //  vedi non e' stato tolto: e' dietro l'interruttore, a un tocco.
        // ============================================================
        const PERIODI_DASH = [
            { id: 'giorno', label: 'Oggi' },
            { id: 'mese',   label: 'Mese' },
            { id: 'anno',   label: 'Anno' }
        ];

        function periodoDash() {
            const v = window.periodoDashScelto;
            return PERIODI_DASH.some(x => x.id === v) ? v : 'giorno';
        }

        function cambiaPeriodoDash(v) {
            window.periodoDashScelto = v;
            try { localStorage.setItem('taxi_periodo_dash', v); } catch (e) { /* pazienza */ }
            renderContent();
        }

        function interruttorePeriodo() {
            const attivo = periodoDash();
            return `
                <div class="flex gap-1 bg-gray-800 p-1 rounded-xl no-print" role="group" aria-label="Periodo da vedere">
                    ${PERIODI_DASH.map(x => `
                        <button onclick="cambiaPeriodoDash('${x.id}')"
                                aria-current="${attivo === x.id ? 'true' : 'false'}"
                                class="flex-1 px-4 py-2 rounded-lg text-sm transition-colors ${attivo === x.id ? 'bg-yellow-400 text-gray-900 font-black' : 'text-white/55 font-bold hover:text-white'}">
                            ${x.label}
                        </button>
                    `).join('')}
                </div>`;
        }

        // La testata comune ai tre periodi: l'interruttore, le frecce per
        // spostarsi, e IL numero - uno solo, grande davvero, con sotto le due
        // righe che dicono cosa ne resta. Prima il numero piu' importante della
        // schermata aveva lo stesso corpo di altri sedici.
        function testataPeriodo(sottotitolo, navigatore, d, note) {
            const resta = d.saldo;
            // La stessa scheda scura della giornata, qui in cima al riepilogo:
            // il numero grande bianco, il simbolo piu' tenue, e sotto le caselle
            // con le cifre allineate. Prima il numero era giallo su nero - bello
            // di sera, ma con il sole in faccia il giallo su nero e' la coppia
            // che si legge peggio di tutte.
            return `
                <div class="bg-gray-900 px-5 py-4 space-y-4">
                    ${interruttorePeriodo()}
                    <div class="flex flex-wrap items-center ${sottotitolo ? 'justify-between' : ''} gap-x-3 gap-y-2">
                        ${sottotitolo ? `<p class="text-xs text-gray-300 font-bold prima-maiuscola">${sottotitolo}</p>` : ''}
                        <div class="flex flex-wrap items-center gap-1.5 min-w-0 no-print">${navigatore || ''}</div>
                    </div>
                    <div>
                        <p class="cifra text-[2.6rem] sm:text-5xl text-white leading-none">${cifraEuro(d.incassi)}</p>
                        <p class="text-xs font-medium text-white/50 mt-1.5">
                            incassato${d.nCorse ? ` · ${d.nCorse} cors${d.nCorse === 1 ? 'a' : 'e'}` : ''}${note ? ' · ' + note : ''}
                        </p>
                    </div>
                    <div class="flex border-t border-white/10 pt-3.5">
                        <div class="flex-1 min-w-0">
                            <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/40">Spese</p>
                            <p class="text-[17px] font-black ${d.uscite ? 'text-red-400' : 'text-white/30'} mt-0.5 truncate">${d.uscite ? '−' + soldi(d.uscite) : '—'}</p>
                        </div>
                        <div class="flex-1 min-w-0 border-l border-white/10 pl-3.5">
                            <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/40">Ti resta</p>
                            <p class="text-[17px] font-black ${resta >= 0 ? 'text-white' : 'text-red-400'} mt-0.5 truncate">${soldi(resta)}</p>
                        </div>
                        <div class="flex-1 min-w-0 border-l border-white/10 pl-3.5">
                            <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/40">A corsa</p>
                            <p class="text-[17px] font-black ${d.nCorse ? 'text-yellow-400' : 'text-white/30'} mt-0.5 truncate">${d.nCorse ? soldi(d.mediaCorsa) : '—'}</p>
                        </div>
                    </div>
                </div>`;
        }

        function giornoSelezionato() {
            if (!window.dashGiorno) window.dashGiorno = ultimoGiornoConDati();
            return window.dashGiorno;
        }

        function meseSelezionato() {
            if (!window.dashMese) window.dashMese = giornoSelezionato().slice(0, 7);
            return window.dashMese;
        }

        // Dal Rendimento al riepilogo di quella giornata, in Dashboard
        function vaiAlGiorno(iso) {
            setDashGiorno(iso);
            switchTab('dashboard');
        }

        function setDashGiorno(v) {
            if (!v) return;
            window.dashGiorno = v;
            window.dashMese = v.slice(0, 7);
            renderContent();
        }

        function scorriGiorno(delta) {
            setDashGiorno(spostaGiorno(giornoSelezionato(), delta));
        }

        function setDashMese(v) {
            if (!v) return;
            window.dashMese = v;
            renderContent();
        }

        function scorriMese(delta) {
            const [a, m] = meseSelezionato().split('-').map(Number);
            const d = new Date(a, m - 1 + delta, 1);
            setDashMese(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
        }

        // Aggrega i movimenti di un periodo (prefisso data: '2026-05' oppure '2026-05-14')
        function aggrega(prefisso) {
            return memo('aggrega:' + prefisso, () => aggregaCalcola(prefisso));
        }

        function aggregaCalcola(prefisso) {
            const r = {
                incassi: 0, contanti: 0, pos: 0, satispay: 0, app: 0, fattura: 0,
                nCorse: 0, uscite: 0, carburante: 0, manutenzione: 0, altroSpese: 0,
                // Le stesse tre voci, ma solo per la parte pagata in modo
                // tracciato: e' quella che va in deduzione.
                usciteDed: 0, carburanteDed: 0, manutenzioneDed: 0, altroSpeseDed: 0,
                perCategoria: {}, speseCategorie: [],
                listaUscite: [], ore: 0, nTurni: 0, turni: []
            };

            (window.dailyRecords || []).forEach(x => {
                if (!x.data || !String(x.data).startsWith(prefisso)) return;
                const imp = parseFloat(x.importo || 0);
                if (x.tipo === 'ENTRATA') {
                    r.incassi += imp;
                    r.nCorse++;
                    switch (famigliaMetodo(x.metodo)) {
                        case 'POS': r.pos += imp; break;
                        case 'Contanti': r.contanti += imp; break;
                        case 'Satispay': r.satispay += imp; break;
                        case 'Fattura': r.fattura += imp; break;
                        default: r.app += imp;
                    }
                } else if (x.tipo === 'USCITA') {
                    r.uscite += imp;
                    r.listaUscite.push(x);
                    // Stessa regola del report: decide categoriaBase, non un elenco
                    // di parole a parte che dimenticava benzina, GPL e metano.
                    const base = categoriaBase(x.categoria);
                    const ded = metodoTracciato(x.metodo) ? imp : 0;
                    r.usciteDed += ded;
                    if (base === 'Carburante') { r.carburante += imp; r.carburanteDed += ded; }
                    else if (base === 'Manutenzione' || base === 'Lavaggio') { r.manutenzione += imp; r.manutenzioneDed += ded; }
                    else { r.altroSpese += imp; r.altroSpeseDed += ded; }

                    if (!r.perCategoria[base]) r.perCategoria[base] = { nome: base, tot: 0, voci: [] };
                    r.perCategoria[base].tot += imp;
                    r.perCategoria[base].voci.push(x);
                }
            });

            r.riposi = [];
            (window.shifts || []).forEach(t => {
                if (!t.data || !String(t.data).startsWith(prefisso)) return;
                if (isRiposo(t)) { r.riposi.push(t); return; }
                r.nTurni++;
                r.ore += parseFloat(t.ore || 0);
                r.turni.push(t);
            });

            r.saldo = r.incassi - r.uscite;
            r.mediaCorsa = r.nCorse ? r.incassi / r.nCorse : 0;
            r.mediaOra = r.ore ? r.incassi / r.ore : 0;
            r.listaUscite.sort((a, b) => parseFloat(b.importo) - parseFloat(a.importo));
            r.speseCategorie = Object.values(r.perCategoria).sort((a, b) => b.tot - a.tot);
            r.speseCategorie.forEach(c => {
                c.voci.sort((a, b) => parseFloat(b.importo) - parseFloat(a.importo));
                c.tipologie = raggruppaPerTipologia(c.voci);
            });
            return r;
        }

        // Incassi, uscite, corse e ore raccolti per giorno (chiave lunga 10) o per
        // mese (chiave lunga 7), con UN SOLO giro sull'archivio.
        // Prima ogni colonna del grafico chiamava aggrega(), che rilegge tutti i
        // movimenti e tutti i turni e per giunta ordina e raggruppa le categorie:
        // per il grafico del mese erano trentuno letture complete, piu' dodici per
        // quello dell'anno, ad ogni ridisegno della Dashboard.
        function totaliPerChiave(prefisso, lunghezzaChiave) {
            const per = {};
            const tocca = (k) => per[k] || (per[k] = { incassi: 0, uscite: 0, nCorse: 0, ore: 0 });
            (window.dailyRecords || []).forEach(x => {
                const d = String(x.data || '');
                if (!d.startsWith(prefisso)) return;
                const imp = parseFloat(x.importo || 0) || 0;
                const g = tocca(d.slice(0, lunghezzaChiave));
                if (x.tipo === 'ENTRATA') { g.incassi += imp; g.nCorse++; }
                else if (x.tipo === 'USCITA') g.uscite += imp;
            });
            (window.shifts || []).forEach(t => {
                const d = String(t.data || '');
                if (!d.startsWith(prefisso) || isRiposo(t)) return;
                tocca(d.slice(0, lunghezzaChiave)).ore += parseFloat(t.ore || 0) || 0;
            });
            return per;
        }

        const PERIODO_VUOTO = { incassi: 0, uscite: 0, nCorse: 0, ore: 0 };

        // ============================================================
        //  I CORRISPETTIVI, GIORNO PER GIORNO
        //  Il registro dei corrispettivi si compila una data alla volta, e
        //  per ogni data serve la divisione per come hanno pagato. I numeri
        //  c'erano gia' tutti, ma sparsi: il totale del mese per metodo da
        //  una parte, il totale del giorno dall'altra, e l'incrocio - che e'
        //  esattamente quello che va trascritto - da nessuna parte.
        //  Qui il registro si legge come si compila: una riga per data, una
        //  colonna per metodo, il totale in fondo.
        // ============================================================
        const METODI_CORRISPETTIVI = ['Contanti', 'POS', 'Satispay', 'App', 'Fattura'];
        const METODI_BREVI = { 'Contanti': 'Contanti', 'POS': 'POS', 'Satispay': 'Satispay', 'App': 'App', 'Fattura': 'Fattura' };

        function corrispettiviMese(ym) {
            return memo('corrispettivi:' + ym, () => corrispettiviMeseCalcola(ym));
        }

        function corrispettiviMeseCalcola(ym) {
            const [a, m] = ym.split('-').map(Number);
            const giorniMese = new Date(a, m, 0).getDate();
            const per = {};
            const tocca = (iso) => {
                if (!per[iso]) {
                    per[iso] = { iso, giorno: parseInt(iso.slice(8, 10), 10), tot: 0, n: 0 };
                    METODI_CORRISPETTIVI.forEach(k => per[iso][k] = 0);
                }
                return per[iso];
            };

            (window.dailyRecords || []).forEach(x => {
                if (x.tipo !== 'ENTRATA') return;
                const d = String(x.data || '');
                if (!d.startsWith(ym + '-')) return;
                const imp = parseFloat(x.importo || 0) || 0;
                const g = tocca(d);
                // Un metodo scritto a mano o arrivato da una versione vecchia
                // non deve sparire dal conto: famigliaMetodo lo riporta a una
                // delle cinque colonne, e «App» e' quella che raccoglie il resto.
                const fam = famigliaMetodo(x.metodo);
                const col = METODI_CORRISPETTIVI.includes(fam) ? fam : 'App';
                g[col] += imp;
                g.tot += imp;
                g.n++;
            });

            const righe = Object.values(per).sort((x, y) => x.giorno - y.giorno);
            const totali = { tot: 0, n: 0 };
            METODI_CORRISPETTIVI.forEach(k => totali[k] = 0);
            righe.forEach(r => {
                METODI_CORRISPETTIVI.forEach(k => totali[k] += r[k]);
                totali.tot += r.tot;
                totali.n += r.n;
            });

            // Le colonne a zero per tutto il mese non si mostrano: cinque colonne
            // di cui tre vuote rendono illeggibile la tabella su un telefono.
            const usati = METODI_CORRISPETTIVI.filter(k => totali[k] > 0);
            return { righe, totali, usati, giorniMese, senzaIncasso: giorniMese - righe.length };
        }

        // Dettaglio giorno per giorno del mese, usato dal grafico a barre
        function serieMensile(ym) {
            return memo('serieMensile:' + ym, () => serieMensileCalcola(ym));
        }

        function serieMensileCalcola(ym) {
            const [a, m] = ym.split('-').map(Number);
            const giorni = new Date(a, m, 0).getDate();
            const per = totaliPerChiave(ym, 10);
            const serie = [];
            for (let g = 1; g <= giorni; g++) {
                const iso = `${ym}-${String(g).padStart(2, '0')}`;
                const d = per[iso] || PERIODO_VUOTO;
                serie.push({ giorno: g, iso, incassi: d.incassi, uscite: d.uscite, nCorse: d.nCorse, ore: d.ore });
            }
            return serie;
        }

        // I 12 mesi dell'anno con i rispettivi totali: e' la base del grafico annuale
        function serieAnnuale(anno) {
            return memo('serieAnnuale:' + anno, () => serieAnnualeCalcola(anno));
        }

        function serieAnnualeCalcola(anno) {
            const per = totaliPerChiave(String(anno), 7);
            const serie = [];
            for (let m = 1; m <= 12; m++) {
                const ym = `${anno}-${String(m).padStart(2, '0')}`;
                const d = per[ym] || PERIODO_VUOTO;
                serie.push({ mese: m, ym, incassi: d.incassi, uscite: d.uscite, nCorse: d.nCorse, ore: d.ore });
            }
            return serie;
        }

        // Riquadro "Incassi per metodo", usato identico in quattro punti dell'app.
        // opzioni: vuoto = testo quando non ci sono incassi;
        //          daVersare = aggiunge la riga contanti + Satispay;
        //          soloConImporto = nasconde i metodi a zero (utile sulla singola giornata).
        function bloccoIncassiPerMetodo(d, opzioni) {
            const o = opzioni || {};
            if (!(d.incassi > 0)) {
                return `<p class="text-sm text-gray-400">${o.vuoto || 'Nessun incasso registrato.'}</p>`;
            }
            const metodi = [
                ['Contanti', d.contanti, 'bg-green-500'],
                ['POS / Carta', d.pos, 'bg-gray-900'],
                ['Satispay', d.satispay, 'bg-red-500'],
                ['App / Voucher', d.app, 'bg-blue-500'],
                ['Fattura', d.fattura, 'bg-indigo-500']
            ];
            // La riga Fattura si mostra solo se c'e' davvero: altrimenti resta sempre a zero
            const visibili = metodi.filter(m => o.soloConImporto ? m[1] > 0 : (m[0] !== 'Fattura' || m[1] > 0));
            const righe = visibili.map(m => rigaMetodo(m[0], m[1], d.incassi, m[2])).join('');
            if (!o.daVersare) return righe;
            return righe + `
                <div class="pt-2 mt-1 border-t border-dashed border-gray-200 flex justify-between text-xs font-black">
                    <span class="text-gray-600">Da versare (contanti + Satispay)</span>
                    <span class="text-gray-900">${formatCurrency(d.contanti + d.satispay)}</span>
                </div>`;
        }

        // Riquadro "Spese per categoria" dei riepiloghi mensile e annuale
        // Elenco compatto "descrizione - importo" delle spese di una giornata
        function righeSpeseGiornata(uscite) {
            const elenco = uscite || [];
            // Con i costi fissi in sottofondo la giornata ne ha una riga per
            // ognuno: elencarle tutte coprirebbe le spese vere, che sono quelle
            // che interessa vedere. Si raccolgono in una riga sola.
            const raccogli = fissiDaRaccogliere();
            const fissi = raccogli ? elenco.filter(fissoGenerato) : [];
            const altre = raccogli ? elenco.filter(u => !fissoGenerato(u)) : elenco;

            const righe = altre.map(u => `
                <div class="px-3 py-2 flex justify-between items-center gap-3">
                    <span class="text-xs font-bold text-gray-700 truncate">
                        ${esc(u.categoria)}${u.nota ? `<span class="font-medium text-gray-400"> · ${esc(u.nota)}</span>` : ''}
                    </span>
                    <span class="text-sm font-black text-red-600 whitespace-nowrap">-${formatCurrency(u.importo)}</span>
                </div>`).join('');

            if (!fissi.length) return righe;

            return righe + `
                <div class="px-3 py-2 flex justify-between items-center gap-3 bg-indigo-50/70">
                    <span class="text-xs font-bold text-indigo-800 truncate" title="${esc(fissi.map(f => sottocategoria(f.categoria)).join(', '))}">Costi fissi del giorno <span class="font-medium text-indigo-500">· ${fissi.length} ${fissi.length === 1 ? 'voce' : 'voci'}</span></span>
                    <span class="text-sm font-black text-indigo-700 whitespace-nowrap">-${formatCurrency(totaleImporti(fissi))}</span>
                </div>`;
        }

        function bloccoSpesePerCategoria(d, ambito, vuoto) {
            if (!(d.uscite > 0)) return `<p class="text-sm text-gray-400">${vuoto}</p>`;
            return d.speseCategorie.map(c => rigaCategoriaSpesa(c, d.uscite, ambito)).join('');
        }

        // ============================================================
        //  TRACCIATO O IN CONTANTI
        //  Una spesa pagata con POS, bonifico, carta o app lascia una prova del
        //  pagamento: e' quella che il commercialista puo' portare in deduzione
        //  senza doverti credere sulla parola. I contanti no. La regola non e'
        //  uguale per tutte le voci e non la decide questa app: qui si conta e
        //  si divide, la parola definitiva resta al commercialista.
        // ============================================================
        function metodoTracciato(metodo) {
            const m = String(metodo || '').trim();
            // Senza metodo scritto non si sa come e' stata pagata: non si puo'
            // dire che lascia una traccia. Meglio contarla fuori e vederla
            // nell'elenco come «Non indicato», che darla per buona.
            if (!m) return false;
            return famigliaMetodo(m) !== 'Contanti';
        }

        // Quanto, di queste spese, va a ridurre l'imponibile: solo quelle
        // tracciate. E' la regola scritta dal tassista con il suo
        // commercialista, e da qui in avanti la usa tutta l'app - la stima
        // delle tasse, l'accantonamento e il foglio da portare in studio.
        function usciteDeducibili(elenco) {
            return (elenco || []).reduce((t, r) =>
                t + (metodoTracciato(r.metodo) ? (parseFloat(r.importo || 0) || 0) : 0), 0);
        }

        const COLORE_PAGAMENTO = {
            'Contanti': 'bg-green-500',
            'POS': 'bg-yellow-400',
            'Satispay': 'bg-red-500',
            'App': 'bg-blue-500',
            'Bonifico': 'bg-indigo-500',
            'Fattura': 'bg-sky-400'
        };

        // Le spese divise per come sono state pagate. Ritorna anche i due
        // mucchi che contano: quello che lascia traccia e quello che non ne
        // lascia.
        function spesePerPagamento(lista) {
            const per = {};
            let tracciate = 0, nTracciate = 0, contanti = 0, nContanti = 0, conFattura = 0, nFattura = 0;
            (lista || []).forEach(r => {
                const imp = parseFloat(r.importo || 0) || 0;
                // Il nome com'e' scritto sul movimento: «Carta Carburante» e
                // «POS» sono due cose diverse in cassa, anche se il fisco le
                // guarda allo stesso modo.
                const nome = r.metodo || 'Non indicato';
                if (!per[nome]) per[nome] = { nome, tot: 0, n: 0, tracciato: metodoTracciato(nome) };
                per[nome].tot += imp;
                per[nome].n++;
                if (metodoTracciato(nome)) { tracciate += imp; nTracciate++; }
                else { contanti += imp; nContanti++; }
                if (r.fattura) { conFattura += imp; nFattura++; }
            });
            return {
                perMetodo: Object.values(per).sort((a, b) => b.tot - a.tot),
                tracciate, nTracciate, contanti, nContanti, conFattura, nFattura,
                totale: tracciate + contanti
            };
        }

        // Il riquadro «come le hai pagate»: i due mucchi in cima, il dettaglio
        // per metodo sotto. Lo usano il registro spese e il foglio per il
        // commercialista, con gli stessi numeri.
        function bloccoPagamentoSpese(sp, opzioni) {
            const o = opzioni || {};
            if (!(sp.totale > 0)) return `<p class="text-sm text-gray-400">${o.vuoto || 'Nessuna spesa in questa selezione.'}</p>`;
            const pct = (v) => sp.totale > 0 ? Math.round((v / sp.totale) * 100) : 0;
            return `
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="bg-white border border-gray-200 rounded-xl p-3">
                        <p class="text-[10.5px] font-bold uppercase tracking-wider text-gray-400">Deducibili · tracciate</p>
                        <p class="text-[19px] font-black text-gray-900 mt-0.5">${soldi(sp.tracciate)} <span class="text-xs font-bold text-gray-400">${pct(sp.tracciate)}%</span></p>
                        <p class="text-[11px] font-medium text-gray-400">${sp.nTracciate} ${sp.nTracciate === 1 ? 'spesa' : 'spese'}${sp.conFattura > 0 ? ` \u00b7 ${soldi(sp.conFattura)} con fattura` : ''}</p>
                    </div>
                    <div class="bg-white border border-gray-200 rounded-xl p-3">
                        <p class="text-[10.5px] font-bold uppercase tracking-wider text-gray-400">Non deducibili</p>
                        <p class="text-[19px] font-black ${sp.contanti > 0 ? 'text-gray-900' : 'text-gray-300'} mt-0.5">${soldi(sp.contanti)} <span class="text-xs font-bold text-gray-400">${pct(sp.contanti)}%</span></p>
                        <p class="text-[11px] font-medium text-gray-400">${sp.nContanti} ${sp.nContanti === 1 ? 'spesa' : 'spese'}</p>
                    </div>
                </div>
                <div class="space-y-2.5 mt-3">
                    ${sp.perMetodo.map(m => rigaMetodo(
                        `${esc(m.nome)}${m.tracciato ? '' : ' <span class="font-medium text-gray-400">(senza traccia)</span>'}`,
                        m.tot, sp.totale, COLORE_PAGAMENTO[famigliaMetodo(m.nome)] || 'bg-gray-400'
                    )).join('')}
                </div>
                ${o.nota === false ? '' : `
                    <p class="text-[11px] text-gray-400 leading-relaxed mt-3">
                        La regola che hai stabilito: <strong class="text-gray-500">in deduzione vanno solo le spese
                        tracciate</strong>, quelle di cui resta una prova del pagamento \u2014 POS, carta, bonifico, app.
                        Contanti e spese senza metodo scritto restano spese vere, tolgono soldi dalla cassa, ma non
                        abbassano l\'imponibile: la stima delle tasse e l\'accantonamento le lasciano fuori.
                    </p>`}`;
        }

        function rigaMetodo(etichetta, valore, totale, classe) {
            const pct = totale > 0 ? (valore / totale) * 100 : 0;
            return `
                <div class="space-y-1">
                    <div class="flex justify-between items-baseline text-xs">
                        <span class="font-bold text-gray-600">${etichetta}</span>
                        <span class="font-black text-gray-900">${formatCurrency(valore)} <span class="text-gray-400 font-bold">${pct.toFixed(0)}%</span></span>
                    </div>
                    <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full ${classe} rounded-full" style="width:${pct}%"></div>
                    </div>
                </div>`;
        }

        // Riga di spesa per categoria: si tocca per aprire l'elenco dei singoli movimenti
        function rigaCategoriaSpesa(cat, totale, ambito) {
            const pct = totale > 0 ? (cat.tot / totale) * 100 : 0;
            // L'ambito ('mese' o 'anno') tiene separate le righe aperte nei due riepiloghi
            const chiave = (ambito || 'mese') + '|' + cat.nome;
            const aperta = window.catSpesaAperta === chiave;
            return `
                <div class="space-y-1">
                    <div onclick="toggleCatSpesa('${escJs(chiave)}')" class="cursor-pointer select-none">
                        <div class="flex justify-between items-baseline text-xs">
                            <span class="font-bold text-gray-600">
                                <span class="text-gray-400">${aperta ? '&#9662;' : '&#9656;'}</span>
                                ${esc(cat.nome)}
                                <span class="text-gray-400 font-bold">${(fissiDaRaccogliere() && cat.nome === 'Costi fissi') ? (cat.tipologie || raggruppaPerTipologia(cat.voci)).length : cat.voci.length}</span>
                            </span>
                            <span class="font-black text-gray-900">${formatCurrency(cat.tot)} <span class="text-gray-400 font-bold">${pct.toFixed(0)}%</span></span>
                        </div>
                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden mt-1">
                            <div class="h-full ${coloreCategoria(cat.nome)} rounded-full" style="width:${pct}%"></div>
                        </div>
                    </div>
                    ${aperta ? `
                        <div class="ml-1 pl-2 border-l-2 border-gray-100">
                            ${(cat.tipologie || raggruppaPerTipologia(cat.voci)).map((t, i, tutte) => `
                                ${t.pagamento && !(tutte[i - 1] || {}).pagamento ? '<p class="text-[9px] font-black uppercase tracking-wider text-gray-400 mt-2 pt-2 border-t border-gray-200">Per pagamento</p>' : ''}
                                <div class="flex justify-between items-baseline gap-2 py-1">
                                    <span class="text-xs ${t.pagamento ? 'text-gray-600 font-bold' : 'text-gray-500'} truncate">
                                        ${esc(t.nome)}
                                        <span class="text-gray-400 font-normal">${t.n > 1 ? '×' + t.n : ggMm(t.ultima)}</span>
                                    </span>
                                    <span class="text-xs font-bold text-red-600 whitespace-nowrap">-${formatCurrency(t.tot)}</span>
                                </div>`).join('')}
                        </div>` : ''}
                </div>`;
        }

        function toggleCatSpesa(chiave) {
            window.catSpesaAperta = window.catSpesaAperta === chiave ? null : chiave;
            window.renderContent();
        }

        // ============================================================
        //  QUOTA GIORNALIERA DEI COSTI FISSI
        //  Ogni spesa resta registrata nel giorno in cui e' stata fatta: e' cosi'
        //  che se ne tiene traccia ed e' cosi' che va in contabilita'. Ma per
        //  capire com'e' andata una giornata quel numero non serve: un pieno, un
        //  tagliando, il commercialista o i contributi servono per tutto il mese,
        //  non per il giorno in cui li hai pagati, e la giornata in cui capitano
        //  risulta disastrosa mentre tutte le altre sembrano piu' ricche del vero.
        //  Qui le spese del mese si dividono per i suoi giorni, e resta una
        //  lettura: non e' un movimento e non entra in nessun totale.
        // ============================================================

        // Quanti giorni ha un mese e quanti ne ha un anno sono fatti di
        // calendario: non cambiano mai, e si possono tenere da parte per
        // sempre. Nei cicli del conguaglio venivano chiesti migliaia di volte,
        // e ogni volta costruivano una data per buttarla via subito.
        const GIORNI_MESE = new Map();
        const GIORNI_ANNO = new Map();

        function giorniDelMese(ym) {
            const k = String(ym);
            if (GIORNI_MESE.has(k)) return GIORNI_MESE.get(k);
            const [a, m] = k.split('-').map(Number);
            const n = (!a || !m) ? 30 : new Date(a, m, 0).getDate();
            GIORNI_MESE.set(k, n);
            return n;
        }

        // Giornate in cui si e' davvero lavorato in quel mese: nei riposi le
        // spese corrono lo stesso, ma non c'e' nessun incasso a coprirle.
        function giorniLavoratiDelMese(ym) {
            const giorni = new Set();
            (window.shifts || []).forEach(t => {
                if (!t.data || String(t.data).slice(0, 7) !== String(ym)) return;
                if (isRiposo(t)) return;
                giorni.add(String(t.data));
            });
            return giorni.size;
        }

        // A quale voce di budget corrisponde un movimento? Si guarda il nome, non
        // il prefisso, cosi' funzionano tutte e due le forme:
        //   "Costi fissi - Radio taxi - fattura di aprile"   (spesa di sola gestione)
        //   "Carburante - Q8 corso Francia"                  (spesa che ha gia' una
        //                                                     sua categoria)
        function nomeSpesaDiRecord(r) {
            const t = String(r && r.categoria || '').trim();
            if (!t) return '';
            let resto = /^costi fissi\b/i.test(t) ? t.replace(/^costi fissi\s*[-–:]?\s*/i, '') : t;
            const i = resto.indexOf(' - ');
            if (i > -1) resto = resto.slice(0, i);
            return resto.replace(/\s*\([^()]*\)\s*$/, '').trim();
        }

        // Chiave di confronto fra due nomi: senza accenti, senza maiuscole e senza
        // punteggiatura. Diversa dallo slug, che invece taglia a 24 caratteri per
        // stare in un identificativo: qui il taglio farebbe combaciare due voci
        // dal nome lungo e simile.
        // I nomi da confrontare sono una manciata - le categorie di spesa e le
        // voci di budget - ma passavano di qui migliaia di volte per disegno,
        // e ogni volta pagavano un normalize() e due espressioni regolari.
        // Il risultato dipende solo dal testo, quindi si tiene da parte.
        const CHIAVI_NOME = new Map();

        function chiaveNome(t) {
            const testo = String(t || '');
            const pronta = CHIAVI_NOME.get(testo);
            if (pronta !== undefined) return pronta;
            const k = testo.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
            // Un tetto, per un nome scritto a mano diverso ogni volta
            if (CHIAVI_NOME.size > 500) CHIAVI_NOME.clear();
            CHIAVI_NOME.set(testo, k);
            return k;
        }

        // Le voci di budget indicizzate per chiave: prima ogni spesa le scorreva
        // tutte ri-normalizzandone il nome, cioe' lo stesso lavoro rifatto per
        // ognuno dei movimenti dell'anno. L'indice si rifa' a ogni disegno, che
        // e' anche quando le voci possono essere cambiate.
        function indiceVociBudget() {
            return memo('indiceVociBudget', () => {
                const m = new Map();
                elencoVociFisse().forEach(v => {
                    const k = chiaveNome(v.nome);
                    if (k && !m.has(k)) m.set(k, v);
                });
                return m;
            });
        }

        function voceBudgetDiRecord(r) {
            if (!r || r.tipo !== 'USCITA') return null;
            const indice = indiceVociBudget();
            const cerca = (k) => k ? (indice.get(k) || null) : null;

            // 1. il nome scritto nel movimento, cosi' com'e'
            const diretta = cerca(chiaveNome(nomeSpesaDiRecord(r)));
            if (diretta) return diretta;

            // 2. la categoria a cui l'app riconduce la spesa. "Carburante /
            //    Diesel - Q8" e "Carburante - Eni" sono la stessa cosa, e il
            //    budget parla di carburante: senza questo passaggio una voce di
            //    budget non trovava i suoi movimenti solo perche' la categoria
            //    si chiama in un modo un po' diverso.
            const base = categoriaBase(r.categoria);
            if (base === 'Altro' || base === 'Costi fissi') return null;
            return cerca(chiaveNome(base));
        }

        // Le spese che il budget gia' prevede. Contarle anche come spesa reale
        // nella quota del giorno le conterebbe due volte: quando escono dal conto
        // finiscono nel conguaglio, non nella quota. Ci finiscono anche le vecchie
        // righe "Costi fissi" che non corrispondono piu' a nessuna voce: sarebbero
        // dei picchi mostruosi in un giorno solo.
        function copertaDalBudget(r) {
            if (categoriaBase(r && r.categoria) === 'Costi fissi') return true;
            const v = voceBudgetDiRecord(r);
            // La voce deve pesare davvero in quella data: se e' a zero, o se il suo
            // periodo non copre il giorno della spesa, il budget non la sta gia'
            // contando e la spesa va nella media come tutte le altre.
            return !!v && quotaVoceGiorno(v, String(r.data || '')) > 0;
        }

        // Le spese reali che il budget non copre: carburante, manutenzione,
        // lavaggio, ristoro, contributi. Si conoscono solo fino a oggi, quindi in
        // un mese ancora in corso si fa la media sui giorni gia' passati: dividerle
        // per trentuno le farebbe sembrare la meta' di quello che sono.
        function mediaAltreSpese(ym) {
            const gg = giorniDelMese(ym);
            let altre = 0, voci = 0;
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA') return;
                if (String(r.data || '').slice(0, 7) !== String(ym)) return;
                if (copertaDalBudget(r)) return;
                altre += parseFloat(r.importo || 0);
                voci++;
            });
            const oggi = oggiISO();
            const inCorso = String(ym) === oggi.slice(0, 7);
            const giorni = inCorso ? Math.min(gg, Math.max(1, Number(oggi.slice(8, 10)))) : gg;
            return { altre, voci, giorni, inCorso, quota: giorni ? altre / giorni : 0 };
        }

        // Quanto pesa davvero una giornata: il budget dei costi fissi di quel
        // giorno piu' la media delle altre spese del mese.
        function quotaDelGiorno(iso) {
            const ym = String(iso).slice(0, 7);
            const gg = giorniDelMese(ym);
            const budget = budgetDelGiorno(iso);
            const m = mediaAltreSpese(ym);
            const lavorati = giorniLavoratiDelMese(ym);
            // Spese della finestra considerata: il mese intero se e' finito,
            // i giorni gia' passati se e' ancora in corso.
            const speseFinestra = budgetPeriodo(`${ym}-01`, `${ym}-${String(m.giorni).padStart(2, '0')}`) + m.altre;
            return {
                ym, giorni: gg, giorniAltre: m.giorni, inCorso: m.inCorso, lavorati,
                budget, altre: m.quota, quota: budget + m.quota,
                totaleAltre: m.altre, budgetMese: budgetMese(ym),
                quotaLavorati: lavorati ? speseFinestra / lavorati : 0
            };
        }

        // Un costo fisso scritto come movimento dalle versioni precedenti
        // dell'app: ha un identificativo che comincia per "fissi-". E' quello che
        // si puo' raccogliere in una riga sola; una spesa scritta a mano no.
        function fissoGenerato(r) {
            return !!r && r.tipo === 'USCITA' && generataDallApp(r) && categoriaBase(r.categoria) === 'Costi fissi';
        }

        // Le vecchie versioni dell'app scrivevano i costi fissi come movimenti,
        // uno al mese o addirittura uno al giorno. Quelle righe restano dove sono
        // — sono la traccia di quello che hai pagato — ma nel registro si mostrano
        // raccolte in una riga sola, altrimenti le spese vere ci spariscono dentro.
        function fissiDaRaccogliere() {
            return !window.mostraFissi;
        }

        // Scrive la versione nella barra laterale: se qui non c'e' il numero che
        // ti aspetti, il telefono sta usando una copia vecchia tenuta in cache.
        function mostraVersione() {
            const el = document.getElementById('etichetta-versione');
            if (el) el.textContent = `Edizione Cloud · v${VERSIONE_APP}`;
            const nelMenu = document.getElementById('nome-nel-menu');
            if (nelMenu) nelMenu.textContent = profiloCompilato() ? nomeCompleto() : '';
            const pastiglia = document.getElementById('pastiglia-versione');
            if (pastiglia) pastiglia.textContent = `v${VERSIONE_APP}`;
            // Con la scheda compilata in cima c'e' il tuo nome: su un telefono
            // «TaxiManager» lo sai gia', mentre il nome dice con quale account
            // stai lavorando - e su un telefono che passa di mano conta.
            // Con la sigla accanto, il nome per intero non ci sta e viene tagliato
            // («Giuse…» a 320px). In cima serve riconoscersi, non leggere
            // l'anagrafe: con la sigla basta il nome di battesimo, e il cognome
            // resta nel titolo per chi ci passa sopra. Senza sigla, nome intero.
            const prof = window.profilo || {};
            const conSigla = !!String(prof.sigla || '').trim();
            const inCima = document.getElementById('nome-in-cima');
            if (inCima) {
                inCima.textContent = !profiloCompilato() ? 'TaxiManager'
                    : (conSigla ? (String(prof.nome || '').trim() || nomeCompleto()) : nomeCompleto());
                inCima.title = profiloCompilato() ? nomeCompleto() : 'TaxiManager';
                inCima.classList.toggle('text-lg', !conSigla);
                inCima.classList.toggle('text-base', conSigla);
            }
            // La sigla e il colore del turno: e' quello che identifica la vettura,
            // ed e' quello che si guarda al volo la mattina. Stanno in una
            // pastiglia sola - la sigla scritta dentro, colorata del turno -
            // perche' in cima a un telefono tre elementi staccati si
            // contenderebbero i pixel per dire una cosa sola.
            const targhetta = document.getElementById('sigla-in-cima');
            if (targhetta) {
                const sigla = String(prof.sigla || '').trim();
                const col = coloreTurno(prof.colore);
                targhetta.classList.toggle('hidden', !sigla && !col);
                targhetta.classList.toggle('flex', !!(sigla || col));
                if (sigla || col) {
                    // Senza sigla resta il pallino di prima: un rotondo colorato.
                    targhetta.textContent = sigla;
                    targhetta.classList.toggle('w-4', !sigla);
                    targhetta.classList.toggle('h-4', !sigla);
                    targhetta.classList.toggle('rounded-full', !sigla);
                    targhetta.classList.toggle('px-2.5', !!sigla);
                    targhetta.classList.toggle('py-1', !!sigla);
                    targhetta.style.background = col ? col.fondo : '#111827';
                    targhetta.style.color = col ? col.testo : '#fbbf24';
                    targhetta.style.borderColor = col ? col.bordo : '#111827';
                    targhetta.title = [sigla, col ? 'turno ' + col.nome.toLowerCase() : ''].filter(Boolean).join(' · ');
                }
            }
        }

        // Forza il passaggio alla versione nuova senza chiudere l'app: si chiede
        // al telefono di ricontrollare, e se ce n'e' una in attesa le si dice di
        // prendere il comando subito.
        async function aggiornaApp() {
            showToast('Cerco una versione nuova...');
            try {
                const reg = window.registrazioneSW
                    || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
                if (reg) {
                    await reg.update();
                    if (reg.waiting) {
                        reg.waiting.postMessage({ tipo: 'AGGIORNA_SUBITO' });
                        return;   // al cambio di comando la pagina si ricarica da sola
                    }
                }
            } catch (err) {
                console.warn('Controllo aggiornamento non riuscito:', err);
            }
            setTimeout(() => window.location.reload(), 400);
        }

        // Il confronto fra le due basi di calcolo e la soglia del forfettario si
        // guardano una volta l'anno col commercialista: tenerli sempre aperti
        // rendeva la scheda lunga il doppio di ogni altra.
        function alternaDettagliFiscali() {
            window.dettagliFiscali = !window.dettagliFiscali;
            try { localStorage.setItem('taxi_dettagli_fiscali', window.dettagliFiscali ? '1' : '0'); } catch (err) { /* pazienza */ }
            renderContent();
        }

        function alternaMostraFissi() {
            window.mostraFissi = !window.mostraFissi;
            renderContent();
        }

        function totaleImporti(elenco) {
            return (elenco || []).reduce((a, x) => a + parseFloat(x.importo || 0), 0);
        }

        // Riquadro che spiega quanto pesa ogni giorno e quanto serve incassare
        // per coprire tutto: e' il numero che dice se la giornata e' andata
        // davvero in attivo. Le spese ci sono tutte, non solo quelle fisse:
        // il pieno di gasolio e il tagliando servono per tutto il mese.
        function bloccoQuotaSpese(iso, incassiGiorno, usciteGiorno) {
            const q = quotaDelGiorno(iso);
            if (!(q.quota > 0)) return '';
            const mese = nomeMese(parseInt(q.ym.slice(5, 7), 10));
            const risultato = (incassiGiorno || 0) - q.quota;
            const speseOggi = usciteGiorno || 0;

            return `
                <div class="bg-white border border-indigo-100 rounded-[1.25rem] shadow-sm p-4">
                    <p class="etichetta block text-indigo-500">Quanto costa questa giornata</p>
                    <p class="mt-1.5"><span class="cifra text-[1.75rem] text-indigo-900">${cifraEuro(q.quota)}</span> <span class="text-sm font-bold text-indigo-400">al giorno</span></p>
                    <p class="text-[11px] font-medium text-indigo-400 mt-0.5">${mese} · budget ${formatCurrency(q.budgetMese)} + spese ${formatCurrency(q.totaleAltre)}${q.inCorso ? ' finora' : ''}</p>
                    <p class="text-[11px] font-medium text-indigo-400 mt-0.5">
                        a budget ${formatCurrency(q.budget)} + spese fuori budget ${formatCurrency(q.altre)}
                    </p>
                    <div class="grid grid-cols-2 gap-2.5 mt-3.5">
                        <div class="bg-indigo-50/70 rounded-xl p-3">
                            <p class="text-[10.5px] font-bold uppercase tracking-wider text-indigo-400">Pareggio</p>
                            <p class="text-[17px] font-black text-indigo-900 mt-0.5">${soldi(q.quota)}</p>
                        </div>
                        <div class="bg-indigo-50/70 rounded-xl p-3">
                            <p class="text-[10.5px] font-bold uppercase tracking-wider text-indigo-400">Sopra il pareggio</p>
                            <p class="text-[17px] font-black ${risultato >= 0 ? 'text-green-700' : 'text-red-600'} mt-0.5">${soldi(risultato)}</p>
                        </div>
                    </div>
                    ${(() => {
                        if (!(risultato > 0)) return '';
                        const acc = aliquotaAccantonamento(iso.slice(0, 4));
                        if (!(acc.perc > 0)) return '';
                        const alFisco = risultato * acc.perc;
                        return `
                            <div class="bg-indigo-50/70 rounded-xl p-3 mt-2.5">
                                <div class="flex flex-wrap items-baseline justify-between gap-2">
                                    <p class="text-xs font-black uppercase tracking-wider text-indigo-700">Di questo margine</p>
                                    <p class="text-xs font-bold text-indigo-400">
                                        accantonamento ${(acc.perc * 100).toFixed(0)}%${acc.auto ? ' · calcolato sulla stima di Spese &amp; Fisco' : ' · impostato da te'}
                                    </p>
                                </div>
                                <div class="grid grid-cols-2 gap-3 mt-1">
                                    <div>
                                        <p class="text-[10.5px] font-bold uppercase tracking-wider text-indigo-400">Da mettere da parte</p>
                                        <p class="text-[17px] font-black text-orange-600 mt-0.5">${soldi(alFisco)}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10.5px] font-bold uppercase tracking-wider text-indigo-400">Tuoi</p>
                                        <p class="text-[17px] font-black text-green-700 mt-0.5">${soldi(risultato - alFisco)}</p>
                                    </div>
                                </div>
                                <details class="mt-2">
                                    <summary class="text-xs font-black text-indigo-600 cursor-pointer select-none">Perché una parte è già del fisco</summary>
                                    <p class="text-xs text-indigo-500 mt-2 leading-relaxed">
                                        Le tasse non spostano il pareggio: a utile zero non se ne pagano. Cambiano quanto ti resta
                                        di quello che c'è <strong>sopra</strong> il pareggio. La percentuale è quella che costa
                                        l'euro guadagnato in più allo scaglione dove sei${acc.auto ? ', ricavata dall\'utile dell\'anno' : ''}.
                                    </p>
                                </details>
                            </div>`;
                    })()}
                    ${q.lavorati ? `
                        <p class="text-xs text-indigo-600 mt-2 leading-relaxed">
                            Sui ${q.lavorati} ${q.lavorati === 1 ? 'giorno' : 'giorni'} in cui hai davvero lavorato la quota sale a
                            <strong>${formatCurrency(q.quotaLavorati)}</strong>: nei riposi le spese corrono lo stesso, ma non c'è incasso a coprirle.
                        </p>` : ''}
                    <details class="mt-2">
                    <summary class="text-xs font-black text-indigo-600 cursor-pointer select-none">Come è fatto questo conto</summary>
                    <p class="text-xs text-indigo-500 mt-2 leading-relaxed">
                        Le voci a <strong>budget</strong> entrano qui a preventivo, non a fattura: pesano ogni giorno anche quando la spesa esce dal conto una volta l'anno.
                        Le altre sono le spese che hai registrato${speseOggi > 0 ? ` (in questa giornata ${formatCurrency(speseOggi)})` : ''}, divise per i giorni del mese: un tagliando serve per tutto il mese, non solo per il giorno in cui l'hai pagato.
                        È una lettura, non un movimento: i totali di mese e anno restano quelli veri.
                        ${q.inCorso ? `${mese} è ancora in corso, quindi le spese fuori budget sono la media dei primi ${q.giorniAltre} giorni.` : ''}
                    </p>
                    </details>
                </div>`;
        }

        function apertoPieghevole(chiave, apertoDiNorma) {
            try {
                const v = localStorage.getItem('taxi_apri_' + chiave);
                if (v !== null) return v === '1';
            } catch (e) { /* pazienza */ }
            return apertoDiNorma;
        }

        function ricordaPieghevole(chiave, aperto) {
            try { localStorage.setItem('taxi_apri_' + chiave, aperto ? '1' : '0'); } catch (e) { /* pazienza */ }
        }

        // Il filtro: «Tutti» mostra l'incrocio completo, un metodo solo isola
        // la sua colonna - comodo quando si sta trascrivendo una voce alla volta.
        function metodoCorrispettivi() {
            const v = window.metodoCorrisp;
            return METODI_CORRISPETTIVI.includes(v) ? v : 'ALL';
        }

        function cambiaMetodoCorrispettivi(v) {
            window.metodoCorrisp = v;
            try { localStorage.setItem('taxi_metodo_corrisp', v); } catch (e) { /* pazienza */ }
            renderContent();
        }

        function sezioneCorrispettivi(ym) {
            const c = corrispettiviMese(ym);
            const scelto = metodoCorrispettivi();
            const colonne = scelto === 'ALL' ? c.usati : (c.usati.includes(scelto) ? [scelto] : []);
            const [anno, mese] = ym.split('-').map(Number);

            const corpo = !c.righe.length
                ? `<p class="text-sm text-gray-400 p-5">Nessun incasso registrato in ${nomeMese(mese)} ${anno}.</p>`
                : !colonne.length
                    ? `<p class="text-sm text-gray-400 p-5">In ${nomeMese(mese)} non ci sono incassi ${METODI_BREVI[scelto] ? 'in ' + METODI_BREVI[scelto] : ''}.</p>`
                    : `
                    ${colonne.length > 2 ? '<p class="text-xs font-bold text-gray-400 px-4 pb-2 no-print">Scorri la tabella di lato per vedere tutti i metodi. La colonna del giorno resta ferma.</p>' : ''}
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                                <tr>
                                    <th class="px-3 py-2 text-left font-black col-ferma col-ferma-grigia">Giorno</th>
                                    ${colonne.map(k => `<th class="px-3 py-2 text-right font-black whitespace-nowrap">${METODI_BREVI[k]}</th>`).join('')}
                                    ${colonne.length > 1 ? '<th class="px-3 py-2 text-right font-black">Totale</th>' : ''}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${c.righe.filter(r => scelto === 'ALL' || r[scelto] > 0).map(r => `
                                    <tr>
                                        <td class="px-3 py-2 whitespace-nowrap col-ferma col-ferma-chiara">
                                            <button onclick="setDashGiorno('${r.iso}')" class="font-black text-gray-900 hover:text-yellow-600 tasto-minuto">
                                                ${String(r.giorno).padStart(2, '0')}/${String(mese).padStart(2, '0')}
                                            </button>
                                            <span class="block text-xs font-bold text-gray-400">${giornoBreve(r.iso)} · ${r.n} cors${r.n === 1 ? 'a' : 'e'}</span>
                                        </td>
                                        ${colonne.map(k => `<td class="px-3 py-2 text-right font-bold ${r[k] > 0 ? 'text-gray-900' : 'text-gray-300'} whitespace-nowrap">${formatCurrency(r[k])}</td>`).join('')}
                                        ${colonne.length > 1 ? `<td class="px-3 py-2 text-right font-black text-green-700 whitespace-nowrap">${formatCurrency(r.tot)}</td>` : ''}
                                    </tr>
                                `).join('')}
                            </tbody>
                            <tfoot class="bg-gray-900 text-white">
                                <tr>
                                    <td class="px-3 py-2 font-black text-yellow-400 whitespace-nowrap col-ferma col-ferma-scura">Totale ${nomeMese(mese)}</td>
                                    ${colonne.map(k => `<td class="px-3 py-2 text-right font-black whitespace-nowrap">${formatCurrency(c.totali[k])}</td>`).join('')}
                                    ${colonne.length > 1 ? `<td class="px-3 py-2 text-right font-black text-yellow-400 whitespace-nowrap">${formatCurrency(c.totali.tot)}</td>` : ''}
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    ${c.senzaIncasso > 0 ? `<p class="text-xs text-gray-400 px-5 pt-3">I giorni senza incassi non compaiono: in ${nomeMese(mese)} sono ${c.senzaIncasso} su ${c.giorniMese}.</p>` : ''}`;

            return `
                <details class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden print-card print-break" ${apertoPieghevole('corrisp', false) ? 'open' : ''} ontoggle="ricordaPieghevole('corrisp', this.open)">
                    <summary class="flex flex-wrap items-center justify-between gap-2 p-5 cursor-pointer select-none">
                        <div>
                            <h3 class="text-lg font-black text-gray-900">Corrispettivi giorno per giorno</h3>
                            <p class="text-xs text-gray-500">Quanto hai incassato ogni data, diviso per come hanno pagato.</p>
                        </div>
                        <span class="text-xs font-black text-gray-400 no-print">apri / chiudi</span>
                    </summary>
                    <div class="border-t border-gray-100">
                        ${c.usati.length > 1 ? `
                        <div class="flex flex-wrap gap-2 p-4 no-print">
                            <button onclick="cambiaMetodoCorrispettivi('ALL')" class="px-4 py-2 rounded-xl text-xs font-black transition-colors ${scelto === 'ALL' ? 'bg-gray-900 text-yellow-400' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">Tutti</button>
                            ${c.usati.map(k => `
                                <button onclick="cambiaMetodoCorrispettivi('${k}')" class="px-4 py-2 rounded-xl text-xs font-black transition-colors ${scelto === k ? 'bg-gray-900 text-yellow-400' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">${ETICHETTE_METODO[k].split(' ')[0]} ${METODI_BREVI[k]}</button>
                            `).join('')}
                        </div>` : ''}
                        ${corpo}
                        ${c.righe.length ? `
                        <div class="p-4 no-print">
                            <button onclick="scaricaCorrispettivi('${ym}')" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2.5 px-4 rounded-xl text-sm">
                                📊 Scarica questo prospetto (.csv)
                            </button>
                            <p class="text-xs text-gray-400 mt-2">Si apre in Excel o Numeri, con la virgola decimale e il punto e virgola come separatore.</p>
                        </div>` : ''}
                    </div>
                </details>`;
        }

        // Lo stesso prospetto in un foglio di calcolo: chi compila i corrispettivi
        // al computer se lo tiene aperto accanto invece di leggerlo dal telefono.
        function scaricaCorrispettivi(ym) {
            const c = corrispettiviMese(ym);
            if (!c.righe.length) { showToast('Non ci sono incassi in questo mese.'); return; }
            const colonne = c.usati;
            const righe = [['Data', ...colonne.map(k => METODI_BREVI[k]), 'Totale', 'Corse']];
            c.righe.forEach(r => righe.push([
                ggMmAaaa(r.iso),
                ...colonne.map(k => r[k].toFixed(2).replace('.', ',')),
                r.tot.toFixed(2).replace('.', ','),
                String(r.n)
            ]));
            righe.push([
                'TOTALE',
                ...colonne.map(k => c.totali[k].toFixed(2).replace('.', ',')),
                c.totali.tot.toFixed(2).replace('.', ','),
                String(c.totali.n)
            ]);
            const csv = righe.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            scaricaFile(blob, `TaxiManager_Corrispettivi_${ym}.csv`);
            showToast(`Prospetto di ${ym} scaricato!`);
        }

        function boxDato(etichetta, valore, classe) {
            return `
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                    <p class="text-[10.5px] font-bold uppercase tracking-wider text-gray-400 mb-0.5">${etichetta}</p>
                    <p class="text-base sm:text-lg font-black ${classe || 'text-gray-900'} leading-tight">${valore}</p>
                </div>`;
        }

        // ============================================================
        //  RENDIMENTO
        //  Incrocia gli incassi giornalieri con il turno svolto e con il
        //  giorno della settimana: sono dati gia' presenti, mai messi a confronto.
        // ============================================================
        function statsRendimento() {
            const perData = {};
            recordsAnno().forEach(r => {
                if (r.tipo !== 'ENTRATA') return;
                if (!perData[r.data]) perData[r.data] = { tot: 0, n: 0 };
                perData[r.data].tot += parseFloat(r.importo || 0);
                perData[r.data].n++;
            });

            const perTurno = {};
            const giorniConTurno = {};
            turniAnno().filter(t => !isRiposo(t)).forEach(t => {
                giorniConTurno[t.data] = true;
                const g = perData[t.data] || { tot: 0, n: 0 };
                const k = t.turno || 'Personalizzato';
                if (!perTurno[k]) perTurno[k] = { nome: k, gg: 0, tot: 0, n: 0, ore: 0 };
                perTurno[k].gg++;
                perTurno[k].tot += g.tot;
                perTurno[k].n += g.n;
                perTurno[k].ore += parseFloat(t.ore || 0);
            });

            // Giornate con incassi ma senza turno registrato: le tengo separate
            // invece di attribuirle a un turno che non risulta da nessuna parte.
            Object.keys(perData).forEach(d => {
                if (giorniConTurno[d]) return;
                const k = 'Senza turno registrato';
                if (!perTurno[k]) perTurno[k] = { nome: k, gg: 0, tot: 0, n: 0, ore: 0 };
                perTurno[k].gg++;
                perTurno[k].tot += perData[d].tot;
                perTurno[k].n += perData[d].n;
            });

            const listaTurni = Object.keys(perTurno).map(k => {
                const v = perTurno[k];
                return {
                    nome: v.nome, gg: v.gg, tot: v.tot, ore: v.ore,
                    perGg: v.gg ? v.tot / v.gg : 0,
                    perOra: v.ore ? v.tot / v.ore : 0,
                    corseGg: v.gg ? v.n / v.gg : 0,
                    perCorsa: v.n ? v.tot / v.n : 0
                };
            }).sort((a, b) => b.perOra - a.perOra);

            const NOMI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
            const settimana = NOMI.map(n => ({ nome: n, gg: 0, tot: 0, n: 0 }));
            Object.keys(perData).forEach(d => {
                const [a, m, gi] = d.split('-').map(Number);
                const idx = new Date(a, m - 1, gi).getDay();
                settimana[idx].gg++;
