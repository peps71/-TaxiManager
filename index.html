        window.annoPuliziaFissi = '';
        // Approfondimenti fiscali aperti o chiusi: resta com'e' stato lasciato
        window.dettagliFiscali = localStorage.getItem('taxi_dettagli_fiscali') === '1';
        // Voce di budget aperta in modifica (slug, oppure null = tutte chiuse)
        window.voceFissaInModifica = null;
        window.isCloudSyncing = false;
        // Impostazioni fiscali per Regime Ordinario (configurabili dall'utente in "Cloud & Sync")
        window.fiscalSettings = Object.assign(
            // accantonamentoPerc vuoto = calcolato da solo sulla stima delle tasse
            { inpsPerc: 24, addizionaliPerc: 2, sogliaForfettario: 85000, accantonamentoPerc: null },
            leggiLocale('taxi_fiscal_settings', {})
        );

        // ============================================================
        //  SALVATAGGIO LOCALE DI RISERVA
        //  Le versioni "vere" di queste funzioni stanno nel blocco Firebase e
        //  salvano in locale E sul Cloud: quando quel blocco parte, sostituisce
        //  quelle qui sotto. Se pero' il codice di Firebase non si scarica
        //  (nessun campo al primo avvio, CDN irraggiungibile), senza queste
        //  l'app si apriva ma non riusciva a registrare niente: ogni tentativo
        //  di salvare una corsa finiva in errore.
        // ============================================================

        // Chi ha fatto l'accesso al Cloud (null = nessuno, si lavora in locale).
        // Lo riempie il blocco Firebase quando l'accesso va a buon fine.
        window.cloudUtente = null;

        // Se il codice di Firebase non si scarica, i pulsanti dell'accesso devono
        // dire perche' invece di dare errore.
        window.entraConGoogle = function() {
            if (window.showToast) window.showToast('Cloud non raggiungibile: senza rete l\'app funziona in locale.');
        };
        window.esciDalCloud = function() {};

        function scriviLocale(chiave, valore) {
            try {
                localStorage.setItem(chiave, JSON.stringify(valore));
            } catch (err) {
                console.warn('Salvataggio locale non riuscito:', chiave, err);
                if (window.showToast) window.showToast('⚠️ Memoria del telefono piena: libera spazio.');
            }
        }

        function perData(a, b) {
            return String(b.data || '').localeCompare(String(a.data || ''));
        }

        window.saveRecordToCloud = function(record) {
            window.dailyRecords.unshift(record);
            window.dailyRecords.sort(perData);
            scriviLocale('taxi_records', window.dailyRecords);
        };

        window.saveShiftToCloud = function(shift) {
            window.shifts.unshift(shift);
            window.shifts.sort(perData);
            scriviLocale('taxi_shifts', window.shifts);
        };

        window.deleteRecordFromCloud = function(id) {
            window.dailyRecords = (window.dailyRecords || []).filter(r => String(r.id) !== String(id));
            scriviLocale('taxi_records', window.dailyRecords);
        };

        window.deleteRecordsFromCloud = async function(ids) {
            const insieme = new Set((ids || []).map(String));
            window.dailyRecords = (window.dailyRecords || []).filter(r => !insieme.has(String(r.id)));
            scriviLocale('taxi_records', window.dailyRecords);
        };

        window.deleteShiftFromCloud = function(id) {
            window.shifts = (window.shifts || []).filter(x => String(x.id) !== String(id));
            scriviLocale('taxi_shifts', window.shifts);
        };

        // Scadenze e veicoli sono gia' scritti in locale dalle rispettive
        // salvaScadenze() / salvaVeicoli(): qui non serve altro
        window.saveScadenzaToCloud = function() {};
        window.deleteScadenzaFromCloud = function() {};
        window.saveVeicoloToCloud = function() {};
        window.deleteVeicoloFromCloud = function() {};
        window.saveVoceFissaToCloud = function() {};
        window.deleteVoceFissaFromCloud = function() {};

        window.bulkSave = async function(newRecords, newShifts) {
            const unisci = (esistenti, nuovi) => {
                const mappa = new Map();
                (esistenti || []).forEach(x => mappa.set(String(x.id), x));
                (nuovi || []).forEach(x => mappa.set(String(x.id), x));
                return Array.from(mappa.values()).sort(perData);
            };
            window.dailyRecords = unisci(window.dailyRecords, newRecords);
            window.shifts = unisci(window.shifts, newShifts);
            scriviLocale('taxi_records', window.dailyRecords);
            scriviLocale('taxi_shifts', window.shifts);
            return { cloud: false };
        };

        window.wipeAllData = async function() {
            window.dailyRecords = [];
            window.shifts = [];
            scriviLocale('taxi_records', []);
            scriviLocale('taxi_shifts', []);
        };

        // Numero massimo di righe mostrate nelle tabelle (i totali restano sempre completi)
        const LIMITE_RIGHE = 300;

        // Categorie di spesa piu' comuni per un tassista: si scelgono con un tap invece di
        // scrivere ogni volta a mano (ed evitano che "Carburante"/"carburante" spacchino i report).
        const CATEGORIE_USCITA = ['Carburante', 'Ristoro', 'Lavaggio', 'Manutenzione', 'Assicurazione', 'Radio taxi', 'Bollo / Tasse auto', 'Parcheggio / Pedaggio', 'Multa', 'Commercialista'];

        // Le voci di budget da aggiungere al menu delle spese. Quelle che hanno
        // gia' una categoria loro (Carburante, Manutenzione) restano dove sono:
        // spostarle sotto "Costi fissi" le toglierebbe dal costo al chilometro
        // delle vetture e dalle caselle fiscali. Il conguaglio le riconosce dal
        // nome, quindi vanno bene tutte e due le forme.
        function vociBudgetNelMenu() {
            const standard = new Set(CATEGORIE_USCITA.map(c => chiaveNome(c)));
            return elencoVociFisse()
                .filter(v => String(v.nome || '').trim())
                .filter(v => !standard.has(chiaveNome(v.nome)));
        }

        // Colore della barretta di ogni categoria di spesa nei riepiloghi
        const COLORI_CATEGORIA = {
            'Carburante': 'bg-orange-500',
            'Manutenzione': 'bg-amber-600',
            'Lavaggio': 'bg-sky-500',
            'Assicurazione': 'bg-indigo-500',
            'Radio taxi': 'bg-purple-500',
            'Bollo / Tasse auto': 'bg-rose-500',
            'Parcheggio / Pedaggio': 'bg-teal-500',
            'Multa': 'bg-red-600',
            'Commercialista': 'bg-lime-600',
            'Ristoro': 'bg-cyan-500',
            'Costi fissi': 'bg-slate-500',
            'Altro': 'bg-gray-400'
        };

        function coloreCategoria(nome) {
            return COLORI_CATEGORIA[nome] || 'bg-gray-400';
        }

        // Secondo livello di dettaglio: dalla stringa salvata alla tipologia di spesa.
        // "Costi fissi - Radio taxi (31 gg x 10,50 €)"  -> "Radio taxi"
        // "Costi fissi - Finanziamento licenza (rata mensile)" -> "Finanziamento licenza"
        // "Costi fissi - Rata tassametro (rata mensile dal 10/07)" -> "Rata tassametro"
        // "Carburante - Q8 corso Francia"               -> "Q8 corso Francia"
        // "Carburante / Diesel (233362 Km)"             -> "Carburante / Diesel"
        // "Finanziamento licenza (70.000 € x 10 anni) (31 gg x 26,60 €)" -> tiene la prima parentesi
        function sottocategoria(testo) {
            let t = String(testo || '').trim();
            if (!t) return 'Senza descrizione';
            const i = t.indexOf(' - ');
            if (i > -1) t = t.slice(i + 3).trim();
            // via solo le code automatiche: conteggio giorni e chilometraggio
            t = t.replace(/\s*\(\s*\d+\s*gg[^()]*\)\s*$/i, '').trim();
            t = t.replace(/\s*\(\s*rata mensile[^()]*\)\s*$/i, '').trim();
            t = t.replace(/\s*\([^()]*\bkm\b[^()]*\)\s*$/i, '').trim();
            return t || 'Senza descrizione';
        }

        // Raggruppa un elenco di movimenti per tipologia, dal piu' pesante al piu' leggero
        // Il carburante si paga in tanti modi - contanti al distributore, POS, fattura
        // Q8, app - e le diciture scritte a mano moltiplicano le righe: nove voci
        // quasi uguali per dire la stessa cosa. Quello che conta e' come e' stato
        // pagato: contanti da una parte, e dall'altra tutto cio' che passa dal conto.
        function raggruppaPerPagamento(voci) {
            const m = {
                'Contanti': { nome: 'Contanti', tot: 0, n: 0, ultima: '' },
                'POS / Fattura': { nome: 'POS / Fattura', tot: 0, n: 0, ultima: '' }
            };
            (voci || []).forEach(v => {
                const g = m[famigliaMetodo(v.metodo) === 'Contanti' ? 'Contanti' : 'POS / Fattura'];
                g.tot += parseFloat(v.importo || 0) || 0;
                g.n++;
                if (String(v.data) > String(g.ultima)) g.ultima = v.data;
            });
            return Object.values(m).filter(g => g.n).sort((a, b) => b.tot - a.tot);
        }

        function raggruppaPerSottocategoria(voci) {
            const m = {};
            (voci || []).forEach(v => {
                const nome = sottocategoria(v.categoria);
                if (!m[nome]) m[nome] = { nome, tot: 0, n: 0, ultima: v.data };
                m[nome].tot += parseFloat(v.importo || 0);
                m[nome].n++;
                if (String(v.data) > String(m[nome].ultima)) m[nome].ultima = v.data;
            });
            return Object.values(m).sort((a, b) => b.tot - a.tot);
        }

        function raggruppaPerTipologia(voci) {
            // Le voci di un gruppo appartengono tutte alla stessa categoria di base:
            // basta la prima per sapere dove siamo.
            if (!(voci || []).length) return [];
            const base = categoriaBase(voci[0].categoria);
            // Carburante: le diciture non distinguono niente, conta solo il pagamento.
            if (base === 'Carburante') return raggruppaPerPagamento(voci);

            // Tutte le altre: le tipologie dicono cosa hai comprato (tagliando,
            // gomme, carrozzeria) e restano. In coda, staccato, quanto e' andato in
            // contanti e quanto e' passato dal conto. Solo se ci sono tutti e due i
            // modi: altrimenti sarebbe la stessa cifra scritta una seconda volta.
            const perTipo = raggruppaPerSottocategoria(voci);
            const pagamenti = raggruppaPerPagamento(voci);
            if (pagamenti.length > 1) {
                return perTipo.concat(pagamenti.map(g => Object.assign({}, g, { pagamento: true })));
            }
            return perTipo;
        }

        // Le spese sono salvate come "Categoria - nota" (es. "Carburante - Q8 corso Francia").
        // Qui si torna alla sola categoria, cosi' i totali si raggruppano anche quando
        // la nota cambia ogni volta.
        function categoriaBase(testo) {
            const t = String(testo || '').trim();
            if (!t) return 'Altro';
            const b = t.toLowerCase();
            if (b.startsWith('costi fissi')) return 'Costi fissi';
            if (b.includes('carburante') || b.includes('diesel') || b.includes('benzina') || b.includes('gpl') || b.includes('metano')) return 'Carburante';
            const trovata = CATEGORIE_USCITA.find(c => b.startsWith(c.toLowerCase()));
            return trovata || 'Altro';
        }

        // Il testo scritto dall'utente (descrizione di una spesa, nome di una scadenza)
        // e i dati che arrivano dal Cloud o da un backup finiscono dentro l'HTML.
        // Senza questa conversione bastava un apice o una parentesi angolare nella nota
        // (un apice, una virgoletta, un segno di minore) per spezzare il markup: il campo di modifica
        // si troncava e la riga si rompeva. Convertendo i caratteri speciali il testo
        // resta esattamente quello scritto e non puo' diventare codice della pagina.
        function esc(v) {
            return String(v === null || v === undefined ? '' : v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Stessa cosa per i valori passati dentro un onclick="funzione('...')":
        // prima si proteggono apice e barra rovescia per il JavaScript, poi il tutto
        // viene convertito per l'HTML.
        function escJs(v) {
            return esc(String(v === null || v === undefined ? '' : v)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'"));
        }

        // Un solo messaggio alla volta: senza azzerare il timer precedente, due avvisi
        // ravvicinati facevano sparire il secondo dopo una frazione di secondo.
        let timerToast = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toast-text');
            if (!toast || !text) return;
            text.textContent = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            if (timerToast) clearTimeout(timerToast);
            timerToast = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
                timerToast = null;
            }, 3000);
        }

        // ============================================================
        //  IL FORMATTATORE SI COSTRUISCE UNA VOLTA SOLA
        //  Intl.NumberFormat e' caro da costruire e gratis da riusare:
        //  misurato, ventimila importi costano 613 ms costruendolo ogni volta
        //  e 11 ms riusandolo - cinquantaquattro volte tanto. E una schermata
        //  di questa app formatta centinaia di importi per disegno, perche'
        //  ogni corsa, ogni riga di spesa e ogni casella ne ha uno.
        // ============================================================
        const FORMATO_EURO = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
        const FORMATO_NUMERO = new Intl.NumberFormat('it-IT');

        const FORMATO_SOLDI = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        const formatCurrency = (val) => FORMATO_EURO.format(val || 0);
        const numeroIT = (val) => FORMATO_NUMERO.format(val || 0);
        // Un importo senza il simbolo: dove la colonna dice gia' di che si
        // tratta («Spese», «Ti resta»), tre euro ripetuti sono tre macchie.
        const soldi = (val) => FORMATO_SOLDI.format(val || 0);
        // L'importo con il simbolo piu' piccolo e piu' chiaro del numero:
        // quello che si legge da lontano e' la cifra, non il simbolo.
        const cifraEuro = (val) => {
            const t = FORMATO_EURO.format(val || 0);
            const i = t.search(/[\u00a0\s]?\u20ac/);
            return i < 0 ? esc(t)
                : esc(t.slice(0, i)) + '<span class="cifra-euro">\u20ac</span>';
        };

        // Stile badge colorato per metodo di pagamento: verde=Contanti, nero=POS, rosso=Satispay, blu=App/altri importi
        function metodoBadgeClass(metodo) {
            switch (famigliaMetodo(metodo)) {
                case 'Contanti':  return 'bg-green-100 text-green-800 border border-green-300';
                case 'POS':       return 'bg-gray-900 text-white border border-gray-900';
                case 'Satispay':  return 'bg-red-100 text-red-800 border border-red-300';
                default:          return 'bg-blue-100 text-blue-800 border border-blue-300';
            }
        }

        // ============================================================
        //  LA SCHEDA DEL TASSISTA
        //  Lo stesso modulo serve due volte: la prima, come benvenuto, appena
        //  entrato; le altre, da «Backup e impostazioni», per correggere.
        //  Un modulo solo perche' i campi sono gli stessi, e due copie
        //  finirebbero per divergere - e' gia' successo in questa app.
        // ============================================================
        const CAMPI_PROFILO = [
            { id: 'nome',     etichetta: 'Nome',            segno: 'Es. Giuseppe',      largo: false },
            { id: 'cognome',  etichetta: 'Cognome',         segno: 'Es. Rossi',         largo: false },
            { id: 'licenza',  etichetta: 'Numero di licenza', segno: 'Es. 1234',        largo: false },
            { id: 'sigla',    etichetta: 'Sigla',           segno: 'Es. Torino 57',     largo: false },
            { id: 'piva',     etichetta: 'Partita IVA',     segno: '11 cifre',          largo: true  }
        ];

        function moduloProfiloHTML(titolo, sottotitolo, etichettaTasto) {
            const p = {};
            CAMPI_PROFILO.forEach(c => p[c.id] = valoreProfilo(c.id));
            p.colore = valoreProfilo('colore');
            return `
                <div class="space-y-4">
                    <div>
                        <h3 class="text-lg font-black text-gray-900">${esc(titolo)}</h3>
                        <p class="text-xs text-gray-500 leading-relaxed mt-1">${sottotitolo}</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${CAMPI_PROFILO.map(c => `
                            <div class="${c.largo ? 'sm:col-span-2' : ''}">
                                <label for="prof-${c.id}" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-1">${esc(c.etichetta)}</label>
                                <input type="text" id="prof-${c.id}" value="${esc(p[c.id] || '')}" placeholder="${esc(c.segno)}"
                                       ${c.id === 'piva' ? 'inputmode="numeric" maxlength="11"' : ''}
                                       autocomplete="off"
                                       class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 font-bold text-gray-900" />
                            </div>
                        `).join('')}
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2">Colore del turno</label>
                        <div class="flex flex-wrap gap-2" role="group" aria-label="Colore del turno">
                            ${COLORI_TURNO.map(c => {
                                const scelto = (p.colore || '') === c.id;
                                return `<button type="button" onclick="scegliColoreTurno('${c.id}')"
                                        aria-pressed="${scelto}"
                                        class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-sm transition-all ${scelto ? 'ring-2 ring-offset-2 ring-gray-900' : 'opacity-70 hover:opacity-100'}"
                                        style="background:${c.fondo};color:${c.testo};border:2px solid ${c.bordo}">
                                        ${esc(c.nome)}${scelto ? ' ✓' : ''}
                                    </button>`;
                            }).join('')}
                            <button type="button" onclick="scegliColoreTurno('')" aria-pressed="${!p.colore}"
                                    class="px-4 py-2.5 rounded-xl font-black text-sm border-2 transition-colors ${!p.colore ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'}">
                                Nessuno
                            </button>
                        </div>
                        <p class="text-xs text-gray-400 mt-2">È il colore scritto sulla licenza, quello che dice quali giorni tocca lavorare.</p>
                    </div>

                    <p id="prof-avviso" class="text-xs font-bold text-gray-400"></p>
                    <button onclick="salvaProfiloDalModulo()" class="bg-gray-900 hover:bg-gray-800 text-yellow-400 font-black py-3 px-6 rounded-xl shadow-sm transition-colors">
                        ${esc(etichettaTasto)}
                    </button>
                </div>`;
        }

        // Il colore si sceglie toccando, e il modulo si ridisegna per farlo
        // vedere acceso: quello che hai gia' battuto va tenuto, o si
        // perderebbe il nome. Ma va tenuto in una BOZZA, non nel profilo vero:
        // scrivendolo nel profilo, il riquadro di benvenuto sparirebbe appena
        // scelto il colore - perche' a quel punto risulterebbe gia' compilato -
        // e ti troveresti il modulo chiuso in faccia senza aver salvato niente.
        window.bozzaProfilo = null;

        function valoreProfilo(campo) {
            const b = window.bozzaProfilo;
            if (b && b[campo] !== undefined) return b[campo];
            return (window.profilo || {})[campo] || '';
        }

        function raccogliBozzaProfilo() {
            const b = Object.assign({}, window.bozzaProfilo);
            CAMPI_PROFILO.forEach(c => {
                const el = document.getElementById('prof-' + c.id);
                if (el) b[c.id] = el.value;
            });
            window.bozzaProfilo = b;
            return b;
        }

        function scegliColoreTurno(id) {
            const b = raccogliBozzaProfilo();
            b.colore = id;
            window.bozzaProfilo = b;
            renderContent();
        }

        function salvaProfiloDalModulo() {
            const leggi = (id) => (document.getElementById('prof-' + id) || {}).value || '';
            const dati = {};
            CAMPI_PROFILO.forEach(c => dati[c.id] = String(leggi(c.id)).trim());
            dati.colore = valoreProfilo('colore');
            dati.piva = dati.piva.replace(/\D/g, '');

            if (!dati.nome && !dati.cognome) {
                showToast('Scrivi almeno il nome, così l\'app sa chi sei.');
                return;
            }
            // La partita IVA sbagliata non blocca il salvataggio - potresti non
            // averla sottomano - ma lo dice, perche' finisce sui documenti.
            const pivaStorta = dati.piva && !partitaIvaValida(dati.piva);
            salvaProfilo(dati);
            window.bozzaProfilo = null;   // salvata: la bozza non serve piu'
            showToast(pivaStorta
                ? '✅ Scheda salvata. Controlla la partita IVA: le 11 cifre non tornano.'
                : `✅ Ciao ${esc(dati.nome || dati.cognome)}, scheda salvata!`);
            renderNav();
            renderContent();
        }

        // Le voci del menu «che spesa e'»: le categorie di sempre piu' le voci di
        // budget che non ne hanno una loro. Stava scritta due volte, nel modulo
        // completo e nella spesa lampo, e le due copie erano gia' divergenti -
        // una passava le categorie da esc(), l'altra no.
        function opzioniCategoriaSpesa(conAltro) {
            const scelta = window.ultimaCategoriaUscita || 'Carburante';
            const base = CATEGORIE_USCITA
                .map(c => `<option value="${esc(c)}" ${scelta === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
            const voci = vociBudgetNelMenu();
            const fissi = !voci.length ? '' : `<optgroup label="Costi fissi (vanno nel conguaglio)">
                    ${voci.map(v => {
                        const val = `Costi fissi - ${String(v.nome).trim()}`;
                        return `<option value="${esc(val)}" ${window.ultimaCategoriaUscita === val ? 'selected' : ''}>${esc(v.nome)}</option>`;
                    }).join('')}
                </optgroup>`;
            return base + fissi + (conAltro ? '<option value="__altro__">✏️ Altro (scrivi tu)</option>' : '');
        }

        // Opzioni del menu metodo, condivise da form di inserimento e modifica in riga
        function opzioniMetodo(selezionato, tipo) {
            const voci = tipo === 'USCITA'
                ? [['Contanti', '🟢 Contanti'], ['POS', '⚫ POS / Carta'], ['Satispay', '🔴 Satispay'],
                   ['Carta Carburante', '🔵 Carta Carburante'], ['Fattura', '🔵 Fattura'], ['Bonifico', '🔵 Bonifico']]
                : [['Contanti', '🟢 Contanti'], ['POS', '⚫ POS / Carta'], ['Satispay', '🔴 Satispay'],
                   ['App/Nexi', '🔵 App / Voucher'], ['Fattura', '🔵 Fattura / Convenzione']];
            return voci.map(([v, l]) => `<option value="${v}" ${selezionato === v ? 'selected' : ''}>${l}</option>`).join('');
        }

        // Aliquote IRPEF a scaglioni. Dal 2026 il secondo scaglione scende dal 35% al 33%
        // (Legge di Bilancio 2026, L. 199/2025); per gli anni precedenti resta il 35%.
        function aliquotaSecondoScaglione(anno) {
            return parseInt(anno, 10) >= 2026 ? 0.33 : 0.35;
        }

        function calcolaIRPEF(imponibile, anno) {
            if (imponibile <= 0) return 0;
            const a2 = aliquotaSecondoScaglione(anno || annoAttivo());
            if (imponibile <= 28000) return imponibile * 0.23;
            if (imponibile <= 50000) return 28000 * 0.23 + (imponibile - 28000) * a2;
            return 28000 * 0.23 + 22000 * a2 + (imponibile - 50000) * 0.43;
        }

        // Stima tasse per Regime Ordinario: Contributi INPS (deducibili) + IRPEF a scaglioni + Addizionali
        function calcolaTasseOrdinario(utileLordo, anno) {
            return memo('tasse:' + utileLordo + ':' + anno, () => calcolaTasseOrdinarioCalcola(utileLordo, anno));
        }

        function calcolaTasseOrdinarioCalcola(utileLordo, anno) {
            const fs = window.fiscalSettings || { inpsPerc: 24, addizionaliPerc: 2 };
            const contributiInps = utileLordo > 0 ? utileLordo * (fs.inpsPerc / 100) : 0;
            const imponibileIrpef = Math.max(0, utileLordo - contributiInps);
            const irpef = calcolaIRPEF(imponibileIrpef, anno);
            const addizionali = imponibileIrpef * (fs.addizionaliPerc / 100);
            return {
                contributiInps, irpef, addizionali, imponibileIrpef,
                tasseTot: contributiInps + irpef + addizionali
            };
        }

        // ------------------------------------------------------------
        //  ACCANTONAMENTO SUL MARGINE
        //  L'IRPEF non e' un costo fisso: e' una percentuale sull'utile, e a
        //  utile zero non si paga. Quindi non sposta il pareggio della giornata,
        //  ma dice quanta parte di quello che c'e' sopra il pareggio non e' tua.
        //  La percentuale giusta non e' quella media dell'anno: e' quella che
        //  costa l'euro guadagnato in piu' - lo scaglione in cui ti trovi.
        // ------------------------------------------------------------

        // L'utile su cui si contano le tasse: gli incassi meno le sole spese
        // deducibili, cioe' quelle pagate in modo tracciato. Le spese in
        // contanti restano spese vere - tolgono soldi dalla cassa - ma non
        // abbassano l'imponibile, quindi qui non entrano.
        function utileFiscaleAnno(anno) {
            let entrate = 0, deducibili = 0;
            (window.dailyRecords || []).forEach(r => {
                if (String(r.data || '').slice(0, 4) !== String(anno)) return;
                const imp = parseFloat(r.importo || 0) || 0;
                if (r.tipo === 'ENTRATA') entrate += imp;
                else if (r.tipo === 'USCITA' && metodoTracciato(r.metodo)) deducibili += imp;
            });
            return entrate - deducibili;
        }

        // A meta' anno l'utile registrato e' meta' di quello che sara': se lo
        // prendessimo com'e', lo scaglione risulterebbe piu' basso del vero.
        // Si annualizza solo quello che e' stato registrato fino a oggi, poi si
        // tiene il piu' alto fra la proiezione e quello che c'e' scritto: cosi'
        // le spese e gli incassi con data futura non falsano il conto.
        function utileProiettato(anno) {
            return memo('utileProiettato:' + anno, () => utileProiettatoCalcola(anno));
        }

        function utileProiettatoCalcola(anno) {
            const totale = utileFiscaleAnno(anno);
            const oggi = oggiISO();
            if (String(anno) !== oggi.slice(0, 4)) return totale;
            let entrate = 0, deducibili = 0;
            (window.dailyRecords || []).forEach(r => {
                const d = String(r.data || '');
                if (d.slice(0, 4) !== String(anno) || d > oggi) return;
                const imp = parseFloat(r.importo || 0) || 0;
                if (r.tipo === 'ENTRATA') entrate += imp;
                else if (r.tipo === 'USCITA' && metodoTracciato(r.metodo)) deducibili += imp;
            });
            const trascorsi = Math.max(1, Math.round((new Date(oggi) - new Date(`${anno}-01-01`)) / 86400000) + 1);
            // Nei primi due mesi annualizzare e' un azzardo: tre giorni moltiplicati
            // per trecentosessantacinque. Finche' l'anno e' cosi' giovane, l'utile
            // dell'anno scorso e' la stima migliore che abbiamo dello scaglione.
            if (trascorsi < 60) {
                const scorso = utileFiscaleAnno(String(Number(anno) - 1));
                if (scorso > 0) return Math.max(totale, scorso);
            }
            // Senza un anno prima a cui appoggiarsi si annualizza lo stesso, ma non
            // si moltiplica mai per piu' di dodici: un gennaio fortunato non deve
            // spedire l'accantonamento nello scaglione piu' alto.
            const fattore = Math.min(giorniDellAnno(anno) / trascorsi, giorniDellAnno(anno) / 30);
            return Math.max(totale, (entrate - deducibili) * fattore);
        }

        function aliquotaAccantonamento(anno) {
            return memo('accantonamento:' + anno, () => aliquotaAccantonamentoCalcola(anno));
        }

        function aliquotaAccantonamentoCalcola(anno) {
            const a = String(anno || annoAttivo());
            const scritta = parseFloat((window.fiscalSettings || {}).accantonamentoPerc);
            if (Number.isFinite(scritta) && scritta >= 0) {
                return { perc: Math.min(0.95, scritta / 100), auto: false };
            }
            const utile = Math.max(0, utileProiettato(a));
            const passo = 1000;
            const qui = calcolaTasseOrdinario(utile, a).tasseTot;
            const su = calcolaTasseOrdinario(utile + passo, a).tasseTot;
            const perc = (su - qui) / passo;
            return { perc: Math.min(0.95, Math.max(0, perc)), auto: true };
        }

        // Riga "voce ... importo" usata nel prospetto delle tasse
        function rigaFiscale(etichetta, valore, opzioni) {
            const o = opzioni || {};
            return `
                <div class="flex justify-between items-baseline gap-3 py-1.5 ${o.bordo ? 'border-t-2 border-gray-300 mt-1 pt-2' : 'border-b border-gray-100'}">
                    <span class="${o.forte ? 'font-black text-gray-900' : 'font-medium text-gray-600'} text-sm">${etichetta}</span>
                    <span class="font-black ${o.classe || 'text-gray-900'} text-sm whitespace-nowrap">${valore}</span>
                </div>`;
        }

        // ============================================================
        //  ANNO DI ESERCIZIO
        //  Tutta l'app lavora su un anno alla volta: le tasse si calcolano
        //  per anno solare, quindi sommare piu' anni darebbe numeri falsi.
        // ============================================================

        function anniDisponibili() {
            const anni = new Set();
            (window.dailyRecords || []).forEach(r => { if (r.data) anni.add(String(r.data).slice(0, 4)); });
            (window.shifts || []).forEach(t => { if (t.data) anni.add(String(t.data).slice(0, 4)); });
            anni.add(String(new Date().getFullYear()));
            return Array.from(anni).sort();
        }

        function annoAttivo() {
            if (!window.annoScelto) {
                const anni = anniDisponibili();
                const corrente = String(new Date().getFullYear());
                window.annoScelto = anni.includes(corrente) ? corrente : anni[anni.length - 1];
            }
            return window.annoScelto;
        }

        function cambiaAnno(val) {
            window.annoScelto = val;
            if (typeof renderNav === 'function') setTimeout(renderNav, 0);
            // I selettori di giorno e mese devono ricadere nell'anno scelto
            window.dashGiorno = null;
            window.dashMese = null;
            window.filterGiornoUscite = null;  // si riposiziona sull'anno scelto
            ricordaGiornoGiornate('');         // il giorno di un altro anno non c'entra piu'
            window.giornataAperta = null;
            window.annoScadenze = null;        // il calendario scadenze segue l'anno scelto
            renderContent();
        }

        function nellAnno(x) {
            return x && x.data && String(x.data).slice(0, 4) === annoAttivo();
        }

        function recordsAnno() {
            return (window.dailyRecords || []).filter(nellAnno);
        }

        function turniAnno() {
            return (window.shifts || []).filter(nellAnno);
        }

        function getStats() {
            let entrate = 0, uscite = 0, deducibili = 0;
            recordsAnno().forEach(r => {
                const imp = parseFloat(r.importo || 0) || 0;
                if (r.tipo === 'ENTRATA') entrate += imp;
                if (r.tipo === 'USCITA') {
                    uscite += imp;
                    if (metodoTracciato(r.metodo)) deducibili += imp;
                }
            });
            // Due utili, e non sono la stessa cosa:
            // - di cassa: quello che ti resta davvero, tolte tutte le spese;
            // - fiscale: la base delle tasse, tolte le sole spese deducibili.
            const utileCassa = entrate - uscite;
            const utileFiscale = entrate - deducibili;
            const fiscale = calcolaTasseOrdinario(utileFiscale);
            const tasse = fiscale.tasseTot;
            return {
                entrate, uscite,
                deducibili, nonDeducibili: uscite - deducibili,
                utileCassa, utileFiscale,
                tasse, fiscale, netto: utileCassa - tasse
            };
        }

        function saveFiscalSettings() {
            const inps = numeroScritto(document.getElementById('set-inps').value);
            const add = numeroScritto(document.getElementById('set-add').value);
            const campoSoglia = document.getElementById('set-soglia');
            const soglia = campoSoglia ? numeroScritto(campoSoglia.value) : (window.fiscalSettings.sogliaForfettario || 85000);
            if (isNaN(inps) || isNaN(add) || inps < 0 || add < 0 || isNaN(soglia) || soglia <= 0) {
                showToast('Valori non validi.');
                return;
            }
            // Lasciato vuoto: l'accantonamento se lo calcola l'app.
            const campoAcc = document.getElementById('set-accantonamento');
            const scritto = campoAcc ? String(campoAcc.value).trim() : '';
            let accantonamento = null;
            if (scritto !== '') {
                accantonamento = numeroScritto(scritto);
                if (!Number.isFinite(accantonamento) || accantonamento < 0 || accantonamento > 95) {
                    showToast('L\'accantonamento va da 0 a 95, oppure lascialo vuoto.');
                    return;
                }
            }
            window.fiscalSettings = { inpsPerc: inps, addizionaliPerc: add, sogliaForfettario: soglia, accantonamentoPerc: accantonamento };
            localStorage.setItem('taxi_fiscal_settings', JSON.stringify(window.fiscalSettings));
            showToast('⚡ Impostazioni fiscali salvate!');
            renderContent();
        }

        // Un singolo scenario di calcolo: da un imponibile di partenza alle tasse stimate
        function scenarioTasse(incassi, uscite, anno) {
            const utile = incassi - uscite;
            const f = calcolaTasseOrdinario(utile, anno);
            return {
                incassi, uscite, utile,
                contributiInps: f.contributiInps,
                imponibileIrpef: f.imponibileIrpef,
                irpef: f.irpef,
                addizionali: f.addizionali,
                tasse: f.tasseTot,
                netto: utile - f.tasseTot
            };
        }

        // Quanto manca alla soglia di uscita dal Regime Forfettario, sull'anno attivo.
        function statsForfettario() {
            return memo('forfettario', () => statsForfettarioCalcola());
        }

        function statsForfettarioCalcola() {
            const fs = window.fiscalSettings || {};
            const soglia = fs.sogliaForfettario || 85000;
            const entrate = recordsAnno().filter(r => r.tipo === 'ENTRATA').reduce((a, r) => a + parseFloat(r.importo || 0), 0);
            const pct = soglia > 0 ? Math.min(100, (entrate / soglia) * 100) : 0;
            return { soglia, entrate, pct, vicino: entrate >= soglia * 0.85 };
        }

        // Totali essenziali di un anno, per il confronto anno su anno
        function totaliAnno(anno) {
            let entrate = 0, uscite = 0, corse = 0, ore = 0, giorni = new Set();
            (window.dailyRecords || []).forEach(r => {
                if (!r.data || String(r.data).slice(0, 4) !== anno) return;
                const imp = parseFloat(r.importo || 0);
                if (r.tipo === 'ENTRATA') { entrate += imp; corse++; giorni.add(r.data); }
                else uscite += imp;
            });
            (window.shifts || []).forEach(t => {
                if (!t.data || String(t.data).slice(0, 4) !== anno || isRiposo(t)) return;
                ore += parseFloat(t.ore || 0);
            });
            return { anno, entrate, uscite, saldo: entrate - uscite, corse, ore, giorni: giorni.size };
        }

        // ============================================================
        //  SCADENZE (revisione, RCA, bollo, tassametro, licenza...)
        //  Salvate in locale e sincronizzate sul Cloud come corse e turni,
        //  cosi' si vedono da tutti i dispositivi collegati.
        // ============================================================

        function salvaScadenze() {
            try { localStorage.setItem('taxi_scadenze', JSON.stringify(window.scadenze || [])); } catch (err) { /* spazio esaurito: pazienza */ }
        }

        // Scadenze ricorrenti: revisione, bollo, RCA, verifica del tassametro.
        // Non generano righe una per una: nel calendario dell'anno compaiono
        // tutte le date che toccano, e si spuntano li'. Niente si sposta per
        // conto suo: una scadenza passata e non spuntata deve restare rossa.
        const CADENZE_SCADENZA = [
            { id: '3mesi',  etichetta: 'ogni 3 mesi',  mesi: 3 },
            { id: '6mesi',  etichetta: 'ogni 6 mesi',  mesi: 6 },
            { id: 'anno',   etichetta: 'ogni anno',    mesi: 12 },
            { id: '2anni',  etichetta: 'ogni 2 anni',  mesi: 24 },
            { id: '3anni',  etichetta: 'ogni 3 anni',  mesi: 36 },
            { id: '5anni',  etichetta: 'ogni 5 anni',  mesi: 60 },
            { id: '10anni', etichetta: 'ogni 10 anni', mesi: 120 }
        ];

        function cadenzaScadenza(sc) {
            return CADENZE_SCADENZA.find(x => x.id === (sc && sc.cadenza)) || null;
        }

        // La prima data utile dopo oggi, contata sempre dalla data di partenza:
        // cosi' una scadenza del 31 resta del 31 anche dopo essere passata da
        // febbraio. Se una ricorrente e' rimasta indietro di anni, si salta
        // avanti quanto serve invece di proporre un'altra data gia' passata.
        function ancoraScadenza(sc) {
            return (sc && (sc.ancora || sc.data)) || '';
        }

        // Tutte le date che una scadenza tocca dentro un anno: per l'INPS, che
        // torna ogni 3 mesi, sono le quattro rate dell'anno. Una scadenza non
        // ricorrente conta solo se cade in quell'anno.
        function occorrenzeAnno(sc, anno) {
            if (!sc || !sc.data) return [];
            const da = `${anno}-01-01`, al = `${anno}-12-31`;
            const c = cadenzaScadenza(sc);
            if (!c || !(c.mesi > 0)) return (sc.data >= da && sc.data <= al) ? [sc.data] : [];
            const base = ancoraScadenza(sc);
            // «La prima data della serie e' in ancora»: prima di li' la serie non
            // esisteva. Il conto qui sotto, per non perdere i bordi dell'anno,
            // genera un giro in piu' da una parte e dall'altra, e quello prima
            // dell'ancora finiva nel calendario come se fosse dovuto. Un
            // promemoria creato oggi per fra tre mesi compariva «da fare oggi».
            // Restano solo le date pre-ancora su cui c'e' scritto qualcosa
            // (spuntate, o spostate a mano): quelle sono storia vera.
            const registrate = (sc.occorrenze || {});
            const [annoBase, meseBase] = base.split('-').map(Number);
            const meseAncora = annoBase * 12 + (meseBase - 1);
            const kDa = Math.floor((Number(anno) * 12 - meseAncora) / c.mesi) - 1;
            const kAl = Math.ceil((Number(anno) * 12 + 11 - meseAncora) / c.mesi) + 1;
            const date = [];
            for (let k = kDa; k <= kAl; k++) {
                const d = aggiungiMesi(base, c.mesi * k);
                if (d < da || d > al) continue;
                if (d < base && !registrate[d]) continue;
                date.push(d);
            }
            return date;
        }

        // Cosa e' successo a una singola occorrenza: se e' stata spuntata come
        // fatta e se quell'anno cadeva in un giorno diverso da quello teorico.
        function occorrenzaInfo(sc, teorica) {
            const o = ((sc && sc.occorrenze) || {})[teorica] || {};
            return { teorica, data: o.data || teorica, fatta: !!o.fatta };
        }

        // Il calendario dell'anno: una riga per ogni data di ogni scadenza.
        function calendarioScadenze(anno) {
            const oggi = oggiISO();
            const voci = [];
            (window.scadenze || []).forEach(sc => {
                occorrenzeAnno(sc, anno).forEach(teorica => {
                    const info = occorrenzaInfo(sc, teorica);
                    const giorni = Math.round((new Date(info.data) - new Date(oggi)) / 86400000);
                    voci.push({
                        id: sc.id, nome: sc.nome, cadenza: cadenzaScadenza(sc),
                        teorica, data: info.data, fatta: info.fatta,
                        giorniMancanti: giorni, scaduta: !info.fatta && giorni < 0
                    });
                });
            });
            return voci.sort((a, b) => a.data.localeCompare(b.data));
        }

        function addScadenza(e) {
            e.preventDefault();
            const nome = (document.getElementById('scad-nome').value || '').trim();
            const data = document.getElementById('scad-data').value;
            if (!nome || !data) {
                showToast('Inserisci nome e data della scadenza.');
                return;
            }
            window.scadenze = window.scadenze || [];
            const nuova = { id: nuovoId(), nome, data };
            const spunta = document.getElementById('scad-ripeti');
            if (spunta && spunta.checked) {
                const scelta = (document.getElementById('scad-cadenza') || {}).value || '';
                if (CADENZE_SCADENZA.some(c => c.id === scelta)) {
                    nuova.cadenza = scelta;
                    // La prima data della serie non si tocca piu': tutte le altre si
                    // contano da qui. Se contassimo dall'ultima, una scadenza del 31
                    // passata da febbraio diventerebbe del 28 per sempre.
                    nuova.ancora = data;
                }
            }
            window.scadenze.push(nuova);
            window.scadenze.sort((a, b) => String(a.data).localeCompare(String(b.data)));
            salvaScadenze();
            if (window.saveScadenzaToCloud) window.saveScadenzaToCloud(nuova);
            showToast('⚡ Scadenza aggiunta.');
            renderContent();
        }

        // ============================================================
        //  IL PROMEMORIA DEL BACKUP
        //  Le tre copie automatiche vivono nello stesso account Google
        //  dell'app: bastano per un guaio tuo - una giornata cancellata, un
        //  telefono perso - ma non per la perdita dell'account. Un file .json
        //  scaricato ogni tanto su iCloud o su una chiavetta e' l'unica copia
        //  che non dipende da Google.
        //  Il promemoria non lo puo' mettere nessuno al posto tuo: le scadenze
        //  stanno nei tuoi dati. Qui c'e' il tasto che lo crea, e si accorge
        //  se c'e' gia' invece di farne due uguali.
        // ============================================================
        const NOME_PROMEMORIA_BACKUP = 'Scarica il backup dei dati';

        function promemoriaBackupEsistente() {
            return (window.scadenze || []).find(x => chiaveNome(x.nome) === chiaveNome(NOME_PROMEMORIA_BACKUP)) || null;
        }

        function creaPromemoriaBackup() {
            const gia = promemoriaBackupEsistente();
            if (gia) {
                showToast('Il promemoria c\'è già: lo trovi in «Scadenze».');
                switchTab('scadenze');
                return;
            }
            // Fra tre mesi: il primo giro lo si fa adesso scaricando il backup,
            // quindi non ha senso che scada oggi.
            const d = new Date();
            d.setMonth(d.getMonth() + 3);
            const data = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            const nuova = { id: nuovoId(), nome: NOME_PROMEMORIA_BACKUP, data, cadenza: '3mesi', ancora: data };
            window.scadenze = window.scadenze || [];
            window.scadenze.push(nuova);
            window.scadenze.sort((a, b) => String(a.data).localeCompare(String(b.data)));
            salvaScadenze();
            if (window.saveScadenzaToCloud) window.saveScadenzaToCloud(nuova);
            showToast(`⚡ Promemoria creato: te lo ricordo il ${ggMmAaaa(data)}, e poi ogni tre mesi.`);
            renderContent();
        }

        function deleteScadenza(id) {
            const sc = (window.scadenze || []).find(x => String(x.id) === String(id));
            const c = cadenzaScadenza(sc);
            const domanda = c
                ? `Elimino "${sc.nome}" e tutte le sue date, ${c.etichetta}?`
                : (sc ? `Elimino la scadenza "${sc.nome}" del ${ggMmAaaa(sc.data)}?` : '');
            if (sc && !confirm(domanda)) return;
            window.scadenze = (window.scadenze || []).filter(s => String(s.id) !== String(id));
            salvaScadenze();
            if (window.deleteScadenzaFromCloud) window.deleteScadenzaFromCloud(id);
            showToast('Scadenza eliminata.');
            renderContent();
        }

        function trovaScadenza(id) {
            return (window.scadenze || []).find(x => String(x.id) === String(id)) || null;
        }

        function registraScadenza(sc) {
            window.scadenze.sort((a, b) => String(a.data).localeCompare(String(b.data)));
            salvaScadenze();
            if (window.saveScadenzaToCloud) window.saveScadenzaToCloud(sc);
        }

        // ------------------------------------------------------------
        //  Calendario dell'anno: le singole date si spuntano e si spostano
        //  senza toccare la serie. Quello che cambia resta scritto sulla
        //  scadenza, sotto "occorrenze", con la data teorica come chiave:
        //  cosi' l'anno dopo la serie riparte pulita da dove deve.
        // ------------------------------------------------------------

        function segnaFatta(sc, teorica, fatta) {
            if (!sc || !teorica) return;
            sc.occorrenze = sc.occorrenze || {};
            const o = sc.occorrenze[teorica] || {};
            if (fatta) o.fatta = true; else delete o.fatta;
            if (o.fatta || o.data) sc.occorrenze[teorica] = o;
            else delete sc.occorrenze[teorica];
        }

        // Dopo una spunta la riga in elenco si rimette sulla prima data ancora da
        // fare. Non salta le rate arretrate non pagate: si parte dalla piu'
        // vecchia fra quella in corso e quella appena toccata e si va avanti.
        function riallineaScadenza(sc, teorica) {
            const c = cadenzaScadenza(sc);
            const base = ancoraScadenza(sc);
            if (!c || !base) return;
            const partenza = String(sc.data) < String(teorica) ? String(sc.data) : String(teorica);
            for (let k = 0; k <= 400; k++) {
                const d = aggiungiMesi(base, c.mesi * k);
                if (d < partenza) continue;
                const info = occorrenzaInfo(sc, d);
                if (info.fatta) continue;
                sc.data = info.data;
                return;
            }
        }

        function spuntaOccorrenza(id, teorica) {
            const sc = trovaScadenza(id);
            if (!sc) return;
            segnaFatta(sc, teorica, !occorrenzaInfo(sc, teorica).fatta);
            riallineaScadenza(sc, teorica);
            registraScadenza(sc);
            renderContent();
        }

        // Quell'anno la rata cade in un giorno diverso: si sposta la singola
        // data, non la serie. Rimettendo la data teorica l'eccezione sparisce.
        function spostaOccorrenza(id, teorica, nuova) {
            const sc = trovaScadenza(id);
            if (!sc || !nuova) { renderContent(); return; }
            sc.occorrenze = sc.occorrenze || {};
            const o = sc.occorrenze[teorica] || {};
            if (nuova === teorica) delete o.data; else o.data = nuova;
            if (o.fatta || o.data) sc.occorrenze[teorica] = o;
            else delete sc.occorrenze[teorica];
            // La riga in elenco segue lo spostamento solo se era quella in corso.
            if (String(sc.data) === String(teorica)) sc.data = nuova;
            registraScadenza(sc);
            showToast(`${sc.nome}: spostata al ${ggMmAaaa(nuova)}.`);
            renderContent();
        }

        // Le date gia' spuntate spariscono dal calendario: quello che serve e'
        // quello che resta da fare. Restano a un tocco, per andare a controllare
        // se una l'hai davvero pagata.
        function mostraFatteScadenze() {
            if (window.scadFatteVisibili === undefined) {
                try { window.scadFatteVisibili = localStorage.getItem('taxi_scad_fatte') === '1'; }
                catch (err) { window.scadFatteVisibili = false; }
            }
            return window.scadFatteVisibili;
        }

        function alternaFatteScadenze() {
            window.scadFatteVisibili = !mostraFatteScadenze();
            try { localStorage.setItem('taxi_scad_fatte', window.scadFatteVisibili ? '1' : '0'); }
            catch (err) { /* spazio esaurito: pazienza */ }
            renderContent();
        }

        // Anno mostrato nel calendario: si sfoglia avanti e indietro senza
        // cambiare l'anno di esercizio di tutta l'app.
        function annoCalendario() {
            if (!window.annoScadenze) window.annoScadenze = annoAttivo();
            return String(window.annoScadenze);
        }

        function scorriAnnoScadenze(delta) {
            window.annoScadenze = String(Number(annoCalendario()) + delta);
            renderContent();
        }

        // Le scadenze non ricorrenti dell'anno prima che quest'anno non ci sono:
        // quelle segnate una volta sola, che vanno riproposte a mano.
        function daRiproporre(anno) {
            const prima = String(Number(anno) - 1);
            const giaCi = new Set();
            (window.scadenze || []).forEach(s => {
                if (occorrenzeAnno(s, anno).length) giaCi.add(chiaveNome(s.nome));
            });
            return (window.scadenze || [])
                .filter(s => !cadenzaScadenza(s) && String(s.data).slice(0, 4) === prima)
                .filter(s => !giaCi.has(chiaveNome(s.nome)))
                .map(s => ({ id: s.id, nome: s.nome, data: aggiungiMesi(s.data, 12) }));
        }

        function riproponiSelezionate(anno) {
            const righe = Array.from(document.querySelectorAll('[data-riproponi]'));
            const scelte = righe.filter(r => (r.querySelector('input[type=checkbox]') || {}).checked);
            if (!scelte.length) { showToast('Non hai selezionato nessuna scadenza.'); return; }
            window.scadenze = window.scadenze || [];
            const nuove = [];
            scelte.forEach(r => {
                const nome = r.getAttribute('data-nome') || '';
                const data = (r.querySelector('input[type=date]') || {}).value || '';
                if (!nome || !data) return;
                const nuova = { id: nuovoId(), nome, data };
                window.scadenze.push(nuova);
                nuove.push(nuova);
            });
            if (!nuove.length) { showToast('Manca la data di qualche scadenza.'); return; }
            window.scadenze.sort((a, b) => String(a.data).localeCompare(String(b.data)));
            salvaScadenze();
            if (window.saveScadenzaToCloud) nuove.forEach(x => window.saveScadenzaToCloud(x));
            showToast(`⚡ ${nuove.length} ${nuove.length === 1 ? 'scadenza riproposta' : 'scadenze riproposte'} nel ${anno}.`);
            renderContent();
        }

        // Riquadro della ricorrenza nel form: si apre con la spunta e l'anteprima
        // si scrive a mano nel paragrafo, senza ridisegnare la pagina (un
        // renderContent() qui cancellerebbe il nome appena digitato).
        function onScadRipetiChange() {
            const spunta = document.getElementById('scad-ripeti');
            const box = document.getElementById('scad-ripeti-box');
            if (!spunta || !box) return;
            box.classList.toggle('hidden', !spunta.checked);
            aggiornaAnteprimaScadenza();
        }

        function aggiornaAnteprimaScadenza() {
            const p = document.getElementById('scad-anteprima');
            if (!p) return;
            const spunta = document.getElementById('scad-ripeti');
            if (!spunta || !spunta.checked) { p.textContent = ''; return; }
            const data = (document.getElementById('scad-data') || {}).value || '';
            const scelta = (document.getElementById('scad-cadenza') || {}).value || '';
            const c = CADENZE_SCADENZA.find(x => x.id === scelta);
            if (!data) { p.textContent = 'Scegli prima la data della scadenza.'; return; }
            if (!c) { p.textContent = ''; return; }
            p.textContent = `Dopo il ${ggMmAaaa(data)} tocca il ${ggMmAaaa(aggiungiMesi(data, c.mesi))}, `
                + `poi il ${ggMmAaaa(aggiungiMesi(data, c.mesi * 2))}.`;
        }

        // Ordina per data crescente e calcola i giorni mancanti da oggi.
        // ============================================================
        //  LO STATO VERO DELLE SCADENZE
        //  Le tre caselle in cima e l'avviso rosso guardavano la data scritta
        //  nella scheda della scadenza. Per una scadenza che si ripete quella
        //  data non e' la prossima volta: e' l'ancora della serie - il punto
        //  da cui si contano i giri. Con l'assicurazione ancorata al 7 ottobre
        //  e il bollo al 31, l'app diceva «prossima: Bollo Auto» mentre il
        //  calendario, che le occorrenze le calcola davvero, mostrava
        //  l'assicurazione prima. E «entro 30 giorni: 0» con una scadenza a
        //  ventun giorni.
        //  Qui si contano le occorrenze vere, quelle del calendario, su tre
        //  anni: l'anno scorso per le arretrate rimaste da fare, quest'anno, e
        //  l'anno prossimo perche' a dicembre la prossima cade oltre capodanno.
        // ============================================================
        function statoScadenze() {
            return memo('statoScadenze', () => statoScadenzeCalcola());
        }
        function statoScadenzeCalcola() {
            const anno = Number(oggiISO().slice(0, 4));
            const voci = [];
            [anno - 1, anno, anno + 1].forEach(a => voci.push(...calendarioScadenze(String(a))));
            const daFare = voci.filter(v => !v.fatta).sort((x, y) => x.data.localeCompare(y.data));

            // Una scadenza che si ripete ha tante occorrenze quanti sono i giri.
            // Di quelle passate e mai spuntate conta l'ultima, non tutte: il
            // bollo del 2025 non e' una seconda cosa da fare oltre a quello del
            // 2026, e' la stessa cosa in ritardo. Se no bastava non spuntare per
            // un anno per ritrovarsi l'avviso rosso pieno di doppioni.
            const arretrata = new Map();   // per scadenza: l'ultima occorrenza passata
            const futura = new Map();      // per scadenza: la prima che deve ancora arrivare
            daFare.forEach(v => {
                if (v.giorniMancanti < 0) arretrata.set(v.id, v);
                else if (!futura.has(v.id)) futura.set(v.id, v);
            });
            const perData = (x, y) => x.data.localeCompare(y.data);
            const prossime = Array.from(futura.values()).sort(perData);
            return {
                scadute: Array.from(arretrata.values()).sort(perData),
                vicine: prossime.filter(v => v.giorniMancanti <= 30),
                prossima: prossime[0] || null
            };
        }

        function scadenzeOrdinate() {
            return memo('scadenzeOrdinate', () => scadenzeOrdinateCalcola());
        }

        function scadenzeOrdinateCalcola() {
            const oggi = oggiISO();
            return (window.scadenze || []).slice().sort((a, b) => String(a.data).localeCompare(String(b.data))).map(s => {
                const giorni = Math.round((new Date(s.data) - new Date(oggi)) / 86400000);
                return Object.assign({}, s, { giorniMancanti: giorni, scaduta: giorni < 0, vicina: giorni >= 0 && giorni <= 30 });
            });
        }


        // ============================================================
        //  PARCO AUTO
        //  Ogni vettura con quello che e' costata e quello che ha reso.
        //  I km non si riscrivono a mano: quelli percorsi si ricavano dal
        //  contachilometri dei turni, e le spese del periodo sono quelle
        //  gia' registrate nel Registro Uscite.
        // ============================================================

        const ALIMENTAZIONI = ['Diesel', 'Benzina', 'GPL', 'Metano', 'Ibrida', 'Ibrida plug-in', 'Elettrica', 'Altro'];

        const USCITE_VEICOLO = {
            'in-uso':       'Ancora in uso',
            'venduta':      'Venduta',
            'permutata':    'Data in permuta',
            'rottamata':    'Rottamata',
            'incidente':    'Distrutta in un incidente',
            'fine-leasing': 'Restituita a fine leasing'
        };

        // Categorie di spesa che riguardano la vettura: sono quelle che entrano
        // nel costo al chilometro. Restano fuori radio taxi, commercialista e
        // ristoro, che ci sarebbero con qualsiasi auto, e i costi fissi: li' dentro
        // c'e' il finanziamento della licenza, che con la vettura non c'entra.
        // Fuori anche le rate di un eventuale finanziamento dell'auto: quanto e'
        // costata la vettura sta gia' nella differenza fra prezzo di acquisto e
        // valore di realizzo, e sommarci le rate sarebbe contarla due volte.
        const CATEGORIE_AUTO = ['Carburante', 'Manutenzione', 'Lavaggio', 'Assicurazione',
                                'Bollo / Tasse auto', 'Parcheggio / Pedaggio', 'Multa'];

        function salvaVeicoli() {
            try { localStorage.setItem('taxi_veicoli', JSON.stringify(window.veicoli || [])); } catch (err) { /* spazio esaurito: pazienza */ }
        }

        // Converte in cifra un numero scritto a mano. Accetta l'euro, gli spazi,
        // la virgola decimale e il punto delle migliaia: "6.500" e' seimilacinque-
        // cento, "10.50" e' dieci e cinquanta. Si distinguono dai gruppi di tre
        // cifre, che sono migliaia solo se sono esattamente tre fino in fondo.
        // Senza questo, scrivere 6.500 € di carburante dava sei euro e mezzo.
        function numeroScritto(v) {
            let t = String(v === null || v === undefined ? '' : v)
                .trim()
                .replace(/[€\s\u00a0']/g, '');
            if (!t) return NaN;
            if (t.includes(',')) {
                // virgola decimale: i punti sono per forza separatori di migliaia
                t = t.replace(/\./g, '').replace(',', '.');
            } else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) {
                t = t.replace(/\./g, '');
            }
            return parseFloat(t);
        }

        // Come si scrive un importo dentro un campo che aspetta la virgola.
        // Con toFixed() uscirebbe «18.50» proprio nel campo a cui si chiede
        // «18,50»: una contraddizione a video, e un numero che il tastierino
        // del telefono non sa nemmeno ribattere.
        // Le ore come le scrive un italiano: 12 h, non 12.0 h; 9,5 h, non 9.5 h.
        function oreScritte(n) {
            const v = Number(n) || 0;
            return (Math.round(v * 10) % 10 === 0 ? String(Math.round(v)) : v.toFixed(1).replace('.', ','));
        }

        // L'ora in cui la riga e' stata scritta, non l'ora della corsa: se una
        // corsa la segni la sera per la mattina, qui c'e' la sera. E' quello che
        // serve davvero - ritrovare l'ordine in cui hai battuto le cose, e
        // riconoscere una riga sbagliata fra due uguali.
        function oraDiAdesso() {
            const d = new Date();
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function importoScritto(v) {
            const n = numeroScritto(v);
            return Number.isFinite(n) ? n.toFixed(2).replace('.', ',') : '';
        }

        function numeroOpzionale(v) {
            const n = numeroScritto(v);
            return Number.isFinite(n) ? n : null;
        }

        function inUso(v) { return !v.dataUscita; }

        // Vetture dalla piu' recente alla piu' vecchia, con quella in uso in cima
        function veicoliOrdinati() {
            return (window.veicoli || []).slice().sort((a, b) => {
                if (inUso(a) !== inUso(b)) return inUso(a) ? -1 : 1;
                return String(b.dataAcquisto || '').localeCompare(String(a.dataAcquisto || ''));
            });
        }

        // Contachilometri piu' alto registrato nei turni dentro un periodo:
        // serve per sapere a che punto e' l'auto ancora in uso, senza doverlo
        // riscrivere a mano da qualche parte.
        function kmMassimoNelPeriodo(da, a) {
            let massimo = null;
            (window.shifts || []).forEach(t => {
                if (isRiposo(t) || !t.data) return;
                if (da && String(t.data) < da) return;
                if (a && String(t.data) > a) return;
                [t.kmInizio, t.kmFine].forEach(k => {
                    const n = numeroOpzionale(k);
                    if (n !== null && n > 0 && (massimo === null || n > massimo)) massimo = n;
                });
            });
            return massimo;
        }

        // Tutti i conti di una vettura: km, perdita di valore, spese del periodo
        // e quanto viene a costare ogni chilometro.
        function statsVeicolo(v) {
            const da = v.dataAcquisto || '';
            const a = v.dataUscita || oggiISO();

            const kmAcq = numeroOpzionale(v.kmAcquisto);
            const kmUsc = numeroOpzionale(v.kmUscita);
            const kmOggi = inUso(v) ? kmMassimoNelPeriodo(da, a) : null;
            const kmFinali = kmUsc !== null ? kmUsc : kmOggi;
            const kmPercorsi = (kmAcq !== null && kmFinali !== null && kmFinali >= kmAcq) ? kmFinali - kmAcq : null;

            const prezzoAcq = numeroOpzionale(v.prezzoAcquisto);
            const realizzo = numeroOpzionale(v.valoreUscita);
            const stimato = numeroOpzionale(v.valoreStimato);
            // Per un'auto venduta la perdita e' certa; per una ancora in uso si
            // puo' calcolare solo se hai indicato quanto vale oggi, a occhio.
            const valoreFinale = inUso(v) ? stimato : realizzo;
            const perdita = (prezzoAcq !== null && valoreFinale !== null) ? prezzoAcq - valoreFinale : null;
            const perditaStimata = inUso(v) && perdita !== null;

            // Spese del periodo di possesso, prese dai movimenti gia' registrati
            const perCategoria = {};
            let speseTot = 0, incassi = 0;
            (window.dailyRecords || []).forEach(r => {
                if (!r.data || String(r.data) < da || String(r.data) > a) return;
                const imp = parseFloat(r.importo || 0);
                if (r.tipo === 'ENTRATA') { incassi += imp; return; }
                if (r.tipo !== 'USCITA') return;
                const base = categoriaBase(r.categoria);
                if (!CATEGORIE_AUTO.includes(base)) return;
                perCategoria[base] = (perCategoria[base] || 0) + imp;
                speseTot += imp;
            });

            const giorni = da ? Math.max(1, giorniTraDate(da, a)) : null;
            const anni = giorni ? giorni / 365.25 : null;

            const costoTot = (perdita !== null ? perdita : 0) + speseTot;
            const perKm = (x) => (kmPercorsi && kmPercorsi > 0 && x !== null) ? x / kmPercorsi : null;

            return {
                da, a, giorni, anni,
                kmAcq, kmFinali, kmPercorsi, kmOggi,
                kmAnno: (kmPercorsi !== null && anni) ? kmPercorsi / anni : null,
                prezzoAcq, valoreFinale, perdita, perditaStimata,
                speseTot, incassi,
                categorie: Object.keys(perCategoria)
                    .map(k => ({ nome: k, totale: perCategoria[k] }))
                    .sort((x, y) => y.totale - x.totale),
                costoTot,
                perditaKm: perKm(perdita),
                speseKm: perKm(speseTot),
                costoKm: perKm(costoTot)
            };
        }

        function giorniTraDate(da, a) {
            const [a1, m1, g1] = String(da).split('-').map(Number);
            const [a2, m2, g2] = String(a).split('-').map(Number);
            if (!a1 || !a2) return 0;
            return Math.round((Date.UTC(a2, m2 - 1, g2) - Date.UTC(a1, m1 - 1, g1)) / 86400000);
        }

        // Due vetture possedute nello stesso momento: le spese di quei giorni
        // finirebbero contate su entrambe. Meglio dirlo che far tornare i conti
        // per finta.
        function periodiSovrapposti() {
            const elenco = (window.veicoli || []).filter(v => v.dataAcquisto);
            const coppie = [];
            for (let i = 0; i < elenco.length; i++) {
                for (let j = i + 1; j < elenco.length; j++) {
                    const x = elenco[i], y = elenco[j];
                    const fineX = x.dataUscita || '9999-12-31';
                    const fineY = y.dataUscita || '9999-12-31';
                    if (x.dataAcquisto <= fineY && y.dataAcquisto <= fineX) {
                        coppie.push([x, y]);
                    }
                }
            }
            return coppie;
        }

        // Campi del modulo, nell'ordine in cui compaiono
        const CAMPI_VEICOLO = ['modello', 'targa', 'anno', 'alimentazione', 'telaio',
                               'data-acquisto', 'km-acquisto', 'prezzo-acquisto',
                               'uscita', 'data-uscita', 'km-uscita', 'valore-uscita',
                               'valore-stimato', 'note'];

        // Cambiando la situazione della vettura il modulo si ridisegna, perche'
        // i campi da mostrare sono diversi. Prima si fotografa quello che c'e'
        // gia' scritto, altrimenti la scelta appena fatta andrebbe persa insieme
        // a tutto il resto. I campi non presenti in quel momento restano com'erano.
        function leggiFormVeicolo() {
            window.bozzaVeicolo = window.bozzaVeicolo || {};
            CAMPI_VEICOLO.forEach(campo => {
                const el = document.getElementById('vc-' + campo);
                if (el) window.bozzaVeicolo[campo] = el.value;
            });
            return window.bozzaVeicolo;
        }

        function cambiaUscitaVeicolo() {
            leggiFormVeicolo();
            renderContent();
        }

        function apriFormVeicolo(id) {
            window.veicoloInModifica = id || 'nuovo';
            const v = id && id !== 'nuovo'
                ? ((window.veicoli || []).find(x => String(x.id) === String(id)) || {})
                : {};
            const testo = (x) => x === null || x === undefined ? '' : String(x);
            window.bozzaVeicolo = {
                'modello': testo(v.modello), 'targa': testo(v.targa), 'anno': testo(v.anno),
                'alimentazione': v.alimentazione || ALIMENTAZIONI[0], 'telaio': testo(v.telaio),
                'data-acquisto': testo(v.dataAcquisto), 'km-acquisto': testo(v.kmAcquisto),
                'prezzo-acquisto': testo(v.prezzoAcquisto),
                'uscita': v.uscita || 'in-uso', 'data-uscita': testo(v.dataUscita),
                'km-uscita': testo(v.kmUscita), 'valore-uscita': testo(v.valoreUscita),
                'valore-stimato': testo(v.valoreStimato), 'note': testo(v.note)
            };
            renderContent();
            setTimeout(() => {
                const el = document.getElementById('vc-modello');
                if (el) el.focus();
            }, 0);
        }

        function chiudiFormVeicolo() {
            window.veicoloInModifica = null;
            window.bozzaVeicolo = null;
            renderContent();
        }

        function salvaVeicolo(e) {
            e.preventDefault();
            const bozza = leggiFormVeicolo();
            const leggi = (id) => String(bozza[String(id).replace(/^vc-/, '')] || '').trim();
            const modello = leggi('vc-modello');
            const dataAcquisto = leggi('vc-data-acquisto');
            if (!modello) { showToast('Indica almeno marca e modello.'); return; }
            if (!dataAcquisto) { showToast('Indica la data di acquisto.'); return; }

            const uscita = leggi('vc-uscita');
            const dataUscita = uscita === 'in-uso' ? '' : leggi('vc-data-uscita');
            if (uscita !== 'in-uso' && !dataUscita) {
                showToast('Indica la data in cui l\'auto è uscita.');
                return;
            }
            if (dataUscita && dataUscita < dataAcquisto) {
                showToast('La data di uscita viene prima di quella di acquisto.');
                return;
            }

            const kmAcquisto = numeroOpzionale(leggi('vc-km-acquisto'));
            const kmUscita = uscita === 'in-uso' ? null : numeroOpzionale(leggi('vc-km-uscita'));
            if (kmAcquisto !== null && kmUscita !== null && kmUscita < kmAcquisto) {
                showToast('I km all\'uscita non possono essere inferiori a quelli di acquisto.');
                return;
            }

            const prezzoAcquisto = numeroOpzionale(leggi('vc-prezzo-acquisto'));
            const valoreUscita = uscita === 'in-uso' ? null : numeroOpzionale(leggi('vc-valore-uscita'));
            const valoreStimato = uscita === 'in-uso' ? numeroOpzionale(leggi('vc-valore-stimato')) : null;
            if ([prezzoAcquisto, valoreUscita, valoreStimato].some(x => x !== null && x < 0)) {
                showToast('Gli importi non possono essere negativi.');
                return;
            }

            const esistente = window.veicoloInModifica !== 'nuovo'
                ? (window.veicoli || []).find(x => String(x.id) === String(window.veicoloInModifica))
                : null;

            const veicolo = Object.assign({}, esistente || {}, {
                id: esistente ? esistente.id : nuovoId(),
                modello,
                targa: leggi('vc-targa').toUpperCase(),
                anno: leggi('vc-anno'),
                alimentazione: leggi('vc-alimentazione'),
                telaio: leggi('vc-telaio').toUpperCase(),
                dataAcquisto, kmAcquisto, prezzoAcquisto,
                uscita, dataUscita, kmUscita, valoreUscita, valoreStimato,
                note: leggi('vc-note')
            });

            window.veicoli = window.veicoli || [];
            if (esistente) {
                window.veicoli = window.veicoli.map(x => String(x.id) === String(veicolo.id) ? veicolo : x);
            } else {
                window.veicoli.push(veicolo);
            }
            salvaVeicoli();
            if (window.saveVeicoloToCloud) window.saveVeicoloToCloud(veicolo);
            window.veicoloInModifica = null;
            window.bozzaVeicolo = null;
            showToast(esistente ? 'Vettura aggiornata.' : '⚡ Vettura aggiunta al parco auto.');
            renderNav();
            renderContent();

        // Scheda di una singola vettura, con i conti gia' fatti
        function schedaVeicolo(v) {
            const s = statsVeicolo(v);
            const km = (n) => n === null || n === undefined ? '—' : numeroIT(Math.round(n)) + ' km';
            const centesimi = (n) => n === null ? '—' : formatCurrency(n).replace('€', '').trim() + ' €/km';

                            ${boxDato(inUso(v) ? 'Costo di acquisto' : 'Acquisto → uscita',

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

                                        { classe: 'text-red-600' })}
                                    ${s.categorie.map(c => rigaFiscale(c.nome, formatCurrency(c.totale))).join('')}
                                    ${!s.categorie.length ? '<p class="text-xs text-gray-400 py-2">Nessuna spesa registrata in questo periodo.</p>' : ''}

                                </div>

                                    <p class="text-xs text-gray-400 mt-2">

        function getReportStats(monthFilter) {
            const meseOk = (x) => monthFilter === 'ALL'
                || (!!x.data && parseInt(String(x.data).slice(5, 7)) === parseInt(monthFilter));

            const records = recordsAnno().filter(meseOk);
            const shifts = turniAnno().filter(meseOk);

            let incassiTot = 0, pos = 0, contanti = 0, fattura = 0, satispay = 0, app = 0;
            let usciteTot = 0, carburante = 0, manutenzione = 0, altro = 0;
            const perCat = {};

            records.forEach(r => {
                const imp = parseFloat(r.importo || 0);
                if (r.tipo === 'ENTRATA') {
                    incassiTot += imp;
                    switch (famigliaMetodo(r.metodo)) {
                        case 'POS': pos += imp; break;
                        case 'Contanti': contanti += imp; break;
                        case 'Satispay': satispay += imp; break;
                        case 'Fattura': fattura += imp; break;
                        default: app += imp;
                    }
                } else if (r.tipo === 'USCITA') {
                    usciteTot += imp;
                    // Una sola regola per capire di che spesa si tratta, quella di
                    // categoriaBase: prima qui si guardava solo "carburante" e
                    // "diesel", cosi' un pieno scritto "Benzina" o "GPL" finiva fra
                    // le altre spese mentre nel dettaglio per categoria era
                    // carburante, e i due totali non tornavano.
                    const baseCat = categoriaBase(r.categoria);
                    if (baseCat === 'Carburante') carburante += imp;
                    else if (baseCat === 'Manutenzione' || baseCat === 'Lavaggio') manutenzione += imp;
                    else altro += imp;

                    if (!perCat[baseCat]) perCat[baseCat] = { nome: baseCat, tot: 0, n: 0, voci: [] };
                    perCat[baseCat].tot += imp;
                    perCat[baseCat].n++;
                    perCat[baseCat].voci.push(r);
                }
            });

            let kmTot = 0, oreTot = 0;
            shifts.filter(s => !isRiposo(s)).forEach(s => {
                kmTot += parseFloat(s.kmTot || 0);
                oreTot += parseFloat(s.ore || 0);
            });

            // Cassa e fisco: le spese in contanti tolgono soldi veri ma non
            // abbassano l'imponibile, quindi i due utili non coincidono.
            const usciteDed = usciteDeducibili(records.filter(r => r.tipo === 'USCITA'));
            const utileLordo = incassiTot - usciteTot;          // di cassa
            const utileFiscale = incassiTot - usciteDed;        // base delle tasse
            const fiscale = calcolaTasseOrdinario(utileFiscale);
            const stimaTasse = fiscale.tasseTot;
            const nettoStimato = utileLordo - stimaTasse;

            const mediaOra = oreTot > 0 ? (incassiTot / oreTot) : 0;
            const mediaKm = kmTot > 0 ? (incassiTot / kmTot) : 0;
            const costoKm = kmTot > 0 ? (usciteTot / kmTot) : 0;

            return {
                countCorse: records.filter(r => r.tipo === 'ENTRATA').length,
                countUscite: records.filter(r => r.tipo === 'USCITA').length,
                countTurni: shifts.filter(s => !isRiposo(s)).length,
                countRiposi: shifts.filter(isRiposo).length,
                incassiTot, pos, contanti, fattura, satispay, app,
                usciteTot, carburante, manutenzione, altro,
                pagamentoSpese: spesePerPagamento(records.filter(r => r.tipo === 'USCITA')),
                speseCategorie: Object.values(perCat)
                    .sort((a, b) => b.tot - a.tot)
                    .map(c => ({ ...c, tipologie: raggruppaPerTipologia(c.voci) })),
                kmTot, oreTot, utileLordo, utileFiscale, usciteDed,
                usciteNonDed: usciteTot - usciteDed,
                stimaTasse, nettoStimato, fiscale,
                mediaOra, mediaKm, costoKm
            };
        }

        // ============================================================
        //  LE TRE DESTINAZIONI, E TUTTO IL RESTO
        //  Prima erano nove porte tutte uguali in fila, e chi non e' pratico
        //  le apriva a caso finche' non ritrovava quella giusta. Ma in turno
        //  si fanno tre cose: si segna una corsa, si guarda come sta andando,

        //  Le scadenze in corso restano fuori dal cassetto: compaiono come

        // ============================================================
        const SCHEDE_PRINCIPALI = [

        ];

        const SCHEDE_SECONDARIE = [
            { id: 'categorie',  label: 'Spese e tasse',         desc: 'Dove vanno i soldi, e quanto è già del fisco', icona: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>' },
