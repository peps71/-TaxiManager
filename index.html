        const GIORNI_SETT = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
        const GIORNI_SETT_BREVI = ['dom','lun','mar','mer','gio','ven','sab'];

        // Le date sono salvate come 'AAAA-MM-GG': confronto le stringhe per evitare
        // gli scherzi dei fusi orari di new Date().
        function dataEstesa(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(a, m - 1, g);
            return `${GIORNI_SETT[d.getDay()]} ${g} ${nomeMese(m).toLowerCase()} ${a}`;
        }

        function giornoBreve(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            return GIORNI_SETT_BREVI[new Date(a, m - 1, g).getDay()];
        }

        // Numero di settimana ISO 8601 (la settimana contiene il primo giovedi' dell'anno):
        // e' lo stesso conteggio usato su calendari e agende cartacee.
        function numeroSettimana(iso) {
            if (!iso) return '';
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(Date.UTC(a, m - 1, g));
            const giornoIso = (d.getUTCDay() + 6) % 7; // lunedi=0 ... domenica=6
            d.setUTCDate(d.getUTCDate() - giornoIso + 3);
            const primoGennaio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - primoGennaio) / 86400000) + 1) / 7);
        }

        // Domenica di Pasqua secondo il calendario gregoriano (algoritmo di Gauss):
        // serve per calcolare Pasqua e Pasquetta, le uniche due festivita' italiane "mobili".
        function pasquaGregoriana(anno) {
            const a = anno % 19;
            const b = Math.floor(anno / 100);
            const c = anno % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mese = Math.floor((h + l - 7 * m + 114) / 31); // 3 = marzo, 4 = aprile
            const giorno = ((h + l - 7 * m + 114) % 31) + 1;
            return `${anno}-${String(mese).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
        }

        // Festivita' nazionali italiane + il patrono di Torino (San Giovanni Battista, 24 giugno),
        // utile a colpo d'occhio per un tassista torinese per capire su quali giorni si e' lavorato
        // durante una festa. Calcolate una volta per anno e tenute in cache.
        const _cacheFestivita = {};
        function festivitaAnno(anno) {
            if (_cacheFestivita[anno]) return _cacheFestivita[anno];
            const pasqua = pasquaGregoriana(anno);
            const pasquetta = spostaGiorno(pasqua, 1);
            const mappa = {
                [`${anno}-01-01`]: 'Capodanno',
                [`${anno}-01-06`]: 'Epifania',
                [pasqua]: 'Pasqua',
                [pasquetta]: 'Pasquetta',
                [`${anno}-04-25`]: '25 Aprile',
                [`${anno}-05-01`]: '1 Maggio',
                [`${anno}-06-02`]: '2 Giugno',
                [`${anno}-06-24`]: 'S. Giovanni',
                [`${anno}-08-15`]: 'Ferragosto',
                [`${anno}-11-01`]: 'Ognissanti',
                [`${anno}-12-08`]: 'Immacolata',
                [`${anno}-12-25`]: 'Natale',
                [`${anno}-12-26`]: 'S. Stefano',
            };
            _cacheFestivita[anno] = mappa;
            return mappa;
        }

        function nomeFestivo(iso) {
            if (!iso) return null;
            const anno = parseInt(iso.slice(0, 4));
            return festivitaAnno(anno)[iso] || null;
        }

        // Classe colore per evidenziare sabato (arancione), domenica e festivi (rosso):
        // un colpo d'occhio per distinguere subito i giorni "normali" da weekend/festa.
        function classeEvidenziaGiorno(iso) {
            if (!iso) return 'text-gray-400';
            const [a, m, g] = iso.split('-').map(Number);
            const gg = new Date(a, m - 1, g).getDay(); // 0 = domenica ... 6 = sabato
            if (nomeFestivo(iso) || gg === 0) return 'text-red-500';
            if (gg === 6) return 'text-amber-600';
            return 'text-gray-400';
        }

        // Markup compatto per le celle "Data" dei registri: data + giorno abbreviato + settimana
        // (o nome della festa, se il giorno e' festivo), su due righe per non allargare le tabelle
        // (importante sugli schermi piu' stretti). Sabato in arancione, domenica/festivi in rosso.
        function dataConDettagli(iso) {
            if (!iso) return '';
            const festivo = nomeFestivo(iso);
            const colore = classeEvidenziaGiorno(iso);
            const evidenziato = colore !== 'text-gray-400';
            const dettaglio = festivo ? `${giornoBreve(iso)} · ${festivo}` : `${giornoBreve(iso)} · sett. ${numeroSettimana(iso)}`;
            return `<div class="${evidenziato ? colore + ' font-bold' : ''}">${iso}</div><div class="text-[10px] ${colore} font-bold uppercase tracking-wide">${dettaglio}</div>`;
        }

        // ============================================================
        //  SPESE RICORRENTI
        //  La rata della licenza, il radio taxi, il commercialista: spese che
        //  tornano sempre uguali a distanza regolare. Si scrivono una volta e
        //  l'app ne genera la serie. Restano movimenti come tutti gli altri:
        //  si modificano, si eliminano e contano nei totali uno per uno.
        // ============================================================

        const CADENZE_SPESA = [
            { id: 'settimana',  etichetta: 'ogni settimana',   giorni: 7 },
            { id: '2settimane', etichetta: 'ogni 2 settimane', giorni: 14 },
            { id: 'mese',       etichetta: 'ogni mese',        mesi: 1 },
            { id: '2mesi',      etichetta: 'ogni 2 mesi',      mesi: 2 },
            { id: '3mesi',      etichetta: 'ogni 3 mesi',      mesi: 3 },
            { id: '6mesi',      etichetta: 'ogni 6 mesi',      mesi: 6 },
            { id: 'anno',       etichetta: 'ogni anno',        mesi: 12 }
        ];

        // Aggiunge dei mesi restando dentro il mese di arrivo: una rata del 31
        // diventa il 28 (o il 29) a febbraio, e torna al 31 il mese dopo, perche'
        // il conto si fa sempre a partire dalla data di partenza.
        function aggiungiMesi(iso, n) {
            const [a, m, g] = String(iso).split('-').map(Number);
            const arrivo = new Date(a, m - 1 + n, 1);
            const ultimo = new Date(arrivo.getFullYear(), arrivo.getMonth() + 1, 0).getDate();
            return `${arrivo.getFullYear()}-${String(arrivo.getMonth() + 1).padStart(2, '0')}-${String(Math.min(g, ultimo)).padStart(2, '0')}`;
        }

        const MAX_RICORRENZE = 400;

        // Le date di una serie, dalla prima compresa fino a "finoAl" compreso
        function datePeriodiche(inizio, cadenzaId, finoAl) {
            const c = CADENZE_SPESA.find(x => x.id === cadenzaId);
            if (!c || !inizio || !finoAl || finoAl < inizio) return [];
            const date = [];
            for (let k = 0; k < MAX_RICORRENZE; k++) {
                const d = c.mesi ? aggiungiMesi(inizio, c.mesi * k) : spostaGiorno(inizio, c.giorni * k);
                if (d > finoAl) break;
                date.push(d);
            }
            return date;
        }

        function spostaGiorno(iso, delta) {
            const [a, m, g] = iso.split('-').map(Number);
            const d = new Date(a, m - 1, g + delta);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Identificativo univoco per corse, turni e scadenze.
        // Date.now() da solo puo' ripetersi se due registrazioni cadono nello stesso
        // millisecondo: due righe con lo stesso id si cancellerebbero a vicenda.
        let contatoreId = 0;
        function nuovoId() {
            contatoreId = (contatoreId + 1) % 1000;
            return String(Date.now()) + String(contatoreId).padStart(3, '0');
        }

        function oggiISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // Ultimo giorno lavorato: la Dashboard si apre lì.
        // Cerco un giorno con incassi, non solo con movimenti, altrimenti finirei
        // sull'ultimo del mese dove sono registrati i costi fissi.
        function ultimoGiornoConDati() {
            const conIncassi = recordsAnno()
                .filter(r => r.tipo === 'ENTRATA' && r.data).map(r => r.data).sort();
            if (conIncassi.length) return conIncassi[conIncassi.length - 1];
            const tutte = recordsAnno().map(r => r.data).filter(Boolean).sort();
            if (tutte.length) return tutte[tutte.length - 1];
            // Anno senza dati: mi posiziono su oggi se l'anno è quello corrente,
            // altrimenti sul 1° gennaio dell'anno scelto.
            const oggi = oggiISO();
            return oggi.slice(0, 4) === annoAttivo() ? oggi : `${annoAttivo()}-01-01`;
        }

        function giornoSelezionato() {
            if (!window.dashGiorno) window.dashGiorno = ultimoGiornoConDati();
            return window.dashGiorno;
        }

        function meseSelezionato() {
            if (!window.dashMese) window.dashMese = giornoSelezionato().slice(0, 7);
            return window.dashMese;
        }

        // Dal Rendimento al riepilogo di quella giornata, in Dashboard
        function vaiAlGiorno(iso) {
            setDashGiorno(iso);
            switchTab('dashboard');
        }

        function setDashGiorno(v) {
            if (!v) return;
            window.dashGiorno = v;
            window.dashMese = v.slice(0, 7);
            renderContent();
        }

        function scorriGiorno(delta) {
            setDashGiorno(spostaGiorno(giornoSelezionato(), delta));
        }

        function setDashMese(v) {
            if (!v) return;
            window.dashMese = v;
            renderContent();
        }

        function scorriMese(delta) {
            const [a, m] = meseSelezionato().split('-').map(Number);
            const d = new Date(a, m - 1 + delta, 1);
            setDashMese(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
        }

        // Aggrega i movimenti di un periodo (prefisso data: '2026-05' oppure '2026-05-14')
        function aggrega(prefisso) {
            const r = {
                incassi: 0, contanti: 0, pos: 0, satispay: 0, app: 0, fattura: 0,
                nCorse: 0, uscite: 0, carburante: 0, manutenzione: 0, altroSpese: 0,
                perCategoria: {}, speseCategorie: [],
                listaUscite: [], ore: 0, nTurni: 0, turni: []
            };

            (window.dailyRecords || []).forEach(x => {
                if (!x.data || !String(x.data).startsWith(prefisso)) return;
                const imp = parseFloat(x.importo || 0);
                if (x.tipo === 'ENTRATA') {
                    r.incassi += imp;
                    r.nCorse++;
                    switch (famigliaMetodo(x.metodo)) {
                        case 'POS': r.pos += imp; break;
                        case 'Contanti': r.contanti += imp; break;
                        case 'Satispay': r.satispay += imp; break;
                        case 'Fattura': r.fattura += imp; break;
                        default: r.app += imp;
                    }
                } else if (x.tipo === 'USCITA') {
                    r.uscite += imp;
                    r.listaUscite.push(x);
                    const c = (x.categoria || '').toLowerCase();
                    if (c.includes('carburante') || c.includes('diesel')) r.carburante += imp;
                    else if (c.includes('manutenzione') || c.includes('lavaggio')) r.manutenzione += imp;
                    else r.altroSpese += imp;

                    // Dettaglio per categoria: totale e singoli movimenti
                    const base = categoriaBase(x.categoria);
                    if (!r.perCategoria[base]) r.perCategoria[base] = { nome: base, tot: 0, voci: [] };
                    r.perCategoria[base].tot += imp;
                    r.perCategoria[base].voci.push(x);
                }
            });

            r.riposi = [];
            (window.shifts || []).forEach(t => {
                if (!t.data || !String(t.data).startsWith(prefisso)) return;
                if (isRiposo(t)) { r.riposi.push(t); return; }
                r.nTurni++;
                r.ore += parseFloat(t.ore || 0);
                r.turni.push(t);
            });

            r.saldo = r.incassi - r.uscite;
            r.mediaCorsa = r.nCorse ? r.incassi / r.nCorse : 0;
            r.mediaOra = r.ore ? r.incassi / r.ore : 0;
            r.listaUscite.sort((a, b) => parseFloat(b.importo) - parseFloat(a.importo));
            r.speseCategorie = Object.values(r.perCategoria).sort((a, b) => b.tot - a.tot);
            r.speseCategorie.forEach(c => {
                c.voci.sort((a, b) => parseFloat(b.importo) - parseFloat(a.importo));
                c.tipologie = raggruppaPerTipologia(c.voci);
            });
            return r;
        }

        // Dettaglio giorno per giorno del mese, usato dal grafico a barre
        function serieMensile(ym) {
            const [a, m] = ym.split('-').map(Number);
            const giorni = new Date(a, m, 0).getDate();
            const serie = [];
            for (let g = 1; g <= giorni; g++) {
                const iso = `${ym}-${String(g).padStart(2, '0')}`;
                const d = aggrega(iso);
                serie.push({ giorno: g, iso, incassi: d.incassi, uscite: d.uscite, nCorse: d.nCorse, ore: d.ore });
            }
            return serie;
        }

        // I 12 mesi dell'anno con i rispettivi totali: e' la base del grafico annuale
        function serieAnnuale(anno) {
            const serie = [];
            for (let m = 1; m <= 12; m++) {
                const ym = `${anno}-${String(m).padStart(2, '0')}`;
                const d = aggrega(ym);
                serie.push({ mese: m, ym, incassi: d.incassi, uscite: d.uscite, nCorse: d.nCorse, ore: d.ore });
            }
            return serie;
        }

        // Riquadro "Incassi per metodo", usato identico in quattro punti dell'app.
        // opzioni: vuoto = testo quando non ci sono incassi;
        //          daVersare = aggiunge la riga contanti + Satispay;
        //          soloConImporto = nasconde i metodi a zero (utile sulla singola giornata).
        function bloccoIncassiPerMetodo(d, opzioni) {
            const o = opzioni || {};
            if (!(d.incassi > 0)) {
                return `<p class="text-sm text-gray-400">${o.vuoto || 'Nessun incasso registrato.'}</p>`;
            }
            const metodi = [
                ['Contanti', d.contanti, 'bg-green-500'],
                ['POS / Carta', d.pos, 'bg-gray-900'],
                ['Satispay', d.satispay, 'bg-red-500'],
                ['App / Voucher', d.app, 'bg-blue-500'],
                ['Fattura', d.fattura, 'bg-indigo-500']
            ];
            // La riga Fattura si mostra solo se c'e' davvero: altrimenti resta sempre a zero
            const visibili = metodi.filter(m => o.soloConImporto ? m[1] > 0 : (m[0] !== 'Fattura' || m[1] > 0));
            const righe = visibili.map(m => rigaMetodo(m[0], m[1], d.incassi, m[2])).join('');
            if (!o.daVersare) return righe;
            return righe + `
                <div class="pt-2 mt-1 border-t border-dashed border-gray-200 flex justify-between text-xs font-black">
                    <span class="text-gray-600">Da versare (contanti + Satispay)</span>
                    <span class="text-gray-900">${formatCurrency(d.contanti + d.satispay)}</span>
                </div>`;
        }

        // Riquadro "Spese per categoria" dei riepiloghi mensile e annuale
        // Elenco compatto "descrizione - importo" delle spese di una giornata
        function righeSpeseGiornata(uscite) {
            const elenco = uscite || [];
            // Con i costi fissi in sottofondo la giornata ne ha una riga per
            // ognuno: elencarle tutte coprirebbe le spese vere, che sono quelle
            // che interessa vedere. Si raccolgono in una riga sola.
            const raccogli = fissiDaRaccogliere();
            const fissi = raccogli ? elenco.filter(fissoGenerato) : [];
            const altre = raccogli ? elenco.filter(u => !fissoGenerato(u)) : elenco;

            const righe = altre.map(u => `
                <div class="px-3 py-2 flex justify-between items-center gap-3">
                    <span class="text-xs font-bold text-gray-700 truncate">
                        ${esc(u.categoria)}${u.nota ? `<span class="font-medium text-gray-400"> · ${esc(u.nota)}</span>` : ''}
                    </span>
                    <span class="text-sm font-black text-red-600 whitespace-nowrap">-${formatCurrency(u.importo)}</span>
                </div>`).join('');

            if (!fissi.length) return righe;

            return righe + `
                <div class="px-3 py-2 flex justify-between items-center gap-3 bg-indigo-50/70">
                    <span class="text-xs font-bold text-indigo-800 truncate" title="${esc(fissi.map(f => sottocategoria(f.categoria)).join(', '))}">Costi fissi del giorno <span class="font-medium text-indigo-500">· ${fissi.length} ${fissi.length === 1 ? 'voce' : 'voci'}</span></span>
                    <span class="text-sm font-black text-indigo-700 whitespace-nowrap">-${formatCurrency(totaleImporti(fissi))}</span>
                </div>`;
        }

        function bloccoSpesePerCategoria(d, ambito, vuoto) {
            if (!(d.uscite > 0)) return `<p class="text-sm text-gray-400">${vuoto}</p>`;
            return d.speseCategorie.map(c => rigaCategoriaSpesa(c, d.uscite, ambito)).join('');
        }

        function rigaMetodo(etichetta, valore, totale, classe) {
            const pct = totale > 0 ? (valore / totale) * 100 : 0;
            return `
                <div class="space-y-1">
                    <div class="flex justify-between items-baseline text-xs">
                        <span class="font-bold text-gray-600">${etichetta}</span>
                        <span class="font-black text-gray-900">${formatCurrency(valore)} <span class="text-gray-400 font-bold">${pct.toFixed(0)}%</span></span>
                    </div>
                    <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full ${classe} rounded-full" style="width:${pct}%"></div>
                    </div>
                </div>`;
        }

        // Riga di spesa per categoria: si tocca per aprire l'elenco dei singoli movimenti
        function rigaCategoriaSpesa(cat, totale, ambito) {
            const pct = totale > 0 ? (cat.tot / totale) * 100 : 0;
            // L'ambito ('mese' o 'anno') tiene separate le righe aperte nei due riepiloghi
            const chiave = (ambito || 'mese') + '|' + cat.nome;
            const aperta = window.catSpesaAperta === chiave;
            return `
                <div class="space-y-1">
                    <div onclick="toggleCatSpesa('${escJs(chiave)}')" class="cursor-pointer select-none">
                        <div class="flex justify-between items-baseline text-xs">
                            <span class="font-bold text-gray-600">
                                <span class="text-gray-400">${aperta ? '&#9662;' : '&#9656;'}</span>
                                ${esc(cat.nome)}
                                <span class="text-gray-400 font-bold">${(fissiDaRaccogliere() && cat.nome === 'Costi fissi') ? (cat.tipologie || raggruppaPerTipologia(cat.voci)).length : cat.voci.length}</span>
                            </span>
                            <span class="font-black text-gray-900">${formatCurrency(cat.tot)} <span class="text-gray-400 font-bold">${pct.toFixed(0)}%</span></span>
                        </div>
                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden mt-1">
                            <div class="h-full ${coloreCategoria(cat.nome)} rounded-full" style="width:${pct}%"></div>
                        </div>
                    </div>
                    ${aperta ? `
                        <div class="ml-1 pl-2 border-l-2 border-gray-100">
                            ${(cat.tipologie || raggruppaPerTipologia(cat.voci)).map(t => `
                                <div class="flex justify-between items-baseline gap-2 py-1">
                                    <span class="text-[11px] text-gray-500 truncate">
                                        ${esc(t.nome)}
                                        <span class="text-gray-400">${t.n > 1 ? '×' + t.n : ggMm(t.ultima)}</span>
                                    </span>
                                    <span class="text-[11px] font-bold text-red-600 whitespace-nowrap">-${formatCurrency(t.tot)}</span>
                                </div>`).join('')}
                        </div>` : ''}
                </div>`;
        }

        function toggleCatSpesa(chiave) {
            window.catSpesaAperta = window.catSpesaAperta === chiave ? null : chiave;
            window.renderContent();
        }

        // ============================================================
        //  QUOTA GIORNALIERA DEI COSTI FISSI
        //  Ogni spesa resta registrata nel giorno in cui e' stata fatta: e' cosi'
        //  che se ne tiene traccia ed e' cosi' che va in contabilita'. Ma per
        //  capire com'e' andata una giornata quel numero non serve: un pieno, un
        //  tagliando, il commercialista o i contributi servono per tutto il mese,
        //  non per il giorno in cui li hai pagati, e la giornata in cui capitano
        //  risulta disastrosa mentre tutte le altre sembrano piu' ricche del vero.
        //  Qui le spese del mese si dividono per i suoi giorni, e resta una
        //  lettura: non e' un movimento e non entra in nessun totale.
        // ============================================================

        function giorniDelMese(ym) {
            const [a, m] = String(ym).split('-').map(Number);
            if (!a || !m) return 30;
            return new Date(a, m, 0).getDate();
        }

        // Giornate in cui si e' davvero lavorato in quel mese: nei riposi le
        // spese corrono lo stesso, ma non c'e' nessun incasso a coprirle.
        function giorniLavoratiDelMese(ym) {
            const giorni = new Set();
            (window.shifts || []).forEach(t => {
                if (!t.data || String(t.data).slice(0, 7) !== String(ym)) return;
                if (isRiposo(t)) return;
                giorni.add(String(t.data));
            });
            return giorni.size;
        }

        // A quale voce di budget corrisponde un movimento? Si guarda il nome, non
        // il prefisso, cosi' funzionano tutte e due le forme:
        //   "Costi fissi - Radio taxi - fattura di aprile"   (spesa di sola gestione)
        //   "Carburante - Q8 corso Francia"                  (spesa che ha gia' una
        //                                                     sua categoria)
        function nomeSpesaDiRecord(r) {
            const t = String(r && r.categoria || '').trim();
            if (!t) return '';
            let resto = /^costi fissi\b/i.test(t) ? t.replace(/^costi fissi\s*[-–:]?\s*/i, '') : t;
            const i = resto.indexOf(' - ');
            if (i > -1) resto = resto.slice(0, i);
            return resto.replace(/\s*\([^()]*\)\s*$/, '').trim();
        }

        // Chiave di confronto fra due nomi: senza accenti, senza maiuscole e senza
        // punteggiatura. Diversa dallo slug, che invece taglia a 24 caratteri per
        // stare in un identificativo: qui il taglio farebbe combaciare due voci
        // dal nome lungo e simile.
        function chiaveNome(t) {
            return String(t || '').toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
        }

        function voceBudgetDiRecord(r) {
            if (!r || r.tipo !== 'USCITA') return null;
            const voci = elencoVociFisse();
            const cerca = (k) => k ? (voci.find(v => chiaveNome(v.nome) === k) || null) : null;

            // 1. il nome scritto nel movimento, cosi' com'e'
            const diretta = cerca(chiaveNome(nomeSpesaDiRecord(r)));
            if (diretta) return diretta;

            // 2. la categoria a cui l'app riconduce la spesa. "Carburante /
            //    Diesel - Q8" e "Carburante - Eni" sono la stessa cosa, e il
            //    budget parla di carburante: senza questo passaggio una voce di
            //    budget non trovava i suoi movimenti solo perche' la categoria
            //    si chiama in un modo un po' diverso.
            const base = categoriaBase(r.categoria);
            if (base === 'Altro' || base === 'Costi fissi') return null;
            return cerca(chiaveNome(base));
        }

        // Le spese che il budget gia' prevede. Contarle anche come spesa reale
        // nella quota del giorno le conterebbe due volte: quando escono dal conto
        // finiscono nel conguaglio, non nella quota. Ci finiscono anche le vecchie
        // righe "Costi fissi" che non corrispondono piu' a nessuna voce: sarebbero
        // dei picchi mostruosi in un giorno solo.
        function copertaDalBudget(r) {
            if (categoriaBase(r && r.categoria) === 'Costi fissi') return true;
            const v = voceBudgetDiRecord(r);
            // La voce deve pesare davvero in quella data: se e' a zero, o se il suo
            // periodo non copre il giorno della spesa, il budget non la sta gia'
            // contando e la spesa va nella media come tutte le altre.
            return !!v && quotaVoceGiorno(v, String(r.data || '')) > 0;
        }

        // Le spese reali che il budget non copre: carburante, manutenzione,
        // lavaggio, ristoro, contributi. Si conoscono solo fino a oggi, quindi in
        // un mese ancora in corso si fa la media sui giorni gia' passati: dividerle
        // per trentuno le farebbe sembrare la meta' di quello che sono.
        function mediaAltreSpese(ym) {
            const gg = giorniDelMese(ym);
            let altre = 0, voci = 0;
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA') return;
                if (String(r.data || '').slice(0, 7) !== String(ym)) return;
                if (copertaDalBudget(r)) return;
                altre += parseFloat(r.importo || 0);
                voci++;
            });
            const oggi = oggiISO();
            const inCorso = String(ym) === oggi.slice(0, 7);
            const giorni = inCorso ? Math.min(gg, Math.max(1, Number(oggi.slice(8, 10)))) : gg;
            return { altre, voci, giorni, inCorso, quota: giorni ? altre / giorni : 0 };
        }

        // Quanto pesa davvero una giornata: il budget dei costi fissi di quel
        // giorno piu' la media delle altre spese del mese.
        function quotaDelGiorno(iso) {
            const ym = String(iso).slice(0, 7);
            const gg = giorniDelMese(ym);
            const budget = budgetDelGiorno(iso);
            const m = mediaAltreSpese(ym);
            const lavorati = giorniLavoratiDelMese(ym);
            // Spese della finestra considerata: il mese intero se e' finito,
            // i giorni gia' passati se e' ancora in corso.
            const speseFinestra = budgetPeriodo(`${ym}-01`, `${ym}-${String(m.giorni).padStart(2, '0')}`) + m.altre;
            return {
                ym, giorni: gg, giorniAltre: m.giorni, inCorso: m.inCorso, lavorati,
                budget, altre: m.quota, quota: budget + m.quota,
                totaleAltre: m.altre, budgetMese: budgetMese(ym),
                quotaLavorati: lavorati ? speseFinestra / lavorati : 0
            };
        }

        // Un costo fisso scritto come movimento dalle versioni precedenti
        // dell'app: ha un identificativo che comincia per "fissi-". E' quello che
        // si puo' raccogliere in una riga sola; una spesa scritta a mano no.
        function fissoGenerato(r) {
            return !!r && r.tipo === 'USCITA' && generataDallApp(r) && categoriaBase(r.categoria) === 'Costi fissi';
        }

        // Le vecchie versioni dell'app scrivevano i costi fissi come movimenti,
        // uno al mese o addirittura uno al giorno. Quelle righe restano dove sono
        // — sono la traccia di quello che hai pagato — ma nel registro si mostrano
        // raccolte in una riga sola, altrimenti le spese vere ci spariscono dentro.
        function fissiDaRaccogliere() {
            return !window.mostraFissi;
        }

        // Scrive la versione nella barra laterale: se qui non c'e' il numero che
        // ti aspetti, il telefono sta usando una copia vecchia tenuta in cache.
        function mostraVersione() {
            const el = document.getElementById('etichetta-versione');
            if (el) el.textContent = `Edizione Cloud · v${VERSIONE_APP}`;
        }

        // Forza il passaggio alla versione nuova senza chiudere l'app: si chiede
        // al telefono di ricontrollare, e se ce n'e' una in attesa le si dice di
        // prendere il comando subito.
        async function aggiornaApp() {
            showToast('Cerco una versione nuova...');
            try {
                const reg = window.registrazioneSW
                    || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
                if (reg) {
                    await reg.update();
                    if (reg.waiting) {
                        reg.waiting.postMessage({ tipo: 'AGGIORNA_SUBITO' });
                        return;   // al cambio di comando la pagina si ricarica da sola
                    }
                }
            } catch (err) {
                console.warn('Controllo aggiornamento non riuscito:', err);
            }
            setTimeout(() => window.location.reload(), 400);
        }

        function alternaMostraFissi() {
            window.mostraFissi = !window.mostraFissi;
            renderContent();
        }

        function totaleImporti(elenco) {
            return (elenco || []).reduce((a, x) => a + parseFloat(x.importo || 0), 0);
        }

        // Riquadro che spiega quanto pesa ogni giorno e quanto serve incassare
        // per coprire tutto: e' il numero che dice se la giornata e' andata
        // davvero in attivo. Le spese ci sono tutte, non solo quelle fisse:
        // il pieno di gasolio e il tagliando servono per tutto il mese.
        function bloccoQuotaSpese(iso, incassiGiorno, usciteGiorno) {
            const q = quotaDelGiorno(iso);
            if (!(q.quota > 0)) return '';
            const mese = nomeMese(parseInt(q.ym.slice(5, 7), 10));
            const risultato = (incassiGiorno || 0) - q.quota;
            const speseOggi = usciteGiorno || 0;

            return `
                <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-4">
                    <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <p class="text-[10px] font-black uppercase tracking-wider text-indigo-700">Quanto costa questa giornata</p>
                        <p class="text-xs font-bold text-indigo-500">${mese} · budget ${formatCurrency(q.budgetMese)} + spese ${formatCurrency(q.totaleAltre)}${q.inCorso ? ' finora' : ''}</p>
                    </div>
                    <p class="text-2xl font-black text-indigo-900 mt-1">${formatCurrency(q.quota)} <span class="text-sm font-bold text-indigo-500">al giorno</span></p>
                    <p class="text-[11px] font-bold text-indigo-500 mt-0.5">
                        a budget ${formatCurrency(q.budget)} + spese fuori budget ${formatCurrency(q.altre)}
                    </p>
                    <div class="grid grid-cols-2 gap-3 mt-3">
                        <div class="bg-white/70 rounded-lg p-2.5">
                            <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-500">Pareggio della giornata</p>
                            <p class="text-base font-black text-indigo-900">${formatCurrency(q.quota)}</p>
                        </div>
                        <div class="bg-white/70 rounded-lg p-2.5">
                            <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-500">Incasso reale della giornata</p>
                            <p class="text-base font-black ${risultato >= 0 ? 'text-green-700' : 'text-red-600'}">${formatCurrency(risultato)}</p>
                        </div>
                    </div>
                    ${q.lavorati ? `
                        <p class="text-[11px] text-indigo-600 mt-2 leading-relaxed">
                            Sui ${q.lavorati} ${q.lavorati === 1 ? 'giorno' : 'giorni'} in cui hai davvero lavorato la quota sale a
                            <strong>${formatCurrency(q.quotaLavorati)}</strong>: nei riposi le spese corrono lo stesso, ma non c'è incasso a coprirle.
                        </p>` : ''}
                    <p class="text-[11px] text-indigo-500 mt-2 leading-relaxed">
                        Le voci a <strong>budget</strong> entrano qui a preventivo, non a fattura: pesano ogni giorno anche quando la spesa esce dal conto una volta l'anno.
                        Le altre sono le spese che hai registrato${speseOggi > 0 ? ` (in questa giornata ${formatCurrency(speseOggi)})` : ''}, divise per i giorni del mese: un tagliando serve per tutto il mese, non solo per il giorno in cui l'hai pagato.
                        È una lettura, non un movimento: i totali di mese e anno restano quelli veri.
                        ${q.inCorso ? `${mese} è ancora in corso, quindi le spese fuori budget sono la media dei primi ${q.giorniAltre} giorni.` : ''}
                    </p>
                </div>`;
        }

        function boxDato(etichetta, valore, classe) {
            return `
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-0.5">${etichetta}</p>
                    <p class="text-base sm:text-lg font-black ${classe || 'text-gray-900'} leading-tight">${valore}</p>
                </div>`;
        }

        // ============================================================
        //  RENDIMENTO
        //  Incrocia gli incassi giornalieri con il turno svolto e con il
        //  giorno della settimana: sono dati gia' presenti, mai messi a confronto.
        // ============================================================
        function statsRendimento() {
            const perData = {};
            recordsAnno().forEach(r => {
                if (r.tipo !== 'ENTRATA') return;
                if (!perData[r.data]) perData[r.data] = { tot: 0, n: 0 };
                perData[r.data].tot += parseFloat(r.importo || 0);
                perData[r.data].n++;
            });

            const perTurno = {};
            const giorniConTurno = {};
            turniAnno().filter(t => !isRiposo(t)).forEach(t => {
                giorniConTurno[t.data] = true;
                const g = perData[t.data] || { tot: 0, n: 0 };
                const k = t.turno || 'Personalizzato';
                if (!perTurno[k]) perTurno[k] = { nome: k, gg: 0, tot: 0, n: 0, ore: 0 };
                perTurno[k].gg++;
                perTurno[k].tot += g.tot;
                perTurno[k].n += g.n;
                perTurno[k].ore += parseFloat(t.ore || 0);
            });

            // Giornate con incassi ma senza turno registrato: le tengo separate
            // invece di attribuirle a un turno che non risulta da nessuna parte.
            Object.keys(perData).forEach(d => {
                if (giorniConTurno[d]) return;
                const k = 'Senza turno registrato';
                if (!perTurno[k]) perTurno[k] = { nome: k, gg: 0, tot: 0, n: 0, ore: 0 };
                perTurno[k].gg++;
                perTurno[k].tot += perData[d].tot;
                perTurno[k].n += perData[d].n;
            });

            const listaTurni = Object.keys(perTurno).map(k => {
                const v = perTurno[k];
                return {
                    nome: v.nome, gg: v.gg, tot: v.tot, ore: v.ore,
                    perGg: v.gg ? v.tot / v.gg : 0,
                    perOra: v.ore ? v.tot / v.ore : 0,
                    corseGg: v.gg ? v.n / v.gg : 0,
                    perCorsa: v.n ? v.tot / v.n : 0
                };
            }).sort((a, b) => b.perOra - a.perOra);

            const NOMI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
            const settimana = NOMI.map(n => ({ nome: n, gg: 0, tot: 0, n: 0 }));
            Object.keys(perData).forEach(d => {
                const [a, m, gi] = d.split('-').map(Number);
                const idx = new Date(a, m - 1, gi).getDay();
                settimana[idx].gg++;
                settimana[idx].tot += perData[d].tot;
                settimana[idx].n += perData[d].n;
            });
            const perSettimana = [1, 2, 3, 4, 5, 6, 0].map(i => settimana[i]).map(v => ({
                nome: v.nome, gg: v.gg, tot: v.tot,
                perGg: v.gg ? v.tot / v.gg : 0,
                corseGg: v.gg ? v.n / v.gg : 0
            }));

            // Giornata record e giornata piu' fiacca dell'anno. Conto solo i giorni
            // con almeno un incasso: i riposi non sono giornate andate male.
            const turniPerData = {};
            turniAnno().filter(t => !isRiposo(t)).forEach(t => { turniPerData[t.data] = t; });
            const giornate = Object.keys(perData)
                .filter(d => perData[d].tot > 0)
                .map(d => {
                    const t = turniPerData[d];
                    return {
                        data: d,
                        tot: perData[d].tot,
                        nCorse: perData[d].n,
                        turno: t ? (t.turno || 'Personalizzato') : null,
                        ore: t ? parseFloat(t.ore || 0) : 0
                    };
                })
                .sort((a, b) => b.tot - a.tot);

            const giornoRecord = giornate[0] || null;
            // Se c'e' una sola giornata lavorata, record e peggiore coinciderebbero:
            // in quel caso non ha senso mostrare il confronto.
            const giornoPeggiore = giornate.length > 1 ? giornate[giornate.length - 1] : null;

            return {
                listaTurni, perSettimana, giornoRecord, giornoPeggiore,
                giornateLavorate: giornate.length,
                giorniLavorati: Object.keys(perData).length
            };
        }

        function renderRiepilogoGiornaliero() {
            const g = giornoSelezionato();
            const d = aggrega(g);
            // Nessuna corsa e nessun turno = giornata di riposo. Se non è stata
            // registrata esplicitamente la deduco, ma solo per i giorni già passati:
            // un giorno futuro è semplicemente ancora da compilare.
            const riposoEsplicito = d.riposi[0] || null;
            const riposo = d.nCorse === 0 && d.nTurni === 0 && (riposoEsplicito || g <= oggiISO());
            const daCompilare = d.nCorse === 0 && d.nTurni === 0 && !riposo;
            const vuoto = daCompilare && d.listaUscite.length === 0;

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden print-card print-break">
                    <div class="bg-gray-900 px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h3 class="text-lg font-black text-yellow-400 leading-tight">Riepilogo giornaliero</h3>
                            <p class="text-xs text-gray-300 font-bold capitalize">${dataEstesa(g)}</p>
                        </div>
                        <div class="flex items-center gap-2 no-print">
                            <button onclick="scorriGiorno(-1)" title="Giorno precedente" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-400 font-black">‹</button>
                            <input type="date" value="${g}" onchange="setDashGiorno(this.value)" class="p-2 rounded-lg text-sm font-bold bg-white border-0 outline-none" />
                            <button onclick="scorriGiorno(1)" title="Giorno successivo" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-400 font-black">›</button>
                            <button onclick="setDashGiorno(ultimoGiornoConDati())" class="px-3 h-9 rounded-lg bg-yellow-400 hover:bg-yellow-500 text-gray-900 text-xs font-black">Ultimo</button>
                        </div>
                    </div>

                    ${riposo ? `
                        <div class="p-8 text-center bg-blue-50/50">
                            <p class="text-2xl font-black text-indigo-900">${esc(riposoEsplicito ? (riposoEsplicito.turno || 'Festivo') : 'Giornata non lavorata')}</p>
                            <p class="text-sm text-gray-500 font-bold mt-1">Nessuna corsa registrata in questa giornata.</p>
                            ${d.listaUscite.length ? `
                                <div class="max-w-md mx-auto mt-4 text-left divide-y divide-blue-100 border border-blue-100 rounded-xl bg-white">
                                    ${righeSpeseGiornata(d.listaUscite)}
                                </div>
                                <p class="text-xs text-gray-400 mt-2">Spese registrate comunque in questa data.</p>
                            ` : ''}
                        </div>
                    ` : vuoto ? `
                        <div class="p-8 text-center">
                            <p class="text-gray-400 font-bold">Giornata ancora da compilare.</p>
                            <p class="text-xs text-gray-400 mt-1">Usa le frecce per spostarti di un giorno o il pulsante Ultimo.</p>
                        </div>
                    ` : `
                        <div class="p-5 space-y-5">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                ${boxDato('Incasso', formatCurrency(d.incassi), 'text-green-600')}
                                ${boxDato('Spese', d.uscite ? '-' + formatCurrency(d.uscite) : formatCurrency(0), 'text-red-600')}
                                ${boxDato('Saldo di giornata', formatCurrency(d.saldo), d.saldo >= 0 ? 'text-gray-900' : 'text-red-600')}
                                ${boxDato('Corse', `${d.nCorse} <span class="text-xs font-bold text-gray-400">${formatCurrency(d.mediaCorsa)}/corsa</span>`)}
                            </div>

                            ${bloccoQuotaSpese(g, d.incassi, d.uscite)}

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <div class="space-y-3">
                                    <p class="text-xs font-black uppercase tracking-wider text-gray-500">Incassi per metodo</p>
                                    ${bloccoIncassiPerMetodo(d, { daVersare: true, vuoto: 'Nessun incasso registrato.' })}
                                </div>

                                <div class="space-y-3">
                                    <p class="text-xs font-black uppercase tracking-wider text-gray-500">Turno e spese</p>
                                    ${d.turni.length ? d.turni.map(t => `
                                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 flex justify-between items-center">
                                            <div>
                                                <p class="text-sm font-black text-gray-900">${esc(t.turno || (t.inizio + ' - ' + t.fine))}</p>
                                                <p class="text-xs text-gray-500 font-bold">${t.inizio} → ${t.fine}${t.kmTot ? ' · ' + t.kmTot + ' km' : ''}</p>
                                            </div>
                                            <div class="text-right">
                                                <p class="text-base sm:text-lg font-black text-gray-900">${t.ore} h</p>
                                                <p class="text-xs font-bold text-gray-500">${formatCurrency(d.mediaOra)}/ora</p>
                                            </div>
                                        </div>
                                    `).join('') : '<p class="text-sm text-gray-400">Nessun turno registrato.</p>'}

                                    ${d.listaUscite.length ? `
                                        <div class="divide-y divide-gray-100 border border-gray-100 rounded-xl">
                                            ${righeSpeseGiornata(d.listaUscite)}
                                        </div>
                                    ` : '<p class="text-sm text-gray-400">Nessuna spesa registrata.</p>'}
                                </div>
                            </div>
                        </div>
                    `}
                </div>`;
        }

        function renderRiepilogoMensile() {
            const ym = meseSelezionato();
            const [anno, mese] = ym.split('-').map(Number);
            const d = aggrega(ym);
            const serie = serieMensile(ym);
            const gSel = giornoSelezionato();

            const lavorati = serie.filter(x => x.nCorse > 0);
            // Riposi contati solo fino a oggi: i giorni futuri non sono riposi, sono da compilare
            const oggi = oggiISO();
            const trascorsi = serie.filter(x => x.iso <= oggi);
            const riposi = trascorsi.filter(x => x.nCorse === 0);
            const maxIncasso = Math.max(1, ...serie.map(x => x.incassi));
            const migliore = lavorati.length ? lavorati.reduce((a, b) => (b.incassi > a.incassi ? b : a)) : null;
            const peggiore = lavorati.length ? lavorati.reduce((a, b) => (b.incassi < a.incassi ? b : a)) : null;
            const mediaGiorno = lavorati.length ? d.incassi / lavorati.length : 0;

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden print-card print-break">
                    <div class="bg-gray-900 px-5 py-4 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h3 class="text-lg font-black text-yellow-400 leading-tight">Riepilogo mensile</h3>
                            <p class="text-xs text-gray-300 font-bold">${nomeMese(mese)} ${anno}</p>
                        </div>
                        <div class="flex items-center gap-2 no-print">
                            <button onclick="scorriMese(-1)" title="Mese precedente" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-400 font-black">‹</button>
                            <input type="month" value="${ym}" onchange="setDashMese(this.value)" class="p-2 rounded-lg text-sm font-bold bg-white border-0 outline-none" />
                            <button onclick="scorriMese(1)" title="Mese successivo" class="w-9 h-9 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-400 font-black">›</button>
                        </div>
                    </div>

                    <div class="p-5 space-y-5">
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                            ${boxDato('Incassi del mese', formatCurrency(d.incassi), 'text-green-600')}
                            ${boxDato('Spese del mese', d.uscite ? '-' + formatCurrency(d.uscite) : formatCurrency(0), 'text-red-600')}
                            ${boxDato('Saldo', formatCurrency(d.saldo), d.saldo >= 0 ? 'text-gray-900' : 'text-red-600')}
                            ${boxDato('Giorni lavorati', `${lavorati.length} <span class="text-xs font-bold text-gray-400">riposo ${riposi.length}</span>`)}
                        </div>

                        <!-- Grafico incassi per giorno: tocca una barra per aprire quel giorno -->
                        <div>
                            <div class="flex justify-between items-baseline mb-2">
                                <p class="text-xs font-black uppercase tracking-wider text-gray-500">Incassi giorno per giorno</p>
                                <p class="text-[10px] font-bold text-gray-400 no-print"><span class="inline-block w-2 h-2 rounded-sm bg-blue-200 align-middle"></span> riposo · tocca una barra per il dettaglio</p>
                            </div>
                            <div class="flex items-end gap-[2px] h-32 border-b-2 border-gray-200">
                                ${serie.map(x => `
                                    <div onclick="setDashGiorno('${x.iso}')" title="${x.giorno}: ${x.nCorse > 0 ? formatCurrency(x.incassi) + ' · ' + x.nCorse + ' corse' : (x.iso <= oggi ? 'riposo' : 'da compilare')}"
                                         class="flex-1 h-full flex flex-col justify-end cursor-pointer group">
                                        <div class="w-full rounded-t-sm transition-colors ${x.iso === gSel ? 'bg-gray-900' : (x.incassi > 0 ? 'bg-yellow-400 group-hover:bg-yellow-500' : (x.iso <= oggi ? 'bg-blue-200' : 'bg-gray-100'))}"
                                             style="height:${x.incassi > 0 ? Math.max(3, (x.incassi / maxIncasso) * 100) : 3}%"></div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="flex gap-[2px] mt-1">
                                ${serie.map(x => `<div class="flex-1 text-center text-[9px] font-bold ${x.iso === gSel ? 'text-gray-900' : 'text-gray-300'}">${x.giorno % 5 === 0 || x.iso === gSel ? x.giorno : ''}</div>`).join('')}
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                            <div class="space-y-3">
                                <p class="text-xs font-black uppercase tracking-wider text-gray-500">Incassi per metodo</p>
                                ${bloccoIncassiPerMetodo(d, { vuoto: 'Nessun incasso in questo mese.' })}
                            </div>

                            <div class="space-y-3">
                                <div class="flex justify-between items-baseline">
                                    <p class="text-xs font-black uppercase tracking-wider text-gray-500">Spese per categoria</p>
                                    ${d.uscite > 0 ? '<p class="text-[10px] font-bold text-gray-400 no-print">tocca per il dettaglio</p>' : ''}
                                </div>
                                ${bloccoSpesePerCategoria(d, 'mese', 'Nessuna spesa in questo mese.')}
                                <div class="grid grid-cols-2 gap-3 pt-1">
                                    ${boxDato('Corse', `${d.nCorse}`)}
                                    ${boxDato('Ore lavorate', `${d.ore.toFixed(1)} h`)}
                                    ${boxDato('Turni', `${d.nTurni}`)}
                                    ${boxDato('Giorni di riposo', `${riposi.length}`)}
                                    ${boxDato('Media a giornata', formatCurrency(mediaGiorno))}
                                    ${boxDato('Media oraria', formatCurrency(d.mediaOra))}
                                </div>
                            </div>
                        </div>

                        ${migliore ? `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button onclick="setDashGiorno('${migliore.iso}')" class="text-left bg-green-50 border border-green-200 rounded-xl p-3 hover:bg-green-100 transition-colors">
                                    <p class="text-[10px] font-black uppercase tracking-wider text-green-700">Giornata migliore</p>

                                </select>

                            ${filtriAttivi ? `
                                <button onclick="azzeraFiltriCorse()" class="h-9 px-3 rounded-lg bg-gray-100 hover:bg-gray-200 text-xs font-black text-gray-700">Azzera filtri</button>
