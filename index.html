        // Esporta i movimenti dell'anno attivo in CSV, pensato per essere aperto in
        // Excel/Numeri e passato al commercialista (separatore ';' e virgola decimale,
        // come si aspetta un Excel impostato in italiano).
        function exportCSV() {
            const recs = recordsAnno().slice().sort((a, b) => new Date(a.data) - new Date(b.data));
            const righe = [['Data', 'Tipo', 'Categoria', 'Note', 'Metodo', 'Importo (EUR)']];
            recs.forEach(r => {
                righe.push([
                    r.data || '',
                    r.tipo === 'ENTRATA' ? 'Incasso' : 'Spesa',
                    (r.categoria || '').replace(/;/g, ','),
                    (r.nota || '').replace(/;/g, ','),
                    r.metodo || '',
                    (parseFloat(r.importo || 0)).toFixed(2).replace('.', ',')
                ]);
            });
            const csv = righe.map(riga => riga.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            scaricaFile(blob, `TaxiManager_Movimenti_${annoAttivo()}.csv`);
            showToast(`CSV ${annoAttivo()} scaricato!`);
        }

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (!data || typeof data !== 'object') throw new Error('formato non riconosciuto');

                    const valida = (x) => !!x && x.id !== undefined && x.id !== null
                        && /^\d{4}-\d{2}-\d{2}$/.test(String(x.data || ''));
                    const records = (Array.isArray(data.records) ? data.records : []).filter(valida);
                    const shifts = (Array.isArray(data.shifts) ? data.shifts : []).filter(valida);
                    const scadenze = (Array.isArray(data.scadenze) ? data.scadenze : []).filter(valida);
                    const veicoli = (Array.isArray(data.veicoli) ? data.veicoli : [])
                        .filter(v => v && v.id !== undefined && v.id !== null && String(v.modello || '').trim());
                    const vociImportate = (Array.isArray(data.vociFisse) ? data.vociFisse : [])
                        .filter(v => v && String(v.slug || '').trim() && String(v.nome || '').trim());
                    const scartati = (Array.isArray(data.records) ? data.records.length : 0) - records.length
                        + (Array.isArray(data.shifts) ? data.shifts.length : 0) - shifts.length;

                    if (!records.length && !shifts.length && !scadenze.length && !veicoli.length && !vociImportate.length) {
                        showToast('Il file non contiene movimenti, turni o scadenze validi.');
                        return;
                    }

                    const nRec = records.length;
                    const nTur = shifts.length;
                    showToast(`Importazione di ${nRec} movimenti e ${nTur} turni in corso...`);

                    const esito = await window.bulkSave(
                        records,
                        shifts,
                        (fatti, tot) => showToast(`Sincronizzazione Cloud ${fatti}/${tot}...`)
                    );

                    // Le scadenze non passano da bulkSave: si uniscono per identificativo
                    // e si ripubblicano una per una sul Cloud.
                    if (scadenze.length) {
                        const mappa = new Map((window.scadenze || []).map(x => [String(x.id), x]));
                        scadenze.forEach(x => mappa.set(String(x.id), x));
                        window.scadenze = Array.from(mappa.values())
                            .sort((a, b) => String(a.data).localeCompare(String(b.data)));
                        salvaScadenze();
                        if (window.saveScadenzaToCloud) scadenze.forEach(x => window.saveScadenzaToCloud(x));
                    }

                    if (vociImportate.length) {
                        const mappa = new Map((window.vociFisse || []).map(x => [String(x.slug), x]));
                        vociImportate.forEach(x => mappa.set(String(x.slug), x));
                        window.vociFisse = Array.from(mappa.values());
                        salvaVociFisse();
                        if (window.saveVoceFissaToCloud) vociImportate.forEach(x => window.saveVoceFissaToCloud(x));
                    }

                    // Stessa cosa per le vetture del parco auto
                    if (veicoli.length) {
                        const mappa = new Map((window.veicoli || []).map(x => [String(x.id), x]));
                        veicoli.forEach(x => mappa.set(String(x.id), x));
                        window.veicoli = Array.from(mappa.values());
                        salvaVeicoli();
                        if (window.saveVeicoloToCloud) veicoli.forEach(x => window.saveVeicoloToCloud(x));
                    }

                    const pezzi = [];
                    if (scadenze.length) pezzi.push(`${scadenze.length} scadenze`);
                    if (veicoli.length) pezzi.push(`${veicoli.length} vetture`);
                    const coda = pezzi.length ? ' e ' + pezzi.join(', ') : '';
                    showToast(esito.cloud
                        ? `⚡ Importati ${nRec} movimenti, ${nTur} turni${coda} (locale + Cloud)!`
                        : `✅ Importati ${nRec} movimenti, ${nTur} turni${coda} (memoria locale)`);
                    if (scartati > 0) {
                        setTimeout(() => showToast(`${scartati} righe del file sono state ignorate perché incomplete.`), 3200);
                    }
                    renderNav();
                    renderContent();
                } catch (err) {
                    console.error(err);
                    showToast('Errore nel file di backup.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Voci di costo fisso con la quota giornaliera predefinita.
        // Sono quelle che non compaiono altrove: manutenzione, INPS e IRPEF sono
        // volutamente escluse per non contarle due volte.
        // Alcune di queste spese sono una rata fissa che arriva ogni mese uguale
        // (il finanziamento); altre sono un importo annuo che ha senso spalmare
        // giorno per giorno (le assicurazioni). Con l'unita' sbagliata i conti
        // ballano: una rata mensile spalmata a giornata darebbe 733,60 € a
        // febbraio e 812,20 € a gennaio, quando la banca ne addebita 797 sempre.
        // ============================================================
        //  LE TUE VOCI DI COSTO FISSO
        //  L'elenco non e' piu' fisso nel programma: si aggiungono, si
        //  modificano e si tolgono, e ognuna vale in un periodo suo. Una
        //  polizza che parte a marzo non deve comparire a gennaio, e una
        //  rata che finisce a settembre non deve proseguire a ottobre.
        // ============================================================

        // Come partiva il programma prima che l'elenco diventasse modificabile.
        // Gli "slug" sono quelli storici: formano l'identificativo dei movimenti
        // gia' generati, e cambiandoli rigenerare creerebbe dei doppioni invece
        // di aggiornare quelli che ci sono.
        const VOCI_FISSE_INIZIALI = [
            { slug: 'finanziamento',  nome: 'Finanziamento licenza',   importo: 797.00, unita: 'mese' },
            { slug: 'radiotaxi',      nome: 'Radio taxi',              importo: 10.50,  unita: 'giorno' },
            { slug: 'commercialista', nome: 'Commercialista',          importo: 4.50,   unita: 'giorno' },
            { slug: 'assic-auto',     nome: 'Assicurazione auto',      importo: 3.80,   unita: 'giorno' },
            { slug: 'assic-infort',   nome: 'Assicurazione infortuni', importo: 1.37,   unita: 'giorno' }
        ];

        // Le voci di partenza si mettono una volta sola, al primo avvio. Se poi le
        // togli tutte l'elenco resta vuoto: senza questo segno tornavano da sole,
        // e cancellare l'ultima voce ne faceva ricomparire cinque.
        function elencoVociFisse() {
            if (!Array.isArray(window.vociFisse)) window.vociFisse = [];
            if (!window.vociFisse.length && !localStorage.getItem('taxi_voci_fisse_avviato')) {
                window.vociFisse = VOCI_FISSE_INIZIALI.map(v => Object.assign({ dataInizio: '', dataFine: '' }, v));
                salvaVociFisse();
            }
            return window.vociFisse;
        }

        // ============================================================
        //  IL BUDGET DEI COSTI FISSI
        //  Queste voci non sono movimenti: sono una previsione. Servono a sapere
        //  quanto pesa una giornata prima ancora che la spesa esca dal conto,
        //  cosi' l'incasso reale del giorno e' un numero vero anche a meta' mese.
        //  Quando la spesa esce davvero la si registra come qualsiasi altra, nel
        //  giorno in cui e' stata pagata, e il conguaglio dice di quanto il
        //  preventivo si e' discostato dal consuntivo.
        // ============================================================

        function giorniDellAnno(anno) {
            return new Date(parseInt(anno, 10), 1, 29).getDate() === 29 ? 366 : 365;
        }

        // Quanto pesa una singola voce in una singola giornata. La voce vale solo
        // dentro il suo periodo; una rata mensile si divide per i giorni di quel
        // mese, cosi' febbraio e marzo tornano tutti e due alla rata intera, e una
        // cifra annuale si divide per i giorni dell'anno.
        function quotaVoceGiorno(v, iso, giorniMese) {
            const imp = parseFloat(v && v.importo || 0);
            if (!(imp > 0)) return 0;
            const g = String(iso || '');
            if (v.dataInizio && g < v.dataInizio) return 0;
            if (v.dataFine && g > v.dataFine) return 0;
            if (v.unita === 'anno') return imp / giorniDellAnno(g.slice(0, 4));
            if (v.unita === 'mese') return imp / (giorniMese || giorniDelMese(g.slice(0, 7)));
            return imp;
        }

        function budgetDelGiorno(iso) {
            const g = String(iso || '');
            if (g.length < 10) return 0;
            const gg = giorniDelMese(g.slice(0, 7));
            let tot = 0;
            elencoVociFisse().forEach(v => { tot += quotaVoceGiorno(v, g, gg); });
            return tot;
        }

        // Scorre le giornate fra due date comprese
        function perOgniGiorno(da, a, fn) {
            const [y, m, d] = String(da).split('-').map(Number);
            if (!y || !m || !d) return;
            const fine = String(a);
            const cur = new Date(y, m - 1, d);
            for (let giri = 0; giri < 4000; giri++) {
                const iso = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
                if (iso > fine) return;
                fn(iso);
                cur.setDate(cur.getDate() + 1);
            }
        }

        // Budget maturato da una voce fra due date comprese
        function budgetVocePeriodo(v, da, a) {
            let tot = 0, giorni = 0;
            perOgniGiorno(da, a, (iso) => {
                const q = quotaVoceGiorno(v, iso);
                if (q > 0) giorni++;
                tot += q;
            });
            return { totale: Math.round(tot * 100) / 100, giorni };
        }

        function budgetPeriodo(da, a) {
            let tot = 0;
            perOgniGiorno(da, a, (iso) => { tot += budgetDelGiorno(iso); });
            return Math.round(tot * 100) / 100;
        }

        function budgetAnno(anno) { return budgetPeriodo(`${anno}-01-01`, `${anno}-12-31`); }
        function budgetMese(ym) {
            const gg = giorniDelMese(ym);
            return budgetPeriodo(`${ym}-01`, `${ym}-${String(gg).padStart(2, '0')}`);
        }

        function salvaVociFisse() {
            try {
                localStorage.setItem('taxi_voci_fisse', JSON.stringify(window.vociFisse || []));
                localStorage.setItem('taxi_voci_fisse_avviato', '1');
            } catch (err) { /* spazio esaurito: pazienza */ }
        }

        // Identificativo breve e stabile, ricavato dal nome: e' quello che
        // finisce nell'id dei movimenti, quindi non deve scontrarsi con altri.
        function slugVoce(nome) {
            const base = normalizzaSlug(nome) || 'voce';
            const presi = new Set(elencoVociFisse().map(v => v.slug));
            if (!presi.has(base)) return base;
            let n = 2;
            while (presi.has(base + '-' + n)) n++;
            return base + '-' + n;
        }

        function normalizzaSlug(t) {
            return String(t || '').toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 24);
        }

        function aggiungiVoceFissa() {
            const elenco = leggiVociFisse();
            const nome = 'Nuova voce';
            elenco.push({
                slug: slugVoce(nome + '-' + Date.now().toString().slice(-5)),
                nome: '', importo: 0, unita: 'mese',
                dataInizio: '', dataFine: ''
            });
            salvaVociFisse();
            renderContent();
            setTimeout(() => {
                const campi = document.querySelectorAll('input[id^="cf-nome-"]');
                const ultimo = campi[campi.length - 1];
                if (ultimo) { ultimo.focus(); ultimo.scrollIntoView({ block: 'center' }); }
            }, 0);
        }

        // Quello che c'e' scritto adesso nei campi, senza aspettare un salvataggio:
        // cosi' modificando una voce e premendo Genera si usa il valore nuovo.
        function leggiVociFisse() {
            const elenco = elencoVociFisse();
            elenco.forEach(v => {
                const leggi = (p) => {
                    const el = document.getElementById(p + v.slug);
                    return el ? String(el.value || '').trim() : null;
                };
                const nome = leggi('cf-nome-');
                if (nome !== null) v.nome = nome;
                const importo = leggi('cf-imp-');
                if (importo !== null) {
                    if (!importo) {
                        v.importo = 0;
                    } else {
                        const n = numeroScritto(importo);
                        // Se quello che c'e' scritto non si capisce si tiene l'importo
                        // di prima invece di azzerarlo: azzerarlo in silenzio avrebbe
                        // tolto la voce dal budget senza dire niente. A dirlo ci pensa
                        // salvaModificheVociFisse().
                        if (Number.isFinite(n) && n >= 0) v.importo = Math.round(n * 100) / 100;
                    }
                }
                const unita = leggi('cf-unita-');
                if (unita !== null) v.unita = unita;
                const dal = leggi('cf-dal-');
                if (dal !== null) v.dataInizio = dal;
                const al = leggi('cf-al-');
                if (al !== null) v.dataFine = al;
            });
            return elenco;
        }

        // Si guardano i campi e non le voci: sulla voce l'importo illeggibile e'
        // gia' diventato zero, e uno zero scritto per sbaglio non si distingue
        // piu' da uno zero voluto.
        function voceConImportoIlleggibile() {
            const trovata = elencoVociFisse().find(v => {
                const el = document.getElementById('cf-imp-' + v.slug);
                if (!el) return false;
                const t = String(el.value || '').trim();
                return t && !Number.isFinite(numeroScritto(t));
            });
            return trovata || null;
        }

        function salvaModificheVociFisse() {
            const storto = voceConImportoIlleggibile();
            if (storto) { showToast(`L'importo di «${storto.nome}» non si capisce: scrivi solo cifre, per esempio 6.500 oppure 12,80.`); return; }
            const elenco = leggiVociFisse();
            const senzaNome = elenco.filter(v => !String(v.nome || '').trim()).length;
            if (senzaNome) { showToast('Ogni voce deve avere un nome.'); return; }
            const dateStorte = elenco.filter(v => v.dataInizio && v.dataFine && v.dataFine < v.dataInizio).length;
            if (dateStorte) { showToast('In una voce la data finale viene prima di quella iniziale.'); return; }
            // Due voci con lo stesso nome raddoppierebbero il budget e nel
            // conguaglio le spese finirebbero tutte su una sola delle due.
            const viste = new Set();
            const doppia = elenco.find(v => {
                const k = chiaveNome(v.nome);
                if (viste.has(k)) return true;
                viste.add(k);
                return false;
            });
            if (doppia) { showToast(`Ci sono due voci che si chiamano «${doppia.nome}»: cambiane una.`); return; }
            salvaVociFisse();
            if (window.saveVoceFissaToCloud) elenco.forEach(v => window.saveVoceFissaToCloud(v));
            showToast('Voci di costo fisso salvate.');
            renderContent();
        }

        function eliminaVoceFissa(slug) {
            const v = elencoVociFisse().find(x => x.slug === slug);
            if (!v) return;
            if (!confirm(`Tolgo «${v.nome || 'questa voce'}» dall'elenco dei costi fissi?\nI movimenti già generati restano dove sono: puoi eliminarli dalla tabella qui sotto.`)) return;
            window.vociFisse = leggiVociFisse().filter(x => x.slug !== slug);
            salvaVociFisse();
            if (window.deleteVoceFissaFromCloud) window.deleteVoceFissaFromCloud(slug);
            showToast('Voce tolta dall\'elenco.');
            renderContent();
        }

        // Scheda di una voce. I campi hanno la loro etichetta e la loro riga:
        // stipandoli su una riga sola, su iPad il campo dell'importo si
        // schiacciava fino a sparire e il nome restava troncato.
        function rigaVoceFissa(v) {
            const val = (x) => x === null || x === undefined ? '' : esc(x);
            const etichetta = (t) => `<span class="block text-[10px] font-black uppercase tracking-wider text-gray-400 mb-1">${t}</span>`;
            return `
                <div class="border border-gray-200 rounded-xl p-4 space-y-3 bg-gray-50/60">
                    <label class="block">
                        ${etichetta('Che spesa è')}
                        <div class="flex gap-2">
                            <input type="text" id="cf-nome-${esc(v.slug)}" value="${val(v.nome)}" placeholder="Es. Radio taxi"
                                   class="flex-1 min-w-0 p-2.5 border rounded-lg outline-none font-bold bg-white" />
                            <button type="button" onclick="eliminaVoceFissa('${escJs(v.slug)}')"
                                    class="flex-shrink-0 text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 rounded-lg text-xs font-bold">Togli</button>
                        </div>
                    </label>

                    <div class="grid grid-cols-2 gap-2">
                        <label class="block">
                            ${etichetta('Importo')}
                            <input type="text" inputmode="decimal" id="cf-imp-${esc(v.slug)}"
                                   value="${val(String(v.importo).replace('.', ','))}" placeholder="0,00"
                                   class="w-full p-2.5 border rounded-lg outline-none font-bold bg-white" style="min-width:0" />
                        </label>
                        <label class="block">
                            ${etichetta('Ogni')}
                            <select id="cf-unita-${esc(v.slug)}" class="w-full p-2.5 border rounded-lg outline-none font-bold bg-white">
                                <option value="giorno" ${(v.unita !== 'mese' && v.unita !== 'anno') ? 'selected' : ''}>giorno</option>
                                <option value="mese" ${v.unita === 'mese' ? 'selected' : ''}>mese</option>
                                <option value="anno" ${v.unita === 'anno' ? 'selected' : ''}>anno</option>
                            </select>
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <label class="block">
                            ${etichetta('Dal')}
                            <input type="date" id="cf-dal-${esc(v.slug)}" value="${val(v.dataInizio)}"
                                   class="w-full p-2.5 border rounded-lg outline-none text-sm bg-white" />
                        </label>
                        <label class="block">
                            ${etichetta('Al')}
                            <input type="date" id="cf-al-${esc(v.slug)}" value="${val(v.dataFine)}"
                                   class="w-full p-2.5 border rounded-lg outline-none text-sm bg-white" />
                        </label>
                    </div>
                    ${(() => {
                        const imp = parseFloat(v.importo || 0);
                        if (!(imp > 0)) return '<p class="text-[11px] text-gray-400">Dal e Al vuoti = la voce vale sempre, anno dopo anno.</p>';
                        const anno = annoAttivo();
                        const b = budgetVocePeriodo(v, `${anno}-01-01`, `${anno}-12-31`);
                        const alGiorno = v.unita === 'anno' ? imp / giorniDellAnno(anno) : (v.unita === 'mese' ? imp * 12 / 365 : imp);
                        return `<p class="text-[11px] text-gray-500">
                                    <strong>${formatCurrency(alGiorno)} al giorno</strong> · ${formatCurrency(b.totale)} nel ${esc(anno)}${b.giorni < 365 ? ` (${b.giorni} giorni coperti)` : ''}.
                                    Dal e Al vuoti = la voce vale sempre, anno dopo anno.
                                </p>`;
                    })()}
                </div>`;
        }

        // Il riquadro del budget: l'elenco delle voci e quanto pesano in tutto
        function sezioneBudgetFissi() {
            const anno = annoAttivo();
            const voci = elencoVociFisse();
            const nellAnno = budgetAnno(anno);
            // Media sull'anno: i mesi non hanno tutti lo stesso numero di giorni,
            // quindi una rata mensile pesa un filo di piu' a febbraio.
            const giorniAnno = new Date(parseInt(anno, 10), 1, 29).getDate() === 29 ? 366 : 365;
            const alGiorno = nellAnno / giorniAnno;

            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div class="flex flex-wrap items-start justify-between gap-3">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900">Budget dei costi fissi</h3>
                            <p class="text-xs text-gray-500 leading-relaxed mt-1 max-w-2xl">
                                Quanto ti costa lavorare, prima ancora di uscire di casa: la licenza, il radio taxi, il
                                commercialista, le assicurazioni. <strong>Non sono movimenti</strong>: sono una
                                previsione che matura ogni giorno, e serve a sapere quanto devi incassare oggi.
                                Le spese vere le registri quando escono dal conto, e il conguaglio qui sotto confronta
                                le due cose.
                            </p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400">Pesa in media ogni giorno</p>
                            <p class="text-2xl font-black text-indigo-900">${formatCurrency(alGiorno)}</p>
                            <p class="text-[11px] font-bold text-gray-400">${formatCurrency(nellAnno)} nel ${esc(anno)}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-3">
                        ${voci.map(rigaVoceFissa).join('') || '<p class="text-sm text-gray-400">Nessuna voce: aggiungine una qui sotto.</p>'}
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button onclick="aggiungiVoceFissa()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-xl text-sm">+ Aggiungi una voce</button>
                        <button onclick="salvaModificheVociFisse()" class="bg-gray-900 hover:bg-gray-800 text-yellow-400 font-bold py-2 px-4 rounded-xl text-sm">Salva il budget</button>
                    </div>

                    <p class="text-xs text-gray-500 leading-relaxed">
                        L'importo si scrive con la virgola o con il punto, e ha la sua unità: <strong>mese</strong> per
                        una rata che arriva sempre uguale (il finanziamento della licenza), <strong>anno</strong> per
                        una cifra che ti aspetti in dodici mesi (6.500 € di carburante), <strong>giorno</strong> per un
                        costo già ridotto a giornata. Con <strong>Dal</strong> e <strong>Al</strong> si dice da quando a
                        quando vale: una polizza che parte il 15 marzo non pesa a gennaio.<br><br>
                        Ci puoi mettere anche una spesa che cambia da un mese all'altro, come il carburante: metti a
                        budget quello che prevedi di spendere in un anno, ogni giornata ne porta la sua quota, e il
                        conguaglio ti dice a fine anno quanto ci hai preso. Le spese di carburante e manutenzione
                        continui a registrarle nella loro categoria di sempre — restano nel costo al chilometro delle
                        vetture — e il conguaglio le riconosce lo stesso, dal nome.<br><br>
                        Quello che <strong>non</strong> metti a budget, l'app lo spalma da sola facendo la media di
                        quello che hai registrato nel mese. INPS e IRPEF lasciali fuori: sono già stimate più sotto.
                    </p>
                </div>`;
        }


        // ============================================================
        //  COSTI FISSI GIA' IN ARCHIVIO
        //  Versioni diverse dell'app hanno usato nomi (e identificativi)
        //  diversi per le stesse voci: rigenerando, la serie nuova si
        //  affianca alla vecchia invece di sostituirla, e il mese risulta
        //  pagato due volte. Qui si vede cosa c'e' davvero e si toglie
        //  la serie di troppo in un colpo solo.
        // ============================================================

        // Le voci generate dal pulsante "Genera costi fissi" hanno un identificativo
        // che comincia per "fissi-". Tutte le altre arrivano da una versione
        // precedente dell'app o sono state scritte a mano: e' questo, e non il
        // nome, a distinguere le due serie. Alcune voci (Radio taxi, Assicurazione
        // infortuni) si chiamano infatti uguali in entrambe.
        function generataDallApp(r) {
            return String(r.id || '').startsWith('fissi-');
        }

        // Raggruppa i movimenti "Costi fissi" per nome e provenienza
        // Anno su cui lavora il pannello di pulizia: '' = tutti
        function annoPulizia() {
            return window.annoPuliziaFissi || '';
        }

        function impostaAnnoPulizia(v) {
            window.annoPuliziaFissi = v || '';
            renderContent();
        }

        // Gli anni in cui ci sono costi fissi scritti come movimenti
        function anniCostiFissi() {
            const anni = new Set();
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA') return;
                if (categoriaBase(r.categoria) !== 'Costi fissi') return;
                anni.add(String(r.data || '').slice(0, 4));
            });
            return Array.from(anni).filter(Boolean).sort();
        }

        function gruppiCostiFissi() {
            const gruppi = {};
            const anno = annoPulizia();
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA') return;
                if (categoriaBase(r.categoria) !== 'Costi fissi') return;
                if (anno && String(r.data || '').slice(0, 4) !== anno) return;
                const nome = nomeSpesaDiRecord(r) || sottocategoria(r.categoria);
                const daApp = generataDallApp(r);
                const chiave = (daApp ? 'app|' : 'altra|') + nome;
                if (!gruppi[chiave]) {
                    gruppi[chiave] = { chiave, nome, daApp, voci: [], totale: 0, dal: r.data, al: r.data, mesi: new Set() };
                }
                const g = gruppi[chiave];
                g.voci.push(r);
                g.totale += parseFloat(r.importo || 0);
                if (String(r.data) < String(g.dal)) g.dal = r.data;
                if (String(r.data) > String(g.al)) g.al = r.data;
                g.mesi.add(String(r.data).slice(0, 7));
            });
            return Object.values(gruppi).sort((a, b) => (a.daApp === b.daApp) ? b.totale - a.totale : (a.daApp ? 1 : -1));
        }

        // Le righe scritte dall'app quando i costi fissi erano movimenti: sono
        // quelle che il budget rende inutili. Le spese scritte a mano restano,
        // perche' sono i pagamenti veri e il conguaglio li conta.
        function serieGenerata() {
            return gruppiCostiFissi().filter(g => g.daApp);
        }

        async function eliminaGruppoCostiFissi(chiave) {
            const g = gruppiCostiFissi().find(x => x.chiave === chiave);
            if (!g) return;
            if (!confirm(`Elimino tutte le ${g.voci.length} voci di «${g.nome}»${g.daApp ? '' : ' (versione precedente)'}, per un totale di ${formatCurrency(g.totale)}?\nDal ${g.dal} al ${g.al}. L'operazione non si può annullare.`)) return;

            const ids = g.voci.map(v => v.id);
            showToast(`Elimino ${ids.length} voci...`);
            if (typeof window.deleteRecordsFromCloud === 'function') {
                await window.deleteRecordsFromCloud(ids);
            } else {
                const insieme = new Set(ids.map(String));
                window.dailyRecords = (window.dailyRecords || []).filter(r => !insieme.has(String(r.id)));
                scriviLocale('taxi_records', window.dailyRecords);
            }
            showToast(`${ids.length} voci di «${g.nome}» eliminate.`);
            renderNav();
            renderContent();
        }

        // Toglie in un colpo solo tutte le voci di costo fisso che non ha
        // generato questa app: e' la serie rimasta da una versione precedente.
        async function eliminaSerieGenerata() {
            const gruppi = serieGenerata();
            if (!gruppi.length) return;
            const righe = gruppi.reduce((a, g) => a + g.voci.length, 0);
            const totale = gruppi.reduce((a, g) => a + g.totale, 0);
            const elenco = gruppi.map(g => `  · ${g.nome}: ${g.voci.length} righe, ${formatCurrency(g.totale)}`).join('\n');
            const dove = annoPulizia() ? `del ${annoPulizia()}` : 'di tutti gli anni';
            const quali = annoPulizia() ? `del ${annoPulizia()}` : 'di quegli anni';
            if (!confirm(`Elimino ${righe} righe di costi fissi ${dove}, generate dalle versioni precedenti, per ${formatCurrency(totale)} in tutto:\n\n${elenco}\n\nRestano le spese che hai registrato tu. Attenzione: i totali ${quali} caleranno di ${formatCurrency(totale)} e la stima delle tasse cambierà.\nL'operazione non si può annullare: hai già scaricato un backup?`)) return;

            const ids = [].concat(...gruppi.map(g => g.voci.map(v => v.id)));
            showToast(`Elimino ${ids.length} voci...`);
            if (typeof window.deleteRecordsFromCloud === 'function') {
                await window.deleteRecordsFromCloud(ids);
            } else {
                const insieme = new Set(ids.map(String));
                window.dailyRecords = (window.dailyRecords || []).filter(r => !insieme.has(String(r.id)));
                scriviLocale('taxi_records', window.dailyRecords);
            }
            showToast(`${ids.length} righe generate eliminate.`);
            renderNav();
            renderContent();
        }

        // ============================================================
        //  CONGUAGLIO: PREVENTIVO CONTRO CONSUNTIVO
        //  Il budget e' una previsione che matura giorno per giorno; le spese
        //  fisse vere si registrano quando escono dal conto, tutte insieme o a
        //  rate. Qui si vede voce per voce quanto e' maturato e quanto e' stato
        //  speso davvero, e di quanto il preventivo ha sbagliato.
        // ============================================================
        function conguaglioAnno(anno) {
            const oggi = oggiISO();
            const inCorso = String(anno) === oggi.slice(0, 4);
            const da = `${anno}-01-01`;
            const fine = `${anno}-12-31`;
            // Il conto si fa sul budget di tutto l'anno: e' quello che hai
            // ipotizzato ed e' quello che vuoi vedere. Quanto ne sia maturato
            // finora resta accanto, in piccolo, per capire se sei in linea.
            const aOggi = inCorso ? oggi : fine;

            const righe = elencoVociFisse().map(v => {
                const b = budgetVocePeriodo(v, da, fine);
                return {
                    nome: String(v.nome || '').trim() || 'Voce senza nome',
                    budget: b.totale, giorniCoperti: b.giorni,
                    maturato: inCorso ? budgetVocePeriodo(v, da, aOggi).totale : b.totale,
                    speso: 0, movimenti: 0, ultima: ''
                };
            });
            const perNome = new Map(righe.map(r => [chiaveNome(r.nome), r]));
            const fuori = { nome: 'Altre spese fisse registrate', budget: 0, giorniCoperti: 0, maturato: 0, speso: 0, movimenti: 0, ultima: '', extra: true };

            let futuri = 0, importoFuturi = 0;
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'USCITA') return;
                const d = String(r.data || '');
                if (d < da || d > fine) return;
                if (!copertaDalBudget(r)) return;
                // Una spesa gia' registrata ma con data futura - tipico di una
                // serie ricorrente creata in anticipo - non e' ancora uscita dal
                // conto: si conta quando arriva, altrimenti la voce sembrerebbe
                // gia' pagata per intero a settembre.
                if (d > aOggi) { futuri++; importoFuturi += parseFloat(r.importo || 0); return; }
                // Stesso abbinamento che usa la quota del giorno: cosi' una spesa
                // tolta dalla media perche' coperta dal budget finisce per forza
                // nella riga di quella voce, e non fra le "altre".
                const voce = voceBudgetDiRecord(r);
                const riga = (voce && perNome.get(chiaveNome(voce.nome))) || fuori;
                riga.speso += parseFloat(r.importo || 0);
                riga.movimenti++;
                if (d > riga.ultima) riga.ultima = d;
            });

            const tutte = righe.concat(fuori.movimenti ? [fuori] : []);
            const budget = tutte.reduce((t, r) => t + r.budget, 0);
            const maturato = tutte.reduce((t, r) => t + (r.maturato || 0), 0);
            const speso = tutte.reduce((t, r) => t + r.speso, 0);
            // A che punto e' l'anno, e a che punto e' la spesa: due percentuali
            // che dicono in un colpo d'occhio se si sta dentro o si sta sforando.
            const pctAnno = budget > 0 ? (maturato / budget) * 100 : 0;
            const pctSpeso = budget > 0 ? (speso / budget) * 100 : 0;
            return {
                anno: String(anno), da, a: aOggi, fine, inCorso, righe: tutte,
                budget, maturato, speso, differenza: budget - speso, pctAnno, pctSpeso,
                futuri, importoFuturi
            };
        }

        function sezioneConguaglio() {
            const c = conguaglioAnno(annoAttivo());
            if (!c.righe.length) return '';
            const nessunaSpesa = c.speso === 0 && c.budget > 0;
            const avanzo = c.differenza;
            // A meta' anno "speso meno del budget" suonerebbe come un risparmio:
            // finche' l'anno non e' finito la differenza e' solo quello che deve
            // ancora uscire.
            const etichetta = avanzo < 0
                ? 'speso più del budget'
                : (c.inCorso ? 'ancora da spendere' : 'speso meno del budget');

            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div class="flex flex-wrap items-start justify-between gap-3">
                        <div class="max-w-2xl">
                            <h3 class="text-lg font-bold text-gray-900">Conguaglio ${esc(c.anno)}</h3>
                            <p class="text-xs text-gray-500 leading-relaxed mt-1">
                                Il budget che hai ipotizzato per il ${esc(c.anno)} è di <strong>${formatCurrency(c.budget)}</strong>;
                                finora ne hai speso <strong>${formatCurrency(c.speso)}</strong>.
                                ${c.inCorso
                                    ? `Le spese sono quelle registrate fino al ${ggMm(c.a)}.`
                                    : 'Anno chiuso: il conto è definitivo.'}
                            </p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-black uppercase tracking-wider text-gray-400">Differenza</p>
                            <p class="text-2xl font-black ${avanzo >= 0 ? 'text-green-700' : 'text-red-600'}">${avanzo >= 0 ? '+' : ''}${formatCurrency(avanzo)}</p>
                            <p class="text-[11px] font-bold text-gray-400">${etichetta}</p>
                        </div>
                    </div>

                    ${c.inCorso && c.budget > 0 ? `
                        <div class="bg-gray-50 border border-gray-100 rounded-xl p-4">
                            <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
                                <p class="text-xs font-black uppercase tracking-wider text-gray-500">A che punto sei</p>
                                <p class="text-[11px] font-bold text-gray-500">
                                    l'anno è al <strong class="text-gray-800">${c.pctAnno.toFixed(0)}%</strong> ·
                                    del budget ne hai speso il <strong class="${c.pctSpeso > c.pctAnno + 5 ? 'text-red-600' : 'text-gray-800'}">${c.pctSpeso.toFixed(0)}%</strong>
                                </p>
                            </div>
                            <div class="relative h-3 bg-gray-200 rounded-full overflow-hidden">
                                <div class="absolute inset-y-0 left-0 ${c.pctSpeso > c.pctAnno + 5 ? 'bg-red-500' : 'bg-green-600'} rounded-full" style="width:${Math.min(100, c.pctSpeso)}%"></div>
                                <div class="absolute inset-y-0 w-0.5 bg-gray-900" style="left:${Math.min(100, c.pctAnno)}%" title="a che punto è l'anno"></div>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-2 leading-relaxed">
                                La barra è quello che hai speso, la riga nera è a che punto è l'anno. Barra più corta
                                della riga: sei sotto le previsioni. Più lunga: stai spendendo più in fretta di quanto
                                avevi messo a budget. A oggi ne è maturato ${formatCurrency(c.maturato)}.
                            </p>
                        </div>` : ''}

                    ${c.futuri ? `
                        <p class="text-xs text-gray-500 leading-relaxed bg-gray-50 border border-gray-100 rounded-xl px-4 py-3">
                            Nel ${esc(c.anno)} ci sono anche <strong>${c.futuri} ${c.futuri === 1 ? 'movimento registrato in una data futura' : 'movimenti registrati in date future'}</strong>
                            per ${formatCurrency(c.importoFuturi)} — tipicamente una serie ricorrente creata in anticipo.
                            Qui non sono contati: entrano man mano che arriva la loro data. Nei totali dell'anno e nella stima delle tasse invece ci sono già.
                        </p>` : ''}

                    ${nessunaSpesa ? `
                        <div class="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4">
                            <p class="font-black text-yellow-900 text-sm">Nel ${esc(c.anno)} non hai ancora registrato nessuna spesa a budget</p>
                            <p class="text-xs text-yellow-800 mt-1 leading-relaxed">
                                Nel registro non c'è niente che corrisponda alle voci del budget: finché non registri
                                le spese vere questi soldi non entrano nei totali dell'anno né nella stima delle tasse.
                                Registrale come una spesa qualsiasi, il giorno in cui le paghi.
                            </p>
                        </div>` : ''}

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                                <tr>
                                    <th class="p-3 font-bold">Voce</th>
                                    <th class="p-3 font-bold text-right">Budget ${esc(c.anno)}</th>
                                    <th class="p-3 font-bold text-right">Speso davvero</th>
                                    <th class="p-3 font-bold text-right">Differenza</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${c.righe.map(r => {
                                    const d = r.budget - r.speso;
                                    const mat = r.maturato || 0;
                                    return `
                                    <tr class="${r.extra ? 'bg-yellow-50' : ''}">
                                        <td class="p-3 font-bold text-gray-800">
                                            ${esc(r.nome)}
                                            ${r.extra ? '<span class="ml-2 bg-yellow-200 text-yellow-900 px-2 py-0.5 rounded text-[10px] font-black uppercase">fuori budget</span>' : ''}
                                            <span class="block text-[11px] font-medium text-gray-400">
                                                ${r.movimenti ? `${r.movimenti} ${r.movimenti === 1 ? 'movimento' : 'movimenti'}, l'ultimo il ${ggMm(r.ultima)}` : 'nessun movimento registrato'}
                                            </span>
                                        </td>
                                        <td class="p-3 text-right font-bold text-gray-700 whitespace-nowrap">
                                            ${formatCurrency(r.budget)}
                                            ${c.inCorso && r.budget > 0 ? `<span class="block text-[11px] font-medium text-gray-400">a oggi ${formatCurrency(mat)}</span>` : ''}
                                        </td>
                                        <td class="p-3 text-right font-bold whitespace-nowrap ${(c.inCorso && r.speso > mat + 0.005) ? 'text-red-600' : 'text-gray-700'}">${formatCurrency(r.speso)}</td>
                                        <td class="p-3 text-right font-black whitespace-nowrap ${Math.abs(d) < 0.005 ? 'text-gray-400' : (d > 0 ? 'text-green-700' : 'text-red-600')}">${d > 0 ? '+' : ''}${formatCurrency(d)}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                            <tfoot>
                                <tr class="bg-gray-900 text-white">
                                    <td class="p-3 font-black">Totale</td>
                                    <td class="p-3 text-right font-black">
                                        ${formatCurrency(c.budget)}
                                        ${c.inCorso ? `<span class="block text-[11px] font-medium text-gray-400">a oggi ${formatCurrency(c.maturato)}</span>` : ''}
                                    </td>
                                    <td class="p-3 text-right font-black">${formatCurrency(c.speso)}</td>
                                    <td class="p-3 text-right font-black ${avanzo >= 0 ? 'text-green-400' : 'text-red-400'}">${avanzo >= 0 ? '+' : ''}${formatCurrency(avanzo)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <p class="text-xs text-gray-500 leading-relaxed">
                        Una differenza non è per forza un errore: a metà anno è normale aver speso meno del budget di
                        tutto l'anno, e una polizza pagata in un colpo solo a gennaio risulta in anticipo. Quello che
                        conta è il confronto con la colonnina «a oggi»: se una voce ha speso più di quanto sia maturato
                        il numero diventa rosso. Se invece resta a zero mese dopo mese, quella spesa non è mai stata
                        registrata.<br>
                        Il conguaglio confronta i due numeri, non li corregge: nei totali dell'anno e nella stima delle
                        tasse conta solo il <strong>speso davvero</strong>.
                    </p>
                </div>`;
        }

        function sezioneCostiFissiInArchivio() {
            const anni = anniCostiFissi();
            if (!anni.length) return '';
            // Se l'anno scelto prima non esiste piu' si torna a tutti
            if (annoPulizia() && !anni.includes(annoPulizia())) window.annoPuliziaFissi = '';
            const anno = annoPulizia();
            const gruppi = gruppiCostiFissi();
            const generate = serieGenerata();
            const righeGenerate = generate.reduce((a, g) => a + g.voci.length, 0);
            const totaleGenerate = generate.reduce((a, g) => a + g.totale, 0);

            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <div>
                        <h3 class="text-lg font-bold text-gray-900">Costi fissi scritti come movimenti</h3>
                        <p class="text-xs text-gray-500 leading-relaxed mt-1 max-w-3xl">
                            Adesso i costi fissi sono un <strong>budget</strong>, non dei movimenti: pesano ogni
                            giorno senza essere scritti da nessuna parte, e quello che paghi davvero lo registri
                            come una spesa qualsiasi. Qui sotto c'è tutto quello che nel registro porta ancora la
                            categoria "Costi fissi", diviso per provenienza.
                        </p>
                    </div>

                    <div class="flex flex-wrap items-end gap-3">
                        <label class="block">
                            <span class="block text-[10px] font-black uppercase tracking-wider text-gray-400 mb-1">Anno su cui lavorare</span>
                            <select onchange="impostaAnnoPulizia(this.value)" class="p-2.5 border rounded-lg outline-none font-bold bg-gray-50">
                                <option value="" ${!anno ? 'selected' : ''}>tutti gli anni</option>
                                ${anni.map(a => `<option value="${esc(a)}" ${anno === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
                            </select>
                        </label>
                        <p class="text-xs text-gray-500 leading-relaxed flex-1 min-w-[240px]">
                            ${anno
                                ? `L'elenco e il pulsante qui sotto riguardano <strong>solo il ${esc(anno)}</strong>: gli altri anni non vengono toccati.`
                                : 'Scegli un anno per fare pulizia solo su quello: per gli anni già chiusi conviene lasciare tutto com\'è.'}
                        </p>
                    </div>

                    ${generate.length ? `
                        <div class="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4">
                            <p class="font-black text-yellow-900 text-sm">
                                ${righeGenerate} righe generate dalle versioni precedenti${anno ? ' nel ' + esc(anno) : ''}
                            </p>
                            <p class="text-xs text-yellow-800 mt-1 leading-relaxed">
                                Valgono ${formatCurrency(totaleGenerate)}. Con il budget non servono più, ma
                                <strong>non toglierle alla leggera</strong>: sono l'unica traccia di quelle spese, e
                                togliendole i totali ${anno ? 'del ' + esc(anno) : 'di quegli anni'} calano di
                                ${formatCurrency(totaleGenerate)} e la stima delle tasse cambia. Ha senso toglierle
                                solo se registri al loro posto i pagamenti veri.
                            </p>
                            <button onclick="eliminaSerieGenerata()" class="mt-3 bg-red-600 hover:bg-red-700 text-white text-xs font-black px-4 py-2.5 rounded-xl">
                                Elimina le ${righeGenerate} righe generate${anno ? ' del ' + esc(anno) : ''}
                            </button>
                        </div>` : ''}

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                                <tr>
                                    <th class="p-3 font-bold">Voce</th>
                                    <th class="p-3 font-bold text-right">Righe</th>
                                    <th class="p-3 font-bold text-right">Totale</th>
                                    <th class="p-3 font-bold">Periodo</th>
                                    <th class="p-3 font-bold text-center">Azione</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${gruppi.map(g => `
                                    <tr class="${g.daApp ? 'bg-yellow-50' : ''}">
                                        <td class="p-3 font-bold text-gray-800">
                                            ${esc(g.nome)}
                                            ${g.daApp
                                                ? '<span class="ml-2 bg-yellow-200 text-yellow-900 px-2 py-0.5 rounded text-[10px] font-black uppercase whitespace-nowrap">generata dall\'app</span>'
                                                : '<span class="ml-2 bg-green-100 text-green-800 px-2 py-0.5 rounded text-[10px] font-black uppercase whitespace-nowrap">registrata da te</span>'}
                                        </td>
                                        <td class="p-3 text-right">${g.voci.length}</td>
                                        <td class="p-3 text-right font-bold text-red-600">${formatCurrency(g.totale)}</td>
                                        <td class="p-3 text-xs text-gray-500 whitespace-nowrap">${esc(g.dal)} → ${esc(g.al)}</td>
                                        <td class="p-3 text-center">
                                            <button onclick="eliminaGruppoCostiFissi('${escJs(g.chiave)}')"
                                                    class="text-red-600 bg-red-50 hover:bg-red-100 text-xs font-bold px-3 py-1.5 rounded whitespace-nowrap">
                                                Elimina
                                            </button>
                                        </td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                    <p class="text-xs text-gray-400">
                        Le righe «registrata da te» sono i pagamenti veri: sono quelle che il conguaglio confronta
                        con il budget. Scarica un backup prima di eliminare: l'operazione non si può annullare.
                    </p>
                </div>`;
        }

        async function resetAllData() {
            if (!confirm('Attenzione: verranno cancellati TUTTI i movimenti e i turni, anche sul Cloud. Procedere?')) return;
            if (!confirm('Conferma definitiva: l\'operazione non è reversibile. Hai gia\' scaricato un backup?')) return;
            showToast('Cancellazione in corso...');
            await window.wipeAllData();
            showToast('Tutti i dati sono stati azzerati.');
            renderContent();
        }

        window.onload = function() {
            renderNav();
            renderContent();
            controllaNomeFinanziamento();
        };
    </script>

    <!-- PWA: registrazione service worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js')
                    .then(function (reg) {
                        window.registrazioneSW = reg;

                        // Quando esce una versione nuova il telefono la scarica da solo,
                        // ma la schermata aperta resta quella vecchia finche' non si
                        // riapre l'app: senza un avviso non c'e' modo di accorgersene.
                        reg.addEventListener('updatefound', function () {
                            const nuovo = reg.installing;
                            if (!nuovo) return;
                            nuovo.addEventListener('statechange', function () {
                                if (nuovo.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (window.showToast) {
                                        window.showToast('⬆️ Nuova versione pronta: apri Cloud & Sync e tocca «Aggiorna adesso».');
                                    }
                                    if (window.renderContent) window.renderContent();
                                }
                            });
                        });

                        // Il controllo della versione nuova va chiesto: sull'app
                        // aggiunta alla schermata Home il telefono lo fa di rado, e
                        // si resta su una copia vecchia senza accorgersene.
                        try { reg.update(); } catch (e) { /* pazienza */ }
                        document.addEventListener('visibilitychange', function () {
                            if (document.visibilityState === 'visible' && window.registrazioneSW) {
                                try { window.registrazioneSW.update(); } catch (e) { /* pazienza */ }
                            }
                        });
                    })
                    .catch(function (e) { console.log('Service worker non registrato:', e); });

                // Il nuovo service worker ha preso il comando: la pagina va ricaricata
                // una volta sola per usare davvero la copia nuova. Alla primissima
                // installazione invece non c'era nessun comando prima, quindi non
                // e' un aggiornamento e ricaricare sarebbe solo un lampeggio.
                const avevaUnControllore = !!navigator.serviceWorker.controller;
                let giaRicaricata = false;
                navigator.serviceWorker.addEventListener('controllerchange', function () {
                    if (!avevaUnControllore || giaRicaricata) return;
                    giaRicaricata = true;
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
