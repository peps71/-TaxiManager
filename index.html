                settimana[idx].tot += perData[d].tot;
                settimana[idx].n += perData[d].n;
            });
            const perSettimana = [1, 2, 3, 4, 5, 6, 0].map(i => settimana[i]).map(v => ({
                nome: v.nome, gg: v.gg, tot: v.tot,
                perGg: v.gg ? v.tot / v.gg : 0,
                corseGg: v.gg ? v.n / v.gg : 0
            }));

            // Giornata record e giornata piu' fiacca dell'anno. Conto solo i giorni
            // con almeno un incasso: i riposi non sono giornate andate male.
            const turniPerData = {};
            turniAnno().filter(t => !isRiposo(t)).forEach(t => { turniPerData[t.data] = t; });
            const giornate = Object.keys(perData)
                .filter(d => perData[d].tot > 0)
                .map(d => {
                    const t = turniPerData[d];
                    return {
                        data: d,
                        tot: perData[d].tot,
                        nCorse: perData[d].n,
                        turno: t ? (t.turno || 'Personalizzato') : null,
                        ore: t ? parseFloat(t.ore || 0) : 0
                    };
                })
                .sort((a, b) => b.tot - a.tot);

            const giornoRecord = giornate[0] || null;
            // Se c'e' una sola giornata lavorata, record e peggiore coinciderebbero:
            // in quel caso non ha senso mostrare il confronto.
            const giornoPeggiore = giornate.length > 1 ? giornate[giornate.length - 1] : null;

            return {
                listaTurni, perSettimana, giornoRecord, giornoPeggiore,
                giornateLavorate: giornate.length,
                giorniLavorati: Object.keys(perData).length
            };
        }

        function renderRiepilogoGiornaliero() {

            const riposoEsplicito = d.riposi[0] || null;

                    ${riposo ? `

                            ${d.listaUscite.length ? `

                            <p class="text-gray-400 font-bold">Giornata ancora da compilare.</p>
                            <p class="text-xs text-gray-400 mt-1">Usa le frecce per spostarti di un giorno o il pulsante Ultimo.</p>
                        </div>
                    ` : `
                        <div class="p-5 space-y-5">
                            ${d.ore ? `<p class="text-sm font-bold text-gray-500">${formatCurrency(d.mediaOra)} all'ora · ${oreScritte(d.ore)} h di turno</p>` : ''}

                            ${bloccoQuotaSpese(g, d.incassi, d.uscite)}

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

                                    <p class="etichetta block">Incassi per metodo</p>
                                    ${bloccoIncassiPerMetodo(d, { daVersare: true, vuoto: 'Nessun incasso registrato.' })}
                                </div>

                                <div class="space-y-3">
                                    <p class="etichetta block">Turno e spese</p>
                                    ${d.turni.length ? d.turni.map(t => `

                                            <div>
                                                <p class="text-sm font-black text-gray-900">${esc(t.turno || (t.inizio + ' - ' + t.fine))}</p>

                                            </div>
                                            <div class="text-right">
                                                <p class="text-base sm:text-lg font-black text-gray-900">${t.ore} h</p>
                                                <p class="text-xs font-bold text-gray-500">${formatCurrency(d.mediaOra)}/ora</p>
                                            </div>
                                        </div>
                                    `).join('') : '<p class="text-sm text-gray-400">Nessun turno registrato.</p>'}

                                    ${d.listaUscite.length ? `
                                        <div class="divide-y divide-gray-100 border border-gray-100 rounded-xl">
                                            ${righeSpeseGiornata(d.listaUscite)}
                                        </div>
                                    ` : '<p class="text-sm text-gray-400">Nessuna spesa registrata.</p>'}
                                </div>

                    `}

        function renderRiepilogoMensile() {

            const [anno, mese] = ym.split('-').map(Number);
            const d = aggrega(ym);
            const serie = serieMensile(ym);
            const gSel = giornoSelezionato();

            const lavorati = serie.filter(x => x.nCorse > 0);
            // Riposi contati solo fino a oggi: i giorni futuri non sono riposi, sono da compilare
            const oggi = oggiISO();
            const trascorsi = serie.filter(x => x.iso <= oggi);
            const riposi = trascorsi.filter(x => x.nCorse === 0);
            const maxIncasso = Math.max(1, ...serie.map(x => x.incassi));
            const migliore = lavorati.length ? lavorati.reduce((a, b) => (b.incassi > a.incassi ? b : a)) : null;
            const peggiore = lavorati.length ? lavorati.reduce((a, b) => (b.incassi < a.incassi ? b : a)) : null;
            const mediaGiorno = lavorati.length ? d.incassi / lavorati.length : 0;

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden print-card print-break">

                                        <div class="w-full rounded-t-sm transition-colors ${x.iso === gSel ? 'bg-gray-900' : (x.incassi > 0 ? 'bg-yellow-400 group-hover:bg-yellow-500' : (x.iso <= oggi ? 'bg-blue-200' : 'bg-gray-100'))}"
                                             style="height:${x.incassi > 0 ? Math.max(3, (x.incassi / maxIncasso) * 100) : 3}%"></div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="flex gap-[2px] mt-1">
                                ${serie.map(x => `<div class="flex-1 text-center text-[9px] font-bold ${x.iso === gSel ? 'text-gray-900' : 'text-gray-300'}">${x.giorno % 5 === 0 || x.iso === gSel ? x.giorno : ''}</div>`).join('')}

                                <div class="grid grid-cols-2 gap-3 pt-1">

                            <div class="flex gap-1 mt-1">

                    </div>

                    <div class="lg:col-span-5">

                    </div>

        function bloccoTurnoHTML(g, conPulsante = true) {
            const t = g.turno;
            if (!t) return `
                <div class="flex flex-wrap items-center gap-2 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5">

                    ${conPulsante ? `<button onclick="apriFormTurno('${g.iso}')" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 text-xs font-black px-3 py-1.5 rounded-lg">+ Registra turno</button>` : ''}
                </div>`;
            const editing = !isRiposo(t) && String(window.editKmId) === String(t.id);
            // Compilando i km a posteriori, i km inizio si ereditano dal turno
            // precedente: e' il caso normale, il contachilometri e' continuo.
            const precRiga = editing && !t.kmInizio ? turnoPrecedenteConKm(t.data, t.id) : null;
            const kmIniRiga = t.kmInizio || (precRiga ? precRiga.kmFine : '');
            return `
                <div class="bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5 space-y-2">

                                    : `${esc(nomeTurno(t))} <span class="font-medium text-gray-500">${orariTurno(t) ? '· ' + esc(orariTurno(t)) + ' ' : ''}· ${t.ore} ore</span>`}
                            </p>
                            ${isRiposo(t) ? '' : `
                                <p class="text-xs font-bold ${kmMancanti(t) ? 'text-yellow-700' : 'text-gray-500'}">
                                    ${kmMancanti(t) ? 'km da mettere' : `${t.kmInizio} → ${t.kmFine} · ${t.kmTot} km`}
                                </p>`}
                        </div>
                        <span class="flex gap-1 ml-auto">

                                    ${kmMancanti(t) ? '+ Aggiungi km' : 'Modifica'}
                                </button>`}
                            <button onclick="deleteShift('${t.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold bg-red-50 hover:bg-red-100 px-2 py-1.5 rounded">Elimina</button>

                    </div>
                    ${editing ? `
                        <div class="flex flex-wrap items-end gap-3 border-2 border-yellow-300 rounded-xl p-3 bg-white">

        function renderSezioneGiornate() {
            const giorno = giornoGiornate();
            const mese = window.filterMeseGiornate;
            const metodo = window.filterMetodoGiornate;

            // Il giorno, quando e' impostato, ha la precedenza sul mese
            const nelPeriodo = (iso) => {
                const d = String(iso || '');
                if (d.slice(0, 4) !== annoAttivo()) return false;
                if (giorno) return d === giorno;
                if (mese !== 'ALL') return parseInt(d.slice(5, 7), 10) === parseInt(mese, 10);
                return true;
            };

            const corsePeriodo = (window.dailyRecords || []).filter(r => r.tipo === 'ENTRATA' && nelPeriodo(r.data));
            const turniPeriodo = (window.shifts || []).filter(t => nelPeriodo(t.data));
            // Adesso le spese si registrano da qui, quindi da qui si devono anche
            // vedere: segnare il pieno e non vederlo comparire da nessuna parte
            // sarebbe un salto nel buio.
            const spesePeriodo = (window.dailyRecords || []).filter(r => r.tipo === 'USCITA' && nelPeriodo(r.data));
            const totSpese = spesePeriodo.reduce((a, r) => a + (parseFloat(r.importo || 0) || 0), 0);

            // Ripartizione del periodo, calcolata prima del filtro metodo: serve a
            // far vedere quanto pesa ogni voce prima di selezionarla.
            const perMetodo = {};
            ['Contanti', 'POS', 'Satispay', 'App', 'Fattura'].forEach(k => perMetodo[k] = { n: 0, tot: 0 });
            corsePeriodo.forEach(r => {
                const famiglia = famigliaMetodo(r.metodo);
                const f = perMetodo[famiglia] ? famiglia : 'App';
                perMetodo[f].n++;
                perMetodo[f].tot += parseFloat(r.importo || 0) || 0;
            });

            const corseFiltrate = corsePeriodo.filter(r => metodo === 'ALL' || famigliaMetodo(r.metodo) === metodo);
            const totCorse = corseFiltrate.reduce((a, r) => a + (parseFloat(r.importo || 0) || 0), 0);
            const mediaCorsa = corseFiltrate.length ? totCorse / corseFiltrate.length : 0;

            // Una voce per giornata: il turno di quel giorno e le sue corse
            const giornate = new Map();
            const tocca = (iso) => {
                if (!giornate.has(iso)) giornate.set(iso, { iso, turno: null, turni: [], corse: [], spese: [], tot: 0, pos: 0, speso: 0 });
                return giornate.get(iso);
            };
            // Due turni sulla stessa data l'app li permette (lo chiede con una
            // conferma): vanno tenuti tutti, se no le ore e i km della testata non
            // tornerebbero con i totali qui sopra.
            turniPeriodo.forEach(t => {
                const g = tocca(String(t.data));
                g.turni.push(t);
                if (!g.turno) g.turno = t;
            });
            corseFiltrate.forEach(r => {
                const g = tocca(String(r.data));
                const imp = parseFloat(r.importo || 0) || 0;
                g.corse.push(r);
                g.tot += imp;
                if (famigliaMetodo(r.metodo) === 'POS') g.pos += imp;
            });

            spesePeriodo.forEach(r => {
                const g = tocca(String(r.data));
                g.spese.push(r);
                g.speso += parseFloat(r.importo || 0) || 0;
            });

            let lista = Array.from(giornate.values()).sort((a, b) => b.iso.localeCompare(a.iso));
            // Con un metodo selezionato restano solo le giornate che hanno corse di
            // quel tipo: le altre sarebbero righe a zero senza motivo.
            if (metodo !== 'ALL') lista = lista.filter(g => g.corse.length);

            const turniLavorati = turniPeriodo.filter(t => !isRiposo(t));
            const oreTot = turniLavorati.reduce((a, t) => a + (parseFloat(t.ore || 0) || 0), 0);
            const kmTot = turniLavorati.reduce((a, t) => a + (parseFloat(t.kmTot || 0) || 0), 0);
            // Quanto rende un'ora di lavoro: l'incasso del periodo diviso le ore dei
            // turni. Segue il filtro metodo come il riquadro verde, cosi' i due numeri
            // parlano sempre della stessa selezione.
            // Se il turno di quella giornata e' in corso adesso, il conto e' sulle
            // ore fatte finora e si rinfresca da solo ogni minuto.
            const eo = euroOraVivo(totCorse, oreTot, giorno ? turniLavorati : []);
            const euroOra = eo.valore;

            const etichettaPeriodo = giorno
                ? dataEstesa(giorno)
                : (mese === 'ALL' ? 'anno ' + annoAttivo() : nomeMese(mese) + ' ' + annoAttivo());
            const filtriAttivi = giorno || mese !== 'ALL' || metodo !== 'ALL';
            // Il giorno non conta: ha le sue frecce in cima e in uso normale c'e'

            // ============================================================

                <button onclick="alternaSpesaLampo()" class="w-full flex items-center justify-center gap-2.5 bg-white hover:bg-red-50 border border-red-200 text-red-700 font-black text-base py-4 rounded-[1.25rem] shadow-sm transition-colors">

            // ============================================================
            //  LA SPESA, QUI DENTRO

            const spesaLampoHTML = () => `
                <div class="bg-white rounded-[1.25rem] shadow-sm border border-red-200 p-4 space-y-3.5">

            // --- una corsa dentro la giornata ---
            const rigaCorsa = (r) => String(window.editRecordId) === String(r.id) ? `

                </button>`;

            const rigaSpesa = (r) => String(window.editRecordId) === String(r.id) ? `
                <div class="p-3 bg-red-50 space-y-2">

                        <input type="date" id="mv-data-${r.id}" aria-label="Data del movimento" value="${r.data}" class="p-2 border rounded-lg text-sm outline-none" />

                        <div class="flex gap-2 ml-auto">

            ` : `
                <button onclick="apriModificaRecord('${r.id}')" class="w-full text-left px-3 py-2.5 flex items-center gap-2 hover:bg-red-50/50 transition-colors">
                    ${r.ora ? `<span class="text-xs font-black text-gray-400 tabular-nums whitespace-nowrap" title="Ora in cui l'hai registrata">${esc(r.ora)}</span>` : ''}
                    <span class="${metodoBadgeClass(r.metodo)} px-2 py-0.5 rounded-md text-[11px] font-bold whitespace-nowrap" title="${esc(r.metodo)}">${esc(metodoBreve(r.metodo))}</span>
                    <span class="text-sm font-bold text-gray-800 min-w-0 flex-1 truncate">${esc(r.categoria)}${r.nota ? ` <span class="font-normal text-gray-400">· ${esc(r.nota)}</span>` : ''}</span>
                    ${r.fattura ? '<span class="shrink-0 bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-black uppercase" title="Con fattura">fatt.</span>' : ''}
                    <span class="text-sm font-black text-red-600 whitespace-nowrap">−${cifraEuro(r.importo)}</span>
                    <span class="hidden sm:inline text-gray-300 font-black" aria-hidden="true">›</span>
                </button>`;

            // --- il turno della giornata, con i comandi ---
            // conPulsante: nel registro la giornata senza turno offre il pulsante per
            // registrarlo; in cima no, perche' il pulsante e' gia' li' sopra.
            // --- la giornata: testata sempre visibile, dettaglio a richiesta ---
            const scheda = (g) => {
                const t = g.turno;
                const aperta = !!giorno || window.giornataAperta === g.iso;
                const soloUnGiorno = !!giorno;
                const riposo = isRiposo(t);
                const lavorati = (g.turni || []).filter(x => !isRiposo(x));
                const oreGiorno = lavorati.reduce((a, x) => a + (parseFloat(x.ore || 0) || 0), 0);
                const kmGiorno = lavorati.reduce((a, x) => a + (parseFloat(x.kmTot || 0) || 0), 0);
                const sottotitolo = !t ? 'turno non registrato'
                    : lavorati.length > 1
                        ? `${lavorati.length} turni · ${oreScritte(oreGiorno)} h${kmGiorno ? ' · ' + kmGiorno + ' km' : ''}`
                        : (riposo
                            ? esc(t.turno || 'Festivo')
                            : `${esc(nomeTurno(t))}${orariTurno(t) ? ' · ' + esc(orariTurno(t)) : ''} · ${t.ore} h${t.kmTot ? ' · ' + t.kmTot + ' km' : ''}`);
                const dettaglio = `
                    <div class="p-3 space-y-3">
                        ${g.corse.length ? `
                            <div class="divide-y divide-gray-100 border border-gray-100 rounded-xl overflow-hidden">
                                ${g.corse.map(rigaCorsa).join('')}
                            </div>
                        ` : `<p class="text-xs text-gray-400 px-1">Nessuna corsa in questa giornata${metodo !== 'ALL' ? ' con questo metodo' : ''}.</p>`}

                        ${g.spese.length ? `
                            <div>
                                <p class="etichetta block px-1 mb-1.5">Spese della giornata</p>
                                <div class="divide-y divide-gray-100 border border-gray-100 rounded-xl overflow-hidden">
                                    ${g.spese.map(rigaSpesa).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>`;

                // Con un giorno solo selezionato la testata ripeteva parola per
                // parola quello che dice gia' la scheda scura in cima: stessa
                // data, stesso totale, stesse corse. Qui resta solo quello che
                // in cima non c'e' - il turno con i suoi orari e i suoi km.
                if (soloUnGiorno) {
                    return `
                        <div class="bg-white rounded-[1.25rem] shadow-sm border ${riposo ? 'border-indigo-200' : 'border-gray-100'} overflow-hidden">
                            <div class="px-4 py-2.5 flex flex-wrap items-center justify-between gap-x-3 gap-y-1 border-b border-gray-100">
                                <p class="etichetta">${riposo ? 'Giornata non lavorata' : 'Il registro della giornata'}</p>
                                <span class="flex items-center gap-1.5 min-w-0">
                                    <span class="text-xs font-bold text-gray-500 min-w-0 truncate">${sottotitolo}</span>
                                    ${lavorati.some(kmMancanti) ? '<span class="shrink-0 bg-yellow-100 text-yellow-800 px-1.5 py-0.5 rounded text-[11px] font-black uppercase whitespace-nowrap">senza km</span>' : ''}

                            </div>
                            ${dettaglio}
                        </div>`;
                }

                return `
                    <div class="bg-white rounded-[1.25rem] shadow-sm border ${riposo ? 'border-indigo-200' : 'border-gray-100'} overflow-hidden">
                        <button onclick="alternaGiornata('${g.iso}')" class="w-full text-left px-4 py-3 flex flex-wrap items-center gap-x-3 gap-y-1 hover:bg-gray-50 transition-colors">

                                <p class="font-black text-gray-900 prima-maiuscola leading-tight">${dataEstesa(g.iso)}</p>
                                <p class="text-xs font-bold text-gray-500">

                            </div>
                            <div class="text-right shrink-0">
                                <p class="text-lg font-black ${g.tot > 0 ? 'text-green-600' : 'text-gray-300'} leading-tight">${cifraEuro(g.tot)}</p>
                                <p class="text-[11px] font-bold text-gray-400 leading-tight">
                                    ${g.corse.length} ${g.corse.length === 1 ? 'corsa' : 'corse'}${g.pos > 0 ? ' · POS ' + soldi(g.pos) : ''}
                                </p>
                                ${g.speso > 0 ? `<p class="text-[11px] font-bold text-red-500 leading-tight">spese −${soldi(g.speso)}</p>` : ''}
                            </div>
                            <span class="text-gray-300 font-black text-lg leading-none">${aperta ? '▾' : '▸'}</span>
                        </button>
                        ${aperta ? `<div class="border-t border-gray-100">${dettaglio}</div>` : ''}
                    </div>`;
            };

            // I filtri stanno in fondo, chiusi. Chi apre questa schermata vuole
            // vedere le corse, non filtrarle: prima erano aperti e spingevano il
            // registro quattrocento pixel piu' giu'. Il menu del mese non si

            // I riquadri dei metodi si mostrano solo se hanno qualcosa dentro:
            // cinque riquadri di cui tre a 0,00 € sono tre righe di niente.
            const metodiPieni = ['Contanti', 'POS', 'Satispay', 'App', 'Fattura'].filter(k => perMetodo[k].n > 0);

            //  LA DIVISIONE PER METODO, SU FONDO SCURO

            //  al tasto che l'ha riempito. Su bianco erano cinque rettangoli
            //  grigi uguali, e il colore del metodo non si vedeva da nessuna
            //  parte.
            // ============================================================
            const pannelloFiltri = () => `
                <details class="eroe text-white overflow-hidden" ${filtroOltreIlGiorno ? 'open' : ''}>
                    <summary class="flex items-center justify-between gap-2 p-4 cursor-pointer select-none text-sm font-black text-white">
                        <span>Filtra per metodo</span>
                        <span class="text-xs font-bold ${filtroOltreIlGiorno ? 'text-yellow-400' : 'text-white/40'}">${filtroOltreIlGiorno ? 'filtro attivo' : 'stai vedendo tutto'}</span>
                    </summary>
                    <div class="px-4 pb-4 space-y-4 border-t border-white/10 pt-4">
                        ${metodiPieni.length ? `
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
                            ${metodiPieni.map(k => {
                                const c = COLORI_METODO_SCURO[k] || COLORI_METODO_SCURO['App'];
                                const scelto = metodo === k;
                                return `
                                <button onclick="applyFilterMetodoGiornate('${scelto ? 'ALL' : k}')"
                                        aria-pressed="${scelto ? 'true' : 'false'}"
                                        class="text-left px-3 py-2.5 rounded-xl transition-colors ${scelto ? c.pieno : 'bg-white/[0.06] hover:bg-white/10'}">
                                    <p class="flex items-center gap-1.5 text-[10.5px] font-bold uppercase tracking-wider ${scelto ? 'opacity-70' : 'text-white/45'}">
                                        <span class="w-1.5 h-1.5 rounded-full ${scelto ? 'bg-current' : c.punto}"></span>${NOMI_METODO[k]}
                                    </p>
                                    <p class="text-[17px] font-black mt-0.5 ${scelto ? '' : c.testo}">${soldi(perMetodo[k].tot)}</p>
                                    <p class="text-[11px] font-medium ${scelto ? 'opacity-70' : 'text-white/35'}">${perMetodo[k].n} ${perMetodo[k].n === 1 ? 'corsa' : 'corse'}</p>
                                </button>`;
                            }).join('')}
                        </div>` : '<p class="text-xs text-white/40">Nessun incasso in questa selezione.</p>'}

                        <div class="flex flex-wrap items-end gap-x-4 gap-y-3 pt-1">
                            <div class="min-w-0">
                                <label for="filtro-metodo-giornate" class="block text-[10.5px] font-bold uppercase tracking-wider text-white/40 mb-1.5">Come hanno pagato</label>
                                <select id="filtro-metodo-giornate" onchange="applyFilterMetodoGiornate(this.value)" class="campo-scuro px-3 py-2 text-sm">
                                    <option value="ALL" ${metodo==='ALL'?'selected':''}>Tutti i metodi</option>
                                    <option value="Contanti" ${metodo==='Contanti'?'selected':''}>Contanti</option>
                                    <option value="POS" ${metodo==='POS'?'selected':''}>POS / Carta</option>
                                    <option value="Satispay" ${metodo==='Satispay'?'selected':''}>Satispay</option>
                                    <option value="App" ${metodo==='App'?'selected':''}>App / Voucher</option>
                                    <option value="Fattura" ${metodo==='Fattura'?'selected':''}>Fattura / Convenzione</option>
                                </select>
                            </div>
                            ${giorno ? '' : `
                            <div class="min-w-0">
                                <label for="filtro-mese-giornate" class="block text-[10.5px] font-bold uppercase tracking-wider text-white/40 mb-1.5">Mese</label>
                                <select id="filtro-mese-giornate" onchange="applyFilterMeseGiornate(this.value)" class="campo-scuro px-3 py-2 text-sm">
                                    ${opzioniMese(mese, "Tutti i Mesi")}
                                </select>
                            </div>`}
                            ${filtriAttivi ? `
                                <button onclick="azzeraFiltriGiornate()" class="px-4 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold text-white">Mostra tutto</button>
                            ` : ''}
                        </div>
                        ${giorno ? `<p class="text-[11px] text-white/35">Stai guardando un giorno solo, quindi il mese non serve.</p>` : ''}
                    </div>
                </details>`;

            return `
                <div class="fade-in space-y-5 max-w-7xl mx-auto">
                    ${avvisoProfilo()}

                    <!-- ============================================================
                         LA SCHEDA DELLA GIORNATA
                         Prima questa parte erano tre riquadri in fila: il titolo
                         «Oggi» grande, la scheda bianca con il campo data, e due
                         rettangoli colorati con i totali. Occupavano mezza
                         schermata per dire una cosa sola - quanto ho fatto oggi -
                         e il numero che conta stava a 24px, piu' piccolo del
                         titolo. Adesso e' una scheda sola: il giorno in cima, il
                         guadagno grande, e sotto la riga che serve davvero a fine
                         turno - quanto e' uscito, quanto resta, quanto rende
                         un'ora.
                         ============================================================ -->
                    <div class="eroe text-white p-5">
                        <div class="flex items-center justify-between gap-2 mb-4">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <button onclick="scorriGiornoGiornate(-1)" title="Giorno precedente" aria-label="Giorno precedente" class="tasto-icona w-9 h-9 flex-shrink-0 rounded-xl eroe-campo text-yellow-400 flex items-center justify-center text-lg">‹</button>
                                <label class="relative min-w-0 px-1.5 cursor-pointer">
                                    <span class="block text-sm font-black prima-maiuscola truncate leading-tight">${giorno ? dataDueRighe(giorno).su : etichettaPeriodo}</span>
                                    <span class="block text-[11px] font-medium text-white/45 truncate leading-tight">${giorno ? dataDueRighe(giorno).giu : 'tutte le giornate'}</span>
                                    <input type="date" value="${giorno}" onchange="applyFilterGiornoGiornate(this.value)" aria-label="Giorno da vedere" class="data-coperta" />
                                </label>
                                <button onclick="scorriGiornoGiornate(1)" title="Giorno successivo" aria-label="Giorno successivo" class="tasto-icona w-9 h-9 flex-shrink-0 rounded-xl eroe-campo text-yellow-400 flex items-center justify-center text-lg">›</button>
                                ${giorno ? `<button onclick="pulisciGiornoGiornate()" title="Togli il filtro giorno" aria-label="Togli il filtro giorno" class="tasto-icona w-9 h-9 flex-shrink-0 rounded-xl text-white/45 hover:text-white flex items-center justify-center">×</button>` : ''}
                            </div>
                            ${eo.vivo ? `
                                <span class="shrink-0 flex items-center gap-1.5 bg-yellow-400/12 px-2.5 py-1.5 rounded-full">
                                    <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span>
                                    <span class="text-[11px] font-bold text-yellow-400 whitespace-nowrap">in turno</span>
                                </span>` : ''}
                        </div>

                        <p class="cifra text-[2.6rem] leading-none">${cifraEuro(totCorse)}</p>
                        <p class="text-xs font-medium text-white/50 mt-1.5">
                            incassato${metodo !== 'ALL' ? ' in ' + NOMI_METODO[metodo] : ''} · ${corseFiltrate.length} ${corseFiltrate.length === 1 ? 'corsa' : 'corse'}${corseFiltrate.length ? ' · ' + formatCurrency(mediaCorsa) + ' a corsa' : ''}
                        </p>
                        ${turniLavorati.length ? `
                            <p class="text-xs font-medium text-white/35 mt-0.5">
                                ${turniLavorati.length} ${turniLavorati.length === 1 ? 'turno' : 'turni'} · ${oreScritte(oreTot)} h${kmTot ? ' · ' + numeroIT(kmTot) + ' km' : ''}
                            </p>` : ''}

                        <div class="flex mt-4 pt-3.5 border-t border-white/10">
                            <div class="flex-1 min-w-0">
                                <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/40">Spese</p>
                                <p class="text-[17px] font-black ${totSpese > 0 ? 'text-red-400' : 'text-white/30'} mt-0.5 truncate">${totSpese > 0 ? '−' + soldi(totSpese) : '—'}</p>
                            </div>
                            <div class="flex-1 min-w-0 border-l border-white/10 pl-3.5">
                                <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/40">Ti resta</p>
                                <p class="text-[17px] font-black text-white mt-0.5 truncate">${soldi(totCorse - totSpese)}</p>
                            </div>
                            <div class="flex-1 min-w-0 border-l border-white/10 pl-3.5">
                                <p class="text-[10.5px] font-bold uppercase tracking-wider text-white/40">All'ora</p>
                                ${eo.vivo ? `
                                    <p id="euro-ora-vivo" class="mt-0.5" title="Incasso diviso le ore che hai fatto finora in questo turno">
                                        <span class="block text-[17px] font-black text-yellow-400 truncate">${eo.troppoPresto ? '—' : soldi(euroOra)}</span>
                                        <span class="block text-[10.5px] font-medium text-white/35 whitespace-nowrap">${oreScritte(eo.ore)} h finora</span>
                                    </p>`
                                  : `<p class="text-[17px] font-black ${oreTot > 0 ? 'text-yellow-400' : 'text-white/30'} mt-0.5 truncate" title="Incasso del periodo diviso le ore dei turni">${oreTot > 0 ? soldi(euroOra) : '—'}</p>`}
                            </div>
                        </div>
                    </div>

                    ${riposoDelGiorno ? `
                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-4">
                            <p class="text-sm font-black text-gray-900">${esc(riposoDelGiorno.turno)}: qui non si registrano corse</p>
                            <p class="text-xs text-gray-500 mt-1 leading-relaxed">
                                <span class="capitalize">${dataEstesa(giorno)}</span> è segnata come
                                <strong>${esc(riposoDelGiorno.turno)}</strong>, quindi il registro non accetta incassi in questa data.
                                Se quel giorno hai lavorato lo stesso, cambia il tipo di giornata dal calendario.
                            </p>
                            <button onclick="apriNelCalendario('${giorno}')" class="mt-3 bg-gray-900 hover:bg-gray-800 text-yellow-400 font-bold py-2 px-4 rounded-xl text-sm">Apri nel calendario</button>
                        </div>
                        ${window.mostraSpesaLampo ? '' : `
                        <button onclick="alternaSpesaLampo()" class="w-full flex items-center justify-center gap-2.5 bg-white hover:bg-red-50 border border-red-200 text-red-700 font-black text-base py-4 rounded-[1.25rem] shadow-sm transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                            Segna una spesa
                        </button>
                        <p class="text-xs text-gray-400">Le corse no, ma le spese sì: in un giorno di riposo l'auto costa come sempre.</p>`}
                    ` : (window.mostraSpesaLampo ? '' : corsaLampoHTML())}

                    ${window.showCorsaForm && !riposoDelGiorno ? moduloCorsa() : ''}

                    ${window.mostraSpesaLampo ? spesaLampoHTML() : ''}

                    ${pannelloFiltri()}

                    <!-- Il registro chiude la pagina: sopra c'e' quello che si fa,
                         qui sotto quello che e' gia' registrato, con i filtri che lo
                         governano subito sopra. -->
                    ${lista.length > LIMITE_RIGHE ? `
                        <p class="text-center text-xs font-bold text-gray-500 bg-yellow-50 border border-yellow-200 rounded-xl p-3">
                            Mostrate le ${LIMITE_RIGHE} giornate più recenti su ${lista.length}. Restringi con il filtro Giorno o Mese per vederle tutte: i totali qui sopra le considerano comunque tutte.
                        </p>` : ''}

                    <div class="space-y-2">
                        ${lista.slice(0, LIMITE_RIGHE).map(scheda).join('') || `
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center text-gray-400">
                                ${filtriAttivi
                                    ? 'Niente in questa selezione. Usa le frecce qui sopra per cambiare giorno, oppure × per togliere il filtro e vedere tutto l\'anno.'
                                    : 'Nessuna giornata registrata.'}
                            </div>`}
                    </div>
                </div>
            `;
        }

        // ============================================================
        //  SCHEDA UNIFICATA TURNI & CORSE
        //  Il giorno selezionato e' uno solo per tutte e tre le viste:
        //  passando da Giornata a Corse o a Turni non si perde il segno.
        // ============================================================

        // Il form turno vive nella vista Elenco turni: ci porto l'utente con la
        // data gia' impostata, invece di duplicare un form complesso.
        function ricordaVista(v) {
            window.vistaGiornata = v;
            try { localStorage.setItem('taxi_vista_giornata', v); } catch (err) { /* spazio esaurito: pazienza */ }
        }

        function setVistaGiornata(v) {
            ricordaVista(v);
            window.giornoCalendarioAperto = null;
            window.spostaTurnoId = null;
            window.editRecordId = null;
            renderContent();
        }

        // Riga compatta di una corsa: in verticale una tabella e' illeggibile
        // ============================================================
        //  CALENDARIO TURNI
        //  Vista mensile per vedere a colpo d'occhio lavoro, riposi e
        //  recuperi, e per sistemarli senza passare dall'elenco.
        // ============================================================

        // Come si colora ogni tipo di giornata nella griglia
        const COLORI_CALENDARIO = {
            'Festivo':          { cella: 'bg-indigo-100 border-indigo-300', testo: 'text-indigo-900', breve: 'Festivo' },
            'Recupero festivo': { cella: 'bg-orange-200 border-orange-400', testo: 'text-orange-900', breve: 'Recupero' },
            // Vecchi "Riposo" non ancora convertiti: stesso colore dei festivi
            'Riposo':           { cella: 'bg-indigo-100 border-indigo-300', testo: 'text-indigo-900', breve: 'Festivo' },
            // Il rinforzo e' una giornata di lavoro, ma si riconosce a colpo d'occhio
            'rinforzo':         { cella: 'bg-fuchsia-200 border-fuchsia-500', testo: 'text-fuchsia-900', breve: '' },
            'Malattia':         { cella: 'bg-orange-100 border-orange-300', testo: 'text-orange-900', breve: 'Malattia' },
            'Sciopero':         { cella: 'bg-pink-100 border-pink-300', testo: 'text-pink-900', breve: 'Sciopero' },
            'lavoro':           { cella: 'bg-yellow-100 border-yellow-400', testo: 'text-yellow-900', breve: '' },
            'vuoto':            { cella: 'bg-white border-gray-200', testo: 'text-gray-400', breve: '' }
        };

        function stileGiornoCalendario(turno) {
            if (!turno) return COLORI_CALENDARIO['vuoto'];
            if (!isRiposo(turno)) {
                return String(turno.turno || '').startsWith('Rinforzo')
                    ? COLORI_CALENDARIO['rinforzo']
                    : COLORI_CALENDARIO['lavoro'];
            }
            return COLORI_CALENDARIO[turno.turno] || COLORI_CALENDARIO['Riposo'];
        }

        // Attenzione al nome: la variabile di stato si chiama window.meseCalendario,
        // quindi questa funzione deve chiamarsi diversamente. Con lo stesso nome il
        // modulo Firebase, che parte dopo, sostituirebbe la funzione con null.
        function meseCalendarioAttivo() {
            if (!window.meseCalendario) {
                // Parto dal mese di oggi, ma se stai guardando un altro anno di
                // esercizio parto da gennaio di quell'anno.
                const oggi = oggiISO();
                window.meseCalendario = oggi.slice(0, 4) === annoAttivo() ? oggi.slice(0, 7) : `${annoAttivo()}-01`;
            }
            return window.meseCalendario;
        }

        function scorriMeseCalendario(delta) {
            const [a, m] = meseCalendarioAttivo().split('-').map(Number);
            const d = new Date(a, m - 1 + delta, 1);
            window.meseCalendario = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            window.giornoCalendarioAperto = null;
            renderContent();
        }

        function meseCalendarioOggi() {
            window.meseCalendario = oggiISO().slice(0, 7);
            window.giornoCalendarioAperto = null;
            renderContent();
        }

        // Tocco su una casella: se sto spostando un turno lo appoggio qui,
        // altrimenti apro (o chiudo) il pannello di quel giorno.
        function toccaGiornoCalendario(iso) {
            if (window.spostaTurnoId) { concludiSpostamento(iso); return; }
            window.giornoCalendarioAperto = window.giornoCalendarioAperto === iso ? null : iso;
            renderContent();
        }

        function iniziaSpostamento(id) {
            window.spostaTurnoId = id;
            window.giornoCalendarioAperto = null;
            showToast('Ora tocca il giorno in cui spostarlo.');
            renderContent();
        }

        function annullaSpostamento() {
            window.spostaTurnoId = null;
            renderContent();
        }

        function concludiSpostamento(iso) {
            const turno = (window.shifts || []).find(t => String(t.id) === String(window.spostaTurnoId));
            window.spostaTurnoId = null;
            if (!turno) { renderContent(); return; }
            if (turno.data === iso) { showToast('Era già questo il giorno.'); renderContent(); return; }

            const occupato = (window.shifts || []).find(t => t.data === iso && String(t.id) !== String(turno.id));
            if (occupato && !confirm(`Il ${ggMm(iso)} ha già ${occupato.turno}. Sposto lo stesso?`)) {
                renderContent();
                return;
            }
            // Tolgo la riga vecchia e ne salvo una nuova sulla data scelta:
            // il salvataggio aggiunge sempre, quindi senza la prima parte
            // lo stesso turno comparirebbe due volte.
            window.deleteShiftFromCloud(turno.id);
            window.saveShiftToCloud({ ...turno, id: nuovoId(), data: iso });
            showToast(`${turno.turno} spostato al ${ggMm(iso)}.`);
            renderContent();
        }

        // Registra al volo una giornata non lavorata dal calendario
        function segnaGiornataNonLavorata(iso, tipo) {
            const preset = SHIFT_PRESETS[tipo];
            if (!preset || !isRiposo(preset)) return;
            // Il rovescio del blocco nel registro corse: se in quella giornata ci
            // sono gia' degli incassi, segnarla come non lavorata e' quasi sempre
            // uno sbaglio. Le corse restano dove sono, ma va detto.
            const incassi = (window.dailyRecords || [])
                .filter(r => r.tipo === 'ENTRATA' && String(r.data) === String(iso))
                .reduce((tot, r) => tot + (parseFloat(r.importo || 0) || 0), 0);
            if (incassi > 0 && !confirm(`Il ${ggMm(iso)} ha ${formatCurrency(incassi)} di corse registrate. Lo segno lo stesso come ${preset.label}?`)) return;
            const gia = (window.shifts || []).find(x => x.data === iso);
            if (gia && !confirm(`Il ${ggMm(iso)} ha già ${gia.turno}. Lo sostituisco con ${preset.label}?`)) return;
            if (gia) window.deleteShiftFromCloud(gia.id);

            window.saveShiftToCloud({
                id: nuovoId(),
                data: iso, inizio: '', fine: '',
                turno: preset.label,
                lavorato: false,
                kmInizio: null, kmFine: null,
                ore: 0, kmTot: null
            });
            window.giornoCalendarioAperto = null;
            showToast(`${preset.label} registrato per il ${ggMm(iso)}.`);
            renderContent();
        }

        // Registra un turno di lavoro con uno degli orari fissi
        function segnaTurnoLavoro(iso, tipo) {
            const preset = SHIFT_PRESETS[tipo];
            if (!preset || isRiposo(preset) || tipo === 'custom') return;
            const gia = (window.shifts || []).find(x => x.data === iso);
            if (gia && !confirm(`Il ${ggMm(iso)} ha già ${gia.turno}. Lo sostituisco con ${preset.label}?`)) return;
            if (gia) window.deleteShiftFromCloud(gia.id);

            const ore = calcolaOreTurno(iso, preset.inizio, preset.fine, preset.pausaInizio, preset.pausaFine);
            // I km restano da compilare: si aggiungono dall'elenco turni quando si sanno
            window.saveShiftToCloud({
                id: nuovoId(),
                data: iso, inizio: preset.inizio, fine: preset.fine,
                turno: preset.label,
                lavorato: true,
                kmInizio: null, kmFine: null,
                ore, kmTot: null
            });
            window.giornoCalendarioAperto = null;
            showToast(`${preset.label} registrato per il ${ggMm(iso)}.`);
            renderContent();
        }

        // Dal calendario all'elenco delle giornate, posizionato su quel giorno
        function apriNellElenco(iso) {
            ricordaVista('giornate');
            ricordaGiornoGiornate(iso);
            ricordaMeseGiornate('ALL');
            window.giornataAperta = iso;
            window.giornoCalendarioAperto = null;
            renderContent();
        }

        // Apre il modulo del turno gia' puntato su una giornata: e' il pulsante
        // che compare nelle giornate senza turno registrato.
        function apriFormTurno(iso) {
            ricordaVista('calendario');   // il modulo del turno vive nel calendario
            window.dataTurnoProposta = iso;
            window.kmIniDraft = null;
            window.kmFineDraft = null;
            window.showShiftForm = true;
            renderContent();
            portaInVista('sh-data');
        }

        function renderSezioneCalendario() {
            const mese = meseCalendarioAttivo();
            const [anno, mm] = mese.split('-').map(Number);
            const oggi = oggiISO();

            // Griglia che parte sempre da lunedi', come i calendari cartacei
            const primo = new Date(anno, mm - 1, 1);
            const giorniNelMese = new Date(anno, mm, 0).getDate();
            const offset = (primo.getDay() + 6) % 7;   // 0 = lunedi'
            const celle = [];
            for (let i = 0; i < offset; i++) celle.push(null);
            for (let g = 1; g <= giorniNelMese; g++) {
                celle.push(`${anno}-${String(mm).padStart(2, '0')}-${String(g).padStart(2, '0')}`);
            }
            while (celle.length % 7 !== 0) celle.push(null);

            const turnoDi = (iso) => (window.shifts || []).find(t => t.data === iso) || null;

            // Incassi del mese contati una volta sola, giorno per giorno: prima
            // ogni cella rileggeva tutto l'archivio, trentuno volte di fila.
            // La divisione per metodo qui non serve piu': la dice il prospetto
            // dei corrispettivi, per tutti e cinque i metodi e in colonna.
            const incassiDelMese = {};
            (window.dailyRecords || []).forEach(r => {
                if (r.tipo !== 'ENTRATA') return;
                const d = String(r.data || '');
                if (!d.startsWith(mese)) return;
                incassiDelMese[d] = (incassiDelMese[d] || 0) + (parseFloat(r.importo || 0) || 0);
            });
            const incassoDi = (iso) => incassiDelMese[iso] || 0;

            // Conteggi del mese
            const delMese = (window.shifts || []).filter(t => String(t.data).startsWith(mese));
            const lavorati = delMese.filter(t => !isRiposo(t));
            const festivi = delMese.filter(t => isRiposo(t) && t.turno === 'Festivo');
            const recuperi = delMese.filter(t => t.turno === 'Recupero festivo');
            const oreMese = lavorati.reduce((tot, t) => tot + parseFloat(t.ore || 0), 0);

            const inSpostamento = (window.shifts || []).find(t => String(t.id) === String(window.spostaTurnoId));

            const cella = (iso) => {
                if (!iso) return '<div class="aspect-square"></div>';
                const t = turnoDi(iso);
                const stile = stileGiornoCalendario(t);
                const giorno = parseInt(iso.slice(8, 10), 10);
                const isOggi = iso === oggi;
                const aperto = window.giornoCalendarioAperto === iso;
                const rossa = classeEvidenziaGiorno(iso) === 'text-red-500';
                const incasso = t && !isRiposo(t) ? incassoDi(iso) : 0;

                return `
                    <button onclick="toccaGiornoCalendario('${iso}')"
                            class="aspect-square w-full rounded-lg border ${stile.cella} ${aperto ? 'ring-2 ring-gray-900' : ''} ${isOggi ? 'ring-2 ring-yellow-500' : ''} p-1 flex flex-col items-center justify-center gap-0.5 transition-colors hover:brightness-95">
                        <span class="text-sm font-black ${t ? stile.testo : (rossa ? 'text-red-500' : 'text-gray-500')} leading-none">${giorno}</span>

                    </button>`;
            };

            const pannello = () => {
                const iso = window.giornoCalendarioAperto;
                if (!iso) return '';
                const t = turnoDi(iso);
                const lavoro = ['sei30', 'otto', 'una', 'notte', 'spezzato', 'rinforzo'];
                const nonLavorate = ['festivo', 'recupero', 'malattia', 'sciopero'];
                return `

                                <p class="text-xs font-bold text-gray-400">${t ? esc(nomeTurno(t) + (orariTurno(t) ? ' · ' + orariTurno(t) : '') + (t.ore ? ` · ${t.ore} h` : '')) : 'Nessun turno registrato'}</p>

                        <div>

                            <div class="flex flex-wrap gap-1.5">

                                    <button onclick="segnaTurnoLavoro('${iso}', '${k}')" class="text-xs font-black px-2.5 py-1.5 rounded-lg ${k === 'rinforzo' ? 'bg-fuchsia-600 hover:bg-fuchsia-700 text-white' : 'bg-yellow-400 hover:bg-yellow-500 text-gray-900'}">${SHIFT_PRESETS[k].label.split(' (')[0]}</button>

                        ${(() => {

                            return (diQuelGiorno.length > 1

                                : '')

                        })()}

                        <div class="flex flex-wrap gap-1.5 pt-1 border-t border-gray-800">
                            ${t ? `<button onclick="iniziaSpostamento('${t.id}')" class="text-xs font-black px-2.5 py-1.5 rounded-lg bg-white hover:bg-gray-100 text-gray-900">Sposta ad altro giorno</button>` : ''}
                            ${t ? `<button onclick="deleteShift('${t.id}')" class="text-xs font-black px-2.5 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white">Elimina</button>` : ''}
                            <button onclick="apriNellElenco('${iso}')" class="text-xs font-black px-2.5 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white">Apri nelle giornate</button>
                        </div>
                        <p class="text-xs text-gray-500 leading-tight">I km si aggiungono qui sopra, quando li sai. Per un orario diverso da questi usa "+ Registra Turno".</p>

            };

            // Il promemoria guarda tutto l'anno, non solo il mese mostrato: un turno

            const daCompletare = turniAnno().filter(kmMancanti);

            return `
                <div class="space-y-4">

                    <button onclick="toggleShiftForm()" class="w-full sm:w-auto bg-gray-900 hover:bg-gray-800 text-white font-bold px-5 py-3 rounded-xl transition-colors whitespace-nowrap">

                    ${daCompletare.length ? `
                        <div class="bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 no-print">

                            </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-4">
                        <!-- Intestazione con mese precedente e successivo -->
                        <div class="flex items-center justify-between gap-3">
                            <button onclick="scorriMeseCalendario(-1)" title="Mese precedente" class="w-10 h-10 rounded-lg bg-gray-100 hover:bg-gray-200 font-black text-gray-700">‹</button>
                            <div class="text-center min-w-0">
                                <p class="text-lg font-black text-gray-900 capitalize leading-tight">${nomeMese(mm)} ${anno}</p>
                                <p class="text-xs font-bold text-gray-400">${lavorati.length} lavorati · ${festivi.length} festivi · ${recuperi.length} recuperi · ${oreScritte(oreMese)} h</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="meseCalendarioOggi()" class="px-3 h-10 rounded-lg bg-yellow-400 hover:bg-yellow-500 text-gray-900 text-xs font-black">Oggi</button>
                                <button onclick="scorriMeseCalendario(1)" title="Mese successivo" class="w-10 h-10 rounded-lg bg-gray-100 hover:bg-gray-200 font-black text-gray-700">›</button>
                            </div>
                        </div>

                        ${inSpostamento ? `
                            <div class="bg-gray-900 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
                                <p class="text-xs font-bold text-white">Sto spostando <span class="text-yellow-400 font-black">${esc(inSpostamento.turno)}</span> del ${ggMm(inSpostamento.data)}: tocca il giorno di destinazione.</p>
                                <button onclick="annullaSpostamento()" class="text-xs font-black px-2.5 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white">Annulla</button>
                            </div>
                        ` : ''}

                        <!-- Griglia del mese -->
                        <div>
                            <div class="grid grid-cols-7 gap-1 mb-1">
                                ${['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'].map((g, i) => `
                                    <div class="text-center text-xs font-black uppercase tracking-wider ${i >= 5 ? 'text-red-400' : 'text-gray-400'}">${g}</div>
                                `).join('')}
                            </div>
                            <div class="grid grid-cols-7 gap-1">
                                ${celle.map(cella).join('')}
                            </div>
                        </div>

                        <!-- Legenda -->
                        <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs font-bold text-gray-500 pt-1 border-t border-gray-100">
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-yellow-100 border border-yellow-400 align-middle"></span> lavoro</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-fuchsia-200 border border-fuchsia-500 align-middle"></span> rinforzo</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-indigo-100 border border-indigo-300 align-middle"></span> festivo</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-orange-200 border border-orange-400 align-middle"></span> recupero festivo</span>
                            <span><span class="inline-block w-2.5 h-2.5 rounded-sm bg-white border border-gray-300 align-middle"></span> da compilare</span>
                            <span class="text-green-700">● incassato</span>
                        </div>
                    </div>

                    ${pannello()}
                </div>`;
        }

        // Il benvenuto: compare finche' la scheda non e' compilata, e poi non si
        // rivede piu'. Non e' una pagina a se' - una schermata di registrazione
        // davanti all'app sarebbe un muro fra te e la prima corsa - ma un
        // riquadro sopra «Oggi», che si puo' anche rimandare.
        function avvisoProfilo() {
            if (profiloCompilato() || window.rimandaProfilo) return '';
            return `
                <div class="bg-white border-2 border-yellow-400 rounded-2xl p-5 shadow-sm no-print">
                    ${moduloProfiloHTML(
                        'Benvenuto: dicci chi sei',
                        'Lo chiediamo una volta sola. Nome e cognome per l\'app, licenza, codice radio e partita IVA per le carte che vanno al commercialista. Puoi anche saltare e compilarla dopo, da «Gestione → Backup e impostazioni».',
                        '💾 Salva e comincia')}
                    <button onclick="rimandaLaScheda()" class="mt-3 text-xs font-black text-gray-400 hover:text-gray-700 underline underline-offset-2">
                        Lo faccio dopo
                    </button>
                </div>`;
        }

        // I dati del tassista in testa al foglio. Un riepilogo senza nome e
        // partita IVA e' un foglio anonimo: il commercialista non sa di chi e',
        // e se lo tiene in archivio non lo ritrova piu'.
        function intestazioneTassista() {
            const p = window.profilo || {};
            const righe = [
                p.licenza ? ['Licenza', p.licenza] : null,
                p.sigla ? ['Sigla', p.sigla] : null,
                p.piva ? ['Partita IVA', p.piva] : null
            ].filter(Boolean);
            const col = coloreTurno(p.colore);
            if (!profiloCompilato() && !righe.length) {
                return `<p class="text-xs text-gray-400 no-print">Aggiungi la tua scheda da «Backup e impostazioni» e comparirà qui in testa, con licenza e partita IVA.</p>`;
            }
            return `
                <div class="border border-gray-200 rounded-xl p-4 print-break">
                    <p class="etichetta block">Intestatario</p>
                    <div class="flex flex-wrap items-center gap-3">
                        <p class="text-lg font-black text-gray-900 leading-tight">${esc(nomeCompleto() || '—')}</p>
                        ${col ? `<span class="text-xs font-black px-3 py-1 rounded-full" style="background:${col.fondo};color:${col.testo};border:1px solid ${col.bordo}">Turno ${esc(col.nome.toLowerCase())}</span>` : ''}
                    </div>
                    ${righe.length ? `
                        <div class="flex flex-wrap gap-x-6 gap-y-1 mt-2">
                            ${righe.map(([k, v]) => `<p class="text-xs font-bold text-gray-500">${esc(k)} <span class="text-gray-900">${esc(v)}</span></p>`).join('')}
                        </div>` : ''}
                </div>`;
        }

        function rimandaLaScheda() {
            window.rimandaProfilo = true;
            try { localStorage.setItem('taxi_rimanda_profilo', '1'); } catch (e) { /* pazienza */ }
            renderContent();
        }

        // Le scadenze stanno nel cassetto «Altro», ma quelle che scadono no:
        // una scadenza nascosta in un sottomenu e' una scadenza persa. Questo
        // avviso compare su «Oggi» e su «Andamento», dove si passa tutti i giorni.
        function avvisoScadenze() {
            const st = statoScadenze();
            const urgenti = st.scadute.concat(st.vicine);
            if (!urgenti.length) return '';
            return `
                <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 no-print">
                    <div class="min-w-0">
                        <p class="font-black text-red-800">${urgenti.length} scadenz${urgenti.length > 1 ? 'e' : 'a'} da tenere d'occhio</p>
                        <p class="text-xs text-red-700">${urgenti.map(s => `${esc(s.nome)} (${s.giorniMancanti < 0 ? 'scaduta' : (s.giorniMancanti === 0 ? 'oggi' : 'tra ' + s.giorniMancanti + ' gg')})`).join(' · ')}</p>
                    </div>
                    <button onclick="switchTab('scadenze')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-black px-4 py-2.5 rounded-xl shrink-0">Guarda</button>
                </div>`;
        }

        // ============================================================
        //  MUOVERSI DENTRO «GESTIONE»
        //  Entrando in una sezione non c'era modo di tornare all'indice se non
        //  ritrovando «Gestione» nella barra in basso - che resta accesa, ma
        //  non e' un tasto «indietro» e nessuno lo legge cosi'. E per passare
        //  da «Scadenze» a «Le mie auto» bisognava fare due tappe.
        //  Adesso in cima a ogni sezione c'e' il ritorno all'indice e la fila
        //  delle sorelle, con quella dove sei accesa: da una sezione all'altra
        //  e' un tocco solo.
        // ============================================================

        // Il registro spese non e' una voce dell'indice (v80): si apre da
        // «Spese e tasse», quindi il suo «indietro» torna li'.
        const GENITORE_SEZIONE = { uscite: 'categorie' };

        function intestazioneGestione(idAttivo) {
            const genitore = GENITORE_SEZIONE[idAttivo];
            const padre = genitore
                ? (SCHEDE_SECONDARIE.find(x => x.id === genitore) || {}).label || 'Gestione'
                : 'Gestione';
            const dove = genitore || 'altro';
            return `
                <div class="space-y-3 no-print">
                    <button onclick="switchTab('${dove}')" class="flex items-center gap-1 text-sm font-black text-gray-500 hover:text-gray-900 transition-colors">
                        <span class="text-xl leading-none" aria-hidden="true">‹</span> ${esc(padre)}
                    </button>
                    <div class="-mx-4 px-4 md:mx-0 md:px-0 overflow-x-auto">
                        <div class="flex gap-2 w-max">
                            ${SCHEDE_SECONDARIE.map(t => {
                                const qui = t.id === idAttivo || t.id === genitore;
                                return `<button onclick="switchTab('${t.id}')" aria-current="${qui ? 'page' : 'false'}"
                                        class="px-4 py-2 rounded-xl text-xs font-black whitespace-nowrap transition-colors ${qui ? 'bg-gray-900 text-yellow-400' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-100'}">${t.label}</button>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
        }

        // Un colore per reparto, tenue: sei quadrati tutti gialli uguali non
        // aiutano a ritrovare la voce, e a colpo d'occhio erano sei bolli.
        const COLORE_REPARTO = {
            categorie:  'bg-amber-100 text-amber-700',
            scadenze:   'bg-red-100 text-red-700',
            auto:       'bg-indigo-100 text-indigo-700',
            rendimento: 'bg-green-100 text-green-700',
            report:     'bg-stone-100 text-stone-600',
            cloud:      'bg-blue-100 text-blue-700'
        };

        // «Altro» non e' un ripostiglio: e' un indice scritto a parole, dove
        // sotto ogni voce c'e' cosa ci trovi. Un elenco di icone non lo legge
        // nessuno; una riga che dice «dove vanno i soldi» si', e si ricorda.
        function renderAltro() {
            return `
                <div class="fade-in space-y-4 max-w-3xl mx-auto">
                    <header class="flex items-center justify-between gap-x-3 mb-2">
                        <div class="min-w-0 flex-1">
                            <h2 class="text-2xl font-black text-gray-900 tracking-tight">Gestione</h2>
                            <p class="text-gray-500 text-[13px] font-medium mt-0.5 truncate">Il lavoro dalla parte della scrivania.</p>
                        </div>
                        ${pillolaAnno('altro')}
                    </header>

                    ${avvisoScadenze()}

                    <div class="bg-white rounded-[1.25rem] shadow-sm border border-gray-100 overflow-hidden divide-y divide-gray-100">
                        ${SCHEDE_SECONDARIE.map(t => `
                            <button onclick="switchTab('${t.id}')" class="w-full flex items-center gap-3.5 p-4 text-left hover:bg-gray-50 transition-colors">
                                <span class="shrink-0 w-10 h-10 rounded-xl ${COLORE_REPARTO[t.id] || 'bg-gray-100 text-gray-600'} flex items-center justify-center">${t.icona}</span>
                                <span class="min-w-0 flex-1">
                                    <span class="block font-bold text-[15px] text-gray-900">${t.label}</span>
                                    <span class="block text-xs text-gray-500 mt-0.5">${t.desc}</span>
                                </span>
                                <svg class="shrink-0 text-gray-300" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
                            </button>
                        `).join('')}
                    </div>

                    <p class="text-center text-xs text-gray-400 pt-2">TaxiManager · versione ${VERSIONE_APP}</p>
                </div>`;
        }

        // ============================================================
        //  I CONTI PESANTI SI FANNO UNA VOLTA PER DISEGNO
        //  Misurato su tre anni di lavoro (9.697 movimenti): disegnare
        //  «Spese e tasse» chiamava elencoVociFisse() 732 volte e
        //  calcolaTasseOrdinario() 7. Non era codice sbagliato - erano gli
        //  stessi conti chiesti da punti diversi della stessa schermata.
        //  Qui si tengono da parte per la durata di un disegno e basta: la
        //  memoria si svuota all'inizio E alla fine di renderContent, cosi'
        //  nessuno puo' leggere un valore vecchio fuori dal disegno e il
        //  problema di quando invalidarla non esiste.
        // ============================================================
        const memoDisegno = new Map();
        let dentroUnDisegno = false;

        function memo(chiave, calcola) {
            // Fuori da un disegno non si tiene niente da parte: il valore
            // resterebbe li' mentre i dati cambiano, e chi lo rilegge dopo si
            // troverebbe un numero vecchio. E' successo davvero mentre scrivevo
            // questa ottimizzazione - il riepilogo di oggi restava a zero.
            if (!dentroUnDisegno) return calcola();
            if (memoDisegno.has(chiave)) return memoDisegno.get(chiave);
            const v = calcola();
            memoDisegno.set(chiave, v);
            return v;
        }

        // Il guscio del disegno. La memoria si apre e si chiude qui, con un
        // try/finally: cosi' non dipende da dove finisce una funzione lunga
        // milleduecento righe, e si richiude anche se qualcosa va storto.
        function renderContent() {
            memoDisegno.clear();
            dentroUnDisegno = true;
            try {
                disegnaContenuto();
            } finally {
                dentroUnDisegno = false;
                memoDisegno.clear();
            }
        }

        function disegnaContenuto() {
            const main = document.getElementById('main-container');
            if (!main) return;

            const scrollMain = main.scrollTop;
            const scrollPagina = window.scrollY;
            requestAnimationFrame(() => {
                main.scrollTop = scrollMain;
                window.scrollTo(0, scrollPagina);
            });

            const records = window.dailyRecords || [];
            const shifts = window.shifts || [];

            if (!SCHEDE.includes(window.activeTab)) window.activeTab = 'dashboard';

            if (window.activeTab === 'altro') {
                main.innerHTML = renderAltro();
            }
            else if (window.activeTab === 'dashboard') {
                main.innerHTML = `
                    <div class="fade-in space-y-6 max-w-7xl mx-auto">
                        <header class="flex justify-between items-center gap-x-3">
                            <div class="min-w-0 flex-1">
                                <h2 class="text-2xl font-black text-gray-900 tracking-tight truncate">Come va il ${annoAttivo()}</h2>
                                <p class="text-gray-500 text-[13px] font-medium mt-0.5 flex items-center gap-1.5 truncate">
                                    <span class="w-1.5 h-1.5 rounded-full ${window.isCloudSyncing ? 'bg-green-500' : 'bg-yellow-500'}"></span>
                                    ${window.isCloudSyncing ? 'dati al sicuro sul Cloud' : 'solo su questo dispositivo'}
                                </p>
                            </div>
                            ${pillolaAnno('dash')}
                        </header>

                        ${avvisoScadenze()}

                        <!-- Un periodo per volta: l'interruttore e' nella testata -->
                        ${periodoDash() === 'giorno' ? renderRiepilogoGiornaliero()
                          : periodoDash() === 'mese' ? renderRiepilogoMensile()
                          : renderRiepilogoAnnuale()}

                    </div>
                `;
            } 
            else if (window.activeTab === 'giornata') {
                const vista = vistaCorseTurni();
                if (vista === 'calendario') {
                    main.innerHTML = `
                        <div class="fade-in space-y-6 max-w-7xl mx-auto">
                            ${barraLinguette()}
                            ${renderSezioneCalendario()}
                        </div>`;
                } else {
                    main.innerHTML = `
                        <div class="fade-in space-y-6 max-w-7xl mx-auto">
                            ${barraLinguette()}
                        </div>` + renderSezioneGiornate();
                }
            }
            else if (window.activeTab === 'uscite') {
                // Il giorno, quando impostato, ha la precedenza sul filtro mese
                const uscitePeriodo = records.filter(r => {
                    if (r.tipo !== 'USCITA') return false;
                    if (!nellAnno(r)) return false;
                    if (giornoFiltroUscite()) return r.data === giornoFiltroUscite();
                    if (window.filterMonthUscite !== 'ALL') {
                        const m = parseInt(String(r.data).slice(5, 7));
                        if (m !== parseInt(window.filterMonthUscite)) return false;
                    }
                    return true;
                });

                const usciteList = uscitePeriodo.filter(r =>
                    window.filterTipoUscite === 'ALL' || tipoSpesa(r.categoria) === window.filterTipoUscite
                );

                // Con i costi fissi in sottofondo il registro ne avrebbe una riga
                // per ogni voce e per ogni giorno: le spese vere ci sparirebbero
                // in mezzo. Restano nei totali, ma si mostrano raccolti in una
                // riga sola, che si apre quando serve controllarli.

        function nomeTurno(t) {
            return String((t && t.turno) || 'Personalizzato').split(' (')[0].trim() || 'Personalizzato';

        function orariTurno(t) {
            return t && t.inizio && t.fine ? `${t.inizio} - ${t.fine}` : '';

        function giornataNonLavorata(iso) {

            const t = (window.shifts || []).find(x => String(x.data) === String(iso));
            return isRiposo(t) ? t : null;

        // Calcola le ore lavorate tra inizio e fine (gestendo il turno a cavallo di mezzanotte
        // e, se presente, una pausa da escludere dal totale, come nello Spezzato)
        function calcolaOreTurno(data, inizio, fine, pausaInizio, pausaFine) {
            const start = new Date(`${data}T${inizio}`);
            let end = new Date(`${data}T${fine}`);
            if (end <= start) end.setDate(end.getDate() + 1);
            let diffHours = (end - start) / (1000 * 60 * 60);

            if (pausaInizio && pausaFine) {
                const pStart = new Date(`${data}T${pausaInizio}`);
                let pEnd = new Date(`${data}T${pausaFine}`);
                if (pEnd <= pStart) pEnd.setDate(pEnd.getDate() + 1);
                diffHours -= (pEnd - pStart) / (1000 * 60 * 60);
            }
            return diffHours;
        }

        // ============================================================
        //  IL €/H DENTRO IL TURNO
        //  Diviso per le ore del turno intero, a meta' giornata quel numero
        //  non dice niente: alle dieci di un turno 08-20, con 40 € fatti,
        //  segnava 3,33 €/h - e uno pensa di stare andando male quando sta
        //  solo andando da due ore. Finche' il turno e' in corso il conto va
        //  fatto sulle ore lavorate FINORA, e rifatto man mano.
        //  Fuori dal turno - prima che cominci, o a giornata chiusa - resta
        //  il conto sulle ore intere, che e' il consuntivo vero.
        // ============================================================

        // Quanto e' passato dall'inizio del turno, senza mai superarne la fine.
        // Restituisce null se il turno non e' in corso adesso.
        function oreFinora(t, adesso) {
            if (!t || !t.data || !t.inizio || !t.fine || isRiposo(t)) return null;
            const ora = adesso || new Date();
            const inizio = new Date(`${t.data}T${t.inizio}`);
            let fine = new Date(`${t.data}T${t.fine}`);
            // Turno a cavallo di mezzanotte: la fine e' il giorno dopo
            if (fine <= inizio) fine.setDate(fine.getDate() + 1);
            if (isNaN(inizio.getTime()) || isNaN(fine.getTime())) return null;
            if (ora < inizio || ora >= fine) return null;

            let ore = (ora - inizio) / 3600000;
            // La pausa dello Spezzato si toglie solo quando e' gia' passata:
            // mentre la si sta facendo il conto si ferma all'inizio della pausa.
            const preset = t.pausaInizio && t.pausaFine ? t : null;
            if (preset) {
                const pIni = new Date(`${t.data}T${t.pausaInizio}`);
                let pFin = new Date(`${t.data}T${t.pausaFine}`);
                if (pFin <= pIni) pFin.setDate(pFin.getDate() + 1);
                if (ora >= pFin) ore -= (pFin - pIni) / 3600000;
                else if (ora > pIni) ore = (pIni - inizio) / 3600000;
            }
            return ore;
        }

        // Il turno in corso adesso fra quelli della giornata scelta.
        function turnoInCorso(turni, adesso) {
            return (turni || []).find(t => oreFinora(t, adesso) !== null) || null;
        }

        // Il €/h da mostrare: dentro il turno sulle ore fatte finora, fuori
        // sulle ore intere. Sotto il quarto d'ora non si divide: con cinque
        // minuti di lavoro una corsa da 20 € darebbe 240 €/h, un numero vero
        // in aritmetica e falso in tutto il resto.
        const ORE_MINIME_EURO_ORA = 0.25;

        function euroOraVivo(incasso, oreIntere, turni) {
            const inCorso = turnoInCorso(turni);
            if (!inCorso) {
                return { valore: oreIntere > 0 ? incasso / oreIntere : 0, vivo: false, ore: oreIntere };
            }
            // Le ore fatte finora sono quelle del turno in corso piu' quelle
            // dei turni gia' chiusi nella stessa giornata.
            const altre = (turni || [])
                .filter(t => t !== inCorso && !isRiposo(t))
                .reduce((a, t) => a + (parseFloat(t.ore || 0) || 0), 0);
            const ore = oreFinora(inCorso) + altre;
            if (ore < ORE_MINIME_EURO_ORA) return { valore: 0, vivo: true, ore, troppoPresto: true };
            return { valore: incasso / ore, vivo: true, ore };
        }

        // I moduli stanno in fondo alla scheda Giornate: aprendoli finirebbero

        function portaInVista(id) {

        // Il modulo completo della spesa. Sta qui, fuori da renderContent, perche'
