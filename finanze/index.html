<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conti · Aziendale e Famigliare</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conti">
<meta name="description" content="Gestione dei conti correnti aziendale e famigliare: movimenti, giroconti, budget, scadenze e report.">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-180.png">

<style>
/* ============================================================
   Foglio di stile scritto a mano, senza librerie esterne.
   Motivo: l'app deve aprirsi anche senza campo e senza attese.
   Un CDN va scaricato al primo avvio e, se non risponde, resta
   una pagina di testo senza colori ne' colonne.
   ============================================================ */

:root {
  color-scheme: light dark;

  --sfondo:        #f4f6f9;
  --superficie:    #ffffff;
  --superficie-2:  #f8fafc;
  --bordo:         #e2e8f0;
  --bordo-forte:   #cbd5e1;
  --testo:         #0f172a;
  --testo-2:       #475569;
  --testo-3:       #94a3b8;

  --marchio:       #1e3a5f;
  --marchio-chiaro:#e8eef5;
  --azienda:       #2563eb;
  --azienda-tenue: #dbeafe;
  --famiglia:      #0d9488;
  --famiglia-tenue:#ccfbf1;

  --entrata:       #15803d;
  --entrata-tenue: #dcfce7;
  --uscita:        #b91c1c;
  --uscita-tenue:  #fee2e2;
  --giro:          #7c3aed;
  --giro-tenue:    #ede9fe;
  --avviso:        #b45309;
  --avviso-tenue:  #fef3c7;

  --ombra:   0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.10);
  --ombra-2: 0 4px 6px -1px rgba(15,23,42,.08), 0 2px 4px -2px rgba(15,23,42,.06);
  --raggio:  14px;
  --raggio-s: 10px;
  --barra-bassa: calc(64px + env(safe-area-inset-bottom));
}

@media (prefers-color-scheme: dark) {
  :root {
    --sfondo:        #0b1220;
    --superficie:    #151d2e;
    --superficie-2:  #1c2537;
    --bordo:         #2a3548;
    --bordo-forte:   #3b4860;
    --testo:         #e8edf5;
    --testo-2:       #a8b5c9;
    --testo-3:       #6b7a91;

    --marchio:       #7aa5df;
    --marchio-chiaro:#1b2739;
    --azienda:       #60a5fa;
    --azienda-tenue: #17293f;
    --famiglia:      #2dd4bf;
    --famiglia-tenue:#0f2e2b;

    --entrata:       #4ade80;
    --entrata-tenue: #10281a;
    --uscita:        #f87171;
    --uscita-tenue:  #2e1414;
    --giro:          #a78bfa;
    --giro-tenue:    #211a38;
    --avviso:        #fbbf24;
    --avviso-tenue:  #2b2010;

    --ombra:   0 1px 2px rgba(0,0,0,.4);
    --ombra-2: 0 4px 10px rgba(0,0,0,.45);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--sfondo);
  color: var(--testo);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-bottom: var(--barra-bassa);
}
h1,h2,h3,h4 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--azienda); }

/* ---------- intestazione ---------- */
.testata {
  position: sticky; top: 0; z-index: 30;
  background: var(--marchio);
  color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--ombra);
}
@media (prefers-color-scheme: dark) { .testata { background: #101a2b; } }
.testata .marchio { display: flex; align-items: center; gap: 10px; min-width: 0; }
.testata h1 { font-size: 17px; white-space: nowrap; line-height: 1.2; }
.testata .sotto { font-size: 11px; opacity: .7; white-space: nowrap; }
.testata .spazio { flex: 1; }
.anno-scelta {
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.22);
  color: #fff;
  border-radius: 999px;
  padding: 6px 8px 6px 12px;
  font-weight: 700; font-size: 13px;
  width: auto; flex: 0 0 auto;
}
.anno-scelta option { color: #0f172a; }

/* ---------- contenitore ---------- */
.pagina { max-width: 1100px; margin: 0 auto; padding: 16px; }
.pila > * + * { margin-top: 14px; }

/* ---------- schede di navigazione ---------- */
.barra-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--superficie);
  border-top: 1px solid var(--bordo);
  padding-bottom: env(safe-area-inset-bottom);
}
.barra-nav button {
  background: none; border: 0; padding: 8px 2px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--testo-3); font-size: 10px; font-weight: 700;
}
.barra-nav button svg { width: 21px; height: 21px; }
.barra-nav button[aria-current="page"] { color: var(--azienda); }

@media (min-width: 900px) {
  body { padding-bottom: 0; }
  .barra-nav {
    position: sticky; top: 0; bottom: auto;
    display: flex; justify-content: center; gap: 4px;
    border-top: 0; border-bottom: 1px solid var(--bordo);
    padding: 6px 8px;
  }
  .barra-nav button {
    flex-direction: row; gap: 8px; font-size: 13px; padding: 9px 14px;
    border-radius: var(--raggio-s);
  }
  .barra-nav button:hover { background: var(--superficie-2); color: var(--testo); }
  .barra-nav button[aria-current="page"] { background: var(--marchio-chiaro); color: var(--marchio); }
}

/* ---------- riquadri ---------- */
.riquadro {
  background: var(--superficie);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio);
  box-shadow: var(--ombra);
  overflow: hidden;
}
.riquadro > header {
  padding: 13px 16px;
  border-bottom: 1px solid var(--bordo);
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px 10px; flex-wrap: wrap;
}
.riquadro > header h3 { white-space: nowrap; }
.riquadro > header h3 { font-size: 14px; }
.riquadro > header .nota { font-size: 11.5px; color: var(--testo-3); font-weight: 600; }
.riquadro .corpo { padding: 16px; }
.riquadro .corpo.stretto { padding: 10px 16px; }

.titolo-sezione { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--testo-3); font-weight: 800; }

/* ---------- carte dei conti ---------- */
.conti { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .conti { grid-template-columns: 1fr 1fr; } }
.carta-conto {
  border-radius: var(--raggio);
  padding: 16px;
  border: 1px solid var(--bordo);
  background: var(--superficie);
  box-shadow: var(--ombra);
  position: relative; overflow: hidden;
}
.carta-conto::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: var(--tinta, var(--azienda));
}
.carta-conto .etichetta { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--tinta); }
.carta-conto .nome { font-size: 15px; font-weight: 700; margin-top: 2px; }
.carta-conto .saldo { font-size: 27px; font-weight: 800; letter-spacing: -.02em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.carta-conto .riga-mese { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; font-weight: 700; }
.carta-conto .riga-mese .su { color: var(--entrata); }
.carta-conto .riga-mese .giu { color: var(--uscita); }

.totale-generale {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 14px 16px;
  background: var(--marchio-chiaro);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio);
}
.totale-generale .valore { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---------- dati in griglia ---------- */
.griglia-dati { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 700px) { .griglia-dati { grid-template-columns: repeat(4, 1fr); } }
/* Tre valori: due per riga sul telefono, tre affiancati da tablet in su */
.griglia-dati.tre { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 560px) { .griglia-dati.tre { grid-template-columns: repeat(3, 1fr); } }
.dato .k { overflow-wrap: anywhere; }
.dato {
  background: var(--superficie-2);
  border: 1px solid var(--bordo);
  border-radius: var(--raggio-s);
  padding: 11px 12px;
}
.dato .k { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--testo-3); }
.dato .v { font-size: 17px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }

/* ---------- elenchi di movimenti ---------- */
.elenco { list-style: none; margin: 0; padding: 0; }
.elenco li { border-top: 1px solid var(--bordo); }
.elenco li:first-child { border-top: 0; }
.voce {
  width: 100%; text-align: left; background: none; border: 0;
  padding: 11px 16px; display: flex; align-items: center; gap: 12px;
}
.voce:hover { background: var(--superficie-2); }
.voce .segno {
  width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
  display: grid; place-items: center; font-size: 15px; font-weight: 800;
}
.voce .centro { flex: 1; min-width: 0; display: block; }
.voce .desc { display: block; font-weight: 650; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.voce .meta { display: block; font-size: 11.5px; color: var(--testo-3); font-weight: 600; margin-top: 1px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.voce .meta.libera { white-space: normal; overflow: visible; }
.voce .desc.libera { white-space: normal; }
.voce .cifra { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }

.pallino { display: inline-block; width: 7px; height: 7px; border-radius: 50%; vertical-align: 1px; margin-right: 4px; }

/* ---------- pastiglie ---------- */
.pastiglia {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 800; border: 1px solid transparent;
}
.p-entrata  { background: var(--entrata-tenue); color: var(--entrata); }
.p-uscita   { background: var(--uscita-tenue);  color: var(--uscita); }
.p-giro     { background: var(--giro-tenue);    color: var(--giro); }
.p-avviso   { background: var(--avviso-tenue);  color: var(--avviso); }
.p-neutra   { background: var(--superficie-2);  color: var(--testo-2); border-color: var(--bordo); }

/* ---------- moduli ---------- */
.campi { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .campi.due { grid-template-columns: 1fr 1fr; } .campi.tre { grid-template-columns: 1fr 1fr 1fr; } }
label.campo { display: block; }
label.campo > span {
  display: block; font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .05em; color: var(--testo-2); margin-bottom: 5px;
}
input[type=text], input[type=number], input[type=date], input[type=month], select, textarea {
  width: 100%; padding: 11px 12px;
  background: var(--superficie);
  border: 1px solid var(--bordo-forte);
  border-radius: var(--raggio-s);
  outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--azienda); box-shadow: 0 0 0 3px rgba(37,99,235,.16); }
input[type=number] { font-variant-numeric: tabular-nums; }
.aiuto { font-size: 11.5px; color: var(--testo-3); margin-top: 6px; }

.bottone {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 16px; border-radius: var(--raggio-s);
  border: 1px solid var(--bordo-forte); background: var(--superficie);
  font-weight: 700; font-size: 14px;
}
.bottone:hover { background: var(--superficie-2); }
.bottone.pieno { background: var(--marchio); border-color: var(--marchio); color: #fff; }
.bottone.pieno:hover { filter: brightness(1.12); }
.bottone.pericolo { background: var(--uscita); border-color: var(--uscita); color: #fff; }
.bottone.piccolo { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
.bottone.largo { width: 100%; }
.bottoni { display: flex; flex-wrap: wrap; gap: 8px; }

.scelta-tipo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.scelta-tipo button {
  padding: 10px 6px; border-radius: var(--raggio-s); border: 1.5px solid var(--bordo);
  background: var(--superficie); font-weight: 750; font-size: 13px; color: var(--testo-2);
}
.scelta-tipo button[aria-pressed="true"].t-entrata { border-color: var(--entrata); background: var(--entrata-tenue); color: var(--entrata); }
.scelta-tipo button[aria-pressed="true"].t-uscita  { border-color: var(--uscita);  background: var(--uscita-tenue);  color: var(--uscita); }
.scelta-tipo button[aria-pressed="true"].t-giro    { border-color: var(--giro);    background: var(--giro-tenue);    color: var(--giro); }

/* ---------- filtri ---------- */
.filtri { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.filtri label.campo { flex: 1 1 150px; min-width: 130px; }
.filtri label.campo > span { margin-bottom: 4px; }
.filtri select, .filtri input { padding: 8px 10px; font-size: 13.5px; }

/* ---------- barre di avanzamento ---------- */
.barra { height: 8px; border-radius: 999px; background: var(--superficie-2); overflow: hidden; border: 1px solid var(--bordo); }
.barra > i { display: block; height: 100%; border-radius: 999px; background: var(--azienda); }
.barra.allarme > i { background: var(--uscita); }
.barra.attenzione > i { background: var(--avviso); }

/* ---------- grafico a colonne ---------- */
.grafico { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding-top: 8px; }
.grafico .colonna { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; }
.grafico .colonna .barre { display: flex; align-items: flex-end; gap: 2px; height: 100%; }
.grafico .colonna .barre i { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
.grafico .colonna .barre .e { background: var(--entrata); }
.grafico .colonna .barre .u { background: var(--uscita); }
.grafico .colonna small { text-align: center; font-size: 9.5px; color: var(--testo-3); font-weight: 700; }
.legenda { display: flex; gap: 14px; font-size: 11.5px; font-weight: 700; color: var(--testo-2); }

/* ---------- tabelle ---------- */
.tabella-scorre { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--bordo); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--testo-3); font-weight: 800; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 800; border-top: 2px solid var(--bordo-forte); }

/* ---------- vuoto ---------- */
.vuoto { padding: 30px 16px; text-align: center; color: var(--testo-3); }
.vuoto strong { display: block; color: var(--testo-2); margin-bottom: 4px; font-size: 14px; }

/* ---------- avviso ---------- */
.avviso {
  border-radius: var(--raggio); padding: 12px 14px;
  border: 1px solid var(--avviso); background: var(--avviso-tenue); color: var(--avviso);
  font-size: 13px; font-weight: 650;
}

/* ---------- messaggio a comparsa ---------- */
#messaggio {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(var(--barra-bassa) + 12px); z-index: 60;
  background: #0f172a; color: #fff;
  padding: 11px 16px; border-radius: 999px; box-shadow: var(--ombra-2);
  font-size: 13.5px; font-weight: 650; max-width: min(92vw, 460px); text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
#messaggio.visibile { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 900px) { #messaggio { bottom: 20px; } }

/* ---------- stampa ---------- */
@media print {
  .barra-nav, .testata, #messaggio, .no-stampa { display: none !important; }
  body { background: #fff; color: #000; padding: 0; }
  .pagina { max-width: none; padding: 0; }
  .riquadro { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
}
</style>
</head>
<body>

<header class="testata">
  <div class="marchio">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10.5h20"/><path d="M6 15h4"/>
    </svg>
    <div>
      <h1>Conti</h1>
      <p class="sotto">Aziendale e famigliare</p>
    </div>
  </div>
  <span class="spazio"></span>
  <select class="anno-scelta" id="scelta-anno" aria-label="Anno di esercizio"></select>
</header>

<nav class="barra-nav" id="navigazione" aria-label="Sezioni"></nav>

<main class="pagina" id="contenuto"></main>

<div id="messaggio" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   CONTI — gestione dei conti aziendale e famigliare
   Tutto in un file solo, senza librerie: si apre da subito,
   anche senza rete, e si aggiorna sostituendo questo file.
   ============================================================ */

/* ------------------------------------------------------------
   1. MEMORIA
   I dati stanno nella memoria del browser. Ogni lettura e ogni
   scrittura passano da qui, cosi' un archivio danneggiato non
   impedisce l'apertura dell'app e una memoria piena non fa
   perdere il lavoro in silenzio.
   ------------------------------------------------------------ */

const CHIAVE = {
  conti:       'conti_elenco',
  movimenti:   'conti_movimenti',
  budget:      'conti_budget',
  ricorrenti:  'conti_ricorrenti',
  impostazioni:'conti_impostazioni',
  scheda:      'conti_scheda'
};

function leggi(chiave, predefinito) {
  try {
    const grezzo = localStorage.getItem(chiave);
    if (grezzo === null) return predefinito;
    const v = JSON.parse(grezzo);
    return (v === null || v === undefined) ? predefinito : v;
  } catch (err) {
    console.warn('Archivio illeggibile, riparto dal valore iniziale:', chiave, err);
    return predefinito;
  }
}

function scrivi(chiave, valore) {
  try {
    localStorage.setItem(chiave, JSON.stringify(valore));
    return true;
  } catch (err) {
    console.warn('Salvataggio non riuscito:', chiave, err);
    messaggio('⚠️ Memoria del dispositivo piena: libera spazio, il dato non è stato salvato.');
    return false;
  }
}

/* ------------------------------------------------------------
   2. SINCRONIZZAZIONE (predisposta, oggi spenta)
   Ogni scrittura passa da Sync.inviato(...): adesso non fa nulla.
   Per accendere il Cloud in futuro basta riempire questi tre
   metodi con le chiamate a Firestore, senza toccare il resto
   dell'app. Le istruzioni sono nel README.
   ------------------------------------------------------------ */

const Sync = {
  attivo: false,
  inviato(_collezione, _elemento) { /* qui andra' la scrittura sul Cloud */ },
  rimosso(_collezione, _id)       { /* qui andra' la cancellazione sul Cloud */ },
  avvia()                         { /* qui andra' l'ascolto delle modifiche altrui */ }
};

/* ------------------------------------------------------------
   3. DATI DI PARTENZA
   ------------------------------------------------------------ */

const CONTI_INIZIALI = [
  { id: 'aziendale',  nome: 'Conto aziendale',  ambito: 'aziendale',  saldoIniziale: 0, dataSaldo: '' },
  { id: 'famigliare', nome: 'Conto famigliare', ambito: 'famigliare', saldoIniziale: 0, dataSaldo: '' }
];

// Categorie proposte: si possono cambiare dalle Impostazioni.
const CATEGORIE_INIZIALI = {
  aziendale: {
    ENTRATA: ['Incassi', 'Corse convenzionate', 'Rimborsi', 'Altre entrate'],
    USCITA:  ['Carburante', 'Manutenzione', 'Assicurazione', 'Radio taxi', 'Bollo e tasse auto',
              'Commercialista', 'Contributi INPS', 'Imposte', 'Finanziamento veicolo',
              'Licenza', 'Telefono e internet', 'Altre spese']
  },
  famigliare: {
    ENTRATA: ['Prelievo dal conto aziendale', 'Stipendio', 'Pensione', 'Rimborsi', 'Altre entrate'],
    USCITA:  ['Spesa alimentare', 'Casa (mutuo o affitto)', 'Utenze', 'Auto privata', 'Salute',
              'Scuola e figli', 'Abbigliamento', 'Svago e vacanze', 'Assicurazioni',
              'Risparmio', 'Altre spese']
  }
};

const IMPOSTAZIONI_INIZIALI = {

// Testo dell'utente dentro l'HTML: senza questa conversione una virgoletta
// o una parentesi angolare in una descrizione spezzerebbe la pagina.
function e(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// Per i valori che finiscono dentro un onclick="funzione('...')"
function ej(v) {
  return e(String(v === null || v === undefined ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
}

let contatore = 0;
function nuovoId() {
  contatore = (contatore + 1) % 1000;
  return String(Date.now()) + String(contatore).padStart(3, '0');
}

const euro = (v) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(Number(v) || 0);
// Percentuale con la virgola decimale, come si scrive in italiano
const perc = (parte, totale, decimali) =>
  new Intl.NumberFormat('it-IT', { minimumFractionDigits: decimali || 0, maximumFractionDigits: decimali || 0 })
    .format(totale > 0 ? (parte / totale) * 100 : 0) + '%';

const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MESI_BREVI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

function oggiISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Le date sono stringhe 'AAAA-MM-GG': si confrontano come testo, senza
// passare da new Date(), che con i fusi orari sposta il giorno.
function dataLeggibile(iso) {
  if (!iso) return '';
  const [a, m, g] = String(iso).split('-').map(Number);
  if (!a || !m || !g) return String(iso);
  return `${g} ${MESI[m - 1]} ${a}`;
}
function dataBreve(iso) {
  if (!iso) return '';
  const [, m, g] = String(iso).split('-').map(Number);
  return `${g} ${MESI_BREVI[m - 1]}`;
}
function nomeMese(ym) {
  if (!ym) return '';
  const [a, m] = String(ym).split('-').map(Number);
  return `${MESI[m - 1]} ${a}`;
}
function meseDi(iso) { return String(iso || '').slice(0, 7); }
function annoDi(iso) { return String(iso || '').slice(0, 4); }

function giorniTra(daISO, aISO) {
  const [a1, m1, g1] = String(daISO).split('-').map(Number);
  const [a2, m2, g2] = String(aISO).split('-').map(Number);
  return Math.round((Date.UTC(a2, m2 - 1, g2) - Date.UTC(a1, m1 - 1, g1)) / 86400000);
}

// Somma mesi a una data tenendo il giorno richiesto: chiedendo il 31 in un
// mese che ne ha 30 si ottiene l'ultimo giorno, non il 1° del mese dopo.
function aggiungiMesi(iso, quanti) {
  const [a, m, g] = String(iso).split('-').map(Number);
  const totale = (m - 1) + quanti;
  const anno = a + Math.floor(totale / 12);
  const mese = ((totale % 12) + 12) % 12;
  const ultimo = new Date(anno, mese + 1, 0).getDate();
  const giorno = Math.min(g, ultimo);
  return `${anno}-${String(mese + 1).padStart(2, '0')}-${String(giorno).padStart(2, '0')}`;
}

function importoValido(v) {
  const n = Number(String(v).replace(',', '.'));
  return Number.isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null;
}

let timerMessaggio = null;
function messaggio(testo) {
  const el = document.getElementById('messaggio');
  if (!el) return;
  el.textContent = testo;
  el.classList.add('visibile');
  if (timerMessaggio) clearTimeout(timerMessaggio);
  timerMessaggio = setTimeout(() => el.classList.remove('visibile'), 3400);
}

function conto(id) { return stato.conti.find(c => String(c.id) === String(id)) || null; }
function nomeConto(id) { const c = conto(id); return c ? c.nome : 'Conto eliminato'; }
function ambitoConto(id) { const c = conto(id); return c ? c.ambito : 'aziendale'; }
function tintaConto(id) { return ambitoConto(id) === 'famigliare' ? 'var(--famiglia)' : 'var(--azienda)'; }

function categorieDi(ambito, tipo) {
  const c = (stato.impostazioni.categorie || {})[ambito] || {};
  return (c[tipo] || []).slice();
}

/* ------------------------------------------------------------
   6. CALCOLI
   Un giroconto e' un movimento solo, con conto di partenza e di
   arrivo: toglie da uno e aggiunge all'altro. Non e' ne' un'entrata
   ne' una spesa, quindi non entra nei totali del periodo.
   ------------------------------------------------------------ */

function anniDisponibili() {
  const anni = new Set(stato.movimenti.map(m => annoDi(m.data)).filter(Boolean));
  stato.ricorrenti.forEach(r => { if (r.dataInizio) anni.add(annoDi(r.dataInizio)); });
  anni.add(String(new Date().getFullYear()));
  return Array.from(anni).sort();
}

function annoAttivo() {
  if (!stato.ui.anno) {
    const anni = anniDisponibili();
    const corrente = String(new Date().getFullYear());
    stato.ui.anno = anni.includes(corrente) ? corrente : anni[anni.length - 1];
  }
  return stato.ui.anno;
}

function meseAttivo() {
  if (!stato.ui.mese || annoDi(stato.ui.mese) !== annoAttivo()) {
    const oggi = oggiISO();
    stato.ui.mese = annoDi(oggi) === annoAttivo() ? meseDi(oggi) : `${annoAttivo()}-12`;
  }
  return stato.ui.mese;
}

// Saldo di un conto a una certa data (compresa). Senza data: saldo di oggi.
function saldoConto(idConto, finoA) {
  const c = conto(idConto);
  if (!c) return 0;
  let saldo = Number(c.saldoIniziale) || 0;
  stato.movimenti.forEach(m => {
    if (finoA && String(m.data) > finoA) return;
    // Un saldo iniziale datato ignora tutto quello che viene prima
    if (c.dataSaldo && String(m.data) < c.dataSaldo) return;
    const imp = Number(m.importo) || 0;
    if (m.tipo === 'GIROCONTO') {
      if (String(m.contoId) === String(idConto)) saldo -= imp;
      if (String(m.contoDestinazione) === String(idConto)) saldo += imp;
      return;
    }
    if (String(m.contoId) !== String(idConto)) return;
    saldo += (m.tipo === 'ENTRATA' ? imp : -imp);
  });
  return Math.round(saldo * 100) / 100;
}

function saldoTotale(finoA) {
  return stato.conti.reduce((t, c) => t + saldoConto(c.id, finoA), 0);
}

// Movimenti che riguardano un conto (giroconti compresi, in entrambi i versi)
function riguarda(m, idConto) {
  if (idConto === 'TUTTI') return true;
  return String(m.contoId) === String(idConto) || String(m.contoDestinazione || '') === String(idConto);
}

// Totali di un periodo ('2026' oppure '2026-05'), per conto o per tutti.
function totali(periodo, idConto) {
  const r = { entrate: 0, uscite: 0, nEntrate: 0, nUscite: 0, giroconti: 0, perCategoria: {} };
  stato.movimenti.forEach(m => {
    if (periodo && !String(m.data).startsWith(periodo)) return;
    if (!riguarda(m, idConto || 'TUTTI')) return;
    const imp = Number(m.importo) || 0;
    if (m.tipo === 'GIROCONTO') { r.giroconti += imp; return; }
    // Con un conto specifico contano solo i movimenti di quel conto
    if (idConto && idConto !== 'TUTTI' && String(m.contoId) !== String(idConto)) return;
    if (m.tipo === 'ENTRATA') { r.entrate += imp; r.nEntrate++; }
    else { r.uscite += imp; r.nUscite++; }
    const chiave = (m.tipo === 'ENTRATA' ? 'E|' : 'U|') + (m.categoria || 'Senza categoria');
    if (!r.perCategoria[chiave]) {
      r.perCategoria[chiave] = { tipo: m.tipo, nome: m.categoria || 'Senza categoria', totale: 0, numero: 0 };
    }
    r.perCategoria[chiave].totale += imp;
    r.perCategoria[chiave].numero++;
  });
  r.saldo = r.entrate - r.uscite;
  r.categorie = Object.values(r.perCategoria).sort((a, b) => b.totale - a.totale);
  r.spese = r.categorie.filter(c => c.tipo === 'USCITA');
  r.incassi = r.categorie.filter(c => c.tipo === 'ENTRATA');
  return r;
}

function movimentiOrdinati() {
  return stato.movimenti.slice().sort((a, b) =>
    String(b.data).localeCompare(String(a.data)) || String(b.id).localeCompare(String(a.id)));
}

/* --- budget --- */
// Un budget e' un tetto mensile su una categoria di spesa di un ambito.
function speso(budget, ym) {
  return stato.movimenti.reduce((t, m) => {
    if (m.tipo !== 'USCITA') return t;
    if (meseDi(m.data) !== ym) return t;
    if (m.categoria !== budget.categoria) return t;
    if (budget.conto !== 'TUTTI' && String(m.contoId) !== String(budget.conto)) return t;
    return t + (Number(m.importo) || 0);
  }, 0);
}

function budgetDelMese(ym) {
  return stato.budget.map(b => {
    const usato = speso(b, ym);
    const tetto = Number(b.importo) || 0;
    const perc = tetto > 0 ? (usato / tetto) * 100 : 0;
    return Object.assign({}, b, {
      usato, tetto, perc,
      residuo: tetto - usato,
      sforato: usato > tetto,
      inEsaurimento: !(usato > tetto) && perc >= (stato.impostazioni.sogliaAvvisoBudget || 80)
    });
  }).sort((a, b) => b.perc - a.perc);
}

/* --- scadenze e pagamenti ricorrenti --- */
// La prossima data da pagare: si parte dalla data di inizio e si avanza di
// un periodo alla volta finche' non si supera l'ultima gia' registrata.
function prossimaScadenza(r) {
  const passo = (FREQUENZE.find(f => f.id === r.frequenza) || FREQUENZE[0]).mesi;
  let data = r.dataInizio;
  let giri = 0;
  while (r.ultimaRegistrata && data <= r.ultimaRegistrata && giri < 600) {
    data = aggiungiMesi(data, passo);
    giri++;
  }
  if (r.dataFine && data > r.dataFine) return null;
  return data;
}

function scadenzeOrdinate() {
  const oggi = oggiISO();
  return stato.ricorrenti.map(r => {
    const prossima = prossimaScadenza(r);
    if (!prossima) return Object.assign({}, r, { prossima: null, conclusa: true });
    const giorni = giorniTra(oggi, prossima);
    return Object.assign({}, r, {
      prossima,
      giorni,
      scaduta: giorni < 0,
      oggi: giorni === 0,
      imminente: giorni > 0 && giorni <= (stato.impostazioni.giorniAvvisoScadenza || 14),
      conclusa: false
    });
  }).sort((a, b) => {
    if (a.conclusa !== b.conclusa) return a.conclusa ? 1 : -1;
    return String(a.prossima || '9999').localeCompare(String(b.prossima || '9999'));
  });
}

function scadenzeDaSaldare() {
  return scadenzeOrdinate().filter(s => !s.conclusa && (s.scaduta || s.oggi));
}

function cartaConto(c) {
  const saldo = saldoConto(c.id);
  const t = totali(meseAttivo(), c.id);
  return `
    <div class="carta-conto" style="--tinta:${c.ambito === 'famigliare' ? 'var(--famiglia)' : 'var(--azienda)'}">
      <p class="etichetta">${c.ambito === 'famigliare' ? 'Famigliare' : 'Aziendale'}</p>
      <p class="nome">${e(c.nome)}</p>
      <p class="saldo" style="color:${saldo < 0 ? 'var(--uscita)' : 'inherit'}">${euro(saldo)}</p>
      <div class="riga-mese">
        <span class="su">↑ ${euro(t.entrate)}</span>
        <span class="giu">↓ ${euro(t.uscite)}</span>
      </div>
    </div>`;
}

function rigaMovimento(m, opzioni) {
  const o = opzioni || {};
  const imp = Number(m.importo) || 0;
  let segno, classe, cifra, colore;
  if (m.tipo === 'GIROCONTO') {
    segno = '⇄'; classe = 'p-giro'; cifra = euro(imp); colore = 'var(--giro)';
  } else if (m.tipo === 'ENTRATA') {
    segno = '↑'; classe = 'p-entrata'; cifra = '+' + euro(imp); colore = 'var(--entrata)';
  } else {
    segno = '↓'; classe = 'p-uscita'; cifra = '−' + euro(imp); colore = 'var(--uscita)';
  }
  const descrizione = m.descrizione || m.categoria || (m.tipo === 'GIROCONTO' ? 'Giroconto' : 'Movimento');
  const dettaglio = m.tipo === 'GIROCONTO'
    ? `${e(nomeConto(m.contoId))} → ${e(nomeConto(m.contoDestinazione))}`
    : `${e(m.categoria || 'Senza categoria')} · ${e(nomeConto(m.contoId))}`;
  return `
    <li>
      <button class="voce" onclick="${o.soloLettura ? '' : `apriModifica('${ej(m.id)}')`}">
        <span class="segno ${classe}">${segno}</span>
        <span class="centro">
          <span class="desc">${e(descrizione)}</span>
          <span class="meta">${dataBreve(m.data)} · ${dettaglio}</span>
        </span>
        <span class="cifra" style="color:${colore}">${cifra}</span>
      </button>
    </li>`;
}

function elencoVuoto(titolo, testo) {
  return `<div class="vuoto"><strong>${e(titolo)}</strong>${e(testo || '')}</div>`;
}

function grafico(serie) {
  const massimo = Math.max(1, ...serie.map(p => Math.max(p.entrate, p.uscite)));
  return `
    <div class="grafico">
      ${serie.map(p => `
        <div class="colonna" title="${e(p.etichettaLunga || p.etichetta)}: entrate ${euro(p.entrate)}, uscite ${euro(p.uscite)}">
          <div class="barre">
            <i class="e" style="height:${(p.entrate / massimo) * 100}%"></i>
            <i class="u" style="height:${(p.uscite / massimo) * 100}%"></i>
          </div>
          <small>${e(p.etichetta)}</small>
        </div>`).join('')}
    </div>
    <div class="legenda" style="margin-top:8px">
      <span><span class="pallino" style="background:var(--entrata)"></span>Entrate</span>
      <span><span class="pallino" style="background:var(--uscita)"></span>Uscite</span>

}

      <div class="totale-generale">
        <div>
          <p class="titolo-sezione" style="white-space:nowrap">Liquidità totale</p>
          <p style="font-size:12px;color:var(--testo-3);font-weight:600">Somma dei ${stato.conti.length} conti</p>
        </div>
        <p class="valore" style="color:${totaleSaldo < 0 ? 'var(--uscita)' : 'inherit'}">${euro(totaleSaldo)}</p>
      </div>

      ${daSaldare.length ? `
        <div class="avviso">
          <strong>${daSaldare.length} ${daSaldare.length === 1 ? 'pagamento è scaduto o scade oggi' : 'pagamenti sono scaduti o scadono oggi'}:</strong>
          ${daSaldare.slice(0, 4).map(s => e(s.nome)).join(' · ')}${daSaldare.length > 4 ? ' e altri' : ''}.
          <div style="margin-top:8px"><button class="bottone piccolo" onclick="vaiA('scadenze')">Vai alle scadenze</button></div>
        </div>` : ''}

      <div class="riquadro">
        <header>
          <h3>Andamento di ${nomeMese(ym)}</h3>
          <div class="bottoni no-stampa">
            <button class="bottone piccolo" onclick="scorriMese(-1)" aria-label="Mese precedente">‹</button>
            <button class="bottone piccolo" onclick="scorriMese(1)" aria-label="Mese successivo">›</button>
          </div>
        </header>
        <div class="corpo">
          <div class="griglia-dati">
            <div class="dato"><p class="k">Entrate</p><p class="v" style="color:var(--entrata)">${euro(t.entrate)}</p></div>
            <div class="dato"><p class="k">Uscite</p><p class="v" style="color:var(--uscita)">${euro(t.uscite)}</p></div>
            <div class="dato"><p class="k">Differenza</p><p class="v" style="color:${t.saldo < 0 ? 'var(--uscita)' : 'var(--entrata)'}">${euro(t.saldo)}</p></div>
            <div class="dato"><p class="k">Movimenti</p><p class="v">${t.nEntrate + t.nUscite}</p></div>
          </div>
          ${t.spese.length ? `
            <p class="titolo-sezione" style="margin:18px 0 8px">Dove sono andati i soldi</p>
            ${t.spese.slice(0, 6).map(c => {
              const quota = t.uscite > 0 ? (c.totale / t.uscite) * 100 : 0;
              return `
                <div style="margin-bottom:10px">
                  <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:4px">
                    <span>${e(c.nome)} <span style="color:var(--testo-3)">${c.numero}</span></span>
                    <span>${euro(c.totale)} <span style="color:var(--testo-3)">${perc(c.totale, t.uscite)}</span></span>
                  </div>
                  <div class="barra"><i style="width:${quota}%"></i></div>
                </div>`;
            }).join('')}` : ''}
        </div>
      </div>

      ${budgetCritici.length ? `
        <div class="riquadro">
          <header><h3>Budget sotto pressione</h3><span class="nota">${nomeMese(ym)}</span></header>
          <div class="corpo">
            ${budgetCritici.map(rigaBudget).join('')}
          </div>
        </div>` : ''}

      ${imminenti.length ? `
        <div class="riquadro">
          <header><h3>In arrivo</h3><span class="nota">prossimi ${stato.impostazioni.giorniAvvisoScadenza} giorni</span></header>
          <ul class="elenco">
            ${imminenti.map(s => `
              <li><div class="voce">
                <span class="segno p-avviso">!</span>
                <span class="centro">
                  <span class="desc">${e(s.nome)}</span>
                  <span class="meta">${dataLeggibile(s.prossima)} · fra ${s.giorni} ${s.giorni === 1 ? 'giorno' : 'giorni'} · ${e(nomeConto(s.conto))}</span>
                </span>
                <span class="cifra">${euro(s.importo)}</span>
              </div></li>`).join('')}
          </ul>
        </div>` : ''}

      <div class="riquadro">
        <header>
          <h3>Ultimi movimenti</h3>
          <button class="bottone piccolo no-stampa" onclick="vaiA('movimenti')">Vedi tutti</button>
        </header>
        ${ultimi.length
          ? `<ul class="elenco">${ultimi.map(m => rigaMovimento(m)).join('')}</ul>`
          : elencoVuoto('Nessun movimento registrato', 'Comincia dalla scheda Movimenti, oppure imposta i saldi di partenza dei conti nelle Impostazioni.')}
      </div>

    </div>`;
}

function scorriMese(delta) {
  const [a, m] = meseAttivo().split('-').map(Number);
  const d = new Date(a, m - 1 + delta, 1);
  stato.ui.mese = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  if (annoDi(stato.ui.mese) !== annoAttivo()) stato.ui.anno = annoDi(stato.ui.mese);
  render();
}

/* ------------------------------------------------------------
   10. MOVIMENTI
   Il modulo serve sia per registrare sia per correggere: quando
   si apre una voce esistente i campi arrivano gia' compilati.
   ------------------------------------------------------------ */

function bozzaVuota() {
  const primo = stato.conti[0] || {};
  return {
    tipo: stato.ui.tipoNuovo || 'USCITA',
    data: oggiISO(),
    conto: stato.ui.contoNuovo || primo.id || '',
    contoA: (stato.conti[1] || stato.conti[0] || {}).id || '',
    categoria: '',
    descrizione: '',
    importo: '',
    metodo: (stato.impostazioni.metodi || [])[0] || ''
  };
}

function bozza() {
  if (!stato.ui.bozza) stato.ui.bozza = bozzaVuota();
  return stato.ui.bozza;
}

// Prima di ogni ridisegno del modulo si fotografa quello che c'e' scritto:
// altrimenti cambiando il tipo di movimento si perderebbe l'importo appena digitato.
function leggiModulo() {
  const v = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const b = bozza();
  ['data', 'conto', 'contoA', 'categoria', 'descrizione', 'importo', 'metodo'].forEach(k => {
    const val = v('mv-' + k);
    if (val !== undefined) b[k] = val;
  });
}

function cambiaTipoMovimento(tipo) {
  leggiModulo();
  bozza().tipo = tipo;
  bozza().categoria = '';
  stato.ui.tipoNuovo = tipo;
  render();
}

function cambiaContoModulo() {
  leggiModulo();
  bozza().categoria = '';
  render();
}

function apriModulo() {
  stato.ui.inModifica = null;
  stato.ui.bozza = bozzaVuota();
  stato.ui.modulo = true;
  render(true);
}

function chiudiModulo() {
  stato.ui.modulo = false;
  stato.ui.inModifica = null;
  stato.ui.bozza = null;
  render();
}

function apriModifica(id) {
  const m = stato.movimenti.find(x => String(x.id) === String(id));
  if (!m) return;
  stato.ui.scheda = 'movimenti';
  stato.ui.inModifica = m.id;
  stato.ui.modulo = true;
  stato.ui.bozza = {
    tipo: m.tipo,
    data: m.data,
    conto: m.contoId,
    contoA: m.contoDestinazione || (stato.conti[1] || {}).id || '',
    categoria: m.categoria || '',
    descrizione: m.descrizione || '',
    importo: String(m.importo),
    metodo: m.metodo || ''
  };
  render(true);
}

function moduloMovimento() {
  const b = bozza();
  const modifica = !!stato.ui.inModifica;
  const giro = b.tipo === 'GIROCONTO';
  const ambito = ambitoConto(b.conto);
  const elenco = categorieDi(ambito, b.tipo === 'ENTRATA' ? 'ENTRATA' : 'USCITA');
  const opzioniConto = (selezionato) => stato.conti.map(c =>
    `<option value="${e(c.id)}" ${String(selezionato) === String(c.id) ? 'selected' : ''}>${e(c.nome)}</option>`).join('');

  return `
    <div class="riquadro no-stampa">
      <header>
        <h3>${modifica ? 'Correggi il movimento' : 'Nuovo movimento'}</h3>
        <button class="bottone piccolo" onclick="chiudiModulo()">Chiudi</button>
      </header>
      <div class="corpo">
        <form onsubmit="salvaMovimento(event)" class="pila">

          <div class="scelta-tipo">
            <button type="button" class="t-uscita"  aria-pressed="${b.tipo === 'USCITA'}"    onclick="cambiaTipoMovimento('USCITA')">↓ Uscita</button>
            <button type="button" class="t-entrata" aria-pressed="${b.tipo === 'ENTRATA'}"   onclick="cambiaTipoMovimento('ENTRATA')">↑ Entrata</button>
            <button type="button" class="t-giro"    aria-pressed="${b.tipo === 'GIROCONTO'}" onclick="cambiaTipoMovimento('GIROCONTO')">⇄ Giroconto</button>
          </div>

          <div class="campi due">
            <label class="campo"><span>Data</span>
              <input type="date" id="mv-data" value="${e(b.data)}" required>
            </label>
            <label class="campo"><span>Importo (€)</span>
              <input type="number" id="mv-importo" inputmode="decimal" step="0.01" min="0.01"
                     value="${e(b.importo)}" placeholder="0,00" required>
            </label>
          </div>

          ${giro ? `
            <div class="campi due">
              <label class="campo"><span>Esce dal conto</span>
                <select id="mv-conto" onchange="cambiaContoModulo()">${opzioniConto(b.conto)}</select>
              </label>
              <label class="campo"><span>Entra nel conto</span>
                <select id="mv-contoA">${opzioniConto(b.contoA)}</select>
              </label>
            </div>
            <p class="aiuto">Il giroconto sposta denaro fra i tuoi conti: non conta né come entrata né come spesa nei totali del periodo. È il caso tipico del prelievo dal conto aziendale a quello di famiglia.</p>
          ` : `
            <div class="campi due">
              <label class="campo"><span>Conto</span>
                <select id="mv-conto" onchange="cambiaContoModulo()">${opzioniConto(b.conto)}</select>
              </label>
              <label class="campo"><span>Categoria</span>
                <input type="text" id="mv-categoria" list="lista-categorie" value="${e(b.categoria)}"
                       placeholder="Scegli o scrivi" required>
                <datalist id="lista-categorie">
                  ${elenco.map(c => `<option value="${e(c)}"></option>`).join('')}
                </datalist>
              </label>
            </div>
          `}

          <div class="campi due">
            <label class="campo"><span>Descrizione ${giro ? '' : '<span style="text-transform:none;font-weight:600;color:var(--testo-3)">(facoltativa)</span>'}</span>
              <input type="text" id="mv-descrizione" value="${e(b.descrizione)}" placeholder="${giro ? 'Es. prelievo mensile' : 'Es. Enel, spesa Esselunga, gasolio'}">
            </label>
            <label class="campo"><span>Modalità</span>
              <select id="mv-metodo">
                ${(stato.impostazioni.metodi || []).map(m =>
                  `<option value="${e(m)}" ${b.metodo === m ? 'selected' : ''}>${e(m)}</option>`).join('')}
              </select>
            </label>
          </div>

          <div class="bottoni">
            <button type="submit" class="bottone pieno" name="azione" value="chiudi">${modifica ? 'Salva le modifiche' : 'Salva'}</button>
            ${modifica ? `
              <button type="button" class="bottone pericolo" onclick="eliminaMovimento('${ej(stato.ui.inModifica)}')">Elimina</button>
            ` : `
              <button type="submit" class="bottone" name="azione" value="ancora">Salva e registra un altro</button>
            `}
          </div>
        </form>
      </div>
    </div>`;
}

function movimentiFiltrati() {
  const f = stato.ui.filtri;
  const cerca = (f.cerca || '').trim().toLowerCase();
  return movimentiOrdinati().filter(m => {
    if (annoDi(m.data) !== annoAttivo()) return false;
    if (f.mese !== 'TUTTI' && meseDi(m.data) !== f.mese) return false;
    if (f.conto !== 'TUTTI' && !riguarda(m, f.conto)) return false;
    if (f.tipo !== 'TUTTI' && m.tipo !== f.tipo) return false;
    if (f.categoria !== 'TUTTE' && (m.categoria || '') !== f.categoria) return false;
    if (cerca) {
      const testo = `${m.descrizione || ''} ${m.categoria || ''} ${nomeConto(m.contoId)}`.toLowerCase();
      if (!testo.includes(cerca)) return false;
    }
    return true;
  });
}

function categorieUsate() {
  const s = new Set();
  stato.movimenti.forEach(m => { if (m.categoria) s.add(m.categoria); });
  return Array.from(s).sort((a, b) => a.localeCompare(b, 'it'));
}

function mesiDellAnno() {
  const s = new Set(stato.movimenti.filter(m => annoDi(m.data) === annoAttivo()).map(m => meseDi(m.data)));
  return Array.from(s).sort().reverse();
}

function vistaMovimenti() {
  const f = stato.ui.filtri;
  const elenco = movimentiFiltrati();
  const entrate = elenco.filter(m => m.tipo === 'ENTRATA').reduce((t, m) => t + Number(m.importo || 0), 0);
  const uscite  = elenco.filter(m => m.tipo === 'USCITA').reduce((t, m) => t + Number(m.importo || 0), 0);
  const filtriAttivi = f.conto !== 'TUTTI' || f.tipo !== 'TUTTI' || f.categoria !== 'TUTTE' || f.mese !== 'TUTTI' || !!f.cerca;

  return `
    <div class="pila">

      ${stato.ui.modulo ? moduloMovimento() : `
        <button class="bottone pieno largo no-stampa" onclick="apriModulo()">+ Registra un movimento</button>`}

      <div class="riquadro no-stampa">
        <div class="corpo stretto" style="padding-top:14px;padding-bottom:14px">
          <div class="filtri">
            <label class="campo"><span>Conto</span>
              <select onchange="impostaFiltro('conto', this.value)">
                <option value="TUTTI">Tutti i conti</option>
                ${stato.conti.map(c => `<option value="${e(c.id)}" ${f.conto === c.id ? 'selected' : ''}>${e(c.nome)}</option>`).join('')}
              </select>
            </label>
            <label class="campo"><span>Tipo</span>
              <select onchange="impostaFiltro('tipo', this.value)">
                <option value="TUTTI">Tutti</option>
                <option value="USCITA" ${f.tipo === 'USCITA' ? 'selected' : ''}>Uscite</option>
                <option value="ENTRATA" ${f.tipo === 'ENTRATA' ? 'selected' : ''}>Entrate</option>
                <option value="GIROCONTO" ${f.tipo === 'GIROCONTO' ? 'selected' : ''}>Giroconti</option>
              </select>
            </label>
            <label class="campo"><span>Mese</span>
              <select onchange="impostaFiltro('mese', this.value)">
                <option value="TUTTI">Tutto il ${annoAttivo()}</option>
                ${mesiDellAnno().map(m => `<option value="${m}" ${f.mese === m ? 'selected' : ''}>${nomeMese(m)}</option>`).join('')}
              </select>
            </label>
            <label class="campo"><span>Categoria</span>
              <select onchange="impostaFiltro('categoria', this.value)">
                <option value="TUTTE">Tutte</option>
                ${categorieUsate().map(c => `<option value="${e(c)}" ${f.categoria === c ? 'selected' : ''}>${e(c)}</option>`).join('')}
              </select>
            </label>
            <label class="campo" style="flex:2 1 200px"><span>Cerca</span>
              <input type="text" value="${e(f.cerca)}" placeholder="descrizione o categoria"
                     oninput="impostaFiltro('cerca', this.value, true)">
            </label>
            ${filtriAttivi ? `<button class="bottone piccolo" onclick="azzeraFiltri()" style="margin-bottom:1px">Azzera</button>` : ''}
          </div>
        </div>
      </div>

      <div class="riquadro">
        <header>
          <h3>${elenco.length} ${elenco.length === 1 ? 'movimento' : 'movimenti'}</h3>
          <span class="nota" style="flex-basis:100%">
            <span style="color:var(--entrata)">↑ ${euro(entrate)}</span> ·
            <span style="color:var(--uscita)">↓ ${euro(uscite)}</span> ·
            saldo ${euro(entrate - uscite)}
          </span>
        </header>
        ${elenco.length
          ? `<ul class="elenco">${elenco.slice(0, 400).map(m => rigaMovimento(m)).join('')}</ul>
             ${elenco.length > 400 ? `<div class="corpo" style="text-align:center;color:var(--testo-3);font-size:12.5px">Mostrati i 400 più recenti su ${elenco.length}. I totali qui sopra li considerano tutti.</div>` : ''}`
          : elencoVuoto(filtriAttivi ? 'Nessun movimento con questi filtri' : 'Nessun movimento nel ' + annoAttivo(),
                        filtriAttivi ? 'Prova ad azzerare i filtri.' : 'Tocca «Registra un movimento» per cominciare.')}
      </div>
    </div>`;
}

let timerCerca = null;
function impostaFiltro(campo, valore, differito) {
  stato.ui.filtri[campo] = valore;
  if (differito) {
    // Ridisegnare a ogni lettera farebbe perdere il fuoco alla casella di ricerca
    if (timerCerca) clearTimeout(timerCerca);
    timerCerca = setTimeout(() => {
      render();
      const box = document.querySelector('input[oninput*="cerca"]');
      if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    }, 320);
    return;
  }
  render();
}

function azzeraFiltri() {
  stato.ui.filtri = { conto: 'TUTTI', tipo: 'TUTTI', categoria: 'TUTTE', mese: 'TUTTI', cerca: '' };
  render();
}

function salvaMovimento(ev) {
  ev.preventDefault();
  leggiModulo();
  const b = bozza();
  const importo = importoValido(b.importo);

  if (!b.data) { messaggio('Manca la data.'); return; }
  if (importo === null) { messaggio('L\'importo deve essere un numero maggiore di zero.'); return; }

  if (b.tipo === 'GIROCONTO') {
    if (!b.conto || !b.contoA) { messaggio('Scegli il conto di partenza e quello di arrivo.'); return; }
    if (String(b.conto) === String(b.contoA)) { messaggio('Il giroconto deve andare da un conto a un altro.'); return; }
  } else if (!(b.categoria || '').trim()) {
    messaggio('Indica una categoria.'); return;
  }

  const dati = {
    data: b.data,
    tipo: b.tipo,
    contoId: b.conto,
    contoDestinazione: b.tipo === 'GIROCONTO' ? b.contoA : null,
    categoria: b.tipo === 'GIROCONTO' ? '' : (b.categoria || '').trim(),
    descrizione: (b.descrizione || '').trim(),
    importo,
    metodo: b.metodo || ''
  };

  if (stato.ui.inModifica) {
    const i = stato.movimenti.findIndex(x => String(x.id) === String(stato.ui.inModifica));
    if (i < 0) { messaggio('Movimento non più presente.'); chiudiModulo(); return; }
    stato.movimenti[i] = Object.assign({}, stato.movimenti[i], dati);
    salva.movimenti();
    Sync.inviato('movimenti', stato.movimenti[i]);
    messaggio('Movimento aggiornato.');
    chiudiModulo();
    return;
  }

  const nuovo = Object.assign({ id: nuovoId() }, dati);
  stato.movimenti.push(nuovo);
  salva.movimenti();
  Sync.inviato('movimenti', nuovo);

  const ancora = !!(ev.submitter && ev.submitter.value === 'ancora');
  messaggio(ancora ? 'Salvato. Pronto per il prossimo.' : 'Movimento salvato.');
  if (ancora) {
    // Si tengono data, conto e tipo: di solito si registrano piu' voci simili di fila
    stato.ui.bozza = Object.assign(bozzaVuota(), {
      tipo: nuovo.tipo, data: nuovo.data, conto: nuovo.contoId, contoA: b.contoA, metodo: nuovo.metodo
    });
    render();
    setTimeout(() => { const el = document.getElementById('mv-importo'); if (el) el.focus(); }, 0);
  } else {
    chiudiModulo();
  }
}

function eliminaMovimento(id) {
  const m = stato.movimenti.find(x => String(x.id) === String(id));
  if (!m) return;
  const cosa = m.descrizione || m.categoria || 'il movimento';
  if (!confirm(`Elimino ${cosa} del ${dataLeggibile(m.data)} (${euro(m.importo)})?\nL'operazione non si può annullare.`)) return;
  stato.movimenti = stato.movimenti.filter(x => String(x.id) !== String(id));
  salva.movimenti();
  Sync.rimosso('movimenti', id);
  messaggio('Movimento eliminato.');
  chiudiModulo();
}

/* ------------------------------------------------------------
   11. BUDGET
   Un tetto di spesa mensile per categoria. Vale per tutti i mesi:
   quello che cambia e' quanto ne hai gia' consumato nel mese scelto.
   ------------------------------------------------------------ */

function rigaBudget(b) {
  const quota = Math.min(100, b.perc);
  const classe = b.sforato ? 'allarme' : (b.inEsaurimento ? 'attenzione' : '');
  const colore = b.sforato ? 'var(--uscita)' : (b.inEsaurimento ? 'var(--avviso)' : 'var(--testo-2)');
  return `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;margin-bottom:5px">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(b.categoria)}</span>
        <span style="color:${colore};white-space:nowrap">${euro(b.usato)} <span style="color:var(--testo-3)">di ${euro(b.tetto)}</span></span>
      </div>
      <div class="barra ${classe}"><i style="width:${quota}%"></i></div>
      <div style="display:flex;justify-content:space-between;gap:10px;margin-top:4px;font-size:11.5px;font-weight:650;color:var(--testo-3)">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${b.conto === 'TUTTI' ? 'tutti i conti' : e(nomeConto(b.conto))} ·
          ${b.sforato
            ? `<span style="color:var(--uscita)">superato di ${euro(-b.residuo)}</span>`
            : `restano ${euro(b.residuo)}`}</span>
        <span style="white-space:nowrap">${perc(b.usato, b.tetto)}</span>
      </div>
    </div>`;
}

function vistaBudget() {
  const ym = meseAttivo();
  const elenco = budgetDelMese(ym);
  const tetto = elenco.reduce((t, b) => t + b.tetto, 0);
  const usato = elenco.reduce((t, b) => t + b.usato, 0);
  const categorieProponibili = Array.from(new Set([].concat(
    categorieDi('aziendale', 'USCITA'), categorieDi('famigliare', 'USCITA'), categorieUsate()
  ))).sort((a, b) => a.localeCompare(b, 'it'));

  return `
    <div class="pila">

      <div class="riquadro">
        <header>

function salvaBudget(ev) {
  ev.preventDefault();
  const categoria = (document.getElementById('bg-categoria').value || '').trim();
  const importo = importoValido(document.getElementById('bg-importo').value);
  const contoScelto = document.getElementById('bg-conto').value;
  if (!categoria) { messaggio('Indica la categoria.'); return; }
  if (importo === null) { messaggio('Il tetto deve essere un numero maggiore di zero.'); return; }

  const gia = stato.budget.find(b => b.categoria === categoria && b.conto === contoScelto);
  if (gia) {
    if (!confirm(`Per «${categoria}» c'è già un tetto di ${euro(gia.importo)}. Lo sostituisco con ${euro(importo)}?`)) return;
    gia.importo = importo;
  } else {
    stato.budget.push({ id: nuovoId(), categoria, importo, conto: contoScelto });
  }
  salva.budget();
  Sync.inviato('budget', gia || stato.budget[stato.budget.length - 1]);
  messaggio('Budget salvato.');
  render();
}

function eliminaBudget(id) {
  const b = stato.budget.find(x => String(x.id) === String(id));
  if (!b) return;
  if (!confirm(`Tolgo il tetto di spesa su «${b.categoria}»?`)) return;
  stato.budget = stato.budget.filter(x => String(x.id) !== String(id));
  salva.budget();
  Sync.rimosso('budget', id);
  messaggio('Tetto rimosso.');
  render();
}

/* ------------------------------------------------------------
   12. SCADENZE E PAGAMENTI RICORRENTI
   Si inseriscono una volta; l'app calcola la data della prossima
   e, quando arriva, basta un tocco per registrare il movimento.
   La registrazione non e' automatica di proposito: un addebito
   scritto da solo, magari mai andato a buon fine, falserebbe il
   saldo senza che tu te ne accorga.
   ------------------------------------------------------------ */

function vistaScadenze() {
  const elenco = scadenzeOrdinate();
  const daSaldare = elenco.filter(s => !s.conclusa && (s.scaduta || s.oggi));
  const attive = elenco.filter(s => !s.conclusa);
  const usciteMensili = attive.reduce((t, s) => {
    const mesi = (FREQUENZE.find(f => f.id === s.frequenza) || FREQUENZE[0]).mesi;
    return t + (s.tipo === 'USCITA' ? (Number(s.importo) || 0) / mesi : 0);
  }, 0);

  const pastiglia = (s) => {
    if (s.conclusa) return '<span class="pastiglia p-neutra">Conclusa</span>';
    if (s.scaduta) return `<span class="pastiglia p-uscita">Scaduta da ${-s.giorni} gg</span>`;
    if (s.oggi) return '<span class="pastiglia p-avviso">Scade oggi</span>';
    if (s.imminente) return `<span class="pastiglia p-avviso">Fra ${s.giorni} gg</span>`;
    return `<span class="pastiglia p-neutra">Fra ${s.giorni} gg</span>`;
  };

  return `
    <div class="pila">

      ${daSaldare.length ? `
        <div class="avviso">
          <strong>${daSaldare.length} ${daSaldare.length === 1 ? 'pagamento da registrare' : 'pagamenti da registrare'}.</strong>
          Controlla che siano davvero passati sul conto, poi registrali.
          <div style="margin-top:8px"><button class="bottone piccolo" onclick="registraTutteScadute()">Registra tutti (${daSaldare.length})</button></div>
        </div>` : ''}

      <div class="griglia-dati tre">
        <div class="dato"><p class="k">Attive</p><p class="v">${attive.length}</p></div>
        <div class="dato"><p class="k">Da registrare</p><p class="v" style="color:${daSaldare.length ? 'var(--uscita)' : 'inherit'}">${daSaldare.length}</p></div>
        <div class="dato"><p class="k">Costo al mese</p><p class="v">${euro(usciteMensili)}</p></div>
      </div>

      <div class="riquadro">
        <header><h3>Pagamenti ricorrenti</h3><span class="nota">in ordine di scadenza</span></header>
        ${elenco.length ? `
          <ul class="elenco">
            ${elenco.map(s => `
              <li><div class="voce" style="flex-wrap:wrap">
                <span class="segno ${s.tipo === 'ENTRATA' ? 'p-entrata' : 'p-uscita'}">${s.tipo === 'ENTRATA' ? '↑' : '↓'}</span>
                <span class="centro">
                  <span class="desc libera">${e(s.nome)}</span>
                  <span class="meta libera">
                    ${s.conclusa ? 'Nessuna scadenza futura' : dataLeggibile(s.prossima)}
                    · ${e((FREQUENZE.find(f => f.id === s.frequenza) || {}).etichetta || s.frequenza)}
                    · ${e(nomeConto(s.conto))}
                  </span>
                </span>
                <span style="text-align:right">
                  <span class="cifra" style="display:block">${euro(s.importo)}</span>
                  <span style="display:block;margin-top:3px">${pastiglia(s)}</span>
                </span>
                <span style="flex-basis:100%;display:flex;gap:6px;justify-content:flex-end;margin-top:8px" class="no-stampa">
                  ${!s.conclusa && (s.scaduta || s.oggi || s.imminente)
                    ? `<button class="bottone piccolo" onclick="registraScadenza('${ej(s.id)}')">Registra il pagamento</button>` : ''}
                  <button class="bottone piccolo" onclick="eliminaRicorrente('${ej(s.id)}')">Elimina</button>
                </span>
              </div></li>`).join('')}
          </ul>` : elencoVuoto('Nessun pagamento ricorrente',
                               'Inserisci qui rate, bollette, assicurazioni, F24: l\'app ti ricorderà quando scadono.')}
      </div>

      <div class="riquadro no-stampa">
        <header><h3>Aggiungi un pagamento ricorrente</h3></header>
        <div class="corpo">
          <form onsubmit="salvaRicorrente(event)">
            <div class="campi due">
              <label class="campo"><span>Che cos'è</span>
                <input type="text" id="rc-nome" placeholder="Es. Rata finanziamento, RCA, F24" required>
              </label>
              <label class="campo"><span>Importo (€)</span>
                <input type="number" id="rc-importo" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00" required>
              </label>
            </div>
            <div class="campi tre" style="margin-top:12px">
              <label class="campo"><span>Conto</span>
                <select id="rc-conto">${stato.conti.map(c => `<option value="${e(c.id)}">${e(c.nome)}</option>`).join('')}</select>
              </label>
              <label class="campo"><span>Ogni quanto</span>
                <select id="rc-frequenza">${FREQUENZE.map(f => `<option value="${f.id}">${e(f.etichetta)}</option>`).join('')}</select>
              </label>
              <label class="campo"><span>Prima scadenza</span>
                <input type="date" id="rc-inizio" value="${oggiISO()}" required>
              </label>
            </div>
            <div class="campi tre" style="margin-top:12px">
              <label class="campo"><span>Tipo</span>
                <select id="rc-tipo">
                  <option value="USCITA">Uscita (pagamento)</option>
                  <option value="ENTRATA">Entrata (incasso fisso)</option>
                </select>
              </label>
              <label class="campo"><span>Categoria</span>
                <input type="text" id="rc-categoria" list="lista-categorie-rc" placeholder="Scegli o scrivi" required>
                <datalist id="lista-categorie-rc">
                  ${Array.from(new Set([].concat(categorieDi('aziendale','USCITA'), categorieDi('famigliare','USCITA'))))

              </label>
              <label class="campo"><span>Fino al <span style="text-transform:none;font-weight:600;color:var(--testo-3)">(facoltativo)</span></span>

              <button type="submit" class="bottone pieno">Aggiungi</button>
            </div>
            <p class="aiuto">Nessun movimento viene creato da solo: alla scadenza l'app te lo segnala e lo registri con un tocco, dopo aver controllato che sia davvero passato sul conto.</p>
          </form>
        </div>
      </div>
    </div>`;
}

function salvaRicorrente(ev) {
  ev.preventDefault();
  const v = (id) => (document.getElementById(id).value || '').trim();
  const nome = v('rc-nome');
  const importo = importoValido(v('rc-importo'));
  const inizio = v('rc-inizio');
  const fine = v('rc-fine');
  const categoria = v('rc-categoria');

  if (!nome) { messaggio('Dai un nome al pagamento.'); return; }
  if (importo === null) { messaggio('L\'importo deve essere un numero maggiore di zero.'); return; }
  if (!inizio) { messaggio('Indica la data della prima scadenza.'); return; }
  if (fine && fine < inizio) { messaggio('La data finale viene prima della prima scadenza.'); return; }
  if (!categoria) { messaggio('Indica una categoria.'); return; }

  const nuovo = {
    id: nuovoId(), nome, importo,
    conto: v('rc-conto'),
    frequenza: v('rc-frequenza'),
    tipo: v('rc-tipo'),
    categoria,
    dataInizio: inizio,
    dataFine: fine || '',
    ultimaRegistrata: ''
  };
  stato.ricorrenti.push(nuovo);
  salva.ricorrenti();
  Sync.inviato('ricorrenti', nuovo);
  messaggio('Pagamento ricorrente aggiunto.');
  render();
}

function registraScadenza(id, silenzioso) {
  const r = stato.ricorrenti.find(x => String(x.id) === String(id));
  if (!r) return false;
  const data = prossimaScadenza(r);
  if (!data) { if (!silenzioso) messaggio('Non ci sono altre scadenze per questa voce.'); return false; }

  const movimento = {
    id: nuovoId(),
    data,
    tipo: r.tipo === 'ENTRATA' ? 'ENTRATA' : 'USCITA',
    contoId: r.conto,
    contoDestinazione: null,
    categoria: r.categoria,
    descrizione: r.nome,
    importo: Number(r.importo) || 0,
    metodo: 'Addebito diretto (RID)',
    ricorrenteId: r.id
  };
  stato.movimenti.push(movimento);
  r.ultimaRegistrata = data;
  salva.movimenti();
  salva.ricorrenti();
  Sync.inviato('movimenti', movimento);
  Sync.inviato('ricorrenti', r);
  if (!silenzioso) {
    messaggio(`${r.nome} registrato il ${dataLeggibile(data)}.`);
    render();
  }
  return true;
}

function registraTutteScadute() {
  const da = scadenzeDaSaldare();
  if (!da.length) return;
  const totale = da.reduce((t, s) => t + (Number(s.importo) || 0), 0);
  if (!confirm(`Registro ${da.length} ${da.length === 1 ? 'pagamento' : 'pagamenti'} per ${euro(totale)}?\nControlla prima che siano passati davvero sul conto.`)) return;
  let fatti = 0;
  da.forEach(s => { if (registraScadenza(s.id, true)) fatti++; });
  messaggio(`${fatti} ${fatti === 1 ? 'pagamento registrato' : 'pagamenti registrati'}.`);
  render();
}

function eliminaRicorrente(id) {
  const r = stato.ricorrenti.find(x => String(x.id) === String(id));
  if (!r) return;
  if (!confirm(`Elimino «${r.nome}» dai pagamenti ricorrenti?\nI movimenti già registrati restano.`)) return;
  stato.ricorrenti = stato.ricorrenti.filter(x => String(x.id) !== String(id));
  salva.ricorrenti();
  Sync.rimosso('ricorrenti', id);
  messaggio('Pagamento ricorrente eliminato.');
  render();
}

function serieAnnuale(idConto) {
  const serie = [];
  for (let m = 1; m <= 12; m++) {
    const ym = `${annoAttivo()}-${String(m).padStart(2, '0')}`;
    const t = totali(ym, idConto);
    serie.push({ etichetta: MESI_BREVI[m - 1], etichettaLunga: nomeMese(ym), ym, entrate: t.entrate, uscite: t.uscite });
  }
  return serie;
}

  const anno = annoAttivo();

  const serie = serieAnnuale('TUTTI');
  const perConto = stato.conti.map(c => ({ conto: c, t: totali(anno, c.id), saldo: saldoConto(c.id, `${anno}-12-31`) }));

  return `
    <div class="pila">

      <div class="riquadro">
        <header>
          <h3>Anno ${anno}</h3>
          <div class="bottoni no-stampa">
            <button class="bottone piccolo" onclick="window.print()">Stampa / PDF</button>

        </header>

            <div class="dato"><p class="k">Uscite</p><p class="v" style="color:var(--uscita)">${euro(complessivo.uscite)}</p></div>

            <div class="dato"><p class="k">Girato fra conti</p><p class="v" style="color:var(--giro)">${euro(complessivo.giroconti)}</p></div>
          </div>
          <p class="titolo-sezione" style="margin:20px 0 0">Mese per mese</p>
          ${grafico(serie)}
        </div>
      </div>

      <div class="riquadro">
        <header><h3>Conto per conto</h3></header>
        <div class="tabella-scorre">
          <table>
            <thead><tr>
              <th>Conto</th><th class="num">Entrate</th><th class="num">Uscite</th>
              <th class="num">Differenza</th><th class="num">Saldo a fine ${anno}</th>
            </tr></thead>
            <tbody>
              ${perConto.map(r => `
                <tr>
                  <td><span class="pallino" style="background:${r.conto.ambito === 'famigliare' ? 'var(--famiglia)' : 'var(--azienda)'}"></span>${e(r.conto.nome)}</td>
                  <td class="num" style="color:var(--entrata)">${euro(r.t.entrate)}</td>
                  <td class="num" style="color:var(--uscita)">${euro(r.t.uscite)}</td>
                  <td class="num" style="color:${r.t.saldo < 0 ? 'var(--uscita)' : 'inherit'}">${euro(r.t.saldo)}</td>
                  <td class="num">${euro(r.saldo)}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot><tr>
              <td>Totale</td>
              <td class="num">${euro(complessivo.entrate)}</td>
              <td class="num">${euro(complessivo.uscite)}</td>
              <td class="num">${euro(complessivo.saldo)}</td>
              <td class="num">${euro(saldoTotale(`${anno}-12-31`))}</td>
            </tr></tfoot>
          </table>

      ${['USCITA', 'ENTRATA'].map(tipo => {
        const voci = tipo === 'USCITA' ? complessivo.spese : complessivo.incassi;

          <p class="aiuto" style="margin:0 0 12px">
            I dati stanno solo su questo dispositivo. Scarica ogni tanto un backup e conservalo
            su iCloud Drive o Google Drive: è anche il modo per spostare tutto su un altro telefono.
          </p>
          <div class="bottoni">
            <button class="bottone pieno" onclick="esportaBackup()">Scarica backup (.json)</button>
            <button class="bottone" onclick="esportaCSV()">Scarica CSV ${annoAttivo()}</button>
            <label class="bottone" style="margin:0">
              Ripristina da backup
              <input type="file" accept=".json,application/json" onchange="importaBackup(event)" hidden>
            </label>
          </div>
          <p class="aiuto">Il ripristino unisce: le voci con lo stesso identificativo vengono aggiornate, non duplicate.</p>
        </div>
      </div>

      <div class="riquadro" style="border-color:var(--uscita)">
        <header><h3 style="color:var(--uscita)">Azzera tutto</h3></header>
        <div class="corpo">
          <p class="aiuto" style="margin:0 0 12px">Cancella movimenti, budget e pagamenti ricorrenti di questo dispositivo. Scarica prima un backup.</p>
          <button class="bottone pericolo" onclick="azzeraTutto()">Cancella tutti i dati</button>
        </div>
      </div>

      <p style="text-align:center;color:var(--testo-3);font-size:12px;padding:4px 0 10px">
        ${stato.movimenti.length} movimenti · ${stato.budget.length} budget · ${stato.ricorrenti.length} pagamenti ricorrenti
      </p>
    </div>`;
}

function salvaConti() {
  let problemi = 0;
  stato.conti.forEach(c => {
    const nome = (document.getElementById('ct-nome-' + c.id).value || '').trim();
    const saldo = Number(String(document.getElementById('ct-saldo-' + c.id).value).replace(',', '.'));
    const data = document.getElementById('ct-data-' + c.id).value;
    if (!nome) { problemi++; return; }
    c.nome = nome;
    c.saldoIniziale = Number.isFinite(saldo) ? Math.round(saldo * 100) / 100 : 0;
    c.dataSaldo = data || '';
  });
  if (problemi) { messaggio('Ogni conto deve avere un nome.'); return; }
  salva.conti();
  stato.conti.forEach(c => Sync.inviato('conti', c));
  messaggio('Conti aggiornati.');
  render();
}

function salvaAvvisi() {
  const soglia = parseInt(document.getElementById('im-soglia').value, 10);
  const giorni = parseInt(document.getElementById('im-giorni').value, 10);
  if (!Number.isFinite(soglia) || soglia < 1 || soglia > 100) { messaggio('La soglia deve stare fra 1 e 100.'); return; }
  if (!Number.isFinite(giorni) || giorni < 1 || giorni > 120) { messaggio('I giorni devono stare fra 1 e 120.'); return; }
  stato.impostazioni.sogliaAvvisoBudget = soglia;
  stato.impostazioni.giorniAvvisoScadenza = giorni;
  salva.impostazioni();
  messaggio('Impostazioni salvate.');
  render();
}

// Su iPhone il collegamento deve stare nella pagina e l'indirizzo temporaneo
// non va liberato subito, altrimenti il file non viene scaricato.
function scaricaFile(contenuto, nomeFile, tipo) {
  const blob = new Blob([contenuto], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomeFile;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
}

function esportaBackup() {
  const dati = {
    applicazione: 'conti',
    versione: 1,
    creato: new Date().toISOString(),
    conti: stato.conti,
    movimenti: stato.movimenti,
    budget: stato.budget,
    ricorrenti: stato.ricorrenti,
    impostazioni: stato.impostazioni
  };
  scaricaFile(JSON.stringify(dati, null, 2), `Conti_Backup_${oggiISO()}.json`, 'application/json');
  messaggio('Backup scaricato.');
}

// Separatore ';' e virgola decimale: e' cosi' che un Excel italiano
// apre il file senza doverlo sistemare a mano.
function esportaCSV() {
  const anno = annoAttivo();
  const righe = [['Data', 'Conto', 'Conto di arrivo', 'Tipo', 'Categoria', 'Descrizione', 'Modalità', 'Importo (EUR)']];
  stato.movimenti
    .filter(m => annoDi(m.data) === anno)
    .sort((a, b) => String(a.data).localeCompare(String(b.data)))
    .forEach(m => {
      righe.push([
        m.data,
        nomeConto(m.contoId),
        m.tipo === 'GIROCONTO' ? nomeConto(m.contoDestinazione) : '',
        m.tipo === 'ENTRATA' ? 'Entrata' : (m.tipo === 'USCITA' ? 'Uscita' : 'Giroconto'),
        m.categoria || '',
        m.descrizione || '',
        m.metodo || '',
        (Number(m.importo) || 0).toFixed(2).replace('.', ',')
      ]);
    });
  const csv = righe.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  scaricaFile('﻿' + csv, `Conti_Movimenti_${anno}.csv`, 'text/csv;charset=utf-8;');
  messaggio(`CSV ${anno} scaricato.`);
}

function importaBackup(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const lettore = new FileReader();
  lettore.onload = (evento) => {
    try {
      const dati = JSON.parse(evento.target.result);
      if (!dati || typeof dati !== 'object') throw new Error('formato non riconosciuto');

      const dataValida = (x) => !!x && x.id !== undefined && /^\d{4}-\d{2}-\d{2}$/.test(String(x.data || ''));
      const movimenti = (Array.isArray(dati.movimenti) ? dati.movimenti : []).filter(dataValida);
      const budget = (Array.isArray(dati.budget) ? dati.budget : []).filter(b => b && b.id && b.categoria);
      const ricorrenti = (Array.isArray(dati.ricorrenti) ? dati.ricorrenti : [])
        .filter(r => r && r.id && r.nome && /^\d{4}-\d{2}-\d{2}$/.test(String(r.dataInizio || '')));
      const conti = (Array.isArray(dati.conti) ? dati.conti : []).filter(c => c && c.id && c.nome);

      if (!movimenti.length && !budget.length && !ricorrenti.length && !conti.length) {
        messaggio('Il file non contiene dati validi per questa app.');
        return;
      }

      const unisci = (attuali, nuovi) => {
        const mappa = new Map(attuali.map(x => [String(x.id), x]));
        nuovi.forEach(x => mappa.set(String(x.id), x));
        return Array.from(mappa.values());
      };

      stato.conti = unisci(stato.conti, conti);
      stato.movimenti = unisci(stato.movimenti, movimenti);
      stato.budget = unisci(stato.budget, budget);
      stato.ricorrenti = unisci(stato.ricorrenti, ricorrenti);
      if (dati.impostazioni && typeof dati.impostazioni === 'object') {
        stato.impostazioni = Object.assign({}, IMPOSTAZIONI_INIZIALI, stato.impostazioni, dati.impostazioni);
      }

      salva.conti(); salva.movimenti(); salva.budget(); salva.ricorrenti(); salva.impostazioni();
      messaggio(`Ripristinati ${movimenti.length} movimenti, ${budget.length} budget e ${ricorrenti.length} pagamenti ricorrenti.`);
      render(true);
    } catch (err) {
      console.error(err);
      messaggio('File non leggibile: non sembra un backup di questa app.');
    }
  };
  lettore.readAsText(file);
}

function azzeraTutto() {
  if (!confirm('Cancello movimenti, budget e pagamenti ricorrenti di questo dispositivo?')) return;
  if (!confirm('Conferma definitiva: l\'operazione non si può annullare. Hai già scaricato un backup?')) return;
  stato.movimenti = [];
  stato.budget = [];
  stato.ricorrenti = [];
  salva.movimenti(); salva.budget(); salva.ricorrenti();
  messaggio('Dati azzerati.');
  render(true);
}

(function avvia() {
  const salvata = leggi(CHIAVE.scheda, 'riepilogo');
  stato.ui.scheda = SCHEDE.includes(salvata) ? salvata : 'riepilogo';
  render(true);
  Sync.avvia();
})();

<script>
/* Registrazione del service worker: da qui in poi l'app si apre anche senza rete */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js')
      .then(function (reg) {
        reg.addEventListener('updatefound', function () {
          const nuovo = reg.installing;
          if (!nuovo) return;
          nuovo.addEventListener('statechange', function () {
            if (nuovo.state === 'installed' && navigator.serviceWorker.controller) {
              messaggio('⬆️ Nuova versione pronta: chiudi e riapri l\'app per usarla.');
            }
          });
        });
      })
      .catch(function (err) { console.log('Service worker non registrato:', err); });
  });
}
</script>
